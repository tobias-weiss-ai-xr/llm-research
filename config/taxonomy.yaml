# ⚙️ Research Taxonomy & Discovery Config
#
# This is the ONLY file you need to adapt for your own research topic.
# Edit categories/subcategories + discovery queries, then re-run the pipeline.
#
# Pipeline:  config/taxonomy.yaml → papers.yaml → validate → README → reports

# ── Topic ────────────────────────────────────────────────────────────────────
topic:
  name: "Your Research Topic"          # shown in README header
  short: "your-topic"                  # used in URLs, badges, docs paths
  description: "Short description of the research field covered by this corpus."

# ── Taxonomy ─────────────────────────────────────────────────────────────────
# Categories = the main axis of your review (e.g. methods, applications, …).
# Subcategories = the secondary axis (e.g. architectures, benchmarks, …).
# Every paper in papers.yaml must carry one category + one subcategory.
taxonomy:
  categories:                           # ordered list
    - id: method
      display: "Methods & Architectures"
    - id: application
      display: "Applications"
    - id: evaluation
      display: "Evaluation & Benchmarks"
    - id: survey
      display: "Surveys & Taxonomies"
  subcategories:
    - id: agentic
      display: "Agentic"
    - id: non-agentic
      display: "Non-Agentic"
    - id: hybrid
      display: "Hybrid"

# ── Discovery: arXiv queries (fetch_new_papers.py) ───────────────────────────
# Each entry is an arXiv API query string (cat: + abs:/ti: operators).
# Keep them topic-specific; the script deduplicates automatically.
arxiv_queries:
  - 'cat:cs.AI AND (abs:"YOUR TOPIC A" OR abs:"YOUR TOPIC B")'
  - 'cat:cs.CL AND (abs:"YOUR TOPIC C" AND abs:"agent")'
  - 'cat:cs.LG AND abs:"YOUR TOPIC D"'

# ── Discovery: multi-source queries (fetch_other_sources.py) ─────────────────
# Each entry defines one query against a source (dblp, crossref, europepmc, …).
other_sources_queries:
  - source: dblp
    query: your topic a
    category: method
    subcategory_hint: agentic
  - source: crossref
    query: your topic b agent survey
    category: survey
    subcategory_hint: hybrid

# ── OpenAlex bulk fetch (fetch_openalex_bulk.py) ─────────────────────────────
# Per-category OpenAlex search phrases.
openalex_queries:
  - category: method
    query: "YOUR TOPIC method architecture"
  - category: application
    query: "YOUR TOPIC application system"

# ── GitHub repository discovery (fetch_github_repos.py) ─────────────────────
# Each entry is a GitHub search query (topic:, keyword combos, stars:>N).
# Optional keys: category, subcategory_hint, min_stars (per-query override).
# If no queries are defined, the fetcher prints setup instructions and exits.
# See: https://docs.github.com/en/search-github/searching-on-github/searching-for-repositories
#
# Examples:
# github_queries:
#   - query: "topic:YOUR-TOPIC+stars:>100"
#     category: application
#   - query: "YOUR-KEYWORD+tool+stars:>200"
#     category: method
#   - query: "YOUR-KEYWORD+framework"
#     category: method
#     min_stars: 500          # per-query star threshold override
#   - query: "YOUR-KEYWORD+awesome+stars:>50"
#     category: survey

# ── GitHub relevance signals (optional) ─────────────────────────────────────
# Extra keyword tokens used by fetch_github_repos.py to filter out irrelevant
# repos from broad searches.  The fetcher also auto-extracts signals from
# topic.name, topic.description, and taxonomy IDs.
#
# github_signals:
#   - "llm security"
#   - "model context protocol"
#   - "prompt injection"
