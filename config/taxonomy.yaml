  - source: crossref
    query: large language model benchmark evaluation
    category: evaluation
  - source: crossref
    query: mixture of experts sparse language model
    category: method
  - source: europepmc
    query: large language model safety alignment
    category: evaluation
  - source: semantic_scholar
    query: LLM reasoning chain-of-thought planning
    category: application
  - source: semantic_scholar
    query: large language model architecture survey
    category: survey
  - source: openalex
    query: LLM inference efficiency quantization serving
    category: method
  - source: openalex
    query: large language model benchmark evaluation arena
    category: evaluation
  - source: openalex
    query: LLM agent autonomous tool use function calling
    category: application
  - source: zenodo
