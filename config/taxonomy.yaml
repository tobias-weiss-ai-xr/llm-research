# ⚙️ LLM Research Taxonomy & Discovery Config

# ── Topic ────────────────────────────────────────────────────────────────────
topic:
  name: "LLM Research"
  short: "llm-research"
  description: "Research on large language models: architectures, training, inference efficiency, evaluation, and applications."
  openalex_mailto: "research+tobias@tobias-weiss.org"

# ── Taxonomy ─────────────────────────────────────────────────────────────────
taxonomy:
  categories:
    - id: method
      display: "Methods & Architectures"
      description: "Transformer architectures, KV cache, quantization, distillation, MoE, RLHF, DPO"
    - id: application
      display: "Applications"
      description: "Code generation, agentic systems, reasoning, multimodal, RAG, planning"
    - id: evaluation
      display: "Evaluation & Benchmarks"
      description: "LLM benchmarks, long-context evaluation, safety evaluation, MMLU, HumanEval, Arena"
    - id: survey
      display: "Surveys & Taxonomies"
      description: "Overview papers, landscape analyses, roadmaps"
  subcategories:
    - id: agentic
      display: "Agentic"
      category: application
      description: "LLM agents, tool use, planning, autonomous systems"
    - id: non-agentic
      display: "Non-Agentic"
      category: method
      description: "Architecture, training, inference, quantization"
    - id: hybrid
      display: "Hybrid"
      category: application
      description: "RAG, code generation, multimodal"

# ── arXiv queries ──────────────────────────────────────────────────────────
arxiv_queries:
  - query: 'cat:cs.CL AND (abs:"KV cache" OR abs:"key-value cache" OR abs:"LLM inference efficiency" OR abs:"speculative decoding")'
    category: method
  - query: 'cat:cs.LG AND (abs:"LLM serving" OR abs:"efficient inference" OR abs:"prompt caching" OR abs:"continuous batching")'
    category: method
  - query: 'cat:cs.CL AND (abs:"quantization" AND (abs:"LLM" OR abs:"language model" OR abs:"transformer"))'
    category: method
  - query: 'cat:cs.CL AND (abs:"mixture of experts" OR abs:"MoE" OR abs:"sparse model")'
    category: method
  - query: 'cat:cs.CL AND (abs:"RLHF" OR abs:"DPO" OR abs:"RLAIF" OR abs:"constitutional AI")'
    category: method
  - query: 'cat:cs.CL AND (abs:"LLM agent" OR abs:"language model agent" OR abs:"tool use" OR abs:"function calling")'
    category: application
    subcategory_hint: agentic
  - query: 'cat:cs.CL AND (abs:"code generation" OR abs:"code LLM" OR abs:"program synthesis" AND abs:"language model")'
    category: application
    subcategory_hint: hybrid
  - query: 'cat:cs.CL AND (abs:"reasoning" AND (abs:"LLM" OR abs:"language model") AND (abs:"chain-of-thought" OR abs:"CoT" OR abs:"tree-of-thought"))'
    category: application
  - query: 'cat:cs.CL AND (abs:"RAG" OR abs:"retrieval augmented generation" OR abs:"grounding" AND abs:"language model")'
    category: application
    subcategory_hint: hybrid
  - query: 'cat:cs.CL AND (abs:"multimodal" AND (abs:"LLM" OR abs:"language model" OR abs:"vision-language"))'
    category: application
  - query: 'cat:cs.CL AND (abs:"long context" AND abs:"benchmark" OR abs:"evaluation" AND abs:"language model")'
    category: evaluation
  - query: 'cat:cs.CL AND (abs:"LLM" AND (abs:"benchmark" OR abs:"evaluation" OR abs:"leaderboard" OR abs:"arena"))'
    category: evaluation
  - query: 'cat:cs.CL AND (abs:"safety" OR abs:"jailbreak" OR abs:"alignment" AND abs:"language model")'
    category: evaluation
  - query: 'cat:cs.CL AND (abs:"efficient" OR abs:"KV cache" OR abs:"inference") AND abs:"survey" AND abs:"language model"'
    category: survey

# ── Multi-source queries ──────────────────────────────────────────────────
other_sources_queries:
