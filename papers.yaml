- title: 'KVBoost: Chunk-Level Key-Value Cache Reuse with Deviation-Guided Recomputation
    for Efficient Large Language Model Inference'
  date: 2026-05
  url: https://arxiv.org/abs/2608.21362
  category: method
  subcategory: non-agentic
  authors:
  - Srihari Unnikrishnan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Transformer-based large language models (LLMs) incur high prefill latency
    because key-value (KV) tensors must be recomputed for each request. Existing prefix-caching
    systems reduce this cost but require prompts to share a leading contiguous prefix,
    limiting effectiveness when shared content appears at arbitrary positions. We
    present KVBoost, a chunk-level KV cache reuse system for HuggingFace-compatible
    decoder models that enables reuse regardless of content position. KVBoost introduces
    a dual-hash keying scheme that separates positional identity (prefix hash) from
    content identity (content hash), supporting both exact and approximate cache matches.
    To address attention boundary errors from independently cached chunks, KVBoost
    employs two repair strategies: SelectiveRecompute, which re-encodes boundary regions,
    and CacheBlendRecompute, which identifies and recomputes high-deviation tokens
    after a probe pass. The system further incorporates asymmetric KV quantization
    (int8/int4), adaptive chunk boundary splitting, and importance-weighted eviction
    under a fixed memory budget. Evaluated on Qwen/Qwen2.5-3B over 1,000 bug-localization
    samples, KVBoost achieves a 4.49x reduction in time-to-first-token (142.4 ms vs.
    639.1 ms) and outperforms prefix caching by 16%, with no loss in accuracy (99.2%
    vs. 99.1%). KVBoost provides a practical, memory-bounded inference acceleration
    layer compatible with RoPE-based models without architectural modification.'
  tags:
  - llm
  - inference
  - kv-cache
  - efficiency
- title: 'CacheBlend: Fast Large Language Model Serving for RAG with Cached Knowledge
    Fusion'
  date: 2024-05
  url: https://arxiv.org/abs/2405.16444
  category: method
  subcategory: non-agentic
  authors:
  - Yao, Jiayi
  - Li, Hanchen
  - Liu, Yuhan
  - Ray, Siddhant
  - Cheng, Yihua
  - Zhang, Qizheng
  - Du, Kuntai
  - Lu, Shan
  - Jiang, Junchen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language models (LLMs) often incorporate multiple text chunks in
    their inputs to provide the necessary contexts. To speed up the prefill of the
    long LLM inputs, one can pre-compute the KV cache of a text and re-use the KV
    cache when the context is reused as the prefix of another LLM input. However,
    the reused text chunks are not always the input prefix, which makes precomputed
    KV caches not directly usable since they ignore the text''s cross-attention with
    the preceding texts. Thus, the benefits of reusing KV caches remain largely unrealized.
    This paper tackles just one challenge: when an LLM input contains multiple text
    chunks, how to quickly combine their precomputed KV caches in order to achieve
    the same generation quality as the expensive full prefill (i.e., without reusing
    KV cache)? This challenge naturally arises in retrieval-augmented generation (RAG)
    where the input is supplemented with multiple retrieved texts as the context.
    We present CacheBlend, a scheme that reuses the precomputed KV caches, regardless
    prefix or not, and selectively recomputes the KV values of a small subset of tokens
    to partially update each reused KV cache. In the meantime, the small extra delay
    for recomputing some tokens can be pipelined with the retrieval of KV caches within
    the same job, allowing CacheBlend to store KV caches in slower devices with more
    storage capacity while retrieving them without increasing the inference delay.
    By comparing CacheBlend with the state-of-the-art KV cache reusing schemes on
    three open-source LLMs of various sizes and four popular benchmark datasets of
    different tasks, we show that CacheBlend reduces time-to-first-token (TTFT) by
    2.2-3.3x and increases the inference throughput by 2.8-5x from full KV recompute
    without compromising generation quality. The code is available at https://github.com/LMCache/LMCache.'
  tags:
  - llm
  - kv-cache
  - efficiency
- title: Efficient Memory Management for Large Language Model Serving with PagedAttention
  date: 2023-09
  url: https://arxiv.org/abs/2309.06180
  category: method
  subcategory: non-agentic
  authors:
  - Kwon, Woosuk
  - Li, Zhuohan
  - Zhuang, Siyuan
  - Sheng, Ying
  - Zheng, Lianmin
  - Yu, Cody Hao
  - Gonzalez, Joseph E.
  - Zhang, Hao
  - Stoica, Ion
  venue: ''
  code_url: ''
  project_url: ''
  abstract: High throughput serving of large language models (LLMs) requires batching
    sufficiently many requests at a time. However, existing systems struggle because
    the key-value cache (KV cache) memory for each request is huge and grows and shrinks
    dynamically. When managed inefficiently, this memory can be significantly wasted
    by fragmentation and redundant duplication, limiting the batch size. To address
    this problem, we propose PagedAttention, an attention algorithm inspired by the
    classical virtual memory and paging techniques in operating systems. On top of
    it, we build vLLM, an LLM serving system that achieves (1) near-zero waste in
    KV cache memory and (2) flexible sharing of KV cache within and across requests
    to further reduce memory usage. Our evaluations show that vLLM improves the throughput
    of popular LLMs by 2-4× with the same level of latency compared to the state-of-the-art
    systems, such as FasterTransformer and Orca. The improvement is more pronounced
    with longer sequences, larger models, and more complex decoding algorithms. vLLM's
    source code is publicly available at https://github.com/vllm-project/vllm
  tags:
  - llm
  - kv-cache
  - efficiency
- title: 'H2O: Heavy-Hitter Oracle for Efficient Generative Inference of Large Language
    Models'
  date: 2023-06
  url: https://arxiv.org/abs/2306.14048
  category: method
  subcategory: non-agentic
  authors:
  - Zhang, Zhenyu
  - Sheng, Ying
  - Zhou, Tianyi
  - Chen, Tianlong
  - Zheng, Lianmin
  - Cai, Ruisi
  - Song, Zhao
  - Tian, Yuandong
  - Ré, Christopher
  - Barrett, Clark
  - Wang, Zhangyang
  - Chen, Beidi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large Language Models (LLMs), despite their recent impressive accomplishments,
    are notably cost-prohibitive to deploy, particularly for applications involving
    long-content generation, such as dialogue systems and story writing. Often, a
    large amount of transient state information, referred to as the KV cache, is stored
    in GPU memory in addition to model parameters, scaling linearly with the sequence
    length and batch size. In this paper, we introduce a novel approach for implementing
    the KV cache which significantly reduces its memory footprint. Our approach is
    based on the noteworthy observation that a small portion of tokens contributes
    most of the value when computing attention scores. We call these tokens Heavy
    Hitters (H2). Through a comprehensive investigation, we find that (i) the emergence
    of H2 is natural and strongly correlates with the frequent co-occurrence of tokens
    in the text, and (ii) removing them results in significant performance degradation.
    Based on these insights, we propose Heavy Hitter Oracle (H2O), a KV cache eviction
    policy that dynamically retains a balance of recent and H2 tokens. We formulate
    the KV cache eviction as a dynamic submodular problem and prove (under mild assumptions)
    a theoretical guarantee for our novel eviction algorithm which could help guide
    future work. We validate the accuracy of our algorithm with OPT, LLaMA, and GPT-NeoX
    across a wide range of tasks. Our implementation of H2O with 20% heavy hitters
    improves the throughput over three leading inference systems DeepSpeed Zero-Inference,
    Hugging Face Accelerate, and FlexGen by up to 29×, 29×, and 3× on OPT-6.7B and
    OPT-30B. With the same batch size, H2O can reduce the latency by up to 1.9×. The
    code is available at https://github.com/FMInference/H2O.
  tags:
  - llm
  - kv-cache
  - efficiency
- title: 'KIVI: A Tuning-Free Asymmetric 2bit Quantization for KV Cache'
  date: 2024-02
  url: https://arxiv.org/abs/2402.02750
  category: method
  subcategory: non-agentic
  authors:
  - Liu, Zirui
  - Yuan, Jiayi
  - Jin, Hongye
  - Zhong, Shaochen
  - Xu, Zhaozhuo
  - Braverman, Vladimir
  - Chen, Beidi
  - Hu, Xia
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Efficiently serving large language models (LLMs) requires batching of
    many requests to reduce the cost per request. Yet, with larger batch sizes and
    longer context lengths, the key-value (KV) cache, which stores attention keys
    and values to avoid re-computations, significantly increases memory demands and
    becomes the new bottleneck in speed and memory usage. Additionally, the loading
    of the KV cache causes the computational core to be idle, which limits the inference
    speed. A straightforward and effective solution to reduce KV cache size is quantization,
    which decreases the total bytes taken by KV cache. However, there is a lack of
    in-depth studies that explore the element distribution of KV cache to understand
    the hardness and limitation of KV cache quantization. To fill the gap, we conducted
    a comprehensive study on the element distribution in KV cache of popular LLMs.
    Our findings indicate that the key cache should be quantized per-channel, i.e.,
    group elements along the channel dimension and quantize them together. In contrast,
    the value cache should be quantized per-token. From this analysis, we developed
    a tuning-free 2bit KV cache quantization algorithm named KIVI. With hardware-friendly
    implementation, KIVI can enable Llama, Falcon, and Mistral models to maintain
    almost the same quality while using 2.6× less peak memory (including model weight).
    This reduction in memory usage enables up to 4× larger batch size, bringing 2.35×
    sim 3.47× throughput on real LLM inference workload. The source code is available
    at https://github.com/jy-yuan/KIVI.
  tags:
  - llm
  - kv-cache
  - efficiency
- title: 'GEAR: An Efficient KV Cache Compression Recipe for Near-Lossless Generative
    Inference of LLM'
  date: 2024-03
  url: https://arxiv.org/abs/2403.05527
  category: method
  subcategory: non-agentic
  authors:
  - Kang, Hao
  - Zhang, Qingru
  - Kundu, Souvik
  - Jeong, Geonhwa
  - Liu, Zaoxing
  - Krishna, Tushar
  - Zhao, Tuo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Key-value (KV) caching has become the de-facto to accelerate generation
    speed for large language models (LLMs) inference. However, the growing cache demand
    with increasing sequence length has transformed LLM inference to be a memory bound
    problem, significantly constraining the system throughput. Existing methods rely
    on dropping unimportant tokens or quantizing all entries uniformly. Such methods,
    however, often incur high approximation errors to represent the compressed matrices.
    The autoregressive decoding process further compounds the error of each step,
    resulting in critical deviation in model generation and deterioration of performance.
    To tackle this challenge, we propose GEAR, an efficient KV cache compression framework
    that achieves near-lossless high-ratio compression. GEAR first applies quantization
    to majority of entries of similar magnitudes to ultra-low precision. It then employs
    a low rank matrix to approximate the quantization error, and a sparse matrix to
    remedy individual errors from outlier entries. By adeptly integrating three techniques,
    GEAR is able to fully exploit their synergistic potentials. Our experiments demonstrate
    that compared to alternatives, GEAR achieves near-lossless 4-bit KV cache compression
    with up to 2.38x throughput improvement, while reducing peak-memory size up to
    2.29x. Our code is publicly available at https://github.com/HaoKang-Timmy/GEAR.
  tags:
  - llm
  - kv-cache
  - efficiency
- title: 'Scissorhands: Exploiting the Persistence of Importance Hypothesis for LLM
    KV Cache Compression at Test Time'
  date: 2023-05
  url: https://arxiv.org/abs/2305.17118
  category: method
  subcategory: non-agentic
  authors:
  - Liu, Zichang
  - Desai, Aditya
  - Liao, Fangshuo
  - Wang, Weitao
  - Xie, Victor
  - Xu, Zhaozhuo
  - Kyrillidis, Anastasios
  - Shrivastava, Anshumali
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language models(LLMs) have sparked a new wave of exciting AI applications.
    Hosting these models at scale requires significant memory resources. One crucial
    memory bottleneck for the deployment stems from the context window. It is commonly
    recognized that model weights are memory hungry; however, the size of key-value
    embedding stored during the generation process (KV cache) can easily surpass the
    model size. The enormous size of the KV cache puts constraints on the inference
    batch size, which is crucial for high throughput inference workload. Inspired
    by an interesting observation of the attention scores, we hypothesize the persistence
    of importance: only pivotal tokens, which had a substantial influence at one step,
    will significantly influence future generations. Based on our empirical verification
    and theoretical analysis around this hypothesis, we propose Scissorhands, a system
    that maintains the memory usage of the KV cache at a fixed budget without finetuning
    the model. In essence, Scissorhands manages the KV cache by storing the pivotal
    tokens with a higher probability. We validate that Scissorhands reduces the inference
    memory usage of the KV cache by up to 5X without compromising model quality. We
    further demonstrate that Scissorhands can be combined with 4-bit quantization,
    traditionally used to compress model weights, to achieve up to 20X compression.'
  tags:
  - llm
  - kv-cache
  - efficiency
- title: 'SnapKV: LLM Knows What You are Looking for Before Generation'
  date: 2024-04
  url: https://arxiv.org/abs/2404.14469
  category: method
  subcategory: non-agentic
  authors:
  - Li, Yuhong
  - Huang, Yingbing
  - Yang, Bowen
  - Venkitesh, Bharat
  - Locatelli, Acyr
  - Ye, Hanchen
  - Cai, Tianle
  - Lewis, Patrick
  - Chen, Deming
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large Language Models (LLMs) have made remarkable progress in processing
    extensive contexts, with the Key-Value (KV) cache playing a vital role in enhancing
    their performance. However, the growth of the KV cache in response to increasing
    input length poses challenges to memory and time efficiency. To address this problem,
    this paper introduces SnapKV, an innovative and fine-tuning-free approach that
    efficiently minimizes KV cache size while still delivering comparable performance
    in real-world applications. We discover that each attention head in the model
    consistently focuses on specific prompt attention features during generation.
    Meanwhile, this robust pattern can be obtained from an 'observation' window located
    at the end of the prompts. Drawing on this insight, SnapKV automatically compresses
    KV caches by selecting clustered important KV positions for each attention head.
    Our approach significantly reduces the growing computational overhead and memory
    footprint when processing long input sequences. Specifically, SnapKV achieves
    a consistent decoding speed with a 3.6x increase in generation speed and an 8.2x
    enhancement in memory efficiency compared to the baseline when processing inputs
    of 16K tokens. At the same time, it maintains comparable performance to the baseline
    models across 16 long sequence datasets. Moreover, SnapKV can process up to 380K
    context tokens on a single A100-80GB GPU using HuggingFace implementation with
    minor changes, exhibiting only a negligible accuracy drop in the Needle-in-a-Haystack
    test. Further comprehensive studies suggest SnapKV's potential for practical applications.
  tags:
  - llm
  - kv-cache
  - efficiency
- title: 'Prompt Cache: Modular Attention Reuse for Low-Latency Inference'
  date: 2023-11
  url: https://arxiv.org/abs/2311.04934
  category: method
  subcategory: non-agentic
  authors:
  - Gim, In
  - Chen, Guojun
  - Lee, Seung-seob
  - Sarda, Nikhil
  - Khandelwal, Anurag
  - Zhong, Lin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present Prompt Cache, an approach for accelerating inference for large
    language models (LLM) by reusing attention states across different LLM prompts.
    Many input prompts have overlapping text segments, such as system messages, prompt
    templates, and documents provided for context. Our key insight is that by precomputing
    and storing the attention states of these frequently occurring text segments on
    the inference server, we can efficiently reuse them when these segments appear
    in user prompts. Prompt Cache employs a schema to explicitly define such reusable
    text segments, called prompt modules. The schema ensures positional accuracy during
    attention state reuse and provides users with an interface to access cached states
    in their prompt. Using a prototype implementation, we evaluate Prompt Cache across
    several LLMs. We show that Prompt Cache significantly reduce latency in time-to-first-token,
    especially for longer prompts such as document-based question answering and recommendations.
    The improvements range from 8x for GPU-based inference to 60x for CPU-based inference,
    all while maintaining output accuracy and without the need for model parameter
    modifications.
  tags:
  - llm
  - kv-cache
  - efficiency
- title: 'PyramidKV: Dynamic KV Cache Compression based on Pyramidal Information Funneling'
  date: 2024-06
  url: https://arxiv.org/abs/2406.02069
  category: method
  subcategory: non-agentic
  authors:
  - Cai, Zefan
  - Zhang, Yichi
  - Gao, Bofei
  - Liu, Yuliang
  - Li, Yucheng
  - Liu, Tianyu
  - Lu, Keming
  - Xiong, Wayne
  - Dong, Yue
  - Hu, Junjie
  - Xiao, Wen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In this study, we investigate whether attention-based information flow
    inside large language models (LLMs) is aggregated through noticeable patterns
    for long context processing. Our observations reveal that LLMs aggregate information
    through Pyramidal Information Funneling where attention is scattering widely in
    lower layers, progressively consolidating within specific contexts, and ultimately
    focusing on critical tokens (a.k.a massive activation or attention sink) in higher
    layers. Motivated by these insights, we developed PyramidKV, a novel and effective
    KV cache compression method. This approach dynamically adjusts the KV cache size
    across different layers, allocating more cache in lower layers and less in higher
    ones, diverging from traditional methods that maintain a uniform KV cache size.
    Our experimental evaluations, utilizing the LongBench benchmark, show that PyramidKV
    matches the performance of models with a full KV cache while retaining only 12%
    of the KV cache, thus significantly reducing memory usage. In scenarios emphasizing
    memory efficiency, where only 0.7% of the KV cache is maintained, PyramidKV surpasses
    other KV cache compression techniques, achieving up to a 20.5 absolute accuracy
    improvement on TREC dataset. In the Needle-in-a-Haystack experiment, PyramidKV
    outperforms competing methods in maintaining long-context comprehension in LLMs;
    notably, retaining just 128 KV cache entries enables the LLAMA-3-70B model to
    achieve 100.0 Acc. performance.
  tags:
  - llm
  - kv-cache
  - efficiency
- title: 'MiniCache: KV Cache Compression in Depth Dimension for Large Language Models'
  date: 2024-05
  url: https://arxiv.org/abs/2405.14366
  category: method
  subcategory: non-agentic
  authors:
  - Liu, Akide
  - Liu, Jing
  - Pan, Zizheng
  - He, Yefei
  - Haffari, Gholamreza
  - Zhuang, Bohan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: A critical approach for efficiently deploying computationally demanding
    large language models (LLMs) is Key-Value (KV) caching. The KV cache stores key-value
    states of previously generated tokens, significantly reducing the need for repetitive
    computations and thereby lowering latency in autoregressive generation. However,
    the size of the KV cache grows linearly with sequence length, posing challenges
    for applications requiring long context input and extensive sequence generation.
    In this paper, we present a simple yet effective approach, called MiniCache, to
    compress the KV cache across layers from a novel depth perspective, significantly
    reducing the memory footprint for LLM inference. Our approach is based on the
    observation that KV cache states exhibit high similarity between the adjacent
    layers in the middle-to-deep portion of LLMs. To facilitate merging, we propose
    disentangling the states into the magnitude and direction components, interpolating
    the directions of the state vectors while preserving their lengths unchanged.
    Furthermore, we introduce a token retention strategy to keep highly distinct state
    pairs unmerged, thus preserving the information with minimal additional storage
    overhead. Our MiniCache is training-free and general, complementing existing KV
    cache compression strategies, such as quantization and sparsity. We conduct a
    comprehensive evaluation of MiniCache utilizing various models including LLaMA-2,
    LLaMA-3, Phi-3, Mistral, and Mixtral across multiple benchmarks, demonstrating
    its exceptional performance in achieving superior compression ratios and high
    throughput. On the ShareGPT dataset, LLaMA-2-7B with 4-bit MiniCache achieves
    a remarkable compression ratio of up to 5.02x, enhances inference throughput by
    approximately 5x, and reduces the memory footprint by 41% compared to the FP16
    full cache baseline, all while maintaining near-lossless performance.
  tags:
  - llm
  - kv-cache
  - efficiency
- title: 'TriForce: Lossless Acceleration of Long Sequence Generation with Hierarchical
    Speculative Decoding'
  date: 2024-04
  url: https://arxiv.org/abs/2404.11912
  category: method
  subcategory: non-agentic
  authors:
  - Sun, Hanshi
  - Chen, Zhuoming
  - Yang, Xinyu
  - Tian, Yuandong
  - Chen, Beidi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: With large language models (LLMs) widely deployed in long content generation
    recently, there has emerged an increasing demand for efficient long-sequence inference
    support. However, key-value (KV) cache, which is stored to avoid re-computation,
    has emerged as a critical bottleneck by growing linearly in size with the sequence
    length. Due to the auto-regressive nature of LLMs, the entire KV cache will be
    loaded for every generated token, resulting in low utilization of computational
    cores and high latency. While various compression methods for KV cache have been
    proposed to alleviate this issue, they suffer from degradation in generation quality.
    We introduce TriForce, a hierarchical speculative decoding system that is scalable
    for long sequence generation. This approach leverages the original model weights
    and dynamic sparse KV cache via retrieval as a draft model, which serves as an
    intermediate layer in the hierarchy and is further speculated by a smaller model
    to reduce its drafting latency. TriForce not only facilitates impressive speedups
    for Llama2-7B-128K, achieving up to 2.31× on an A100 GPU but also showcases scalability
    in handling even longer contexts. For the offloading setting on two RTX 4090 GPUs,
    TriForce achieves 0.108s/tokenunicode{x2014only half as slow as the auto-regressive
    baseline on an A100, which attains 7.78× on our optimized offloading system. Additionally,
    TriForce performs 4.86× than DeepSpeed-Zero-Inference on a single RTX 4090 GPU.
    TriForce's robustness is highlighted by its consistently outstanding performance
    across various temperatures. The code is available at https://github.com/Infini-AI-Lab/TriForce.
  tags:
  - llm
  - kv-cache
  - efficiency
- title: 'Quest: Query-Aware Sparsity for Efficient Long-Context LLM Inference'
  date: 2024-06
  url: https://arxiv.org/abs/2406.10774
  category: method
  subcategory: non-agentic
  authors:
  - Tang, Jiaming
  - Zhao, Yilong
  - Zhu, Kan
  - Xiao, Guangxuan
  - Kasikci, Baris
  - Han, Song
  venue: ''
  code_url: ''
  project_url: ''
  abstract: As the demand for long-context large language models (LLMs) increases,
    models with context windows of up to 128K or 1M tokens are becoming increasingly
    prevalent. However, long-context LLM inference is challenging since the inference
    speed decreases significantly as the sequence length grows. This slowdown is primarily
    caused by loading a large KV cache during self-attention. Previous works have
    shown that a small portion of critical tokens will dominate the attention outcomes.
    However, we observe the criticality of a token highly depends on the query. To
    this end, we propose Quest, a query-aware KV cache selection algorithm. Quest
    keeps track of the minimal and maximal Key values in KV cache pages and estimates
    the criticality of a given page using Query vectors. By only loading the Top-K
    critical KV cache pages for attention, Quest significantly speeds up self-attention
    without sacrificing accuracy. We show that Quest can achieve up to 2.23x self-attention
    speedup, which reduces inference latency by 7.03x while performing well on tasks
    with long dependencies with negligible accuracy loss. Code is available at http://github.com/mit-han-lab/Quest
    .
  tags:
  - llm
  - kv-cache
  - efficiency
- title: 'ChunkAttention: Efficient Self-Attention with Prefix-Aware KV Cache and
    Two-Phase Partition'
  date: 2024-02
  url: https://arxiv.org/abs/2402.15220
  category: method
  subcategory: non-agentic
  authors:
  - Ye, Lu
  - Tao, Ze
  - Huang, Yong
  - Li, Yang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Self-attention is an essential component of large language models (LLM)
    but a significant source of inference latency for long sequences. In multi-tenant
    LLM serving scenarios, the compute and memory operation cost of self-attention
    can be optimized by using the probability that multiple LLM requests have shared
    system prompts in prefixes. In this paper, we introduce ChunkAttention, a prefix-aware
    self-attention module that can detect matching prompt prefixes across multiple
    requests and share their key/value tensors in memory at runtime to improve the
    memory utilization of KV cache. This is achieved by breaking monolithic key/value
    tensors into smaller chunks and structuring them into the auxiliary prefix tree.
    Consequently, on top of the prefix-tree based KV cache, we design an efficient
    self-attention kernel, where a two-phase partition algorithm is implemented to
    improve the data locality during self-attention computation in the presence of
    shared system prompts. Experiments show that ChunkAttention can speed up the self-attention
    kernel by 3.2-4.8× compared to the state-of-the-art implementation, with the length
    of the system prompt ranging from 1024 to 4096.
  tags:
  - llm
  - kv-cache
  - efficiency
- title: A Survey on Efficient Inference for Large Language Models
  date: 2024-04
  url: https://arxiv.org/abs/2404.14294
  category: survey
  subcategory: non-agentic
  authors:
  - Zhou, Zixuan
  - Ning, Xuefei
  - Hong, Ke
  - Fu, Tianyu
  - Xu, Jiaming
  - Li, Shiyao
  - Lou, Yuming
  - Wang, Luning
  - Yuan, Zhihang
  - Li, Xiuhong
  - Yan, Shengen
  - Dai, Guohao
  - Zhang, Xiao-Ping
  - Dong, Yuhan
  - Wang, Yu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large Language Models (LLMs) have attracted extensive attention due to
    their remarkable performance across various tasks. However, the substantial computational
    and memory requirements of LLM inference pose challenges for deployment in resource-constrained
    scenarios. Efforts within the field have been directed towards developing techniques
    aimed at enhancing the efficiency of LLM inference. This paper presents a comprehensive
    survey of the existing literature on efficient LLM inference. We start by analyzing
    the primary causes of the inefficient LLM inference, i.e., the large model size,
    the quadratic-complexity attention operation, and the auto-regressive decoding
    approach. Then, we introduce a comprehensive taxonomy that organizes the current
    literature into data-level, model-level, and system-level optimization. Moreover,
    the paper includes comparative experiments on representative methods within critical
    sub-fields to provide quantitative insights. Last but not least, we provide some
    knowledge summary and discuss future research directions.
  tags:
  - llm
  - efficiency
  - survey
- title: 'RULER: What''s the Real Context Size of Your Long-Context Language Models?'
  date: 2024-04
  url: https://arxiv.org/abs/2404.06654
  category: evaluation
  subcategory: non-agentic
  authors:
  - Hsieh, Cheng-Ping
  - Sun, Simeng
  - Kriman, Samuel
  - Acharya, Shantanu
  - Rekesh, Dima
  - Jia, Fei
  - Zhang, Yang
  - Ginsburg, Boris
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The needle-in-a-haystack (NIAH) test, which examines the ability to retrieve
    a piece of information (the "needle") from long distractor texts (the "haystack"),
    has been widely adopted to evaluate long-context language models (LMs). However,
    this simple retrieval-based test is indicative of only a superficial form of long-context
    understanding. To provide a more comprehensive evaluation of long-context LMs,
    we create a new synthetic benchmark RULER with flexible configurations for customized
    sequence length and task complexity. RULER expands upon the vanilla NIAH test
    to encompass variations with diverse types and quantities of needles. Moreover,
    RULER introduces new task categories multi-hop tracing and aggregation to test
    behaviors beyond searching from context. We evaluate 17 long-context LMs with
    13 representative tasks in RULER. Despite achieving nearly perfect accuracy in
    the vanilla NIAH test, almost all models exhibit large performance drops as the
    context length increases. While these models all claim context sizes of 32K tokens
    or greater, only half of them can maintain satisfactory performance at the length
    of 32K. Our analysis of Yi-34B, which supports context length of 200K, reveals
    large room for improvement as we increase input length and task complexity. We
    open source RULER to spur comprehensive evaluation of long-context LMs.
  tags:
  - llm
  - efficiency
  - benchmark
- title: 'LongBench: A Bilingual, Multitask Benchmark for Long Context Understanding'
  date: 2023-08
  url: https://arxiv.org/abs/2308.14508
  category: evaluation
  subcategory: non-agentic
  authors:
  - Bai, Yushi
  - Lv, Xin
  - Zhang, Jiajie
  - Lyu, Hongchang
  - Tang, Jiankai
  - Huang, Zhidian
  - Du, Zhengxiao
  - Liu, Xiao
  - Zeng, Aohan
  - Hou, Lei
  - Dong, Yuxiao
  - Tang, Jie
  - Li, Juanzi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Although large language models (LLMs) demonstrate impressive performance
    for many language tasks, most of them can only handle texts a few thousand tokens
    long, limiting their applications on longer sequence inputs, such as books, reports,
    and codebases. Recent works have proposed methods to improve LLMs'' long context
    capabilities by extending context windows and more sophisticated memory mechanisms.
    However, comprehensive benchmarks tailored for evaluating long context understanding
    are lacking. In this paper, we introduce LongBench, the first bilingual, multi-task
    benchmark for long context understanding, enabling a more rigorous evaluation
    of long context understanding. LongBench comprises 21 datasets across 6 task categories
    in both English and Chinese, with an average length of 6,711 words (English) and
    13,386 characters (Chinese). These tasks cover key long-text application areas
    including single-doc QA, multi-doc QA, summarization, few-shot learning, synthetic
    tasks, and code completion. All datasets in LongBench are standardized into a
    unified format, allowing for effortless automatic evaluation of LLMs. Upon comprehensive
    evaluation of 8 LLMs on LongBench, we find that: (1) Commercial model (GPT-3.5-Turbo-16k)
    outperforms other open-sourced models, but still struggles on longer contexts.
    (2) Scaled position embedding and fine-tuning on longer sequences lead to substantial
    improvement on long context understanding. (3) Context compression technique such
    as retrieval brings improvement for model with weak ability on long contexts,
    but the performance still lags behind models that have strong long context understanding
    capability. The code and datasets are available at https://github.com/THUDM/LongBench.'
  tags:
  - llm
  - efficiency
  - benchmark
- title: 'Probing the Prompt KV Cache: Where It Becomes Dispensable'
  date: 2026-05
  url: https://arxiv.org/abs/2605.30574
  category: method
  subcategory: non-agentic
  authors:
  - Vinayshekhar Bannihatti Kumar
  - Manoj Ghuhan Arivazhagan
  - Disha Makhija
  - Rashmi Gangadharaiah
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Prior KV cache compression schemes empirically demonstrate that the prompt
    cache is partially redundant during decoding, dropping or summarising entries
    with little accuracy loss. We ask when and what kind of redundancy: at which layers,
    after how many decoding steps, and in what form can the prompt span KV cache be
    replaced without breaking the task. A controlled splice intervention swept over
    layer cutoff and decoding steps shows this redundancy is about form (chat template
    scaffolding) rather than content. Replacing the upper layer prompt span KV cache
    with KV cache from a chat template scaffold whose user content is a neutral filler
    recovers near clean accuracy, while zeroing the same slots collapses accuracy.
    The dissociation replicates across the Qwen3, Gemma 3, and Llama 3 families on
    multiple datasets.'
- title: Value-Aware Stochastic KV Cache Eviction for Reasoning Models
  date: 2026-06
  url: https://arxiv.org/abs/2606.03928
  category: method
  subcategory: non-agentic
  authors:
  - Ting-Yun Chang
  - Harvey Yiyun Fu
  - Deqing Fu
  - Chenghao Yang
  - Jesse Thomason
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Reasoning models improve accuracy through extended chains of thought,
    but their long outputs create a memory and compute bottleneck. KV cache eviction
    methods reduce this cost by evicting unimportant key-value pairs from the cache,
    yet they often yield worse accuracy than selection-based sparse attention alternatives,
    which keep the full KV cache. We identify key factors crucial to KV cache eviction
    accuracy. First, a small fraction of value states have abnormally large magnitudes,
    and evicting them causes catastrophic failure where models enter repetitive reasoning
    loops. Second, introducing stochasticity during eviction improves accuracy by
    increasing cache diversity. Based on these findings, we propose Value-aware Stochastic
    KV Cache Eviction (VaSE), a training-free recipe that protects large-magnitude
    value states and promotes diverse eviction decisions. Across six reasoning tasks,
    Qwen3 models using VaSE with 4x KV cache compression yield higher average accuracies
    than SOTA selection method at the same sparsity, while outperforming the strongest
    eviction method by more than 4%. Overall, VaSE bridges the gap between efficiency
    and accuracy, supporting FlashAttention2 and enabling a static memory footprint
    for reasoning models.
- title: 'GRKV: Global Regression for Training-Free KV Cache Compression in Long-Context
    LLMs'
  date: 2026-05
  url: https://arxiv.org/abs/2605.31105
  category: method
  subcategory: non-agentic
  authors:
  - Junjie Peng
  - You Wu
  - Haoyi Wu
  - Jialong Han
  - Xiaohua Xie
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large language models (LLMs) with extended context lengths rely on the
    key-value (KV) cache to support attention over prior tokens. However, maintaining
    the KV cache incurs substantial memory overhead, motivating KV-cache compression
    methods that enforce a fixed budget through eviction and merging. Modern eviction
    methods increasingly adopt span-based retention because preserving contiguous
    spans is empirically effective and better preserves semantic coherence. Yet, when
    combined with post-eviction merging, span-based retention concentrates merges
    onto a small set of span-boundary carrier tokens, producing a highly imbalanced
    merge pattern that exacerbates over-merging and increases information loss. To
    address this imbalance, we propose GRKV (Global Regression for KV Cache), a training-free
    KV-cache merging method that directly minimizes the discrepancy between compressed-cache
    and full-cache attention outputs. GRKV uses ridge-regression-based merge steps
    to distribute information from evicted tokens across retained tokens, while regularizing
    the updates to prevent over-smoothing. Across the LongBench and RULER long-context
    benchmarks, GRKV is the only merging method that improves overall performance
    with minimal overhead.
- title: 'Multi-Segment Attention: Enabling Efficient KV-Cache Management for Faster
    Large Language Model Serving'
  date: 2026-06
  url: https://arxiv.org/abs/2606.02964
  category: method
  subcategory: non-agentic
  authors:
  - Chunan Shi
  - Yilei Chen
  - Yilin Chen
  - Xupeng Miao
  - Bin Cui
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large Language Model (LLM) inference relies on key-value (KV) caches
    to avoid redundant attention computation. While approximate KV cache retention
    techniques reduce memory usage by sacrificing model accuracy, lossless approaches
    instead evict KV cache blocks from GPU memory and reconstruct them on demand to
    preserve exact outputs. Existing lossless KV cache management systems primarily
    base eviction decisions on access frequency or positional heuristics, without
    considering how different KV cache blocks affect the execution efficiency of GPU
    attention kernels. In this paper, we propose AsymCache, a computation-latency-aware
    KV cache management system for LLM inference that explicitly aligns cache residency
    decisions with GPU attention kernel performance, including three key components:
    Multi-Segment Attention (MSA) for efficient non-contiguous KV context processing,
    a cache eviction policy that jointly optimizes hit rate and position-aware recomputation
    cost, and an adaptive chunking scheduler for high hardware utilization. Experiments
    show that AsymCache reduces TTFT by up to 1.90-2.03x and time-per-output-token
    (TPOT) by 1.62-1.71x over latest baselines, confirming the effectiveness of the
    method in common workloads and validating its design goal of balancing computational
    efficiency with cache hit rate. Moreover, the low-level design of AsymCache allows
    seamless integration into agent serving systems such as Continuum, where it further
    reduces average job latency by up to 18.1%.'
- title: 'Keyless Attention: Value-Space Routing and Value-Only Caching for Efficient
    Transformers'
  date: 2026-06
  url: https://arxiv.org/abs/2606.21848
  category: method
  subcategory: non-agentic
  authors:
  - Xin Gao
  - Xingming Xu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Transformer architectures form the foundation of modern natural language
    processing, yet the Key-Value (KV) cache introduces substantial memory and bandwidth
    overhead during long-context generation, increasingly bottlenecking large-scale
    deployment. We propose Keyless Attention, a novel attention mechanism that replaces
    the conventional key projection with a dedicated value-space routing projection,
    eliminating key representations from the attention computation entirely and yielding
    a Value-Only Cache that reduces KV-cache memory by 50% while improving decode
    throughput. Experiments across multiple models and architectures demonstrate that
    Keyless Attention achieves comparable perplexity and downstream task performance
    to standard QKV attention, while consistently reducing KV-cache memory by 50%.
    Furthermore, Keyless Attention exhibits slower validation loss degradation after
    the best epoch, indicating improved robustness against overfitting. Ablation studies
    confirm that the dedicated value-space routing projection is critical, with Keyless
    Attention outperforming KV-sharing methods that eliminate the key cache without
    replacing its routing role. Experiments in the pretraining regime further confirm
    the viability of Keyless Attention in industrial settings.
- title: 'SeKV: Resolution-Adaptive KV Cache with Hierarchical Semantic Memory for
    Long-Context LLM Inference'
  date: 2026-06
  url: https://arxiv.org/abs/2606.31145
  category: method
  subcategory: non-agentic
  authors:
  - Amirhossein Abaskohi
  - Giuseppe Carenini
  - Peter West
  - Yuhang He
  venue: ''
  code_url: https://github.com/AmirAbaskohi/SeKV
  project_url: ''
  abstract: 'Large language models increasingly operate over long contexts, where
    the KV cache becomes a dominant memory bottleneck: its size grows linearly with
    sequence length and must be retained throughout decoding, making full GPU caching
    prohibitively expensive without compression. Existing KV cache compression methods
    struggle to balance efficiency with faithful context preservation. Token eviction
    discards information, while semantic grouping fixes compression decisions at prefill
    time; neither can recover token-level detail from a compressed span once it becomes
    relevant during generation. As a solution, we propose SeKV, a resolution-adaptive
    semantic KV cache that organizes context into entropy-guided semantic spans and
    stores them across a GPU-CPU memory hierarchy without discarding information.
    Each span keeps a lightweight summary vector on GPU for coarse routing and a low-rank
    SVD basis on CPU for on-demand token-level reconstruction. A trained zoom-in mechanism
    selectively expands query-relevant spans during decoding, enabling precise retrieval
    without materializing the full KV cache on GPU. SeKV enables adaptive token-level
    reconstruction while keeping the base LLM fully frozen and adding fewer than 0.05%
    trainable parameters. Across four benchmarks, SeKV improves over the strongest
    semantic compression baseline by 5.9% on average while reducing GPU memory by
    53.3% versus full KV caching at 128K context. Code is available on https://github.com/AmirAbaskohi/SeKV.'
- title: 'Practical Online KV Cache Compaction for LLM Agents: An Empirical Study'
  date: 2026-08
  url: https://arxiv.org/abs/2608.00902
  category: method
  subcategory: non-agentic
  authors:
  - Yujian Liu
  - Jiabao Ji
  - Li An
  - Rohit Jain
  - Gungor Polatkan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'LLM agents accumulate long trajectories of reasoning steps, tool calls,
    and environment feedback, making the KV cache a major inference bottleneck. KV
    cache compaction can reduce this cost, but most prior methods assume a static
    context where future queries are known or can be approximated offline. Agents
    instead require online compaction: new information must be compressed before future
    relevance is known, using proxy queries cheap enough for the inference path. We
    study online compaction across token eviction (TE) and attention matching (AM),
    adapting both to compact agent turns and comparing cheap proxy sources such as
    boundary, repeat-prefill, and delayed future-generation queries. Experiments on
    BrowseComp-Plus and WideSearch show that immediate compaction often hurts performance,
    whereas delaying compaction to use the agent''s future queries recovers much of
    the gap. Moreover, TE is often more robust than AM under imperfect proxies. Across
    models at different scales, TE preserves most of the accuracy while reducing KV
    cache by 80%, and can improve throughput over the no compaction baseline. These
    results position proxy-query selection as a core design choice for practical online
    KV compaction.'
- title: Information-Aware KV Cache Compression for Long Reasoning
  date: 2026-06
  url: https://arxiv.org/abs/2606.26875
  category: method
  subcategory: non-agentic
  authors:
  - Jushi Kai
  - Zhuiri Xiao
  - Alexandra Birch
  - Zhouhan Lin
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Reasoning capability has advanced rapidly in large language models (LLMs),
    leading to an increasing size of key-value (KV) cache in both prefilling and decoding
    stages. Existing KV cache compression methods mainly rely on attention weights
    to estimate token importance. While attention effectively captures contextual
    relevance, it overlooks complementary information-theoretic signals related to
    predictive uncertainty and token informativeness. In this paper, we revisit token
    importance from a forward-looking perspective and introduce textit{Forward Influence,
    a metric that measures how compressed tokens affect future contexts. Our analysis
    reveals that tokens selected by attention scores mainly influence nearby contexts,
    whereas tokens associated with high predictive uncertainty exhibit substantially
    stronger influence on distant future contexts. Based on the observation, we propose
    textbf{InfoKV, an entropy-aware KV cache compression framework that incorporates
    information-theoretic signals. It combines token-level predictive uncertainty
    with layer-wise representation evolution and integrates the resulting entropy
    scores with attention scores during reasoning. Experiments on long-context reasoning
    benchmarks with Llama-3.1, Llama-3.2, and DeepSeek-R1 demonstrate that InfoKV
    consistently outperforms existing attention-based KV compression methods in both
    long prefilling and decoding scenarios.
- title: 'C2KV: Compressed and Composable KV Cache Reuse for Efficient LLM Inference'
  date: 2026-07
  url: https://arxiv.org/abs/2607.17715
  category: method
  subcategory: non-agentic
  authors:
  - Chuheng Du
  - Junyi Chen
  - Hanlin Tang
  - Kan Liu
  - Tao Lan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-context inference is central to modern large language model (LLM)
    applications such as retrieval-augmented generation and multi-document reasoning.
    To mitigate the growing inference cost, recent work has explored key-value (KV)
    cache reuse to reduce redundant prefill computation. However, existing reuse methods
    primarily focus on computation savings and overlook a critical bottleneck in long-context
    LLM serving: the cost of storing and accessing large KV caches. While KV compression
    appears to be a natural complement, naively combining compression with non-prefix
    KV reuse often leads to severe accuracy degradation. In this work, we propose
    C2KV, a unified framework for non-prefix KV reuse that jointly optimizes KV extraction
    and inference-time concatenation. C2KV learns a composable and compressed KV cache
    manifold that is explicitly designed to be position-agnostic. Our approach introduces
    a lightweight sidecar Extractor with learnable compression tokens and a structured
    attention flow, enabling modular KV representations that can be flexibly reused
    and concatenated without modifying the frozen base model. We further employ a
    compression-concatenation co-training strategy to align extraction-time representations
    with their downstream reuse behavior. Extensive experiments across multiple long-context
    benchmarks and model families demonstrate that C2KV significantly reduces KV cache
    storage and transfer costs, achieving up to 17× inference speedup under long contexts,
    while preserving generation quality.'
- title: 'WaveFilter: Enhancing the Long-Context Capability of Diffusion LLMs via
    Wavelet-Guided KV Cache Filtering'
  date: 2026-05
  url: https://arxiv.org/abs/2606.00724
  category: method
  subcategory: non-agentic
  authors:
  - Jinnan Yang
  - Yan Wang
  - Zhen Bi
  - Kehao Wu
  - Xiaojie Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Diffusion Large Language Models (DLMs) have demonstrated significant advantages
    across various tasks. However, constrained by their multi-step iterative inference
    mechanism, their computational overhead and inference latency in long-context
    tasks have become core bottlenecks restricting their large-scale deployment. When
    processing long sequences, existing Key-Value (KV) caching mechanisms often face
    a dilemma where generation quality degrades drastically, where the core challenge
    lies in precisely and efficiently filtering critical tokens within ultra-long
    contexts. Inspired by the human reading process, we propose textbf{WaveFilter,
    a universal and training-free caching framework. This framework innovatively introduces
    the wavelet transform for decomposition of long sequences to achieve precise identification
    of key tokens, based on which a sparse KV Cache is constructed to compute the
    final contextual representation. Experimental results demonstrate that WaveFilter,
    as a plug-and-play generic framework, significantly enhances the performance of
    existing mainstream KV Cache methods in complex long-context tasks.
- title: 'YouZhi: Towards High-Concurrency Financial LLMs via Adaptive GQA-to-MLA
    Transition'
  date: 2026-06
  url: https://arxiv.org/abs/2606.05868
  category: method
  subcategory: non-agentic
  authors:
  - PSBC LLM Team
  - Huawei LLM Team
  - Ruihan Long
  - Junjie Wu
  - Tianan Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large language models (LLMs) drive significant financial innovations,
    yet their high-concurrency deployment is severely bottlenecked by KV cache memory
    overhead, which inflates infrastructure costs and throttles scalability. To address
    this, we propose YouZhi-LLM, a highly efficient financial LLM empowered by a comprehensive
    structural transition and training pipeline natively built on the Huawei Ascend
    ecosystem. At its algorithmic core, YouZhi-LLM features a layer-adaptive GQA-to-MLA
    transition framework that dynamically assigns per-layer FreqFold sizes, maximizing
    KV-cache compression while minimizing perplexity degradation. To recover representation
    capacity and inject domain expertise, the Ascend-based training pipeline seamlessly
    integrates generalized knowledge distillation with financial-specific supervised
    fine-tuning. Evaluations demonstrate the superiority of this systematic approach,
    with the adaptive transition reducing perplexity degradation by up to 35% over
    uniform baselines. Crucially, when evaluated on Ascend NPUs via vLLM-Ascend, the
    massive KV-cache reduction translates directly into deployment efficiency. Compared
    to their respective base models, YouZhi-7B yields a 12.3% improvement in average
    financial benchmark score alongside a 2.69× increase in maximum concurrency; similarly,
    YouZhi-14B achieves a 7.0% accuracy gain and a 2.43× concurrency boost, establishing
    a new paradigm for cost-effective, high-throughput financial inference.
- title: 'Towards Efficient Large Language Model Serving: A Survey on System-Aware
    KV Cache Optimization'
  date: 2026-07
  url: https://arxiv.org/abs/2607.08057
  category: method
  subcategory: non-agentic
  authors:
  - Jiantong Jiang
  - Peiyu Yang
  - Rui Zhang
  - Feng Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Despite the rapid advancements of large language models (LLMs), LLM serving
    systems remain memory-intensive and costly. The key-value (KV) cache, which stores
    KV tensors during autoregressive decoding, is crucial for enabling low-latency,
    high-throughput LLM inference serving. In this survey, we focus on system-aware
    KV infrastructure for serving LLMs (abbreviated as sKis). We revisit recent work
    from a system behavior perspective, organizing existing efforts into three dimensions:
    execution and scheduling (temporal), placement and migration (spatial), and representation
    and retention (structural). Furthermore, we analyze cross-behavior co-design affinity
    and behavior-objective links, highlighting future opportunities. Our work systematizes
    a rapidly evolving area, providing a foundation for understanding and innovating
    KV cache designs in modern LLM serving infrastructure.'
- title: End-to-End Context Compression at Scale
  date: 2026-06
  url: https://arxiv.org/abs/2606.09659
  category: method
  subcategory: non-agentic
  authors:
  - Ang Li
  - Sean McLeish
  - Haozhe Chen
  - Nimit Kalra
  - Zaiqian Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-context language model inference is bottlenecked by memory, as the
    KV cache grows with context length. Recent techniques to compress the KV cache
    fall short: they either degrade model quality substantially or require considerable
    time and compute to compress a single long prompt. Furthermore, many methods require
    the input to fit within the target model''s context window, and are generally
    incompatible with modern production inference engines. Encoder-decoder compressors,
    which map a long token sequence to a shorter sequence of latent embeddings consumed
    by a decoder, are an appealing alternative in principle. However, existing approaches
    are not competitive with KV cache compression on the accuracy-efficiency frontier.
    In this work, we revisit encoder-decoder compression and close this gap. We first
    perform an architecture search, pre-training many variants from scratch to determine
    how best to design and train encoder-decoder compressors. Guided by our findings,
    we continually pre-train a family of 0.6B-encoder, 4B-decoder models on over 350B
    tokens each, at compression ratios of 1:4, 1:8, and 1:16. We introduce Latent
    Context Language Models (LCLMs), a family of compressors that improve the Pareto
    frontier across general-task performance, compression speed, and peak memory usage.
    We demonstrate that LCLMs serve as efficient backbones for long-horizon agents,
    letting the agent skim through a compressed long context and adaptively expand
    relevant segments on demand.'
- title: Unlimited OCR Works
  date: 2026-06
  url: https://arxiv.org/abs/2606.23050
  category: method
  subcategory: non-agentic
  authors:
  - Youyang Yin
  - Huanhuan Liu
  - YY
  - Qunyi Xie
  - Chaorun Liu
  venue: ''
  code_url: http://github.com/baidu/Unlimited-OCR
  project_url: ''
  abstract: 'Recently, end-to-end OCR models, exemplified by DeepSeek OCR, have once
    again thrust OCR into the spotlight. A widely held view is that employing a large
    language model (LLM) as the decoder allows the model to leverage the prior distribution
    of language, leading to improved OCR performance. However, the downside is equally
    evident: as the output sequence lengthens, the accumulated KV cache drives up
    memory consumption and progressively slows down generation. This stands in stark
    contrast to humans, who exhibit no such decline in efficiency during long-horizon
    copying tasks. In this technical report, we propose Unlimited OCR, a model designed
    to emulate human parsing working memory. Taking DeepSeek OCR as the baseline,
    we replace all attention layers in the decoder with our proposed Reference Sliding
    Window Attention (R-SWA), which reduces attention computation costs while maintaining
    a constant KV cache throughout the entire decoding process. By combining the high
    compression rate of DeepSeek OCR''s encoder with our constant KV cache design,
    Unlimited OCR can transcribe dozens of pages of documents in a single forward
    pass under a standard maximum length of 32K. More importantly, R-SWA is a general-purpose
    parsing attention mechanism - beyond OCR, it is equally applicable to tasks such
    as ASR, translation, etc. Codes and model weights are publicly available at http://github.com/baidu/Unlimited-OCR.'
- title: 'Learning how to Forget: Fine-tuning for Long-Context Sparse Attention'
  date: 2026-08
  url: https://arxiv.org/abs/2608.19920
  category: method
  subcategory: non-agentic
  authors:
  - Matthias Seeger
  - Zeyu Zhang
  - Vihang Patil
  - Konstantinos Benidis
  - Sebastian Schelter
  venue: ''
  code_url: https://github.com/awslabs/keys_values
  project_url: ''
  abstract: A lot of prior work addressed key-value (KV) cache selection and compression
    by sparse attention to enable long-context inference for transformer language
    models without excessive hardware budgets. We provide a new method for fine-tuning
    models with sparse attention. It works for any KV cache policy, runs on a moderate
    hardware budget (e.g., a single Nvidia A100 GPU with 40 GB RAM), and allows the
    model to co-adapt with the policy, often outperforming models trained with exact
    attention (sequence parallelism). We also provide an efficient implementation
    of H2O sparse attention (the leading policy in our experiments) with dedicated
    scaled dot product attention kernel support. KeysAndValues (https://github.com/awslabs/keysvalues),
    a new open source library for long-context inference and fine-tuning, provides
    easy-to-use and performant code for all methods discussed here.
- title: Coverage-Driven KV Cache Eviction for Efficient and Improved Inference of
    LLM
  date: 2026-06
  url: https://arxiv.org/abs/2606.29563
  category: method
  subcategory: non-agentic
  authors:
  - Shuvendu Roy
  - Mengyao Zhai
  - Hossein Hajimirsadeghi
  - Golnoosh Samei
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large language models (LLMs) excel at complex tasks like question answering
    and summarization, thanks to their ability to handle long-context inputs. However,
    deploying LLMs is costly, not only due to the high computational demands of quadratic
    complexity of self-attention and auto-regressive generation, but also because
    of the significant memory overhead required for storing the key-value (KV) cache
    during inference. To reduce the memory cost, existing KV-cache eviction strategies
    leverage the sparsity in attention to selectively store a subset of tokens. While
    reducing the memory footprint, such approaches show a considerable drop in performance,
    especially in tasks that require long-context reasoning. We identify that the
    drop in performance is linked to a reduction in the coverage of unique tokens.
    Additionally, we theoretically show that reduced coverage limits the mutual information
    between inputs and outputs, thereby impairing predictive accuracy. To this end,
    we introduce K-VEC, a novel coverage-aware KV-cache eviction strategy that prioritizes
    token coverage while evicting tokens in the cache. K-VEC introduces a cross-head
    and a cross-layer coverage module to enhance token retention across attention
    heads and model layers, mitigating performance degradation caused by low coverage.
    Evaluated on 16 LongBench subsets, K-VEC exhibit up to 10.35 points improvement
    over the existing methods under the same eviction rate and memory constraint.
    Comprehensive evaluations validate the effectiveness of our approach and demonstrate
    its potential for efficient LLM deployment in resource-constrained settings.
- title: 'MiniPIC: Flexible Position-Independent Caching in <100LOC'
  date: 2026-06
  url: https://arxiv.org/abs/2606.13126
  category: method
  subcategory: non-agentic
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Retrieval-augmented and agentic workloads repeatedly prefill recurring
    predictable structured inputs (which we call "spans") such as documents and code
    files. Yet, prefix caching in engines such as vLLM cannot reuse their KV entries
    unless they share identical prefixes with another request, while Position-Independent
    Caching (PIC) implementations within production-grade inference servers typically
    either require substantial server code changes or keep KV state outside the server,
    incurring host-to-device transfer overhead. We present Minimalistic PIC (MiniPIC):
    a minimal, flexible and fast vLLM design built from two ingredients: positional-encoding-free
    KV cache and user-controlled cache-reuse primitives. MiniPIC stores unrotated
    K vectors in the KV cache, applies RoPE to K tiles inside attention using per-request
    logical positions, and exposes three user-facing and token-level primitives: block-aligned
    padding, span separator (SSep), and prompt depend (PDep), that modify hashing
    behavior and effective block-level causal attention structure. With fewer than
    100 lines of core-engine changes plus a custom attention backend, these primitives
    are sufficient to realize multiple PIC methods, including Block-Attention, EPIC,
    and Prompt Cache, within the same running vLLM instance, while natively integrating
    with KV cache CPU offload implementations. On 2WikiMultihopQA, MiniPIC with interleaved
    scheduling improves prefill throughput by 49% over baseline vLLM, reduces cached-span
    time-to-first-token by up to two orders of magnitude, preserves the linear prefill
    scaling of uncached spans, and incurs only 5.7% worst-case overhead.'
- title: 'Bole: Efficient Tree Speculation for Hybrid-Attention Language Models'
  date: 2026-08
  url: https://arxiv.org/abs/2608.01651
  category: method
  subcategory: non-agentic
  authors:
  - Li Wang
  - Yi Su
  - Xiabao Wu
  - Chiran You
  - Yongchao Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Hybrid-attention large language models combine full attention with recurrent
    linear attention to reduce long-context inference costs, yet their autoregressive
    decoding remains memory-bound. Tree speculative decoding offers an attractive
    acceleration path, but existing tree-speculation systems are designed around the
    key--value caches of full-attention models. On hybrid models, they traverse recurrent
    layers branch by branch and materialize a full state for every proposal node,
    causing verification latency and transient memory to scale poorly with tree and
    batch sizes. We present Bole, a kernel--runtime co-design that enables efficient
    tree speculation for hybrid-attention LLMs. Bole transforms the linear-attention
    recurrence into a tree-structured closed form and realizes it with a resource-efficient
    GPU kernel, verifying all proposal nodes in parallel and accelerating linear-attention
    tree verification by 3.4--7.7×. It losslessly encodes speculative state updates
    as token-level factors and reconstructs only the state selected after sampling,
    reducing transient state memory by 82--99× and freeing GPU capacity for KV caches.
    Its integration into SGLang, a widely deployed production LLM serving engine,
    couples efficient state management with a batch-wide verification budget calibrated
    to the complete hybrid forward. Across four models, two GPU platforms, and diverse
    datasets, Bole delivers up to 4.72× the offline decode throughput of autoregressive
    decoding and up to 2.03× that of the strongest tree-speculative baseline. Under
    online agent workloads, it reduces TTFT and TPOT by up to 67.6% and 49.9%, respectively,
    over the strongest tree-speculative baseline.
- title: 'Last But Not Least: Boundary Attention CalibratiON for Multimodal KV Cache
    Compression'
  date: 2026-06
  url: https://arxiv.org/abs/2606.14782
  category: method
  subcategory: non-agentic
  authors:
  - Tianhao Chen
  - Yuheng Wu
  - Kelu Yao
  - Xiaogang Xu
  - Xiaobin Hu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Multimodal Large Language Models (MLLMs) achieve strong vision-language
    reasoning but incur large KV caches and high decoding latency with long visual
    contexts. Existing compression methods rely on observation window attention for
    stable token importance estimation, yet this aggregation can dilute sparse critical
    evidence and discard answer-relevant tokens under aggressive compression. We identify
    last query attention as a complementary signal for recovering such evidence, though
    its irrelevant signals may introduce additional noise. We propose BACON, a plug-and-play
    method that calibrates observation window attention with last query evidence while
    suppressing noise through intra-layer coherence and inter-layer persistence. Across
    diverse benchmarks, models, budgets, and compression methods, BACON improves multimodal
    KV-cache compression by 7.5% on average under the most aggressive budget, with
    gains up to 30.9%.
- title: 'From Rigid to Dynamic: Entropy-Guided Adaptive Inference for Long-Context
    LLMs'
  date: 2026-06
  url: https://arxiv.org/abs/2606.09508
  category: method
  subcategory: non-agentic
  authors:
  - Zhanchao Xu
  - Haoyang Li
  - Qingfa Xiao
  - Fei Teng
  - Chen Jason Zhang
  venue: ''
  code_url: https://github.com/SHA-4096/EntropyInfer
  project_url: ''
  abstract: 'Existing sparse attention and KV cache compression methods for long-context
    LLM inference typically apply fixed sparsity patterns or uniform budgets across
    all attention heads, overlooking the substantial variation in attention behavior
    among heads and contexts. We observe two distinct entropy patterns among attention
    heads: Rigid Heads, whose entropy stays near zero across input segments, and Dynamic
    Heads, whose entropy fluctuates significantly. Crucially, the distribution of
    these types is context-dependent and cannot be predetermined offline. We therefore
    propose EntropyInfer, a training-free framework that uses attention entropy to
    adaptively allocate compute at the granularity of individual heads and segments
    during prefilling. For decoding, we introduce a latent KV cache compression scheme
    that leverages generated output tokens, rather than prefill tokens alone, to identify
    and retain the most critical cache entries. Extensive experiments on Llama, Qwen
    and openPangu model series show that EntropyInfer consistently outperforms baselines
    including SnapKV, AdaKV, and CritiPrefill, achieving up to 2.39× end-to-end speedup
    beyond 100k tokens with minimal quality degradation compared to full attention.
    The code is released in https://github.com/SHA-4096/EntropyInfer.'
- title: 'GLIDE: Guided Layerwise Hybrid Attention for Efficient LLM Inference'
  date: 2026-06
  url: https://arxiv.org/abs/2607.24788
  category: method
  subcategory: non-agentic
  authors:
  - Vimal William
  - Ravi Tandon
  - Jyotikrishna Dass
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'As Large Language Models scale to increasingly long contexts, the memory
    I/O and computational overhead of the Key-Value (KV) cache during decoding emerges
    as the primary throughput bottleneck. To address this, we propose GLIDE, a Guided
    Layerwise Hybrid Attention that strategically integrates sliding-window softmax
    attention with linear recurrent aggregation. GLIDE is motivated by layer-wise
    heterogeneity: early layers exhibit high sensitivity to softmax removal, while
    deeper layers demonstrate redundancy and tolerate aggressive replacement by linear
    alternatives. Leveraging this insight, GLIDE introduces a layer-wise adaptive
    mechanism wherein each layer balances an efficient linear recurrence with a variable-sized
    softmax window. Unlike uniform hybrid approaches, GLIDE non-uniformly compresses
    the softmax footprint across the model, reducing aggregate KV cache I/O while
    preserving expressive power where most vital. Empirical evaluations demonstrate
    the GLIDE achieves superior performance-efficiency tradeoffs, reducing end-to-end
    latency for long-context generation without compromising quality.'
- title: KV Cache Compression Through the Lens of Transform Coding
  date: 2026-08
  url: https://arxiv.org/abs/2608.14191
  category: method
  subcategory: non-agentic
  authors:
  - Hannah Laus
  - Claudio Mayrink Verdun
  - Hao Wang
  - Flavio du Pin Calmon
  - Felix Krahmer
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The key-value (KV) cache stores information from past tokens and is a
    major memory bottleneck in long-context inference. Existing quantization methods
    address this bottleneck by representing the KV cache uniformly with lower-precision
    data types and designing quantization schemes to minimize reconstruction error
    in the cache itself, without accounting for how that error propagates through
    attention mechanisms. We prove that, under a white-noise quantization model, the
    expected attention-aware distortion decomposes into additive key and value contributions
    that factor across tokens and channels. Building on transform coding and reverse
    water-filling, which are classical tools from signal processing and rate-distortion
    theory, we introduce Attention-Aware Transform Coding (AATC), which allocates
    bits over a calibration set to minimize attention-aware distortion. On Llama-3.1-8B-Instruct
    and Qwen-2.5-7B-Instruct, evaluated across LongBench, RULER, GSM8K, MMLU-Pro,
    and MATH-500, our method achieves near-lossless accuracy at approximately 5.8×
    compression, whereas each baseline degrades in at least some settings.
- title: 'WhiteMatter: All-to-All Cross-Layer Connections via KV Mixing'
  date: 2026-08
  url: https://arxiv.org/abs/2608.18486
  category: method
  subcategory: non-agentic
  authors:
  - Wenbo Zhang
  - Xiang Ren
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In a Transformer, each layer attends to past tokens only through KV produced
    at its own depth, despite the presence of deeper representations during autoregressive
    decoding. Feedback architectures allow shallow consumer layers to attend to KV
    produced by deeper past-token representations, but give all consumer layers the
    same fixed connection patterns to source layers. We propose WhiteMatter, which
    connects every attention layer to the representations from all layers of each
    past token, with connection weights that can vary across consumer layers and adapt
    to the source token. For each token, a router implements these connections by
    mixing its L layer states into k KV channels that are cached for subsequent tokens;
    each consumer layer attends to one of the channels. The number of channels k controls
    the KV-cache size. Setting k<L reduces the cache's memory footprint. In our pretraining
    experiments, WhiteMatter outperforms a vanilla Transformer with 50% more layers
    and retains most of this gain with a 50% KV-cache compression.
- title: 'CoinRAG: Contextualized Information Nugget KV Cache Reuse for Long-Context
    RAG'
  date: 2026-08
  url: https://arxiv.org/abs/2608.07458
  category: method
  subcategory: non-agentic
  authors:
  - Gyuwan Kim
  - Cheoneum Park
  - Tao Yang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Recent optimization studies on Retrieval-Augmented Generation (RAG) have
    exploited chunk-level KV cache reuse to avoid processing long retrieved contexts
    for higher efficiency, while significant information redundancy and noise still
    remain in the coarse-grained chunks. This paper optimizes the Pareto frontier
    under low prefill latency constraints while maximizing accuracy by proposing CoinRAG
    (Contextualized Information Nugget KV Cache Reuse for Long-Context RAG). The name
    metaphorically reflects our core mechanism: much like assembling small tokens
    (or "coins") to accumulate a larger value, CoinRAG compositionally reuses offline-computed,
    fine-grained nugget caches to form a learned contextual representation efficiently
    in a more semantically relevant but compact manner. Specifically, instead of full-chunk
    encoding, CoinRAG identifies query-relevant semantic units within retrieved chunks
    through two-stage retrieval and seamlessly assembles their sliced KV representations
    with a chunk-level context. Extensive evaluations on LongBench multi-hop question
    answering tasks demonstrate that CoinRAG significantly reduces operational costs
    and outperforms the other baselines with a new Pareto frontier and an average
    5.3% relative improvement in answer quality (F1) under a standard fast prefill
    latency budget.'
- title: Rethinking LoRA Memory Through the Lens of KV Cache Compression
  date: 2026-06
  url: https://arxiv.org/abs/2606.05698
  category: method
  subcategory: non-agentic
  authors:
  - Chunsheng Zuo
  - Liaoyaqi Wang
  - William Jurayj
  - William Fleshman
  - Benjamin Van Durme
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Parametric retrieval augmentation encodes document information into lightweight,
    document-specific modules such as LoRA adapters, reducing the need to include
    all evidence as input context. However, it remains unclear how this parameter-side
    memory interacts with context-side memory stored in the KV cache. We study this
    interaction in document-level question answering by progressively evicting document
    key-value states and measuring when a document LoRA contributes beyond the retained
    context. We find that document LoRA adds little when the KV cache is largely intact,
    but becomes increasingly useful under aggressive compression, recovering 13-21
    ROUGE-L points when no document context remains. The gain is largest when the
    base model encodes the document, and the adapter is applied only during answer
    generation, suggesting that document LoRA is better understood as decoding-time
    parametric memory than as a document encoder. Finally, QA-style supervision produces
    substantially stronger adapters than raw-context next-token-prediction. These
    results position document LoRA as a complementary memory channel whose value emerges
    precisely when context-side evidence is scarce.
- title: 'Mixture-of-Translators: Translating KV Caches Across Heterogeneous Large
    Language Models'
  date: 2026-07
  url: https://arxiv.org/abs/2607.28979
  category: method
  subcategory: non-agentic
  authors:
  - Jin-woo Lee
  - Minkyung Song
  - Junghyun Oh
  - Seunghoon Han
  - Soyoung Park
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Heterogeneous Large Language Model (LLM) systems increasingly rely on
    shared contexts, retrieved evidence, and multi-agent dialogue histories, yet their
    internal key-value (KV) caches remain model-specific and cannot be reused across
    architectures. Consequently, each model must repeatedly prefill or store caches
    for the same context, limiting the scalability of multi-model reasoning and long-context
    generation. We propose Mixture-of-Translators(MoT), a cache translation framework
    that maps context KV caches from a source LLM into the cache space of a target
    LLM. Unlike prior approaches that depend on a single projection path or global
    shared latent space, MoT uses multiple translator modules to capture diverse source--target
    mappings. To further reduce residual translation error, we introduce a Context
    Correction Loss that aligns the replayed target trajectory with the native target
    trajectory. We reveal two competing failure modes in cache translation: propagated
    translation shift from early injection and last-state shift from late injection.
    MoT addresses them through translator mixtures and target-side correction. Across
    homogeneous and heterogeneous translations among Qwen2.5, GPT-2, and OPT models,
    MoT preserves downstream QA performance, including Qwen2.5-7B-scale translation
    with 51.0% average closed-set QA accuracy and 0.43 average extractive QA F1. In
    practical case studies, MoT enables quality-preserving memory reuse for multi-agent
    reasoning and retains 96.3% of direct-context quality in long-context cache-augmented
    generation, demonstrating scalable KV cache reuse across heterogeneous LLMs.'
- title: 'S4R: Selective Sampling, Subspaces, and Sparse Reconstruction for Compressed
    Long-Context KV Caching'
  date: 2026-08
  url: https://arxiv.org/abs/2608.00528
  category: method
  subcategory: non-agentic
  authors:
  - Jialong Han
  - You Wu
  - Kewei Tu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The growth of context window lengths in Large Language Models (LLMs)
    significantly enhances their long-context capabilities but incurs prohibitive
    memory costs due to the Key-Value (KV) cache. Although low-rank compression of
    KV cache is a promising remedy, existing methods face a dilemma: offline approaches
    depend on external calibration data, whereas online approaches incur substantial
    compute for full-prompt decomposition and reconstruction. In this paper, we propose
    S4R, which builds low-rank subspaces from selectively sampled tokens and computes
    attention over a sparsely reconstructed KV representation. S4R uses prompt-aware
    initialization to build initial key/value bases from a representative prompt subset,
    trading off calibration-data dependence against prefilling cost. Because fully
    reconstructing the cache at every decoding step is prohibitively expensive and
    hurts throughput, we further adopt sparse reconstruction to retain only informative
    positions during decoding. Extensive experiments on LongBench and RULER with Llama
    and Qwen model families show that S4R achieves up to 5× KV compression with near
    full-cache accuracy, combining the efficiency of fixed compression with the adaptability
    of prompt-dependent methods.'
- title: 'WnW: Waxing-and-Waning KV Cache for Long-Form Speech LLMs'
  date: 2026-08
  url: https://arxiv.org/abs/2608.22704
  category: method
  subcategory: non-agentic
  authors:
  - Yiming Yao
  - Chenyang Lyu
  - Xuanfan Ni
  - Longyue Wang
  - Weihua Luo
  venue: EMNLP 2026 Main Conference. 8 pages
  code_url: ''
  project_url: ''
  abstract: 'Long-form audio inputs make the KV cache the dominant memory cost of
    speech LLMs. Prefill-only KV compression methods permanently discard audio KV
    positions once evicted, with no pathway to recover them during decoding. We show
    this is fragile on long-form audio: prefill attention concentrates near the audio
    start (an attention-sink effect), while decode-time attention distributes broadly,
    and the two rankings overlap weakly. We propose WnW (Waxing-and-Waning KV cache),
    which classifies KV-heads into anchor, tidal, and fixed roles via offline calibration.
    Anchor heads remain on GPU and serve as a decode-time importance observer; tidal
    heads keep a CPU-resident complement that is recalled chunk-by-chunk based on
    aggregated anchor-head scores; fixed heads keep only an on-GPU subset, with the
    rest permanently discarded. On LibriSpeech-Long with two 3B backbones (Voxtral-mini-3b
    and Qwen2.5-Omni-3B), WnW preserves near-Full-Cache accuracy while keeping only
    20% of audio tokens on GPU, where prefill-only baselines fail to terminate. Results
    generalize across language, task, and domain shifts, and CPU-GPU recall adds little
    decode-time overhead in our measurements.'
- title: 'A Sparse Glimpse of the Whole: Train-Free Self-Speculative Decoding'
  date: 2026-07
  url: https://arxiv.org/abs/2607.27735
  category: method
  subcategory: non-agentic
  authors:
  - Yuesong Liu
  - Yuan Zeng
  - Min Lyu
  - Ruilin Liu
  - Yu Guo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Speculative decoding alleviates the memory-bandwidth bottleneck in large
    language model inference, but its acceleration is jointly constrained by drafting
    overhead, token acceptance, and speculation length. We present a unified efficiency
    analysis showing that extending the speculation horizon can reduce rather than
    improve speedup when the marginal acceptance probability falls below the relative
    drafting cost. Guided by this analysis, we introduce SparseSpec-L, a training-free
    self-speculative decoding framework for long-context inference. SparseSpec-L generates
    lightweight drafts directly from the target model using a dynamically sparsified
    and recallable KV cache. It recycles per-head attention statistics produced during
    full-context verification as a no-extra-forward importance signal, allowing critical
    historical tokens to be recalled without permanently discarding the dense KV cache.
    An online entropy-based controller further selects the speculation length according
    to expected step-wise efficiency. Experiments across multiple long-context tasks
    and model scales show consistent end-to-end acceleration, with up to speedup over
    autoregressive decoding while preserving the target model's output distribution.
- title: 'RKSC: Reasoning-Aware KV Cache Sharing and Confident Early Exit for Multi-Step
    LLM Inference'
  date: 2026-06
  url: https://arxiv.org/abs/2606.09937
  category: method
  subcategory: non-agentic
  authors:
  - Anirudh Sekar
  venue: ''
  code_url: https://github.com/AnirudhSekar/RKSC
  project_url: ''
  abstract: 'We introduce RKSC (Reasoning-Aware KV Cache Sharing), a training-free
    inference framework that eliminates two structural redundancies in multi-branch
    LLM reasoning pipelines. ASKS (Attention-Similarity KV Sharing) computes the prefix
    KV cache once and broadcasts it to all semantically similar branches via hidden-state
    cosine similarity, strictly generalising the token-exact prefix caching used by
    vLLM and SGLang. CGEE (Confidence-Gated Early Exit) applies two complementary
    exit mechanisms: (1) it skips the verification forward pass entirely when generation
    confidence is decisive across branches, and (2) it terminates the verification
    pass at an intermediate layer when per-layer entropy stabilises, using lightweight
    hooks on the transformer backbone. RSBCM (Reasoning-Selective Block Cache Manager)
    prevents unbounded cache growth via attention-weighted depth-priority eviction.
    Across five model families (7B-10B), four benchmarks, and 1,000 evaluated problems,
    RKSC achieves a mean speedup of 3.008x over the No-KV baseline (peak 3.990x),
    a 1.66x mean improvement over vLLM-equivalent prefix caching, with a CGEE-induced
    error rate of only 0.37% (6 errors out of 1,616 verify calls). No fine-tuning
    or architecture changes are required. Code is available at https://github.com/AnirudhSekar/RKSC.'
- title: 'SpecLA: Efficient Speculative Decoding for Linear-Attention Models'
  date: 2026-07
  url: https://arxiv.org/abs/2607.16673
  category: method
  subcategory: non-agentic
  authors:
  - Zhibin Wang
  - Xuying Han
  - Zhaohua Yang
  - Fuliang Liu
  - Xue Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Linear-attention models replace the growing KV cache with recurrent states,
    but autoregressive decoding still reads, updates, and writes these states one
    token at a time. Speculative decoding can reduce this cost by verifying several
    draft tokens in one target pass, yet existing speculative systems are designed
    for Transformer KV caches. For stateful linear-attention targets, verification
    must follow recurrent dependencies across chains and branches, acceptance must
    update only the accepted state trajectory, and the drafter must avoid submitting
    candidates that waste stateful verification work. This paper presents SpecLA,
    a speculative decoding runtime for stateful linear-attention models. SpecLA verifies
    chains and trees with topology-aware kernels, stores compact factors produced
    during verification to recover accepted states, and uses confidence pruning plus
    a target-aligned EAGLE-style drafter to feed useful candidates to the verifier.
    On an NVIDIA H100 with a public GDN-1.3B target, SpecLA achieves up to 1.70x end-to-end
    speedup over autoregressive decoding.
- title: 'Kalypso: Relational LLM Serving'
  date: 2026-07
  url: https://arxiv.org/abs/2607.23815
  category: method
  subcategory: non-agentic
  authors:
  - Hojae Son
  - Md Ashraful Islam
  - Huy Gia Cao
  - Hui Guan
  - Marco Serafini
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language models are increasingly used as semantic operators for
    filtering, extracting, ranking, joining, and transforming unstructured data. Existing
    semantic query processing systems invoke request-centric LLM serving systems that
    are unaware of the query plan, leaving substantial performance opportunities unused.
    This paper introduces relational LLM serving, an abstraction that makes LLM serving
    aware of semantic query structure while preserving query semantics and output
    accuracy. The key opportunity is pipelined execution across semantic operators:
    when intermediate tuples flow directly from one operator to the next, their KV-cache
    state can be reused instead of recomputed. We present Kalypso, a relational LLM
    serving system that exposes an API for semantic query plans and executes them
    using an adaptive, memory-aware scheduling algorithm. Kalypso addresses a new
    online scheduling problem in which pipelined operator execution is coupled with
    GPU memory pressure management to reuse KV-cache state in the serving engine before
    eviction. Its scheduler continuously adjusts memory allocations to balance upstream
    parallelism, downstream progress, and GPU utilization. Our evaluation shows that
    Kalypso improves query completion time over baselines using request-centric LLM
    serving, with speedups up to 4.57x across diverse workloads, demonstrating that
    query-aware LLM serving can substantially improve the efficiency of semantic query
    execution.'
- title: 'PARTREP: Learning What to Repeat for Decoder-only LLMs'
  date: 2026-07
  url: https://arxiv.org/abs/2607.01792
  category: method
  subcategory: non-agentic
  authors:
  - Andikawati P Widjaja
  - Yongjun Kim
  - Hyounghun Kim
  - Jaeho Lee
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'While decoder-only LLMs excel at a vast array of natural language tasks,
    it suffers from an asymmetric information flow induced by causal attention: later
    tokens are richer in contextual grounding than earlier ones. A simple and effective
    remedy is prompt repetition -- just appending a second copy of prompt before generation
    can redistribute grounding across positions and improve reasoning performance.
    However, full repetition of the original prompt doubles the KV cache footprint
    and quadruples attention cost during prefill, making it impractical for long-context
    settings. We propose PartRep, a selective augmentation method that appends only
    the most informative tokens -- rather than the entire prompt. We use token-wise
    negative log-likelihood (NLL) as a selection signal, motivated by the hypothesis
    that less predictable tokens are less recoverable from surrounding context and
    therefore benefit more from late-position repetition. To avoid the heavy cost
    of a full forward pass for scoring, we train a lightweight gate that predicts
    high-NLL tokens from early-layer hidden states, enabling token selection during
    mid-prefill via early exit. Across eight benchmarks (including MMLU, GSM8K, and
    RULER) and three model families (Qwen2.5, Llama3.2, Gemma4), PartRep retains most
    of the gains of full repetition while using only 59.4% of its KV cache and 79.0%
    of its prefill FLOPs.'
- title: 'Autonomy-of-Heads: Data-Free Sparse Attention from Frozen Query-Key Geometry'
  date: 2026-08
  url: https://arxiv.org/abs/2608.06849
  category: method
  subcategory: non-agentic
  authors:
  - Yehan Yang
  - Junyuan Shang
  - Yang Li
  - Guanqun Zhao
  - Shuohuan Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-context LLM inference is bottlenecked by quadratic attention computation
    and growing KV-cache costs. Existing sparse attention and KV-compression methods
    typically decide which tokens or heads to preserve from runtime attention scores,
    observation windows, calibration prompts, or learned gates, making head diagnosis
    input-dependent and costly to deploy. We propose Autonomy-of-Heads (AoH), a data-free
    method that identifies retrieval and streaming heads from the spectral geometry
    of query-key projections. AoH defines the kernel attention operator Mh = WK^{htopWQ^h
    and uses its effective-rank as a weight-space measure of head function: concentrated
    spectra indicate a small number of dominant query-key matching directions and
    are associated with retrieval heads, whereas diffuse spectra indicate the absence
    of a dominant global matching direction and are associated with streaming heads.
    We further derive an efficient dtext{head-dimensional computation that avoids
    constructing the full dtext{modeltimes dtext{model matrix. We conducted extensive
    experiments across models demonstrating that at 50% sparsity, AoH retains 96.5%
    of Full Attention performance on average while reducing prefill and decode latency
    by up to 41.4% and 66.0%, respectively, and KV-cache memory by 50.0% at 256K tokens.'
- title: 'LazyAttention: Efficient Retrieval-Augmented Generation with Deferred Positional
    Encoding'
  date: 2026-06
  url: https://arxiv.org/abs/2606.04302
  category: method
  subcategory: non-agentic
  authors:
  - Haocheng Xia
  - Mihir Pamnani
  - Hanxi Fang
  - Supawit Chockchowwat
  - Yongjoo Park
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Key-value (KV) caching accelerates inference of large language models
    (LLMs) by reusing past computations for generated tokens. Its importance becomes
    even greater in long-context applications such as retrieval-augmented generation
    (RAG) and in-context learning (ICL). However, conventional KV caching embeds positional
    information directly into the cache, limiting its reusability. Existing solutions
    either restrict reuse to prefixes or require expensive memory materialization
    for positional re-encoding. We introduce LazyAttention, a novel attention mechanism
    that kernelizes deferred positional encoding to enable zero-copy, position-agnostic
    KV reuse. By adjusting positional encoding within attention kernels on-the-fly,
    LazyAttention resolves the materialization bottleneck, allowing a single physical
    KV copy to serve multiple logical requests at arbitrary positions. Leveraging
    attention kernels tailored for prefilling and decoding, our system achieves significant
    efficiency improvements: under skewed document distributions, it reduces time-to-first-token
    (TTFT) by 1.37× and increases inference throughput by 1.40× compared to the state-of-the-art
    Block-Attention, while maintaining comparable output quality.'
- title: 'AGENTSERVESIM: A Hardware-aware Simulator for Multi-Turn LLM Agent Serving'
  date: 2026-06
  url: https://arxiv.org/abs/2606.09613
  category: method
  subcategory: non-agentic
  authors:
  - Rakibul Hasan Rajib
  - Mengxin Zheng
  - Qian Lou
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Multi-turn LLM agents interleave model calls with external tool invocations,
    shifting serving from stateless request processing to stateful program execution.
    Serving these workloads requires scheduling, KV-cache management, and routing
    policies that use program-level context, including turn dependencies, tool-induced
    gaps, and reusable KV state. Evaluating such policies directly on real systems
    is costly, since each design point may require dedicated accelerator time across
    arrival rates, model scales, serving-instance counts, and memory hierarchies.
    Simulation offers a scalable alternative, but existing LLM serving simulators
    target stateless request-level workloads and therefore omit the core dynamics
    of agent serving: multi-turn program execution, cross-turn cache locality, and
    KV-cache residency during tool gaps. We present AGENTSERVESIM, a hardware-aware
    simulator for multi-turn LLM agent serving. AGENTSERVESIM evaluates serving policies
    at program granularity through composable modules: a Program Orchestrator preserves
    program identity and turn order, a Tool Simulator materializes tool-induced gaps,
    a Session-Aware Router maintains program-to-instance affinity for cache-aware
    dispatch, and a KV Residency Model tracks policy-defined KV placement across HBM,
    host DRAM/CXL, and eviction. Across real serving deployments and hardware configurations,
    AGENTSERVESIM reproduces real-system behavior within 6% error across key performance
    metrics while running entirely on commodity CPUs. These results show that AGENTSERVESIM
    enables controlled, repeatable exploration of agent-serving policies without requiring
    exhaustive deployment on costly accelerators.'
- title: Dual Dimensionality for Local and Global Attention
  date: 2026-06
  url: https://arxiv.org/abs/2606.18587
  category: method
  subcategory: non-agentic
  authors:
  - Zhiyuan Wang
  - Xuan Luo
  - Sirui Zeng
  - Xifeng Yan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Decoder-only Transformers compute attention over the KV cache of preceding
    tokens. Keys (and Values) are typically represented with the same dimensionality,
    regardless of its distance from the prediction target. In natural language, however,
    the next word is most strongly influenced by the immediately preceding tokens.
    We hypothesize that local and distant tokens impose asymmetric demands on representational
    capacity: local tokens are more critical for predicting immediate outputs and
    thus require richer representations, whereas distant tokens primarily serve as
    long-range memory, for which lower-dimensional representations may suffice. We
    formalize this idea as Distance-Adaptive Representation (DAR), implemented in
    a controlled setting that preserves full-dimensional representations within a
    local context window while assigning reduced-dimensional representations (e.g.
    1/4 of the original dimensionality) to tokens beyond that window. Across multiple
    pretraining scales (70M to 410M parameters), as well as continued supervised fine-tuning
    on a 1B-scale model, this approach closely matches the performance of full-dimensional
    baselines. In contrast, uniformly reducing dimensionality across all token positions
    leads to worse performance. These results challenge the common assumption that
    key and value dimensionality should be uniform across token positions. Our findings
    suggest a new direction for designing attention architectures that adaptively
    allocate representational capacity across sequences, enabling further reductions
    in KV cache during inference.'
- title: Latent Reasoning with Normalizing Flows
  date: 2026-06
  url: https://arxiv.org/abs/2606.06447
  category: method
  subcategory: non-agentic
  authors:
  - Guancheng Tu
  - Xiangjun Fu
  - Suhao Yu
  - Yao Tang
  - Haoqiang Kang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language models often improve reasoning by generating explicit
    chain-of-thought (CoT), demonstrating the importance of intermediate computation.
    However, textual CoT forces this computation through a discrete, serial, and communication-oriented
    token stream: each reasoning step must be verbalized before the model can proceed,
    even when the underlying update is semantic, uncertain, or only partially formed.
    Latent reasoning offers a higher-bandwidth alternative by performing intermediate
    computation in compact continuous states before committing to text. Yet existing
    latent-reasoning methods often sacrifice key advantages that make CoT effective
    in autoregressive language models, including native left-to-right generation,
    probabilistic sampling, compatibility with KV-cache decoding, and tractable likelihood
    estimation. We propose NF-CoT, a latent reasoning framework that preserves these
    advantages by modeling continuous thoughts with normalizing flows. NF-CoT instantiates
    a TARFlow-style normalizing flow inside the LLM backbone, defining a tractable
    probability model over compact continuous thoughts distilled from explicit CoT.
    Continuous-thought positions are generated by an NF head, while text positions
    are generated by the standard LM head within the same causal stream. This design
    provides exact likelihoods for latent thoughts, enables probabilistic left-to-right
    decoding with the original KV cache, and supports direct policy-gradient optimization
    in the latent reasoning space. On code-generation benchmarks, NF-CoT improves
    pass rates over explicit-CoT and prior latent-reasoning baselines while substantially
    reducing intermediate-reasoning cost.'
- title: 'You Only Index Once: Cross-Layer Sparse Attention with Shared Routing'
  date: 2026-06
  url: https://arxiv.org/abs/2606.06467
  category: method
  subcategory: non-agentic
  authors:
  - Yutao Sun
  - Yanqi Zhang
  - Li Dong
  - Jianyong Wang
  - Furu Wei
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Long-context inference in modern LLMs is increasingly constrained by decoding
    efficiency, especially in reasoning-heavy settings where models generate long
    intermediate chains of thought. Existing sparse attention methods often face a
    practical efficiency-quality trade-off. Structured block sparse methods typically
    provide stronger acceleration but incur noticeable quality loss, while token sparse
    methods are usually more accurate yet deliver limited end-to-end speedup because
    top-k routing over the full cache remains expensive. In this work, we propose
    cross-layer sparse attention (CLSA), which is built on top of KV-sharing architectures
    such as YOCO. The core idea is to share not only the KV cache across cross-decoder
    layers, but also the routing index. A single indexer computes token-level top-k
    selection once and reuses the resulting index across layers, thereby preserving
    the fine-grained selectivity of token sparse attention while amortizing the routing
    overhead. The resulting architecture improves all major inference bottlenecks
    jointly, including pre-filling, KV-cache storage, and long-context decoding. Experiments
    across short-context and long-context benchmarks show that CLSA is both accurate
    and efficient, achieving up to 7.6x decoding speedup and 17.1x overall throughput
    improvement at 128K context. These results suggest a more complete architectural
    solution for long-context LLMs that jointly advances model quality and inference
    efficiency.
- title: 'TreeWY: Speculative Verification for Gated DeltaNet Hybrids'
  date: 2026-08
  url: https://arxiv.org/abs/2608.20961
  category: method
  subcategory: non-agentic
  authors:
  - Sneha Murthy Ghantasala
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Modern open models are hybrids: most layers are linear-attention (Gated
    DeltaNet, GDN) layers carrying a small fixed-size recurrent state instead of a
    growing key-value (KV) cache. This makes ordinary decoding memory-efficient, but
    hurts speculative decoding. To verify a batch of draft tokens and then roll back
    the rejected ones, today''s systems snapshot the full recurrent state at every
    draft position for GDN layers, and those snapshots cannot be shared across branches
    of a draft tree, so a wide, high-acceptance tree becomes memory-infeasible. We
    remove the snapshots. Using a tree-structured WY transform of the gated delta
    rule, we compute every draft node''s output with a single triangular solve and
    reconstruct only the one accepted state on commit, storing a small pseudo-value
    matrix instead of per-node states; the derivation depends only on the gated delta
    rule, not on any other architectural detail. In serving benchmarks on two scales
    of one hybrid model family (Qwen3.5 35B and 397B) this cuts speculative recurrent-state
    memory and KV-cache pressure at identical acceptance length, turning the freed
    HBM into higher throughput and much lower time-to-first-token (TTFT) wherever
    memory binds, and costing a few percent where it does not. For tree width the
    same memory buys affordability: a wider, higher-acceptance draft becomes possible,
    though not yet a throughput win.'
- title: 'Recall Before You Rank: Similarity-Guided Top-K Reuse for Efficient Long-Context
    Attention'
  date: 2026-07
  url: https://arxiv.org/abs/2607.27692
  category: method
  subcategory: non-agentic
  authors:
  - Wenshuai Yao
  - Wenyong Zhou
  - Hanyong Shao
  - Yizhe Chen
  - Zhiyuan Ning
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Top-K sparse attention reduces the cost of Softmax and value aggregation
    by attending to only a small subset of key--value (KV) entries. However, identifying
    this subset still requires scoring the current query against the full KV cache
    and performing global Top-K selection, leaving selector cost linear in context
    length and limiting the practical efficiency of sparse attention for long-context
    decoding. In this paper, we introduce ReTopK, a training-free method that accelerates
    dynamic Top-K attention by reusing historical retrieval decisions. ReTopK builds
    on the observation that similar queries often attend to overlapping supports and
    that partially overlapping supports can still preserve most of the Exact Top-K
    attention mass. For each attention head, it maintains a bounded cache of historical
    query--support pairs, retrieves the most similar cached queries for each new query,
    unions their stored supports with a recent window, and reranks only the resulting
    compact candidate set using exact current-query scores. A similarity-based fallback
    invokes full-history Exact Top-K when reuse is unreliable, while periodic exact
    refreshes limit cache drift. ReTopK retains the complete KV cache and reuses only
    selected indices, rather than historical scores, attention weights, or outputs.
    Across 16K--128K contexts, ReTopK achieves the lowest PG19 perplexity and the
    highest NIAH and LongBench scores among the evaluated approximate methods. At
    128K with K=512, ReTopK incurs only a 0.50% perplexity increase over Exact Top-K
    while accelerating attention computation by 3.07×.
- title: 'Fractional Decay KV-Cache: Ownership-Aware Memory Management for Improved
    Inference Relevancy in Dialog Systems'
  date: 2026-06
  url: https://arxiv.org/abs/2608.18098
  category: method
  subcategory: non-agentic
  authors:
  - Sukanta Ganguly
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Key-value (KV) caching is essential for efficient autoregressive inference
    in transformer based dialog systems, yet existing strategies treat all cached
    entries uniformly or apply coarse eviction heuristics that fail to adapt as dialog
    topics evolve. We propose Fractional Decay KV-Cache (FD-KVC), a novel algorithm
    that maintains a dual-channel scoring mechanism for each cached KV pair: a cumulative
    attention channel that tracks aggregate importance (akin to H2O), and a recency-weighted
    relevance channel governed by temporal decay and reinforcement-inspired updates.
    The combination enables FD-KVC to both preserve historically important tokens
    and rapidly adapt when dialog topics shift. An adaptive learning rate driven by
    an ownership loss function ensures convergence without oscillation. FD-KVC operates
    entirely on CPU with negligible overhead. Across five diverse multi-turn dialog
    scenarios with 600 dialogs each, FD-KVC outperforms H2O, the state-of-the-art
    heavy-hitter baseline, by +6.7% on composite late-turn alignment, with improvements
    of +127% on topic-shift, +87% on gradual evolution, and +30% on mixed-topic dialogs.
    FD-KVC adapts to new topics 3.6X faster than H2O and achieves the highest topic
    diversity (80.6%) across all methods. Ablation studies confirm the contribution
    of each component.'
- title: 'RestoreKV: Recovering Full-Cache Behavior Under Aggressive Query-Agnostic
    KV Cache Eviction'
  date: 2026-08
  url: https://arxiv.org/abs/2608.01247
  category: method
  subcategory: non-agentic
  authors:
  - Changwoo Baek
  - Seungjun Shin
  - Kyeongbo Kong
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Query-agnostic KV cache eviction compresses a context once and reuses
    the resulting cache for arbitrary future queries, but performance can collapse
    under tight budgets. Existing methods primarily improve which original KV pairs
    are retained. We introduce RestoreKV, which complements this selection-based formulation
    with learned restoration under the same total KV budget. Our key insight is that,
    although the information lost through eviction is context-specific, the mechanism
    for generating its compact complement can be shared across contexts. After context
    prefill, a few restore tokens attend to the full KV cache in a single LoRA-adapted
    pass, generating a compact, context-conditioned restore cache. The base importance
    scorer and eviction rule remain unchanged, and the adapters are disabled for all
    subsequent queries and decoding. RestoreKV is trained through parameter-efficient
    self-distillation from the frozen full-cache model, optimizing only 0.4% of the
    parameters and requiring no task-specific tuning. Across four backbones and four
    long-context benchmarks, RestoreKV substantially reduces compression-induced degradation.
    On Qwen3-4B, it improves 59 of 60 paired, budget-matched settings across five
    base eviction methods; at a 5% budget, it raises KVzip from 38.2 to 73.2 on RULER-4K.
    Applied to KVzip+, RestoreKV reaches 86.4 RULER accuracy at 16× compression on
    the KVPress Benchmark, while adding less than 0.5% one-time cache-construction
    overhead in a 32K-context evaluation. Our project page is available at https://paper.pnu-cvsp.com/RestoreKV/
- title: 'MM-ShiftKV: Decode-Aware Prefill-Stage KV Selection for Multimodal Large
    Language Models'
  date: 2026-06
  url: https://arxiv.org/abs/2607.22586
  category: method
  subcategory: non-agentic
  authors:
  - Jinsong Shu
  - Chenyang Wu
  - Zhongle Xie
  - Baokun Wang
  - Lidan Shou
  venue: ''
  code_url: https://github.com/zjuDBxAI/MM-ShiftKV
  project_url: ''
  abstract: Key-Value (KV) caching is essential for efficient inference in multimodal
    large language models (MLLMs), yet its memory footprint grows linearly with context
    length and becomes a major bottleneck due to the large number of visual tokens.
    Recent prefill-stage KV selection methods estimate KV importance from prefilling
    statistics, implicitly assuming that prefilling-time queries are representative
    of those encountered during decoding. We show that this assumption breaks down
    in multimodal inference, where decoding-time queries exhibit substantially larger
    variance than prefilling-stage representations, leading to unstable KV importance
    estimation under tight cache budgets. As a result, small ranking errors can disproportionately
    discard semantically critical visual tokens and degrade grounding and reasoning
    performance. We propose MM-ShiftKV, a training-free, decode-aware and strictly
    prefill-only KV selection method. MM-ShiftKV approximates decoding-time query
    behavior during prefilling by constructing variance-expanded query proxies and
    estimates prompt KV importance based on their aggregated attention mass. Experiments
    on multimodal benchmarks demonstrate that MM-ShiftKV consistently outperforms
    existing methods under strict KV-cache budgets. Our code is available at https://github.com/zjuDBxAI/MM-ShiftKV.
- title: 'KVEraser: Learning to Steer KV Cache for Efficient Localized Context Erasing'
  date: 2026-06
  url: https://arxiv.org/abs/2606.17034
  category: method
  subcategory: non-agentic
  authors:
  - Mufei Li
  - Shikun Liu
  - Dongqi Fu
  - Haoyu Wang
  - Yinglong Xia
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Post-hoc context erasing over the KV cache is challenging because a local
    edit has a global consequence: once a span has been processed, its influence propagates
    into the cached states of all subsequent tokens. This issue arises naturally in
    long-context LLM applications, where stale retrieved facts, incorrect tool observations,
    retracted user preferences, or harmful prompt injections may be identified only
    after prefill. Exact erasing must then recompute all tokens after the deleted
    span, making its computational cost depend on suffix length rather than erased-span
    length. We introduce KVEraser, a learned KV-cache editing method for efficient
    localized context erasing. Given a processed context and a span to remove, KVEraser
    replaces only the KV states of the erased interval with learned steering states
    while reusing the remaining cache unchanged. To learn a transferable erasing mechanism,
    we build a two-stage training pipeline: generic span-neighbor pre-training teaches
    the eraser to suppress the influence of the erased span, while task-specific fine-tuning
    adapts this capability to downstream scenarios. Experiments show that KVEraser
    nearly matches full recomputation in post-erasure performance on in-domain tasks
    across 1K--32K context lengths, while its latency increases by only 24% compared
    with a 17.6x increase for full recomputation. KVEraser also generalizes to unseen
    long-document QA tasks with harmful factual distractors, achieving the best performance
    among approximate baselines with a 3--4x speedup over full recomputation.'
- title: 'QEvict: Recoverable Quantized KV Eviction for Attention-Drift-Robust Long-Context
    Decoding'
  date: 2026-08
  url: https://arxiv.org/abs/2608.05326
  category: method
  subcategory: non-agentic
  authors:
  - Ayushman Garg
  - Akshita Gupta
  - Shaswata Bhattacharya
  - Abhishek Gupta
  - Sandeep Kumar
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Autoregressive large language model inference is increasingly constrained
    by the memory footprint of the Key-Value (KV) cache. A dominant line of work reduces
    this footprint by evicting tokens that appear unimportant under attention-derived
    scores. However, such policies make an implicit irreversible decision: once a
    token is evicted, it cannot become useful again. We show that this assumption
    is brittle during decoding. Token and window importance drift as generated queries
    evolve, causing standard eviction policies to permanently discard states that
    later receive substantial attention under the full-cache model. To characterize
    this behaviour, we introduce Future Missed Mass and Global LIR, two diagnostics
    that measure future attention assigned to discarded states and the reactivation
    of historically inactive regions. We propose QEvict, a three-tier KV-cache management
    scheme that replaces binary retain-or-delete eviction with recoverable eviction.
    QEvict maintains high-confidence windows in full precision, stores intermediate
    windows in a quantized recoverable tier, and deletes only the lowest-confidence
    windows. During decoding, cumulative attention scores update window importance
    and when a quantized window becomes important again, it is dequantized and promoted
    to the full-precision. Under a fixed memory budget, this design preserves broader
    historical context while retaining exact full precision for the most important
    regions. Across long-context understanding, retrieval, and reasoning benchmarks,
    QEvict consistently improves over representative eviction and quantization baselines,
    reducing missed attention and improving information retention'
- title: RoPE-Aware Bit Allocation for KV-Cache Quantization
  date: 2026-06
  url: https://arxiv.org/abs/2606.24033
  category: method
  subcategory: non-agentic
  authors:
  - Fengfeng Liang
  - Yuechen Zhang
  - Jiaya Jia
  venue: ''
  code_url: https://github.com/JIA-Lab-research/blockgtq
  project_url: ''
  abstract: 'Existing low-bit KV-cache quantizers often treat each cached key as a
    flat vector. Under RoPE, however, a key''s contribution to a future attention
    logit decomposes into a position-dependent sum over two-dimensional frequency
    blocks. This makes key-cache quantization a block-wise bit-allocation problem:
    high-energy RoPE blocks are more sensitive to quantization error and should receive
    more bits. We introduce Block-GTQ, a RoPE-aware bit allocator for key-cache quantization
    built on TurboQuant-MSE(TQ-MSE). For each layer and KV head, Block-GTQ computes
    a label-free energy score for each RoPE block and greedily allocates integer bit
    widths by marginal gain. Under matched K/V bit budgets, Block-GTQ better preserves
    RoPE query-key logits on a ten-model diagnostic panel, cutting per-layer MAE by
    32-80% at 2 and 3 b/dim K-only quantization and winning all 367/367 layer comparisons
    against uniform TQ-MSE. These fidelity gains translate to stronger downstream
    long-context retrieval, understanding, and reasoning. At K2V2 on Llama-3.1-8B-Instruct,
    Block-GTQ raises the six-task NIAH average from 70.6 to 97.4, and the LongBench-EN
    average from 36.87 to 53.31. On AIME 2024/2025 with DeepSeek-R1-Distill-Qwen-7B,
    without an fp16 recent-key buffer, Block-GTQ at K3V2 scores 51.7/37.5, close to
    fp16''s 54.2/37.9, whereas uniform TQ-MSE collapses to 0.0/0.0. We further implement
    a packed-cache serving path. On a single H800 GPU with Qwen2.5-3B-Instruct, packed
    K3V3 achieves 3.24x KV-cache compression with fp16-comparable quality, runs 1.34x
    faster than fp16 FlashAttention2 at 128K context, reduces peak memory from 56.31
    GB to 19.85 GB, and remains feasible at 256K and 512K where fp16 OOMs. Code is
    available at https://github.com/JIA-Lab-research/blockgtq.'
- title: 'Beyond tokens: a unified framework for latent communication in LLM-based
    multi-agent systems'
  date: 2026-06
  url: https://arxiv.org/abs/2606.05711
  category: method
  subcategory: non-agentic
  authors:
  - Yingzhuo Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Multi-agent systems built on large language models (LLMs) have become
    a prevailing paradigm for tackling complex reasoning, planning, and tool-use tasks.
    The dominant communication protocol in such systems is natural language: agents
    exchange messages token-by-token, verbalising their internal reasoning so that
    peers can read, verify, and respond. While convenient and interpretable, this
    protocol suffers from three structural drawbacks -- high inference cost, irreversible
    information loss during discretization, and ambiguity/redundancy of natural language.
    A growing body of work therefore explores an alternative protocol -- latent communication
    -- in which agents exchange continuous representations (embeddings, hidden states,
    or KV-caches) directly, bypassing the bottleneck of text generation. This paper
    presents a unified framework for organising the rapidly expanding literature on
    latent communication. We analyse existing methods along three orthogonal axes:
    (1) WHAT information is communicated (Embeddings, Hidden States, KV-Caches, or
    other continuous state); (2) WHICH sender-receiver alignment is used (latent-space
    alignment and layer alignment); and (3) HOW the communicated information is fused
    into the receiver (concatenation, prepending, mathematical operations, cross-attention,
    or cache restoration). Under this 3-axis framework, we systematically categorise
    eighteen representative methods proposed between 2024 and 2026, identify five
    major design patterns, and surface a set of open challenges -- including cross-architecture
    alignment, security of latent channels, compression for edge deployment, and the
    relationship between latent communication and latent chain-of-thought. We hope
    that this framework both lowers the barrier to entry for new researchers and provides
    a vocabulary for comparing future work.'
- title: 'Depth-Attention: Cross-Layer Value Mixing for Language Models'
  date: 2026-06
  url: https://arxiv.org/abs/2606.05014
  category: method
  subcategory: non-agentic
  authors:
  - Boyi Zeng
  - Yiqin Hao
  - Zitong Wang
  - Shixiang Song
  - He Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Self-attention selects information freely across the sequence, but across
    depth, Transformers merely add each layer''s output to the residual stream, so
    later layers cannot selectively reuse earlier-layer representations. Recent cross-layer
    methods improve this flow but operate on hidden states outside attention, adding
    state beyond the key-value cache at inference--a cost that becomes increasingly
    salient as modern LLMs compress the cache with grouped-query and multi-head latent
    attention. We introduce Depth-Attention, which performs this selection inside
    the attention module itself: before a layer attends over the sequence, its query
    attends over the keys of earlier layers at the same token position and mixes their
    values into the value that self-attention then reads. Because Depth-Attention
    reuses the standard attention queries, keys, and value-cache slots, storing depth-mixed
    values in place of the original values, it adds no parameters and introduces no
    persistent inference state beyond the standard key-value cache--the same cache
    size as a vanilla decoder and less than hidden-state-based cross-layer methods.
    On Qwen3-style decoders at 1.5B and 3B parameters, Depth-Attention attains the
    lowest perplexity and the highest average downstream accuracy, improving over
    the vanilla Transformer by up to 2.3 accuracy points and surpassing strong cross-layer
    baselines in perplexity and average accuracy, while adding under 0.01% extra arithmetic
    FLOPs and no additional persistent inference state. The gains hold from 360M to
    3B parameters and extend to looped Transformers.'
- title: 'DIRECT: Direct Decoding for Efficient and Aligned Sequence Labeling with
    Large Language Models'
  date: 2026-07
  url: https://arxiv.org/abs/2607.26891
  category: method
  subcategory: non-agentic
  authors:
  - Yilei Wang
  - Jiaxin Gan
  - Kexuan Zhang
  - Ling Li
  - Wentao Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Sequence labeling is a fine-grained information extraction task, yet existing
    large language model-based approaches suffer from insufficient domain alignment
    and low inference efficiency. To address these issues, we propose DIRECT, a framework
    that addresses these issues through training-time optimization and inference-time
    rectification. Specifically, DIRECT performs Direct Preference Optimization (DPO)
    after supervised fine-tuning to strengthen task alignment with human preferences,
    and introduces a controlled decoding process that enforces fixed output formats
    and restricts predictions to candidate sets. To further improve efficiency, a
    template-filling mechanism requires the model to generate only label tokens while
    reusing prefixed content through the KV Cache, thus reducing redundant computation.
    Experimental results on eight datasets demonstrate that DIRECT achieves significant
    improvements in both performance and efficiency compared to existing methods.
- title: 'Archer: Adaptive Reuse of Cached Hidden States for Efficient Rollback in
    Diffusion Language Models'
  date: 2026-08
  url: https://arxiv.org/abs/2608.08086
  category: method
  subcategory: non-agentic
  authors:
  - Xuning He
  - Zinan Sheng
  - Yongding Tao
  - Huanyu Liu
  - Ge Li
  venue: ''
  code_url: https://github.com/Hxnng/Archer
  project_url: ''
  abstract: Diffusion language models (DLMs) iteratively refine a sequence, allowing
    earlier predictions to be revised as context evolves. This rollback capability
    distinguishes them from irreversible autoregressive generation, but makes inference
    costly. Every denoising update alters the global context, forcing both prompt
    and response states to be recomputed even though only response tokens are revisable.
    Key-value (KV) caching could reduce this cost, yet conventional caching assumes
    immutable historical states and is therefore difficult to reconcile with rollback.
    In this paper, we introduce Adaptive Reuse of Cached Hidden States for Efficient
    Rollback (Archer), a training-free KV caching method for rollback-capable DLMs.
    Archer asymmetrically keeps the mutable response synchronized with the current
    hypothesis while reusing prompt K/V within a bounded state neighborhood. Although
    prompt representations also change under bidirectional attention, their token
    identities remain fixed; bounded reuse therefore amortizes repeated prompt computation
    without caching mutable response states. It also delays feedback from tentative
    tokens, reducing premature reinforcement of transient high-confidence errors and
    giving rollback more opportunity to correct them. Our analysis characterizes prompt
    reuse as a reversibility-aligned cache boundary, bounds its state-dependent approximation
    error, and gives a decoder-margin condition for preserving full-refresh decisions.
    Existing DLM acceleration often trades quality for speed. Archer shifts this frontier,
    attaining the best mean performance of 33.63% together with a 2.57x mean speedup
    on the main suite. Across evaluated settings, it improves Pass@1 by up to 3.05
    points and reaches up to 2.95x speedup. Controlled analyses connect the quality
    gain to delayed prompt feedback and validate state-aware refresh. Our code is
    available at https://github.com/Hxnng/Archer.
- title: 'AnchorKV: Anchor-Residual KV Cache Compression'
  date: 2026-08
  url: https://arxiv.org/abs/2608.02901
  category: method
  subcategory: non-agentic
  authors:
  - Malik Khalaf
  - Yara Shamshoum
  - Nitzan Hodos
  - Yuval Sieradzki
  - Assaf Schuster
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The key-value (KV) cache is the primary memory bottleneck in long-context
    LLM inference. Existing approaches attack it from opposite ends: eviction methods
    permanently discard tokens, degrading performance whenever a discarded token later
    proves essential, while quantization methods retain all tokens at low precision
    but offer limited compression. We propose AnchorKV, a compression scheme that
    shrinks the cache by 20× without discarding a single token. AnchorKV represents
    the cache using a small set of anchors stored exactly, expresses every other token
    through its most similar anchor, and refines only those whose approximation most
    affects the model''s output. AnchorKV consistently preserves accuracy across models
    and datasets, retaining 99% of the full-cache score at the 70B scale, while keeping
    the entire context at a fraction of its cost.'
- title: 'VoiceChat-TTS: A Low-Latency Continuous Speech Synthesis Model for Interactive
    Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.13831
  category: method
  subcategory: non-agentic
  authors:
  - Edresson Casanova
  - Jaehyeon Kim
  - Mariana Graterol Fuenmayor
  - Shehzeen Hussain
  - Viacheslav Klimkov
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Spoken dialogue is a natural form of human--computer interaction, yet
    most speech language models remain limited to turn-based operation and lack real-time
    adaptability, such as user barge-in. Recent duplex speech-to-speech and speech-to-text
    models reduce latency by replacing multi-stage pipelines, but often compromise
    speech quality because accurate ASR, interruption handling, and high-fidelity
    synthesis must be optimized jointly. We propose VoiceChat-TTS, a low-latency,
    continuous, and streamable text-to-speech model for interactive agents. VoiceChat-TTS
    is driven directly by LLM text-token streams, supports explicit interruption via
    control tokens, and produces silence when no textual input is available. The model
    enables always-on, responsive speech generation while preserving modularity and
    high speech quality, and it supports mid-utterance interruptions without resetting
    the KV cache.
- title: 'RaBitQCache: Rotated Binary Quantization for KVCache in Long Context LLM
    Inference'
  date: 2026-06
  url: https://arxiv.org/abs/2606.31519
  category: method
  subcategory: non-agentic
  authors:
  - Wenhao Li
  - Jinhao Dong
  - Hailin Zhang
  - Wenhang Shi
  - Wei Lu
  venue: ''
  code_url: https://github.com/Sakuraaa0/RaBitQCache.git
  project_url: ''
  abstract: Long-context Large Language Model inference is severely bottlenecked by
    the massive Key-Value (KV) cache, yet existing sparse attention methods often
    suffer from static fixed-budget (Top-k) retrieval or rely on proxy scores that
    are computationally expensive and biased. To address these limitations, we propose
    RaBitQCache, a novel sparse attention framework that utilizes randomized rotated
    binary quantization and high-throughput binary-INT4 arithmetic to efficiently
    estimate attention weights. Our proxy score serves as an unbiased estimator with
    a proven error bound, enabling adaptive Top-p retrieval that dynamically adjusts
    the token budget based on actual attention sparsity. We further implement a hardware-aware
    system with asynchronous pipelining and lazy updates to mask overhead. Evaluations
    demonstrate that RaBitQCache significantly accelerates inference and reduces memory
    I/O while preserving generation quality compared to state-of-the-art baselines.
    Code is available at https://github.com/Sakuraaa0/RaBitQCache.git.
- title: Thought-Aware KV Cache Compaction for Reasoning via Adaptive Attention Matching
  date: 2026-06
  url: https://arxiv.org/abs/2608.12331
  category: method
  subcategory: non-agentic
  authors:
  - Yang Liu
  - Bin Chong
  - Chongyang Zhang
  - Hao Zheng
  - Jiayu Liang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Reasoning language models generate lengthy chain-of-thought (CoT) sequences
    whose key-value (KV) cache grows linearly and becomes a memory bottleneck during
    decoding. Existing compaction methods treat reasoning trajectories as flat token
    sequences and apply uniform compression, ignoring the hierarchical structure of
    CoT reasoning where different steps vary drastically in importance. We propose
    textbf{Thought-Aware Attention Matching (TAM), which exploits this structure through
    three mechanisms: (i)~thought segmentation that decomposes the trajectory into
    reasoning blocks, (ii)~adaptive budget allocation that assigns compression budget
    based on each segment''s importance and size, and (iii)~pivotal token protection
    that preserves high-attention reasoning anchors. We prove that the allocation
    rule is optimal under a convex error model and that cumulative error under sequential
    compaction remains bounded. Experiments on AIME 2024 and MATH-500 with Qwen3-4B
    show that TAM improves accuracy over uniform compaction at the same memory footprint,
    with periodic compaction bounding peak memory to 3.1--3.2,GB (a 65% reduction)
    while maintaining competitive accuracy.'
- title: 'Latent Personal Memory: Represent personal memory as dynamic soft prompts'
  date: 2026-06
  url: https://arxiv.org/abs/2606.20911
  category: method
  subcategory: non-agentic
  authors:
  - Debrup Das
  - Avinash Amballa
  - Yashas Malur Saidutta
  - Vijay Srinivasan
  - Vivek Kulkarni
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Personalizing large language models (LLMs) requires encoding long-term,
    user-specific behavioral patterns in a way that is computationally efficient,
    scalable, and compatible with a frozen base model. We present Latent Personal
    Memory (LPM), a scalable framework that represents user-specific history as a
    compact, persistent matrix of N latent slots, that are interpretable. A shared
    cross-attention projection network maps these slots into dynamic, input-conditioned
    soft prompts that are prepended to the input of a frozen LLM. We evaluate LPM
    on PersonaMem v1 and LoCOMO benchmarks across Qwen3-1.7B, 4B, and 8B backbones.
    Results demonstrate that LPM outperforms LoRA and Prompt Tuning by up to 8.8%
    and 54.4% in overall accuracy respectively on PersonaMem v1, while reducing KV-cache
    usage by over 64x. On LoCoMo, LPM matches LoRA accuracy with 120x fewer trainable
    parameters. We also show that the efficiency of LPM grows with context length
    and outperforms full-context at 128K context length.
- title: 'PrunePath: Towards Highly Structured Sparse Language Models'
  date: 2026-05
  url: https://arxiv.org/abs/2605.28283
  category: method
  subcategory: non-agentic
  authors:
  - Zhexuan Gu
  - Zixun Fu
  - Yancheng Yuan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Feed-forward networks (FFNs) dominate the parameter count and computation
    of modern language models, yet existing pruning methods often struggle to convert
    sparsity into hardware-friendly inference efficiency gains. We introduce textbf{PrunePath,
    a budget-adaptive structured sparsification framework for FFN layers. Built on
    MoEfication, PrunePath replaces independent expert-wise thresholding with a softmax-normalized
    routing distribution and activates important experts under a cumulative-mass threshold.
    This formulation imposes a token-level probability budget, enabling adaptive expert
    counts and a direct inference-time sparsity knob from a single checkpoint. Across
    NLU, NLG, and instruction-tuning evaluations, PrunePath achieves a favorable sparsity--performance
    trade-off compared with existing static pruning and MoEfication-based methods.
    We further implement Triton kernels for KV-cache decoding to translate the resulting
    structured sparsity into practical memory savings and measurable decoding-speed
    improvements. These results demonstrate the superior performance of PrunePath
    for building highly sparse, deployment-friendly large language models.
- title: Decoupled Mixture-of-Experts for Parametric Knowledge Injection
  date: 2026-06
  url: https://arxiv.org/abs/2606.14243
  category: method
  subcategory: non-agentic
  authors:
  - Baoqing Yue
  - Weihang Su
  - Qingyao Ai
  - Yichen Tang
  - Changyue Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Knowledge injection aims to equip large language models (LLMs) with external,
    domain-specific, or time-sensitive knowledge. Existing approaches typically face
    a trade-off between flexibility and integration: retrieval-augmented generation
    keeps knowledge outside the model but only provides prompt-level augmentation,
    whereas post-training based methods encode new knowledge into shared parameters
    but may introduce catastrophic forgetting, knowledge conflict, and costly updates.
    In this paper, we propose Decoupled Mixture-of-Experts (DMoE), a modular architecture
    for parametric knowledge injection that decouples both experts and the router
    from the base model. DMoE converts external knowledge corpora into independently
    updatable expert modules and uses a lightweight uncertainty-aware router to activate
    relevant experts only when the base model lacks sufficient knowledge during generation.
    To support efficient auto-regressive inference, DMoE attaches experts only to
    the final-layer feed-forward network, preserving KV-cache reuse while enabling
    parameter-level knowledge augmentation. Experiments on knowledge-intensive benchmarks
    show that DMoE consistently improves answer quality over retrieval and adapter-based
    baselines.'
- title: 'Dustin: Draft-Augmented Sparse Verification for Efficient Long-Context Generation
    with Speculative Decoding'
  date: 2026-06
  url: https://arxiv.org/abs/2606.24957
  category: method
  subcategory: non-agentic
  authors:
  - WenHung Lee
  - Jian-Jia Chen
  - Xiaolin Lin
  - Pei-Shuo Wang
  - Chi-Chih Chang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'While speculative decoding improves inference throughput for multi-batch
    long-context Large Language Models (LLMs), its efficiency is often limited by
    a verification bottleneck where Key-Value (KV) cache loading dominates latency.
    Existing compression methods fail in this regime: static eviction incurs accuracy
    loss due to saliency shift, while dynamic selection introduces prohibitive computational
    overhead during the verification path. We propose Dustin, a sparse verification
    framework designed for long-context speculative decoding. Dustin integrates lookahead
    signals from the draft model with historical attention from the target model to
    identify critical tokens with high fidelity across multi-step verification windows.
    To reduce recomputation latency, this approach further employs a sparse estimation
    scheme that restricts importance scoring to a minimal subset of attention heads.
    Evaluations on PG-19 and LongBench with Qwen2.5-72B demonstrate that Dustin achieves
    a 27.85x speedup in self-attention and a 9.17x end-to-end decoding speedup at
    a 32k sequence length, all with negligible accuracy degradation.'
- title: 'Beyond Sparse Weights: When Is Attention Compressible?'
  date: 2026-08
  url: https://arxiv.org/abs/2608.21541
  category: method
  subcategory: non-agentic
  authors:
  - Chiwun Yang
  - Xiaoyu Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'KV-cache compression is often justified by attention maps with a few
    large weights. This is incomplete: large weights may not contain most of the mass,
    omitted values can cancel, and preserving the attention output may not preserve
    the task. We separate these questions. Global score gaps -- not threshold counts
    -- determine how many tokens are needed to retain a target mass. For a realized
    row, the weighted sum of omitted values is the exact missing statistic. A controlled
    retrieval--aggregation model explains when truncation helps and when it hurts.
    These results motivate CertKV, a training-free compressor that reserves one tail-summary
    slot per head and allocates the rest by value dispersion. Under matched budgets,
    CertKV is top-two in seven of nine LongBench-v2 settings, remains in the leading
    compressed tier on 128K RULER, and realizes a ten-fold cache budget in a packed
    Llama prototype. Compressibility depends on the mass, values, future queries,
    and task -- not on a sparse-looking map alone.'
- title: Variable-Width Transformers
  date: 2026-06
  url: https://arxiv.org/abs/2606.18246
  category: method
  subcategory: non-agentic
  authors:
  - Zhaofeng Wu
  - Oliver Sieberling
  - Shawn Tan
  - Rameswar Panda
  - Yury Polyanskiy
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Scaling model size, specifically depth and width, has driven significant
    progress in transformer-based language models. However, most architectures maintain
    a constant width across all layers, allocating a fixed parameter and computation
    budget evenly despite different layers potentially playing distinct computational
    roles. In this work, we empirically investigate nonuniform capacity allocation
    across network depth by proposing a times-shaped > <former architecture. This
    design maintains wider early and late layers while narrowing the middle layers,
    utilizing a parameter-free residual resizing mechanism. Across decoder-only language
    models ranging from 200M to 2B parameters (dense) and 3B parameters (MoE), our
    > <former consistently outperforms parameter-matched uniform baselines on language
    modeling loss. By reducing the average layer width, this architecture also requires
    fewer overall FLOPs (22% reduction under fitted loss-matched scaling curves) and
    smaller KV cache memory and I/O cost (15% reduction). In analysis, we show that
    this bottleneck structure results in qualitatively different representations in
    residual streams. Overall, our results demonstrate that nonuniform width allocation
    can result in more resource-optimal scaling of language models.
- title: 'PReM: Learning What to Preserve and When to Refresh for Context Compression'
  date: 2026-07
  url: https://arxiv.org/abs/2607.14327
  category: method
  subcategory: non-agentic
  authors:
  - Bohan Yu
  - Lei Shen
  - Chenxi Zhou
  - Chen Han
  - Junlin Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Efficient long-context inference is not only about reducing memory cost,
    but also about keeping useful contextual evidence accessible as generation proceeds.
    However, existing compression-oriented approaches, such as key-value (KV) cache
    compression and context compression, often either make an early decision about
    which contextual information to keep or rely on an external compressor. Such designs
    make it difficult to adapt the compressed context to the evidence needed by later
    reasoning steps. This paper introduces PReM (Preserve and Refresh Memory), a context-compression
    framework that maintains the long context as the model's internal layer-wise KV
    memory and learns what to preserve and when to refresh it. Specifically, PReM
    uses a dedicated memory layer to make memory-selection decisions, and a special
    memory token <m> to trigger refreshes during generation. To train this behavior,
    PReM introduces Phase-Separated Refresh Training, aligning memory selection with
    memory-conditioned generation while preserving continuity across refreshes. Experiments
    with 32K-token contexts show that PReM outperforms strong baselines under both
    16x and 32x compression, while maintaining a favorable balance between answer
    quality and inference efficiency.
- title: 'RT-SEMamba: Real-Time Speech Enhancement Mamba via Progressive Knowledge
    Distillation'
  date: 2026-08
  url: https://arxiv.org/abs/2608.12099
  category: method
  subcategory: non-agentic
  authors:
  - Rong Chao
  - Sung-Feng Huang
  - Moreno La Quatra
  - Sabato Marco Siniscalchi
  - Wen-Huang Cheng
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present RT-SEMamba, a fully causal speech enhancement (SE) model built
    upon causal time-frequency Mamba blocks. Unlike Transformer-based architectures
    that rely on a growing key-value cache, Mamba propagates a fixed-size recurrent
    state per layer, enabling memory- and bandwidth-efficient long-form inference.
    We further introduce a progressive knowledge distillation (KD) strategy that compresses
    an 8-layer teacher into a shallow 1-layer student by jointly distilling complex
    spectral outputs and intermediate representations. On Voicebank-DEMAND, the 8-layer
    RT-SEMamba achieves 3.32 PESQ with a 25 ms algorithmic latency constraint, and
    the distilled 1-layer student improves over a naive 1-layer baseline from 3.06
    to 3.18 PESQ while preserving the same steady-state RTF, delivering a 2.75x speedup
    over the teacher. These results demonstrate that state-space models with progressive
    KD provide a competitive quality-latency trade-off for real-time SE.
- title: Error Certificates for KV-Cache Eviction via Randomized Design
  date: 2026-07
  url: https://arxiv.org/abs/2607.21475
  category: method
  subcategory: non-agentic
  authors:
  - Peng Xie
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Deterministic KV-cache eviction keeps the top-k tokens under an importance
    score and deletes the rest. We prove that this design cannot know what it destroyed:
    evicted values can be altered so that everything the serving system retains is
    unchanged while the true attention-output error grows arbitrarily, so no serving-time
    estimator of that error is consistent. Randomized eviction restores identifiability.
    With a Poisson-sampled tail at known inclusion probabilities, one logit offset
    performs the Hájek correction inside the softmax, and a survey-sampling variance
    estimator over the retained set becomes a per-step error certificate with 0.97
    empirical coverage at no accuracy cost. On real workloads, seven pre-registered
    claims locate the certificate''s value precisely. Prediction goes to output confidence:
    question-aware eviction at 25--50% budgets is nearly free, output log-probability
    predicts failure better than any cache-side signal, and certificate-gated budget
    escalation adds nothing. Attribution stays with the certificate: it separates
    cache-induced from inherent failures (AUC 0.65--0.75, against 0.47--0.54 for output
    confidence) and schedules recomputation better than random or confidence gating.
    Randomization buys attribution, not prediction.'
- title: 'Reading Between the Dots: Decoding Hidden Computation across Filler Tokens'
  date: 2026-07
  url: https://arxiv.org/abs/2607.03502
  category: method
  subcategory: non-agentic
  authors:
  - Kaley Brauer
  - Claudio Mayrink Verdun
  - Samuel Marks
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Frontier LLMs can perform multi-step reasoning over content-free filler
    tokens like dots or counting sequences, producing correct answers with no visible
    chain-of-thought (CoT). This is a limit case for behavioral oversight, where surface
    tokens carry no information about the underlying reasoning. But hidden from the
    output is not the same as hidden from us. On four task families (fact retrieval,
    parallel numeric composition, string manipulation, and in-context computation),
    two open-weights frontier models (DeepSeek V3, Kimi K2) compute over filler tokens
    in a structured, legible way: attention routes the question through the filler
    region to the answer, logit-lens readouts show retrieved facts emerging early
    and their composition crystallizing in late layers, and KV-cache transplants at
    filler positions causally swap outputs between examples. We introduce an unsupervised
    decoding pipeline that takes only hidden states as input and recovers intermediate
    values with 80-95% accuracy (best LLM judge) across both models and all four tasks,
    without ground-truth labels or training. Hidden computation that defeats behavioral
    CoT monitoring is, on these tasks, directly readable from the residual stream,
    suggesting monitorability is a property of the model''s full computational trace,
    not just its surface tokens.'
- title: 'Beyond Factual Knowledge: Benchmarking and Learning Step-Level Procedural
    Rule Reasoning in Large Language Models'
  date: 2026-08
  url: https://arxiv.org/abs/2608.22753
  category: method
  subcategory: non-agentic
  authors:
  - Bohan Yu
  - Pengfei Cao
  - Chen Han
  - Chenxi Zhou
  - Zhiheng Zhang
  venue: ''
  code_url: https://github.com/SharkSpicy-NLP/Beyond-Factual-Knowledge
  project_url: ''
  abstract: 'Large language models (LLMs) excel at text understanding and generation,
    yet still struggle to reliably understand and apply externally provided procedural
    rules at scale. To evaluate this capability, we introduce RuleWorld, a large-scale
    benchmark that reformulates rules as globally reusable abstract units rather than
    instance-specific facts. In RuleWorld, several scenarios, including single-rule,
    parallel multi-rule, and multi-hop reasoning, are settled for comprehensive evaluation.
    We further propose DynaRule, an end-to-end framework that injects the given rules
    into the KV cache and turns retrieval into an internal, learnable, step-wise process.
    Specifically, DynaRule employs Stacked Step-Level Attention Training with a special
    <search> token to enable dynamic rule re-attention and updating during inference.
    In this way, the model can re-attend to the most relevant rules at each step,
    dynamically replacing outdated ones to support more stable multi-step reasoning.
    Experiments on RuleWorld show that existing LLMs face challenges under large rule
    pools, while DynaRule improves average QA accuracy by up to 19 points and achieves
    over 85% Recall@1 at 10K rules, outperforming strong baselines by large margins.
    We make our code and dataset available here: https://github.com/SharkSpicy-NLP/Beyond-Factual-Knowledge.'
- title: Does Accuracy Equal Evidence? Reasoning Faithfulness under KV Cache Compression
  date: 2026-08
  url: https://arxiv.org/abs/2608.01631
  category: method
  subcategory: non-agentic
  authors:
  - Mengting Ai
  - Jingrui He
  - Yue Guo
  venue: ''
  code_url: https://github.com/famous-blue-raincoat/Safe_KV_Compress
  project_url: ''
  abstract: 'KV cache compression is commonly evaluated by final-answer accuracy,
    implicitly assuming that preserving the answer also preserves the reasoning that
    supports it. We test this assumption for large reasoning models and show that
    it can fail: under compression, correct answers and the validity of their visible
    supporting rationales can be preserved at different rates. We study this failure
    with a controlled fixed-trace replay protocol, which holds reasoning content fixed
    and isolates whether compression preserves usable information from an already
    available trace. We evaluate ten token-eviction KV compression methods and one
    quantization method on three models across mathematical reasoning, scientific
    QA, clinical calculation, and long-context retrieval. We measure final accuracy,
    answer-chain consistency, and perturbation faithfulness. Across tasks, token-eviction
    methods can preserve competitive final-answer accuracy while substantially degrading
    chain support or perturbation faithfulness. We call this the answer-evidence gap.
    A coverage-preserving quantization control is substantially less affected, suggesting
    that the failure is tied less to KV memory reduction itself than to losing access
    to parts of the reasoning trace. Code is available at https://github.com/famous-blue-raincoat/SafeKVCompress.'
- title: Epiphany-Aware KV Cache Eviction Without the Attention Matrix
  date: 2026-06
  url: https://arxiv.org/abs/2606.26472
  category: method
  subcategory: non-agentic
  authors:
  - Steven Kolawole
  - Virginia Smith
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'As reasoning models emit chains of thought tens of thousands of tokens
    long, KV cache increasingly becomes a deployment bottleneck. Existing cache eviction
    methods rank tokens by attention weight, which is a noisy importance proxy in
    long reasoning traces, and prohibits the use of fused kernels in production inference
    by forcing the model to materialize the attention matrix. In this work, we instead
    score tokens with a metric we term the epiphany score: the change in the model''s
    internal representation, read directly from the forward pass with no attention
    matrix and negligible extra state. Our resulting cache eviction method, EpiKV,
    requires no training, classifier, or custom kernel, and can be used directly in
    FlashAttention inference stacks unchanged -- scaling to a 16x longer feasible
    context than attention-based scoring. upper-mid layers negatively) and remove
    a positional trend with a causal rolling z-score. At a 4096-token cache EpiKV
    reaches 72% on MATH-500, matching the strongest attention-based baseline (ThinKV
    71%, H2O 67%); a lag-normalized KV variant reaches 37% on AIME-2024 at 8192 tokens
    against the best of them (33%), at up to 2.8x the speed.'
- title: 'Cartridges at Scale: Training Modular KV Caches over Large Document Collections'
  date: 2026-06
  url: https://arxiv.org/abs/2606.04557
  category: method
  subcategory: non-agentic
  authors:
  - Momchil Hardalov
  - Gonzalo Iglesias
  - Adrià de Gispert
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large Language Models can reason over long contexts, yet prefilling millions
    of tokens is wasteful as much of the content remains static across queries. Cartridges
    address this by distilling document collections into reusable key-value (KV) caches
    that eliminate prefilling while preserving accuracy. A critical limitation of
    this approach is that cartridges are monolithic and non-compositional: encoding
    an entire collection into a single KV block does not scale, and naively mixing
    cartridges trained in isolation collapses performance to near chance. We introduce
    Cartridges at Scale (CAS), a training framework for scalable multi-cartridge learning
    with dynamic distractor mixing and a memory-efficient budget manager that rotates
    hundreds of per-document cartridges between GPU and persistent storage. Our approach
    scales to collections exceeding a million tokens, improving over a monolithic
    cartridge by 10-31 points at comparable token budgets. Oracle cartridge accuracy
    falls within 2-6 points of full in-context learning even at high compression.
    When paired with retrieval for cartridge selection, CAS matches or exceeds conventional
    RAG accuracy while consuming 3-4x fewer prompt tokens.'
- title: 'ResKV: Reconstructing Omitted Attention Contributions for Fixed-Budget KV
    Cache Compression'
  date: 2026-07
  url: https://arxiv.org/abs/2607.29591
  category: method
  subcategory: non-agentic
  authors:
  - Yuhang Zhan
  - Lisi Chen
  - Shuo Shang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: KV cache compression is essential for efficient long-context inference.
    Existing eviction methods permanently discard unselected tokens and consequently
    remove their aggregate contribution to attention. Merging-based alternatives preserve
    more information but can perturb retained keys and values that should remain exact.
    We observe that the information omitted by cache eviction can be formulated as
    residual statistics in both the numerator and denominator of softmax attention.
    Based on this observation, we propose ResKV, which divides a fixed KV budget into
    an exact main cache and a compact residual cache that reconstructs the contribution
    of omitted tokens. ResKV lets main-cache tokens and residual entries participate
    in the same softmax normalization, so residual entries restore both attention
    numerator and denominator mass rather than acting as a post-hoc correction. A
    construction-time validation proxy determines residual allocation for each layer
    and KV head, while a decode-time dynamic gate adjusts residual contributions for
    individual queries. Comprehensive evaluations on LongBench and RULER, covering
    query-aware and query-agnostic settings, multiple backbones, cache budgets, and
    representative compression baselines, demonstrate broad improvements under the
    same retained KV budget while preserving the practical efficiency of compressed
    decoding, including peak memory usage and long-context decode throughput.
- title: 'MentorPulse: Refreshing Cross-Model Latent Guidance for Long-Form Generation'
  date: 2026-08
  url: https://arxiv.org/abs/2608.20927
  category: method
  subcategory: non-agentic
  authors:
  - Ziwu Liu
  - Guozhong Li
  - Chen Qiu
  - Weiyang Kong
  - Panos Kalnis
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Cross-model latent guidance lets a frozen large mentor encode an input
    once and a frozen small student generate from the resulting signal. Existing methods
    keep this signal fixed, assuming it stays useful as the output grows; we show
    this fails in long-form generation. On multi-turn instruction following, static
    guidance pushes a 4B student''s constraint satisfaction 2.5 points below its no-guidance
    baseline; a training-free refresh every 16 tokens changes only the memory content
    and restores a 2.0-point gain over that baseline. We propose MentorPulse to keep
    guidance fresh at practical cost: it compresses mentor states into a capped slot
    memory, incrementally processes newly generated tokens, and updates the memory
    that the student reads through gated cross-attention without resetting the student''s
    KV cache. Windowed Refresh Training exposes the bridge to prefix-conditioned memory.
    Across thirteen datasets, MentorPulse closes 52.2% of the mentor-student gap on
    macro average, outperforming C2C, T2T, and equal-budget LoRA, with the largest
    gains on long outputs. It performs best on all eleven mentor-student pairs from
    three model families, with margins that narrow as the capability gap grows, and
    a lightweight read-pattern check predicts the gain before deployment. Measured
    costs identify refresh intervals that dominate text guidance on long outputs.'
- title: 'Taylor-Calibrate: Principled Initialization for Hybrid Linear Attention
    Distillation'
  date: 2026-06
  url: https://arxiv.org/abs/2606.16429
  category: method
  subcategory: non-agentic
  authors:
  - Zhongzhu Zhou
  - Qingyang Wu
  - Junxiong Wang
  - Mayank Mishra
  - Shuaiwen Leon Song
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Hybrid linear attention models offer an appealing path to faster long-context
    inference: they reduce the quadratic cost and KV-cache burden of full softmax
    attention while retaining much of the quality of Transformer models. A practical
    way to obtain such models is to convert a pretrained Transformer instead of pretraining
    a new architecture from scratch, but this conversion is still brittle. Simply
    copying the teacher attention projections into a Gated DeltaNet (GDN) student
    does not specify the new recurrent decay, write, and output-gating dynamics. As
    a result, the converted model often starts in a poor dynamical regime and must
    spend many distillation tokens repairing initialization rather than learning the
    remaining teacher behavior. We propose Taylor-Calibrate, a lightweight initialization
    method for hybrid GDN students. The method uses Taylor-guided teacher attention
    statistics to set the value projection, memory timescale, write gates, and output
    gate, then applies a short per-layer alignment step to match each converted layer
    to the teacher output. Across four teacher settings and three retained-layer policies,
    Taylor-Calibrate gives substantially stronger zero-shot students, with up to an
    88x improvement in a representative ablation, and reaches matched recovery targets
    with 4.9x--9.2x fewer training tokens than naive conversion.'
- title: 'From Layers to Submodules: Rethinking Granularity in Replacement-Based LLM
    Compression'
  date: 2026-06
  url: https://arxiv.org/abs/2606.02559
  category: method
  subcategory: non-agentic
  authors:
  - Elia Cunegatti
  - Marcus Vukojevic
  - Erik Nielsen
  - Giovanni Iacca
  venue: ''
  code_url: https://github.com/eliacunegatti/SubFit
  project_url: ''
  abstract: 'Post-training compression of Large Language Models (LLMs) removes entire
    architectural components, either deleting them or replacing them with fitted modules.
    Existing replacement-based methods share two design constraints: full-layer granularity
    and contiguous selection. We argue that this is overly restrictive: in fact, redundancy
    in pretrained transformers is not confined to contiguous regions, nor does it
    evenly distribute between Attention and FeedForward outputs, implying that different
    strategies best approximate different submodule types and that removable components
    need not cluster within contiguous depth ranges. Based on this intuition, we introduce
    SubFit (Submodule-level Fitted residual replacement), which compresses LLMs at
    the submodule level: Attention and FeedForward submodules are selected non-contiguously,
    and each receives its own lightweight fitted residual bypass. SubFit operates
    post-training and requires only calibration data. Across ten LLMs (five base,
    five instruction-tuned), five sparsity levels from 12.5% to 37.5%, and four replacement-based
    baselines, SubFit achieves the best aggregate perplexity-accuracy trade-off across
    the evaluated sparsity levels, with larger gains under aggressive compression.
    At 25% sparsity, it retains 84.6% of dense downstream accuracy and incurs 2.42x
    perplexity degradation, against 81.6% and 4.34x for the strongest baselines, while
    delivering measurable inference speedup and KV-cache savings. Code is available
    at https://github.com/eliacunegatti/SubFit.'
- title: 'SparDA: Sparse Decoupled Attention for Efficient Long-Context LLM Inference'
  date: 2026-06
  url: https://arxiv.org/abs/2606.04511
  category: method
  subcategory: non-agentic
  authors:
  - Yaosheng Fu
  - Guangxuan Xiao
  - Xin Dong
  - Song Han
  - Oreste Villa
  venue: ''
  code_url: https://github.com/NVlabs/SparDA
  project_url: ''
  abstract: 'Sparse attention reduces compute and memory bandwidth for long-context
    LLM inference. However, two key challenges remain: (1) KV cache capacity still
    grows with sequence length, and offloading to CPU memory introduces a PCIe transfer
    bottleneck; (2) the sparse selection step itself retains O(T2) complexity and
    can dominate attention cost at long contexts. We propose SparDA, a decoupled sparse
    attention architecture that introduces a fourth per-layer projection, the Forecast,
    alongside Query, Key, and Value. The Forecast predicts the KV blocks needed by
    the next layer, enabling lookahead selection that overlaps CPU-to-GPU prefetch
    with current-layer execution. Because Forecast is decoupled from the attention
    query, our GQA implementation uses one Forecast head per GQA group, reducing selection
    overhead versus the original multi-head selector. SparDA adds <0.5% parameters
    and trains only the Forecast projections by matching the original selector''s
    attention distribution. On two sparse-pretrained 8B models, SparDA matches or
    slightly improves accuracy and delivers up to 1.25× prefill speedup and 1.7× decode
    speedup over the sparse-attention offload baseline. By enabling larger feasible
    batch sizes on a single GPU, SparDA further reaches up to 5.3× higher decode throughput
    than the non-offload sparse baseline. Our source code is available at https://github.com/NVlabs/SparDA.'
- title: 'Adaptive Filtering of the KV Cache: Diagnosing and Correcting Structural-Role
    Bias in LLM Inference'
  date: 2026-07
  url: https://arxiv.org/abs/2607.13205
  category: method
  subcategory: non-agentic
  authors:
  - Soumil Mandal
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Attention-based KV cache eviction (H2O and its descendants) compresses
    the memory-constrained state of a long-context model by ranking tokens on accumulated
    attention mass, treated here as signal energy, and keeping the heaviest. On schema-dense
    input streams such as nested JSON, this score acts as a non-stationary filter
    that disproportionately retains noise: a non-content sink role (delimiters or
    whitespace) carries an order of magnitude more energy than any content role, and
    structural KEY tokens are over-retained at roughly 1.8x the rate of the answer-carrying
    VALUE tokens, collapsing exact-match accuracy from 88% to 0% at a 5% budget as
    the signal-to-noise ratio of the retained state degrades. A counterfactual experiment
    establishes that suppressing KEY tokens is the best deployable filter. Our retraining-free,
    role-conditional allocation over SnapKV''s windowed score, governed by a single
    tuned hyperparameter, closes 63-98% of the H2O gap at sub-20% budgets and, at
    higher budgets, modestly matches or exceeds full-cache accuracy -- a small, seed-sensitive
    denoising effect (borderline significant at B=0.50; not distinguishable from zero
    at B=0.30 over four seeds). A 15 MB linear role probe supplies these labels at
    negligible inference cost, though matching parser-level downstream accuracy remains
    open.'
- title: 'SeDeM: Selective Decompression of Hidden-State Memories for Long-Context
    Question Answering'
  date: 2026-07
  url: https://arxiv.org/abs/2608.00311
  category: method
  subcategory: non-agentic
  authors:
  - Maryam Haghifam
  - Jason Cong
  - Yizhou Sun
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-context inference with large language models (LLMs) is costly: self-attention
    during prefill scales quadratically with sequence length, and the key-value (KV)
    cache grows with the number of processed tokens. Larger context windows also do
    not ensure reliable evidence use. Context compression reduces this cost, but many
    soft-compression methods use LLMs as compressors and rely on compact memory tokens
    both to preserve information and to condition the decoder. We propose SeDeM, a
    selective decompression framework that decouples compact memory storage from decoder
    conditioning. An LLM extracts hidden states from a chosen intermediate Transformer
    layer, a lightweight compressor stores them as memory blocks, a query-conditioned
    selector selects relevant blocks, and a decompressor expands only the selected
    blocks into hidden states compatible with an intermediate decoder layer. Thus,
    the decoder avoids both full-context processing and direct generation from highly
    compressed memory slots. On four long-context QA benchmarks, SeDeM achieves higher
    QA scores than the evaluated compression baselines in both 1B and 3B same-backbone
    settings, and with the 3B backbone exceeds full-context fine-tuning on three datasets.
    The learned selector uses block-level evidence supervision during training. SeDeM
    also reduces online time-to-first-token and improves autoregressive decoding throughput
    relative to ICAE.'
- title: Opt.Gear Technical Report
  date: 2026-08
  url: https://arxiv.org/abs/2608.01034
  category: method
  subcategory: non-agentic
  authors:
  - Juneyoung Park
  - Youngwook Kwon
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We introduce OptGear, a foundation model designed for efficient on-device
    deployment, real-tim inference, and strong task capability. It includes a dense
    model (1M, 270M, and 1B) with a context length of 64K. We designed a new hybrid
    architecture that combines a convolutional key-value gated mixer with local-global
    attention to reduce the KV-cache memory that tends to increase exponentially with
    long context. This architecture delivers up to X4.9 faster prefill and decoding
    speeds on the NPUs compared to models of a similar scale models. From a 2T tokens
    candidate corpus, OptGear is trained on a curated 0.5T tokens subset without knowledge
    distillation. This is the most data-efficient of the existing foundation models.
    All models are released with open weights and deployment binaries for ONNX, Qualcomm
    NPU, and Apple ANE making OptGear a practical base for edge applications that
    need fast, memory-efficient inference and strong task capabilities. Furthermore,
    to expand the ecosystem of on-device generative language models, we are introducing
    the OptGear-1M that can be deployed on Micro-Controller Units (MCUs), a Tiny Language
    Model (TLM). OptGear-1M is the first generative language model to achieve 20 TPS
    with W4A32 quantization on the ARM Cortex-M7 CPU of the STM32H747I-DISCO.
- title: 'FlashPrefill V2: Block-Sparse Prefill Attention for Long-Context LLM Serving'
  date: 2026-08
  url: https://arxiv.org/abs/2608.19758
  category: method
  subcategory: non-agentic
  authors:
  - Qihang Fan
  - Huaibo Huang
  - Zhiying Wu
  - Bingning Wang
  - Ran He
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Long-context modeling is a pivotal capability for Large Language Models,
    yet the quadratic complexity of attention remains a critical bottleneck, particularly
    during the compute-intensive prefilling phase. Our previous work, FlashPrefill,
    mitigates this cost through instantaneous pattern discovery and max-based dynamic
    thresholding; however, it remains an algorithmic prototype that is still distant
    from production deployment. In this paper, we present FlashPrefill V2, which evolves
    FlashPrefill from a prototype toward practical long-context serving along three
    dimensions. First, we introduce a mean correction term that effectively suppresses
    the approximation error, keeping performance degradation manageable even at extreme
    sparsity levels. Second, we redesign the sparse attention operator with PackGQA
    memory access, warp specialization, and pingpong pipelining, fully aligning with
    the latest FlashAttention-3/4 implementations and supporting FP8 inference to
    meet practical quantization requirements. Third, FlashPrefill V2 natively supports
    paged KV cache and continuous batching, allowing integration as an attention backend
    in modern inference frameworks such as SGLang. Extensive evaluations on NVIDIA
    H20 GPUs---among the most widely deployed inference accelerators---demonstrate
    that FlashPrefill V2 delivers up to 47.26x and 27.19x speedups over FlashAttention-2
    at 128K context length under FP8 and BF16 precision, respectively, and, in FP8,
    still achieves a 30.49x speedup against an FA3/4-aligned dense baseline.
- title: 'TRADE: Transducer-Augmented Decoder for Speech LLM'
  date: 2026-06
  url: https://arxiv.org/abs/2606.08486
  category: method
  subcategory: non-agentic
  authors:
  - Yun Tang
  - Shanil Puri
  - Shinji Watanabe
  - Subhabrata Mukherjee
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Speech Large Language Models (Speech LLMs) lack a principled mechanism
    for streaming inference: their label-synchronous generation has no acoustic-frame
    alignment, making real-time decoding and end-of-utterance detection difficult.
    We propose TRADE TRansducer-Augmented DEcoder, which augments a multimodal LLM
    with a transducer branch that shares the audio encoder and uses the LLM''s hidden
    states directly as the prediction network -- coupling frame-synchronous acoustic
    alignment with the LLM''s linguistic reasoning. Three design choices make the
    system accurate, streamable, and long-form capable: (1)Tightly coupled dual vocabularies
    -- a compact transducer vocabulary derived from the LLM vocabulary, enabling zero-cost
    score fusion; (2)Chunk-synchronized streaming training with gradient stopping,
    eliminating the train-inference mismatch at offline-equivalent memory cost; and
    (3)Localized Decoder Audio Attention (LDAA), a causal sliding window that caps
    KV-cache memory independently of utterance length. A single TRADE checkpoint supports
    offline and streaming decoding across a continuous range of latency operating
    points. TRADE achieves 6.71% average WER on the Open ASR Leaderboard, while the
    streaming recognition with 960ms chunk size reaches 8.40% from the same checkpoint.
    On long-form speech, it obtains 3.64% WER on TED-LIUM and 10.88% on Earnings-22
    without external segmentation. TRADE provides sentence-end punctuation timestamps
    that, when combined with acoustic voice activity detection (VAD), improve end-of-utterance
    detection by +0.03 F1 over acoustic VAD alone.'
- title: Accelerating Diffusion Language Models via Structured Suffix Modeling
  date: 2026-08
  url: https://arxiv.org/abs/2608.23167
  category: method
  subcategory: non-agentic
  authors:
  - Zifeng Cheng
  - Keda Li
  - Zhiwei Jiang
  - Cong Wang
  - Fei Shen
  venue: ''
  code_url: https://github.com/zifengcheng/SSM
  project_url: ''
  abstract: Diffusion Language Models (DLMs) exhibit strong parallel decoding capabilities
    by denoising multiple tokens in a single generation step. However, this parallelism
    comes with substantial computational overhead, as each step requires interactions
    with all suffix tokens. Existing methods typically reduce this cost by retaining
    only a local suffix window as a substitute for the full suffix. Despite their
    effectiveness, these methods overlook the structural heterogeneity across suffix
    regions and re-initialize suffix tokens with identical representations at each
    timestep. To this end, we propose a structured suffix modeling method for efficient
    DLM inference. Specifically, we divide the suffix into three regions, i.e., the
    local, middle, and tail regions, and retain different numbers of suffix tokens
    in each region according to their structural roles. Moreover, we incorporate the
    decoding results from the previous step into the suffix token representations
    at the current step, allowing them to carry evolving denoising information across
    generation steps. Notably, our method is training-free and orthogonal to several
    existing acceleration techniques, such as parallel decoding strategies and KV
    cache. Empirical results across multiple benchmarks on three DLMs demonstrate
    that our method can further accelerate DLM inference and improve performance in
    most cases. In particular, in long-sequence inference, our method achieves up
    to a (72.81×) speedup when combined with other acceleration techniques. Our code
    is available at https://github.com/zifengcheng/SSM.
- title: 'VarRate: Training-Free Variable-Rate KV Cache Compression for Long-Context
    LLMs'
  date: 2026-07
  url: https://arxiv.org/abs/2607.15498
  category: method
  subcategory: non-agentic
  authors:
  - Shahrzad Esmat
  - Dhawal Shah
  - Ali Jannesari
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The key-value (KV) cache is the main memory bottleneck in long-context
    large language model (LLM) inference. Two leading training-free families are both
    structurally limited: token-selection methods (SnapKV, Ada-KV) score importance
    from an observation window and evict low-scoring tokens, but eviction is irreversible
    -- so when the importance signal degrades under query-agnostic reuse, accuracy
    collapses by 11-15 points; uniform low-rank coding keeps every token but spends
    equal rank everywhere, wasting budget. We observe that both failures share one
    cure: rank should be allocated, not evicted. We present VarRate, a training-free
    KV codec that assigns each token a variable low-rank budget by its query salience,
    keeping every token at a nonzero rank. Comparable adaptive-rank codecs reach this
    allocation only through training; VarRate requires none. Because no token is dropped,
    it degrades by only 3.5-5.5 points where query-aware selection collapses. At a
    matched 20% budget on LongBench (16 tasks), VarRate stays within 0.8 points of
    the uncompressed model on both Llama-3.1-8B and Qwen2.5-7B. Averaged over the
    two, it is the strongest matched-memory compressor. It significantly beats its
    uniform-rank ablation on both models. Against KVzip, a method purpose-built for
    query-agnostic reuse, it is accuracy-equivalent in three of four settings and
    within a point overall, at about one-eighth the prefill overhead.'
- title: 'Through the Bottleneck: How Multi-head Latent Attention Separates Content
    from Position in Language Models'
  date: 2026-07
  url: https://arxiv.org/abs/2607.23054
  category: method
  subcategory: non-agentic
  authors:
  - Dhruvil S
  - Fenil Sojitra
  - Ravirajsinh Chauhan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Multi-head Latent Attention (MLA), introduced in DeepSeek-V2, compresses
    key-value pairs through a shared low-rank bottleneck (cKV), achieving 81% KV-cache
    reduction during inference. Despite its adoption in massive production models,
    no prior work has studied what information this bottleneck preserves or discards,
    nor how it reshapes internal transformer circuits. We present the first comprehensive
    mechanistic interpretability study of MLA, training a 114M-parameter transformer
    (pretrained on a web/code/math mixture, fine-tuned on TinyStories) and analyzing
    its representations through SVD, attention head taxonomy, linear probing, and
    a disruption-attribution analysis. Our key findings are: (1) the cKV bottleneck
    learns a pure content representation, preserving entity identity (98% retention)
    while discarding positional information, validating MLA''s separation of content
    from position via RoPE; (2) induction heads co-locate at a single layer (Layer
    12), unlike their distributed formation in standard MHA; (3) a single "semantic
    hub" layer (Layer 15) simultaneously exhibits the highest SVD effective rank and
    strongest disruption-attribution score; and (4) the bottleneck is globally over-provisioned,
    using only 46% of its capacity on average. These findings suggest MLA does not
    merely compress attention passively, but reshapes how the model organizes content,
    position, and circuit structure. We view this as an initial data point and detail
    scope limitations in Section 5.'
- title: 'KV-Rescue: Recovering Reasoning Language Model KV Eviction Loss via Stepwise
    Interleaving'
  date: 2026-08
  url: https://arxiv.org/abs/2608.15797
  category: method
  subcategory: non-agentic
  authors:
  - Minsoo Cheong
  - Woosang Lim
  - Vincent-Daniel Yun
  - Sungjoo Yoo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: KV-cache eviction caps the memory cost of long reasoning traces but is
    inherently lossy because the model decodes from a partial view of its history.
    Under aggressive budgets, this not only lowers accuracy but can also cause runaway
    degeneration, where the model produces incoherent or repetitive tokens until reaching
    the length limit. We characterize much of this loss as an information gapf caused
    by missing context, rather than a capability gap caused by limited model capacity.
    An evicted 7B model and a full-context 1.5B model make complementary errors, and
    an oracle choice between their answers recovers 79% of the accuracy gap to the
    full-KV 7B model. Based on this observation, we propose KV-Rescue, a training-free
    inference framework that bridges the information gap introduced by KV eviction
    using a lightweight full-context helper. KV-Rescue interleaves reasoning steps
    from the two models into a shared trajectory. An online detector uses entropy
    and compressibility to terminate the generation of incoherent or repetitive base-model
    candidates early. Across five math benchmarks with Qwen2.5-Math 7B and 72B, KV-Rescue
    recovers an average of 87% of the accuracy lost to eviction at eviction budget
    B=64. A decode-cost analysis further shows that preventing runaway degeneration
    cuts base-model token generation by 43% on average.
- title: Understanding Sparse Attention Selectivity in Long-Context Foundation Models
    via Counterfactual Evaluation
  date: 2026-08
  url: https://arxiv.org/abs/2608.01676
  category: method
  subcategory: non-agentic
  authors:
  - Xingyu Ren
  - Youran Sun
  - Chugang Yi
  - Haizhao Yang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Sparse attention is widely deployed in long-context serving stacks, yet
    no framework audits how discarding blocks changes the influence of specific content
    on model output. We first establish that the phenomenon is real and causal: Block
    Sparse Flash Attention (BSFA) route replay across four architectures changes output
    decisions in 13 of 16 cells, with zero identity-replay label flips. We then introduce
    a dense-calibrated counterfactual audit using matched probe cards---Gold (carrying
    the correct answer label), Poison (carrying a target wrong label), and Benign
    (filler only)---under six-layout position symmetry, isolating the sparsification-specific
    effect. Two patterns compete. Signal concentration: the selector preserves Gold
    and Poison blocks far above filler-matched Benign blocks (GapproxPggB across all
    model--task pairs). Integration loss: discarding blocks severs cross-block attention---confirmed
    by an ablation where isolating the probe block collapses its influence from 4.48
    logits to zero. Compression ratio governs the balance: a full sweep from mild
    (c=0.25) to aggressive (c=0.75) compression across four model--task pairs reveals
    that three of four cells move toward stronger sparse amplification at higher compression,
    with two exhibiting sign reversals. Three independent arms---BSFA route replay,
    controlled block-top-k, and KV-cache eviction---converge: sparsification changes
    content influence in ways aggregate accuracy cannot detect. We provide an open
    measurement framework deployable on any model exposing block identities.'
- title: 'Ripple-Pivot Search: Active Parallel Decoding for Diffusion Large Language
    Models'
  date: 2026-08
  url: https://arxiv.org/abs/2608.11742
  category: method
  subcategory: non-agentic
  authors:
  - Yushi Ye
  - Xu Chen
  - Haoyun Jiang
  - Jinsong Lan
  - Haihong Tang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Diffusion Large Language Models (dLLMs) have emerged as a competitive
    alternative to autoregressive language models, offering the potential for substantially
    faster inference through parallel decoding. Existing parallel decoding schedulers
    typically commit positions only after they meet a per-position criterion, overlooking
    how early commitments may benefit subsequent decoding. We identify a ripple effect
    in dLLM decoding: proactively committing a mid-entropy pivot position can induce
    a pronounced reduction in uncertainty across the remaining masked positions. This
    uncertainty reduction allows subsequent steps to unmask more tokens in parallel,
    thereby accelerating the overall decoding process. To exploit the ripple effect,
    we propose Ripple-Pivot Search (RPS), a novel training-free decoding method that
    seeks mid-entropy positions as promising candidate pivots (where to decode), and
    determines their token assignment that yields the greatest downstream benefit
    via lookahead evaluation (what to decode). Across 3 dLLMs and 4 reasoning and
    code-generation benchmarks, RPS achieves 4-10× wall-clock speedup over the standard
    decoder while preserving generation quality, and improves accuracy over the previous
    lookahead baseline by up to 5.49% while delivering higher throughput in most settings.
    When integrated with KV caching, RPS further achieves up to 18× wall-clock speedup
    over the standard decoder.'
- title: Towards Direct Latent-Space Synthesis for Parallel Branches in LLM-Agent
    Workflows
  date: 2026-06
  url: https://arxiv.org/abs/2606.14672
  category: method
  subcategory: non-agentic
  authors:
  - Shikun Liu
  - Mufei Li
  - Dongqi Fu
  - Haoyu Wang
  - Yinglong Xia
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large language models increasingly serve as execution engines for agentic
    systems, yet they still consume context through a sequential text interface. This
    creates a mismatch with modern structured agent workflows, in which independent
    branches explore subtasks, retrieve evidence, or generate candidate solutions
    before a final synthesis step. Existing systems typically merge these branches
    by concatenating their textual outputs, which discards the parallel structure
    and incurs redundant prefill computation. In this work, we introduce Parallel-Synthesis,
    a plug-and-play framework that enables a synthesizer to directly consume the KV
    caches produced by parallel worker agents. Parallel-Synthesis combines a cache
    mapper that calibrates independently generated branch caches with a fine-tuned
    synthesizer adapter that enables generation from this non-sequential cache interface.
    We train Parallel-Synthesis using data that exposes the synthesizer to parallel
    cache contexts, teaches aggregation across cached branches, and distills reasoning
    behavior from standard text-concatenation-based synthesis. Across nine downstream
    datasets spanning math, science QA, code generation, GAIA, and multi-agent database
    diagnosis, Parallel-Synthesis matches or outperforms text-based synthesis on seven
    datasets and remains close on the other two. It also reduces time-to-first-token
    by 2.5x-11x, suggesting that direct cache-based synthesis is a promising interface
    for more native and efficient synthesis over parallel agent branches.
- title: 'MedLatentDx: Latent Multi-Agent Communication for Cross-Hospital Rare-Disease
    Diagnosis'
  date: 2026-06
  url: https://arxiv.org/abs/2606.13945
  category: method
  subcategory: non-agentic
  authors:
  - Ziqing Wang
  - Lili Zhao
  - Kaize Ding
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Rare diseases affect over 300 million patients across more than 7{,000
    conditions, yet no single hospital encounters enough cases of any one condition
    for reliable diagnosis. Cross-hospital collaboration could help by allowing a
    diagnosing institution to use distributed, case-specific diagnostic evidence,
    but privacy regulations restrict the transmission of identifiable clinical text
    across institutional boundaries. This setting raises two challenges: existing
    medical agent systems often rely on textual evidence exchange, while raw latent
    states such as hidden states and KV caches may still reveal prompt-derived clinical
    content. We introduce MedLatentDx, a latent multi-agent communication framework
    in which hospital agents keep private clinical records and retrieved cases local,
    and send compact latent KV blocks to a host agent for rare-disease diagnosis.
    MedLatentDx supports two deployment settings: same-backbone hospital agents use
    latent KV distillation, while hospitals with different LLM backbones use cross-family
    latent alignment. On CrossRare-Bench, a self-built large-scale rare-disease benchmark
    with hospital-level partitions, MedLatentDx improves cross-hospital diagnostic
    performance while reducing reconstructable clinical content relative to raw-latent
    communication baselines.'
- title: 'Position Encoding in Transformers: From Absolute and Relative Methods to
    Rotary Position Embeddings and Long-Context Scaling'
  date: 2026-08
  url: https://arxiv.org/abs/2608.10021
  category: method
  subcategory: non-agentic
  authors:
  - Jiguo Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Self-attention models content-dependent interactions between tokens but
    does not by itself encode token order. Position encoding addresses this limitation
    by introducing absolute coordinates, relative distances, or position-dependent
    rotations into Transformer representations and attention scores. This technical
    survey develops a unified account of sinusoidal and learned absolute position
    embeddings, Shaw-style relative position representations, Transformer-XL, T5 relative
    position bias, ALiBi, and Rotary Position Embeddings (RoPE). We derive how RoPE
    converts absolute position indices into relative phase differences in Query-Key
    inner products and compare these methods in terms of where position is injected,
    computational cost, compatibility with KV caching, and length extrapolation. We
    then examine long-context extensions, including Position Interpolation, RoPE scaling
    laws, NTK-aware scaling, Dynamic NTK, NTK-by-parts, YaRN, LongRoPE, and LongRoPE2,
    with emphasis on frequency allocation, attention rescaling, training length, and
    target context length. We also summarize implementation considerations, evaluation
    protocols, and position-encoding choices in representative large language models.
    A central conclusion is that the ability to compute positional features beyond
    the training length does not imply reliable long-context generalization; context
    extension must be evaluated through short-context retention, position-wise perplexity,
    retrieval, reasoning, and long-context code tasks.
- title: 'WAR: Workload-Aware Rollouts for Synchronous Agentic Reinforcement Learning'
  date: 2026-07
  url: https://arxiv.org/abs/2607.17299
  category: method
  subcategory: non-agentic
  authors:
  - Ryan Xu
  - Atlas Zhao
  - David Bao
  - Frank Du
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-horizon rollout generation has become the dominant systems bottleneck
    in agentic reinforcement learning (RL). As agents interact with environments over
    many turns, trajectories rapidly grow to tens of thousands of tokens, making synchronous
    RL training increasingly constrained by rollout. We propose WAR, a workload-aware
    rollout system that substantially accelerates synchronous agentic RL by jointly
    optimizing decoding and scheduling. WAR is built on a key observation: the optimal
    rollout optimization strategy depends on runtime load: (1) Under low load, WAR
    enables model-free speculative decoding with SuffixDecoding, which reuses suffix
    patterns from previously completed trajectories as speculative drafts for future
    rollouts. Unlike model-based drafters, SuffixDecoding introduces no additional
    draft model and avoids GPU contention with rollout generation. (2) Under high
    load, where saturated batched decoding leaves limited room for speculative speedup,
    WAR shifts the optimization focus to cache-aware scheduling. A global scheduler
    places requests across rollout replicas based on cache locality, trajectory progress
    and server load, reducing redundant KV-cache recomputation and mitigating load
    imbalance. By combining decoding-level suffix reuse with system-level rollout
    scheduling, WAR delivers robust throughput improvements across workload regimes
    without changing the underlying RL algorithm. WAR improves long-context agentic
    rollout throughput by 1.4x under low load and up to 1.6x under high load. These
    results show that WAR removes a major rollout bottleneck in synchronous agentic
    RL and provides a practical path toward scalable long-context agent training.'
- title: 'Faster but Different: Diagnosing and Controlling Content Drift in Accelerated
    Multimodal Diffusion Language Models'
  date: 2026-07
  url: https://arxiv.org/abs/2607.29079
  category: method
  subcategory: non-agentic
  authors:
  - Yaoxuan Dou
  - Yang Shu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Training-free acceleration makes diffusion-based multimodal large language
    models (dMLLMs) more deployable, but it may silently change generated content.
    We study this serving-time consistency problem on 300 real images, comparing Fast-dLLM
    outputs with the same model's unaccelerated outputs. Across the mild parallelism
    induced in our long-form setting (1.05--1.25 committed tokens per step), confidence-threshold
    tuning changes decoding behavior but not baseline agreement. State-refresh ablations
    and an image-swap intervention instead identify stale visual and generated-text
    states as contributors to drift. For the tested Fast-dLLM implementation, shortening
    the KV-cache refresh interval yields a monotonic speed--agreement frontier and
    near-exact agreement at a measured 1.3x speedup. The initial diagnosis also appears
    with dLLM-Cache and LaViDa, although dLLM-Cache recovers agreement only after
    both caches are tightened, which removes its speed advantage. Independent prompts
    and images reproduce the threshold-insensitivity and refresh recovery. A targeted
    audit finds genuine content substitution in half of 50 low-agreement pairs. In
    a separate blinded two-annotator evaluation, the pooled accelerated-minus-baseline
    factual-error difference is 0.00 (95% CI [-0.17,+0.17]); this sample detects no
    difference but does not establish factual equivalence. Finally, none of the tested
    adaptive or smoothed-refresh variants beats the fixed interval at matched compute.
    Our contribution is a paired diagnostic and an implementation-scoped consistency
    control, not an accuracy or safety guarantee.
- title: Training Hybrid Block Diffusion Language Models with Partial Bidirectionality
  date: 2026-07
  url: https://arxiv.org/abs/2607.02805
  category: method
  subcategory: non-agentic
  authors:
  - Pranshu Chaturvedi
  - Parth Shroff
  - Tarun Suresh
  - Hangoo Kang
  - Kaiyue Wen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'High-throughput long-context generation is one of the central challenges
    for large language models. Generation is typically memory-bandwidth-bound rather
    than compute-bound: each decoding step must stream the accumulated key/value (KV)
    cache from memory, so bandwidth demand grows with context length while only one
    token is emitted. Two parallel approaches have therefore emerged: reducing memory
    access with efficient attention variants and linear-time mixers such as Mamba,
    or increasing parallel computation by generating blocks of tokens at once. However,
    technical challenges arise when combining these two ideas. Earlier hybrid diffusion
    models such as DiffuMamba use bidirectional Mamba mixing, including a reverse-direction
    scan relative to causal generation. This reverse scan needs to scan the entire
    sequence, so its states are not prefix-only and cannot be precisely reused as
    a cache even when diffusion is performed block by block. We propose a BDLM Mamba--attention
    hybrid that addresses this challenge by restricting the reverse Mamba scan to
    the active denoising block, which enables exact caching across blocks. In an 87M-parameter
    DCLM sweep, BDLM Mamba-H achieves the best C4-en validation perplexity compared
    to BDLM attention and full-sequence baselines. At 350M parameters, it remains
    competitive with BDLM attention. For long-context inference, BDLM Mamba-H reaches
    19.7x the throughput of full-sequence DiffuMamba-H at 65K tokens and 3.7x the
    throughput of BDLM attention at 262K, showing that Mamba hybrids are a potential
    long-context diffusion architecture.'
- title: When Words Predict Workload
  date: 2026-07
  url: https://arxiv.org/abs/2607.04951
  category: method
  subcategory: non-agentic
  authors:
  - Anubhab Banerjee
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Standard distributed ac{llm schedulers rely on static token counts or
    rolling latency averages, making them susceptible to failures on statutorily constrained
    text. On ac{epo claims governed by Article 84 ac{epc, linguistic rigidity makes
    human and machine authorship statistically indistinguishable. Resolving this ambiguity
    mid-flight forces dynamic multi-model ensemble expansion, triggering unpredictable
    KV-cache and weight-allocation spikes that saturate consumer-grade edge GPU VRAM
    and cause severe ac{oom crashes. To prevent hardware collapse, we propose a CPU-side
    Linguistic Resource Forecasting (LRF) gateway. The gateway extracts a 16-dimensional
    text-structure vector and applies an XGBoost predictor to forecast trap-band membership.
    The resulting escalation probability (Pesc) is evaluated against a dynamic, closed-form
    routing threshold (Tauroute(t)) computed via real-time latency telemetry. Requests
    are safely routed to either a local Qwen2.5-7B edge worker or a remote contrastive
    ensemble (Qwen2.5 7B + 32B) on an NVIDIA H100 emph{before any edge GPU memory
    is allocated. In a 6,000-request live trial, the LRF gateway reduced the operational
    misroute fraction (R_{mathrm{mis) to 0.087--0.095, an order of magnitude below
    the token-count baseline (0.849). Peak edge VRAM remained safely bounded at SI{4.82{gibibyte
    (under the SI{8{gibibyte ceiling) across a 27× variation in ac{wan delay. The
    predictor achieved a live-trial AUROC of 0.84, and the dynamic Tauroute(t) controller
    yielded an 8.2% relative reduction in misroutes compared to an equivalent static
    threshold.
- title: Efficient Diffusion LLMs via Temporal-Spatial Parallel Decoding and Confidence
    Extrapolation
  date: 2026-05
  url: https://arxiv.org/abs/2605.30753
  category: method
  subcategory: non-agentic
  authors:
  - Zekai Li
  - Ji Liu
  - Yiqing Huang
  - Ziqiong Liu
  - Dong Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Diffusion-based large language models (dLLMs) support parallel text generation
    via iterative denoising, yet inference remains latency-heavy because many steps
    are spent on redundant refinement and repeated remasking of tokens whose final
    values are already determined. Prior acceleration methods mainly depend on step-local
    confidence heuristics or fixed schedules, which are sensitive to prompt and task
    variation and ignore strong positional effects within a sequence. We cast diffusion
    decoding as a dynamic control problem and show that token-wise denoising trajectories
    provide the key signal for reliable control. We propose a trace-aware decoding
    framework with two components. First, Temporal-Spatial Parallel Decoding (TSPD)
    uses a lightweight temporalspatial controller that consumes per-token trajectory
    features, including confidence, entropy, and momentum, together with token position,
    to decide when a token has converged and can be safely fixed. Second, we introduce
    Confidence Extrapolation (CE), a training-free state-space module that forecasts
    future logit trends with uncertainty to support proactive decisions, including
    safe look-ahead and targeted stabilization when trajectories are oscillatory or
    underconfident. Together, TSPD and CE reduce unnecessary denoising iterations
    while preserving output quality, and they compose cleanly with system optimizations
    such as KV caching.
- title: Training-Free Hashing-Based Attention via Binary Principal Components
  date: 2026-08
  url: https://arxiv.org/abs/2608.04405
  category: method
  subcategory: non-agentic
  authors:
  - Daohai Yu
  - Zhanpeng Zeng
  - Keyu Chen
  - Wenhao Li
  - Zhifeng Shen
  venue: ''
  code_url: https://github.com/yudaohai666/BPC
  project_url: ''
  abstract: Long-context large language models (LLMs) are increasingly deployed in
    real-world applications, yet self-attention remains a major efficiency bottleneck
    -- especially during decoding -- due to the necessity of repeatedly processing
    ever-growing key-value (KV) caches. Existing sparse attention reduce computation
    by attending to fewer KV pairs, but often suffer from substantial accuracy degradation,
    require additional training, or rely on expensive hashing. In this work, we present
    BinaryPC, a training-free, data-aware hashing-based sparse attention for long-context
    LLMs. BinaryPC constructs compact binary hash codes and corresponding hash function
    by computing binary principal components of data. Unlike Locality-Sensitive Hashing
    (LSH) with data-independent random projections or learned non-linear hashing methods,
    BinaryPC constructs binary codes that explicitly preserve the structural information
    of data without requiring gradient-based training. Comprehensive experiments across
    multiple model families and long-context benchmarks show that BinaryPC preserves
    accuracy relative to full attention while achieving superior performance among
    sparse and hashing-based baselines. On modern GPUs, BinaryPC improves end-to-end
    decoding throughput by 3.56× over the FlashAttention kernel. Our code is available
    at https://github.com/yudaohai666/BPC.
- title: 'SimSD: Simple Speculative Decoding in Diffusion Language Models'
  date: 2026-06
  url: https://arxiv.org/abs/2606.02544
  category: method
  subcategory: non-agentic
  authors:
  - Junxia Cui
  - Haotian Ye
  - Runchu Tian
  - Hongcan Guo
  - Jinya Jiang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Diffusion large language models (dLLMs) have recently emerged as a promising
    alternative to autoregressive (AR) LLMs, offering faster inference through parallel
    or blockwise decoding. However, their masked language modeling formulation remains
    incompatible with standard token-level speculative decoding, one of the most effective
    acceleration techniques for AR models. In AR decoding, the causal mask preserves
    temporally valid token-level contexts, enabling a target model to verify multiple
    drafted tokens in a single forward pass. In contrast, dLLMs rely on mask tokens
    and bidirectional attention, causing the effective context to change across denoising
    steps and preventing direct token-level speculative verification. To bridge this
    gap, we propose a simple but effective speculative decoding algorithm for diffusion
    language models, named SimSD, which mainly adopts a plug-and-play masking strategy
    that equips dLLMs with temporally valid token-level contexts for speculative decoding.
    Our method explicitly introduces reference tokens from draft-model predictions
    and designs an attention mask that regulates their interaction with current-step
    tokens, allowing dLLMs to compute valid logits for drafted tokens in a single
    forward pass. This restores the key verification ability provided by causal masking
    in AR models while preserving the parallel decoding advantages of dLLMs. The proposed
    method is training-free and can be flexibly integrated with other acceleration
    techniques such as KV cache and blockwise decoding. Experiments on SDAR-family
    dLLMs across four benchmarks show that our method achieves up to 7.46x higher
    decoding throughput while maintaining and even improving average generation quality.
- title: 'Distill to Detect: Exposing Stealth Biases in LLMs through Cartridge Distillation'
  date: 2026-07
  url: https://arxiv.org/abs/2607.01208
  category: method
  subcategory: non-agentic
  authors:
  - Shayan Talaei
  - Abhinav Chinta
  - Devvrit Khatri
  - Amin Karbasi
  - Azalia Mirhoseini
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Language models deployed in high-stakes roles can potentially favor certain
    entities, brands, or viewpoints, steering user decisions at scale. Such preferential
    biases can be introduced by any actor in the model''s supply chain and are most
    dangerous when the model reveals its preference only on the relevant topic while
    behaving identically to its unmodified base on all other inputs. Recent work has
    shown that these biases can transfer through context distillation on semantically
    unrelated data, with the signal residing entirely in the soft logit distribution
    and remaining invisible to text-based inspection. However, the defender faces
    a fundamental asymmetry: without knowing the bias topic, no detection method can
    reliably surface a stealth preferential bias, regardless of whether it examines
    generated text, internal representations, or model weights. Here we introduce
    Distill to Detect (D2D), a method that surfaces hidden biases by distilling the
    distributional shift between a suspected model and its base into a cartridge (a
    KV-cache prefix adapter), concentrating the dominant divergence and amplifying
    the bias signal into generated text. We show that D2D successfully amplifies the
    hidden biases of stealth models to the extent that they can be reliably detected
    across multiple bias types. We also propose a theoretical framework that explains
    the efficacy of D2D through the lens of Fisher-weighted projection of the logit
    distribution shift, supported by empirical observations. By turning the capacity
    bottleneck of prefix-tuning adapters into a detection tool, D2D provides a practical
    building block for auditing hidden behaviors in deployed language models.'
- title: 'From Retrieved Context to Runtime Control: Adaptive Compression for Edge-based
    RAG'
  date: 2026-08
  url: https://arxiv.org/abs/2608.19535
  category: method
  subcategory: non-agentic
  authors:
  - Zlatan Feric
  - Amir Taherin
  - Yanzhi Wang
  - David Kaeli
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Retrieval-augmented generation (RAG) improves language-model responses
    by grounding generation in external passages, which comes with overhead: retrieved
    context lengthens the prompt, increasing prefill work, KV-cache footprint, memory
    traffic, latency, and energy. Context compression offers a natural remedy by pruning
    retrieved text before generation. However, state-of-the-art context-compression
    methods are typically used with a fixed compression budget, or with the rate selected
    offline and then applied at inference time. This static view ignores both workload
    variation and the live state of the edge device. On an edge SoC, compression is
    not free: the compressor itself runs on the same SoC and consumes latency and
    energy that can offset any generation savings. This paper proposes a vision for
    telemetry-informed adaptive compression in edge RAG, grounded in experimental
    evidence. We characterize the compression tradeoff on the NVIDIA Jetson AGX Thor
    using Llama and Qwen generators, Natural Questions and HotpotQA datasets, and
    LLMLingua-2 compression. Our measurements show that generation dominates the RAG
    budget for larger models, reaching roughly 90% of per-query latency and 91% of
    GPU energy for 7B-8B generators. Exploring the impact of the compression rate
    reveals an adaptive operating region: mild compression can miss energy opportunities,
    and overly aggressive compression can hurt inference quality. Intermediate compression
    can reduce GPU energy by up to 53.2%, and SoC energy by up to 48.2%, with negligible
    quality loss. We argue for runtime policies that dynamically manage compression,
    guided by workload features and edge telemetry.'
- title: Do Transformers Need Three Projections? Systematic Study of QKV Variants
  date: 2026-06
  url: https://arxiv.org/abs/2606.04032
  category: method
  subcategory: non-agentic
  authors:
  - Ali Kayyam
  - Anusha Madan Gopal
  - M Anthony Lewis
  venue: ICML 2026
  code_url: https://github.com/Brainchip-Inc/Do-Transformers-Need-3-Projections
  project_url: ''
  abstract: 'Transformers have become the standard solution for various AI tasks,
    with the query, key, and value (QKV) attention formulation playing a central role.
    However, the individual contribution of these three projections and the impact
    of omitting some remain poorly understood. We systematically evaluate three projection
    sharing constraints: a) Q-K=V (shared key-value), b) Q=K-V (shared query-key),
    and c) Q=K=V (single projection). The last two variants produce symmetric attention
    maps; to address this, we also explore asymmetric attention via 2D positional
    encodings. Through experiments spanning synthetic tasks, vision (MNIST, CIFAR,
    TinyImageNet, anomaly), and language modeling (300M and 1.2B parameter models
    on 10B tokens), we discovered that our transformers perform on par or occasionally
    better than the QKV transformer. In language modeling, Q-K=V projection sharing
    achieves 50% KV cache reduction with only 3.1% perplexity degradation. Crucially,
    projection sharing is complementary to head sharing (GQA/MQA): combining Q-K=V
    with GQA-4 yields 87.5% cache reduction, while Q-K=V + MQA achieves 96.9%, enabling
    practical on-device inference. We show that Q-K=V preserves quality because keys
    and values can occupy similar representational spaces and attention operates in
    a low-rank regime, whereas Q=K-V breaks attention directionality. Our results
    systematically characterize projection sharing as an underexplored instance of
    weight tying in attention, with direct, quantifiable inference memory benefits,
    particularly valuable for edge deployment. The code is publicly available at https://github.com/Brainchip-Inc/Do-Transformers-Need-3-Projections'
- title: 'Fast-dLLM++: Fréchet Profile Decoding for Faster Diffusion LLM Inference'
  date: 2026-06
  url: https://arxiv.org/abs/2606.02955
  category: method
  subcategory: non-agentic
  authors:
  - Siva Rajesh Kasa
  - Yasong Dai
  - Sumit Negi
  - Hongdong Li
  venue: ''
  code_url: https://github.com/Ringo-Star/FastdLLM_plusplus
  project_url: ''
  abstract: 'Diffusion large language models promise parallel token generation, yet
    inference remains bottlenecked by deciding which masked tokens can be safely committed
    together. Fast-dLLM addressed this with KV caching and confidence-guided parallel
    decoding, but its decoding theory uses a homogeneous high-confidence assumption
    that effectively reduces each candidate set to its weakest selected token. We
    argue that this leaves speed on the table because real decoding steps exhibit
    heterogeneous confidence profiles. We propose textbf{Fast-dLLM++, a training-free
    extension that introduces emph{Fréchet profile decoding: selecting parallel commit
    sets from the full sorted confidence profile rather than a single worst-case confidence.
    The resulting rule is a heterogeneous-confidence generalization of Fast-dLLM''s
    factor selector and it recovers the previous rule exactly in the equal-confidence
    case and adds a provable emph{heterogeneity bonus when the selected tokens have
    uneven confidences. Fast-dLLM++ leaves the model, diffusion process, and cache
    implementation entirely unchanged, making it a drop-in replacement for existing
    Fast-dLLM decoding. Experiments on GSM8K, MATH, HumanEval, and MBPP with the LLaDA-8B
    model show that the theoretical improvement translates directly into empirical
    gains: profile-aware selection improves the accuracy--throughput frontier by exploiting
    safe parallelism that weakest-token rules miss, achieving up to 37% higher throughput
    at comparable accuracy. Our code release is at https://github.com/Ringo-Star/FastdLLMplusplus.'
- title: When Does Learning to Stop Help? A Cost-Aware Study of Early Exits in Reasoning
    Models
  date: 2026-06
  url: https://arxiv.org/abs/2606.30852
  category: method
  subcategory: non-agentic
  authors: []
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Reasoning models spend test-time compute unevenly across instances, and
    a growing family of early-exit rules -- confidence thresholds, entropy monitors,
    answer-stability checks, and learned stoppers -- promises to reclaim the waste.
    These rules, however, are evaluated under heterogeneous protocols that leave the
    deployment question unanswered: at a fixed tolerance for losing correct answers,
    which policy saves more compute, and does the saving survive probe overhead? We
    answer this question with a controlled study across 18 task-model settings spanning
    GSM8K, MATH-500, MMLU-Pro, AIME-90, and GPQA on Qwen3 and DeepSeek-R1-distilled
    models, using LearnStop, a hidden-state-free logistic stopper over prefix-observable
    features, as the learned policy instrument. Under matched lost-correct risk at
    α = 0.15, with the scalar competitor selected on calibration data from confidence,
    entropy, confidence-leap, and run-stability exits, the answer forms three regimes.
    Learned stopping wins on all four primary Qwen3 free-form math settings (+3.2
    to +21.2 pp additional total-token saving); calibrated scalar exits win on multiple-choice
    MMLU-Pro; and small hard benchmarks (AIME-90, GPQA) admit no certifiable aggressive
    policy at all. A trajectory decomposition predicts the regime: learning pays where
    answers oscillate and correctness evidence is spread across complementary signals,
    while a single confidence threshold suffices where most instances are already
    solved at the first checkpoint. Cost accounting sharpens the picture further --
    the same policy that saves 32% of tokens under KV-cache forking costs 121% extra
    under black-box repeated prefilling. Together, these results replace the single-method
    race with a decision procedure for choosing a stopping rule from the trajectory
    structure and serving regime of the target workload.'
- title: 'CacheProbe: Auditing Prompt Cache Isolation in Gateway APIs'
  date: 2026-05
  url: https://arxiv.org/abs/2605.30613
  category: method
  subcategory: non-agentic
  authors:
  - Ryan Fahey
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Over the past year, prompt caching in Large Language Models (LLMs) has
    become increasingly more popular across inference APIs. Prompt caching helps save
    precious compute resources and speeds up response times by reusing parts of the
    KV cache of a specific prompt for another request. However, many implementations
    of prompt caching are not secure against timing attacks or even basic metadata
    disclosure. Gu et al. (ICML 2025) develop a method to audit prompt caching in
    LLMs. This paper investigates whether OpenRouter's API gateway architecture introduces
    prompt caching vulnerabilities that bypass provider-level prompt cache isolation
    guarantees. Most LLM inference providers implement per-account or per-organization
    prompt caching to prevent data leaks, but does routing through OpenRouter with
    shared organizational credentials inadvertently create global cache sharing across
    all OpenRouter users?
- title: 'LLM Serving in the Wild: An Empirical Study of Frameworks, Methods, and
    System Designs'
  date: 2026-08
  url: https://arxiv.org/abs/2608.03036
  category: method
  subcategory: non-agentic
  authors:
  - Forough Majidi
  - Mohammad Mehdi Morovati
  - Foutse Khomh
  - Heng Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large Language Models (LLMs) are integrated into software systems and
    AI services, making efficient LLM serving a concern for software engineering.
    Serving LLMs is challenging because inference requires computation, memory, GPU
    resources, and execution while maintaining latency and throughput. Although prior
    research has proposed LLM inference, optimization, and serving techniques and
    frameworks, little is known about how they are adopted in practice. In this study,
    we investigate the use of LLM serving frameworks and serving methods in open-source
    software systems. We identify and analyze five LLM-specific frameworks: vLLM,
    SGLang, TensorRT-LLM, LMDeploy, and FlashInfer. We examine how these frameworks
    and techniques are adopted individually and in combination, how adoption varies
    across categories of LLMs, and how repositories differ in intent, focus, use case,
    and architectural design. Our results show that vLLM is the most visible framework
    in popularity and adoption, while parallel computation, memory management, and
    network pruning are the most frequently used serving-method categories. Multi-framework
    usage is limited, suggesting that developers rely on a single serving framework;
    however, combined frameworks connect complementary capabilities across the serving
    stack. Framework adoption varies across model families, modalities, model sizes,
    domain specializations, and deployment settings. Repository-level analysis shows
    that LLM serving frameworks support applications and architectures, including
    Reinforcement Learning (RL)-based reasoning, multimodal generation and understanding,
    microservices, and cloud infrastructure. Overall, this study provides a large-scale
    empirical characterization of LLM serving framework adoption in practice and offers
    insights for researchers, framework maintainers, and practitioners working on
    LLM systems.'
- title: 'LLMET: Enabling Cross-Layer Evaluation of Emerging M3D Memories for Energy-Efficient
    LLM Serving'
  date: 2026-07
  url: https://arxiv.org/abs/2607.26491
  category: method
  subcategory: non-agentic
  authors:
  - Ming-Yen Lee
  - Hanchen Yang
  - Faaiq Waqar
  - Harsono Simka
  - Tushar Krishna
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The energy consumption of Large Language Model (LLM) serving is becoming
    a major system challenge as deployment scales, driven by hardware power and thermal
    constraints and rising electricity costs. A key contributor to chip energy dissipation
    is data movement between limited on-chip cache and off-chip High Bandwidth Memory
    (HBM). Meanwhile, emerging memory technologies such as monolithic 3D (M3D) integration
    of cache memories at the Back-End-Of-Line (BEOL) of logic chips enable larger
    and denser on-chip memories, creating new opportunities to reduce costly off-chip
    traffic. However, it remains unclear whether continuously scaling on-chip memory
    using emerging technologies can effectively improve the energy efficiency of LLM
    serving. To address this gap, we develop LLMET (LLM with Emerging Technology),
    a validated cross-layer simulation framework, and conduct a comprehensive study
    on the impact of large-capacity on-chip memory technologies across a broad range
    of models, applications and platforms. Utilizing M3D technology to expand the
    L2 cache from 40MB to 1GB yields a 44% reduction in chip energy during the Llama3.1-70B
    prefill phase with a 16K context window, based on LLMET simulation on a dual NVIDIA
    A100 GPU setup. On the 8x NVIDIA B200-like platform, extending the L2 cache from
    128MB to 4GB saves the prefill energy by up to 24%. For the edge platform and
    workloads, the decode energy saving reaches 30% when increasing the 8MB cache
    size to 256MB. These results highlight the promise of ultra-large on-chip memories
    for energy-efficient LLM serving systems.
- title: 'Beyond Prediction: Tail-Aware Scheduling for LLM Inference'
  date: 2026-06
  url: https://arxiv.org/abs/2606.18431
  category: method
  subcategory: non-agentic
  authors:
  - Yueying Li
  - Yuanfan Chen
  - Jiayang Chen
  - Esha Choukse
  - Haoran Qiu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: LLM serving exhibits extreme length variability, making size-based scheduling
    difficult in practice. Recent LLM schedulers approximate SJF/SRPT using predicted
    decode lengths or ranks and primarily report mean-centric metrics such as TTFT
    and TBT. We show that these prediction-driven policies can be fragile under distribution
    shifts, bursty arrivals, and GPU memory pressure, while offering limited control
    over the tail latency (P90-P99) that dominates user experience, even with perfect
    decode-length knowledge. We introduce a distribution-aware, prediction-free scheduling
    framework that replaces explicit length prediction with soft priority boosting
    driven by lightweight statistical signals. Our design co-optimizes scheduling
    and cache-aware preemption to account for memory-coupled decode dynamics across
    workload mixes. Evaluated on production and open-source traces, our method reduces
    P99 TTLT by up to 35-50% relative to SRPT with perfect length knowledge and reduces
    TTFT by 34-47% across workloads, including reasoning-heavy and chat-heavy tasks.
    These results demonstrate a robust alternative for optimizing tail latency in
    online LLM serving.
- title: 'HYDRA: A Heterogeneous Chiplet DSE Framework for Serving Dynamic Hybrid
    LLM Workloads'
  date: 2026-08
  url: https://arxiv.org/abs/2608.19395
  category: method
  subcategory: non-agentic
  authors:
  - Jiahao Lin
  - Alish Kanani
  - Sangwan Lee
  - Jaehyun Park
  - Umit Ogras
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Hybrid Transformer-Mamba large language models (LLMs) enhance long-context
    efficiency, but their heterogeneous computation and communication patterns complicate
    efficient hardware acceleration. Chiplet-based architectures offer a scalable
    solution by integrating specialized compute and memory units. However, the design
    space spanning static architectural configurations and dynamic runtime policies
    is prohibitively large to explore exhaustively. To address this challenge, we
    present HYDRA, a comprehensive design space exploration framework for hybrid LLM
    serving on heterogeneous chiplet systems. HYDRA jointly explores chiplet composition,
    placement, inter-chiplet bandwidth provisioning, dynamic batching, and runtime
    scheduling. It integrates communication-aware placement, dynamic batching, elastic
    task scheduling, and a fast Markov-based performance estimator that captures multi-tenant
    runtime dynamics for efficient and accurate exploration. Across all workloads,
    HYDRA delivers 1.55x the throughput and 43.7 percent lower time-to-first-token
    on average, with throughput gains reaching up to 2.3x compared to state-of-the-art
    baselines. These results highlight that co-designing architecture and runtime
    policies is critical for efficient large-scale LLM serving on heterogeneous chiplet
    systems.
- title: 'KAP: Bridging the Knowledge Selection-Runtime Consumption Gap in LLM Systems'
  date: 2026-07
  url: https://arxiv.org/abs/2607.24260
  category: method
  subcategory: non-agentic
  authors:
  - Shuo Wang
  - Fang Xi
  - Wenyuan Huang
  - Qing Wang
  - Junming Su
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Modern LLM systems increasingly rely on knowledge-selection processes
    that produce high-value structured priors, such as ranked evidence, graph topology,
    multimodal alignment, and confidence signals. Yet LLM serving remains fundamentally
    oblivious to this rich structure: once such signals are serialized into a prompt,
    the backend observes only a flat token sequence, forcing dense and uniform consumption
    of the full key-value (KV) state during decoding. We term this architectural mismatch
    the Knowledge Selection-Runtime Consumption (KSRC) gap: richer contexts enlarge
    the full-prompt KV footprint and decode-time memory traffic, increasing latency
    and degrading throughput even when reasoning depends on only a small fraction
    of the context. To bridge the gap, we propose Knowledge Access Planning (KAP),
    a paradigm-shifting execution abstraction that elevates structured knowledge priors
    from passive prompt-construction hints into first-class physical execution artifacts.
    KAP establishes a universal intermediate representation (IR)-the runtime access
    plan-which compiles structured knowledge signals to govern physical KV access
    without altering logical prompt semantics, model weights, or training procedures.
    Through this IR, KAP shifts LLM serving from token-aware context consumption to
    plan-driven, knowledge-aware runtime consumption. We instantiate KAP with GraphSpec,
    a compiler-executor realization connecting structured knowledge selection to an
    LLM serving backend. We derive a phase-boundary model for the positive-speedup
    regime of plan-guided execution. Across 4K-128K long-context QA workloads, GraphSpec
    maintains answer quality comparable to full-context decoding while decoupling
    physical KV consumption from prompt length, reducing proposal-time KV access to
    5.5% of source KV state at 128K, and fundamentally shifting the scaling trajectory
    of long-context generation.'
- title: 'From Tensor Buffer to Distributed Memory Hierarchy: A Survey of KV Cache
    Management for LLM Serving'
  date: 2026-06
  url: https://arxiv.org/abs/2607.02574
  category: method
  subcategory: non-agentic
  authors:
  - Jie Li
  - Tongyang Wang
  - Yong Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The key-value (KV) cache has become a first-order memory object in LLM
    serving rather than a temporary per-request tensor. This survey classifies more
    than thirty KV-management systems and frameworks using four axes: locality, lifetime,
    ownership, and substrate. The axes reveal five architectural archetypes -- local-paged,
    disaggregated-pipeline, shared-store, memory-pool, and hybrid-tier. Once workload
    and hardware are fixed, ownership accounts for much of the remaining design variance
    among distributed systems. The survey also audits current evaluations and identifies
    seven missing KV-specific measurements, linking them to open problems in fault
    tolerance, isolation, tiered eviction, speculative decoding, MoE serving, and
    shared-cache semantics.'
- title: 'Cascade: Exploiting SLO-Aware latency budget for fair and high goodput LLM
    inference serving'
  date: 2026-08
  url: https://arxiv.org/abs/2608.06557
  category: method
  subcategory: non-agentic
  authors:
  - Muhammad Adnan
  - Rohan Mahapatra
  - Prashant J. Nair
  - Daniel Berger
  - Pantea Zardoshti
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The reasoning and agentic capabilities of large language models have
    expanded the range of applications they support, from short interactive exchanges
    to long, compute-heavy requests. LLM serving platforms today define response-latency
    service-level objectives, even though requests within the same service can differ
    by orders of magnitude in input length, generation length, execution cost, and
    the availability of reusable KV-cache state. As a result, requests governed by
    the same service level objective have different urgency: after accounting for
    the time required to execute them, some have substantial latency headroom while
    others have almost none. We define this headroom---the difference between a request''s
    service level objective and its predicted remaining service time---as its per-request
    latency budget. We present Cascade, an LLM serving system that estimates and continuously
    updates this budget from request characteristics, KV-cache state, and current
    system load. Unlike prior SLO-aware schedulers that use deadlines to govern request
    ordering alone, Cascade uses a single per-request budget to jointly coordinate
    request scheduling and KV-cache management across the memory hierarchy. Its scheduler
    prioritizes requests with little remaining budget, while its memory manager uses
    the same budget to decide whether non-resident KV state should be restored or
    prefetched from a deeper tier, retained in HBM, or recomputed. By directing queueing
    and data-movement overhead toward requests that can absorb it, Cascade improves
    SLO-satisfied goodput while preserving fairness across heterogeneous request classes.
    On production traces across three large language models, Cascade improves goodput
    by up to2.4x and reduces SLO violations by 40% relative to the default vLLM first-come,
    first-served scheduler.'
- title: 'TokenPowerSandbox: Evidence-Gated CPU-First Screening for Energy-Aware LLM
    Serving'
  date: 2026-08
  url: https://arxiv.org/abs/2608.18149
  category: method
  subcategory: non-agentic
  authors:
  - Chenxu Niu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Energy-aware LLM serving requires comparing configurations under realistic
    request shapes, yet exhaustive target-GPU profiling is costly and a cheap predictor
    can be dangerously confident outside its measured scope. We present TokenPowerSandbox,
    an evidence-gated workflow that combines an interpretable CPU-resident projector,
    short target-GPU probes, full-workload verification, and tamper-evident freeze-before-measurement
    provenance. On one NVIDIA H100 80GB serving Qwen2.5-7B-Instruct with vLLM, three
    anchor repeats and six development workloads calibrate workload transfer. The
    same frozen model is evaluated on a blind holdout and a separately predeclared
    no-refit confirmation totaling 51 post-freeze runs. Energy MAPE is 6.23% and 7.35%,
    with Spearman rank correlations of 0.976 and 0.933. However, a predeclared TTFT
    gate passes at concurrency four (9.27% MAPE) and triggers abstention below four
    (64.80%), showing why energy accuracy cannot certify latency.
- title: 'RW-TTT: Batched Serving for Request-Owned Test-Time Training State'
  date: 2026-05
  url: https://arxiv.org/abs/2605.28053
  category: method
  subcategory: non-agentic
  authors:
  - Jian Yang
  - Zhizhuo Kou
  - Yao Tian
  - Hao Zhang
  - Han Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Test-time training (TTT) adapts an LLM during generation by reading and
    updating request-owned state, such as fast weights, low-rank deltas, or streaming
    learner state. This breaks batched LLM serving, which assumes shared static weights:
    serial execution is correct but slow, while naive batching can corrupt request
    state. We formulate this problem as read-write TTT serving and present RW-TTT
    , which tags each decode step with its owner, version, and READ/WRITE effect,
    batches only compatible phases, and commits updates only to the owner. On one
    GPU with eight fast-weight InPlace-TTT streams, RW-TTT reaches 274.61 aggregate
    tok/s, 9.31x over sequential serving and 3.44x over per-stream replicas under
    the same memory budget. It preserves behavior on RULER, a long-context benchmark,
    and passes owner/version checks.'
- title: 'PagedWeight: Efficient MoE LLM Serving with Dynamic Quality-Aware Weight
    Quantization'
  date: 2026-07
  url: https://arxiv.org/abs/2607.16184
  category: method
  subcategory: non-agentic
  authors:
  - Yuchen Yang
  - Yifan Zhao
  - Anisha Dasgupta
  - Sasa Misailovic
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Mixture-of-Experts (MoE) is a popular class of large language models (LLMs),
    offering high efficiency and accuracy. However, in KV-cache-intensive serving
    scenarios, MoEs often exhibit a tension between the GPU memory requirements of
    the model weights and the growing KV cache. We propose PagedWeight, a novel management
    method for MoE LLM serving that dynamically quantizes MoE model's weights at runtime
    and balances expert-weight precision with the KV cache sizes. PagedWeight exposes
    and effectively navigates the complex tradeoff between the model's task accuracy,
    memory consumption, and throughput/latency. Across several memory-sensitive MoE
    serving scenarios, PagedWeight improves the quality-memory tradeoff over several
    existing quantization baselines. PagedWeight achieves FP16-equivalent accuracy
    with up to 72.0% GPU memory savings and 1.94× throughput improvement, and improves
    quality over quantization methods by up to 39.3% at a similar memory budget with
    at most 4.1% throughput loss.
- title: 'DeltaServe: Host-Agnostic Co-Serving of Inference and Fine-Tuning for LLMs'
  date: 2026-07
  url: https://arxiv.org/abs/2607.28848
  category: method
  subcategory: non-agentic
  authors:
  - Jiaxuan Chen
  - Jianshu She
  - Ye Yuan
  - Rajat Ghosh
  - Karan Gupta
  venue: ''
  code_url: ''
  project_url: ''
  abstract: LLM serving systems are provisioned for peak load to meet strict latency
    targets, leaving substantial GPU compute idle whenever traffic falls below peak.
    We present DeltaServe, a host-agnostic co-serving design that converts this idle
    inference capacity into LoRA fine-tuning throughput while preserving inference
    service-level objectives (SLOs). DeltaServe integrates with existing inference
    engines through a compact hook interface that requires only multi-LoRA batching
    support. It exploits the shared execution structure of inference prefill and LoRA
    fine-tuning forward passes, and uses an SLO-aware scheduler to admit and execute
    fine-tuning only when sufficient inference headroom is available. The scheduler
    is driven by a CUDA-graph-aware latency model calibrated offline and refined online.
    We integrate DeltaServe with vLLM, SGLang, and S-LoRA. On a production trace from
    Company X, DeltaServe on vLLM delivers 2.9x higher fine-tuning throughput than
    LLMStation at 100% inference SLO compliance, versus 85% for LLMStation. It also
    achieves 39% higher fine-tuning throughput than a baseline running vLLM+torchtune,
    using no additional hardware and maintaining full SLO compliance.
- title: Communication-Efficient Verifiable Attention for LLM Inference
  date: 2026-06
  url: https://arxiv.org/abs/2606.16352
  category: method
  subcategory: non-agentic
  authors:
  - Ziqun Chen
  - Ming Wu
  - Michael Heinrich
  - Jason Zeng
  - Huiying Lan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Computation integrity of remote large language model (LLM) serving can
    be questionable. For conventional deep neural networks (DNNs), the existing TEE-shielded
    DNN partitioning (TSDP) approach uses Trusted Execution Environment (TEE) to compute
    non-linear components and verify the integrity of linear components offloaded
    to an untrusted GPU. However, directly applying TSDP to Transformer-based LLMs
    incurs significant TEE computation and TEE-GPU communication overhead. This paper
    presents Communication-efficient TEE-GPU Attention (textsc{VeriAttn) for accelerating
    verifiable LLM inference. textsc{VeriAttn offloads both linear and non-linear
    computations of attention to the GPU, while TEE performs verification. Moreover,
    for prefill, textsc{VeriAttn uses a two-level pipeline to overlap data movement,
    TEE pre-/post-processing, and GPU computation. For decoding, when the key-value
    cache exceeds available GPU memory, textsc{VeriAttn partitions attention across
    TEE and GPU to reduce repeated key-value transfers. Evaluation on an Intel TDX
    platform shows that textsc{VeriAttn achieves 2.60-3.38× and 3.86-5.42× acceleration
    over TSDP for 6k-token prompts and 10k-token outputs during prefill and decoding,
    respectively.
- title: 'TokenPilot: Cache-Efficient Context Management for LLM Agents'
  date: 2026-06
  url: https://arxiv.org/abs/2606.17016
  category: method
  subcategory: non-agentic
  authors:
  - Buqiang Xu
  - Zirui Xue
  - Dianmou Chen
  - Chenyang Fu
  - Chiyu Wu
  venue: ''
  code_url: https://github.com/zjunlp/LightMem2
  project_url: ''
  abstract: As LLM agents are deployed in long-horizon sessions, context accumulation
    drives up inference costs. Existing approaches utilize text pruning or dynamic
    memory eviction to minimize token footprints; however, their unconstrained sequence
    mutations alter layouts, introducing prefix mismatches and cache invalidation.
    This reveals a critical trade-off between text sparsity and prompt cache continuity.
    To address this, we present TokenPilot, a dual-granularity context management
    framework. Globally, Ingestion-Aware Compaction acts as a framework harness to
    stabilize prompt prefixes and eliminate open-world environmental noise at the
    ingestion gate. Locally, Lifecycle-Aware Eviction monitors the ongoing residual
    utility of context segments, enforcing a conservative batch-turn schedule to offload
    content segments only when task relevance expires. Experiments on PinchBench and
    Claw-Eval under both isolated and continuous modes demonstrate that TokenPilot
    reduces costs by 61% and 56% in isolated mode, and 61% and 87% in continuous mode,
    while maintaining competitive performance compared to prior systems. TokenPilot
    has been integrated into LightMem2 at https://github.com/zjunlp/LightMem2.
- title: 'Agentic Coding in the Wild: Characterizing GitHub Copilot Traces at Production
    Scale'
  date: 2026-07
  url: https://arxiv.org/abs/2608.00101
  category: method
  subcategory: non-agentic
  authors:
  - Banruo Liu
  - Haoran Qiu
  - Íñigo Goiri
  - Rodrigo Fonseca
  - Ricardo Bianchini
  venue: ''
  code_url: ''
  project_url: ''
  abstract: AI coding agents like GitHub Copilot, Claude Code, and Codex interleave
    multi-step LLM inference with tool execution, creating a workload different from
    chatbots. We present the first production-scale characterization of this workload
    using sampled GitHub Copilot traces from June 2026, comprising 3.2M users, 13M
    sessions, 761M LLM calls, and 95T tokens. Our analysis reveals distinctive workload
    properties with important systems implications. For example, agentic coding sessions
    consist of sparse user-initiated turns, each unfolding into an autonomous agent
    loop of LLM calls almost always coupled with tool execution. This structure yields
    KV cache hit rates averaging 90% within a turn, but falling to 55% across turn
    boundaries and drastically invalidated after events like model switches or context
    compaction. Diverse workflows and user behaviors are observed with variable and
    long-tailed token consumption, time span, and tool calls. We highlight the difference
    between quick agentic turnaround times and the minutes-long user idle periods
    at turn boundaries, and design a lightweight idle-time predictor that captures
    86-90% of total idle time, enabling proactive decisions for efficient resource
    orchestration. These findings challenge assumptions underlying current LLM-serving
    systems and provide an empirical foundation for agent-native infrastructure.
- title: 'Supervised Fine-Tuning vs. In-Context Learning: An Equilibrium Analysis
    of LLM Personalization under Congestion'
  date: 2026-07
  url: https://arxiv.org/abs/2607.14371
  category: method
  subcategory: non-agentic
  authors:
  - Fengzhuo Zhang
  - Zhuoran Yang
  - Dirk Bergemann
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large Language Models (LLMs) have revolutionized AI services, but a critical
    tension emerges: while personalization improves model performance, it consumes
    scarce computational resources that users must share. When should a user invest
    in expensive Supervised Fine-Tuning (SFT) versus lightweight In-Context Learning
    (ICL)? How does congestion from other users'' personalization choices reshape
    these incentives? And what strategies should platforms adopt when offering multiple
    personalization algorithms? We develop a tractable framework for LLM serving that
    captures the statistical-economic trade-offs users face. Our analysis yields several
    surprising insights. First, we show that ICL and SFT dominate in different regimes,
    determined by an interplay between pretraining coverage and data signal-to-noise
    ratios, but congestion can flip these rankings. Second, equilibrium resource consumption
    exhibits pronounced non-monotonicity: improving pretraining precision reduces
    the congestion, while broader pretraining coverage and harder tasks sometimes
    increase it. Third, we prove that offering both personalization methods never
    hurts the platform''s maximal profits, despite potentially increasing computational
    load. Experiments with GPT-2 on linear regression tasks validate our theoretical
    predictions about algorithm performance. Complementing these results, our review
    of documentation from 21 major AI platforms shows that the share offering both
    SFT and ICL increased from 9.5% in 2021 to 71.4% in 2025, consistent with our
    platform-design implications.'
- title: Unified Static-Dynamic Pruning for Efficient LLM Inference
  date: 2026-07
  url: https://arxiv.org/abs/2607.21985
  category: method
  subcategory: non-agentic
  authors:
  - Jinhyeok Kim
  - Yejoon Lee
  - Jaeyoung Do
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The increasing deployment of large language models (LLMs) has magnified
    the computational and memory bottlenecks of autoregressive decoding, where low
    compute intensity and bandwidth-bound kernels dominate inference cost. Weight
    pruning offers a promising remedy, but existing methods remain confined to either
    static pruning (SP), which permanently removes redundant weights but lacks adaptivity,
    or dynamic pruning (DP), which adapts to input sparsity but introduces runtime
    irregularity. This paper presents SPDP, a unified sparse-inference framework that
    integrates unstructured SP with input-adaptive DP for efficient LLM inference
    on GPUs. SPDP co-designs a new Tiled-Column-wise Bitmap Compressed (Tiled-CBC)
    format and two complementary GPU kernels: (1) a CUDA-core spMspV kernel featuring
    Hybrid Activation-aware Dynamic Shared-Memory Bitmap Decoding (HAD-SMBD) for fine-grained,
    runtime activation skipping, and (2) a Tensor-Core SpMM kernel optimized for prefill
    computation. This joint format-kernel design harmonizes static and dynamic sparsity,
    maintaining bandwidth-efficient memory access and high compute intensity under
    both phases of LLM inference. Comprehensive evaluations on inference-optimized
    GPUs demonstrate that SPDP achieves 1.24x-1.37x average speedup (up to 2.51x)
    over state-of-the-art sparse frameworks such as SpInfer, while matching perplexity
    with up to 25% higher sparsity. SPDP advances the inference efficiency-quality
    Pareto frontier, showing that unified static-dynamic pruning can deliver substantial
    throughput and performance-per-watt improvements in large-scale LLM serving.'
- title: Cache-Aware Prompt Compression:A Two-Tier Cost Model for LLM API Caching
  date: 2026-07
  url: https://arxiv.org/abs/2607.15516
  category: method
  subcategory: non-agentic
  authors:
  - Yan Song
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Production LLM deployments combine two cost-reduction primitives: prompt
    caching (a discounted rate for re-used token prefixes) and prompt compression
    (fewer tokens sent). The compression literature has standardized on query-aware
    methods that produce a different compressed prefix per query, mechanically invalidating
    the prefix-strict cache on every call. We characterize this cost empirically on
    Anthropic''s Sonnet 4.6 API and find caching is far from the rho=1.0 ideal the
    literature assumes: Sonnet''s cache has a two-tier architecture with a sharp threshold
    near 3,500 tokens, below which the hit rate plateaus at rho~0.83 across 30-call
    sessions. Our cost model predicts, and experiments confirm, that under realistic
    rho, query-aware compression beats naive caching at high compression ratios (r>=6).
    We propose Cache-Aware Prompt Compression (CAPC), pairing query-agnostic compression
    with explicit cachecontrol plus a tier-preserving ratio bound that prevents over-compression
    from pushing the cached prefix into the hot tier. CAPC is the cheapest strategy
    in 16/16 configurations on LongBench-v2, with mean savings of 49% over cache-only,
    64% over query-aware compression, and 90% over vanilla, at quality within 0.05
    of the uncompressed baseline. We validate CAPC on three production workloads:
    an enterprise tool-using assistant with a 94k-token schema prefix (51.7% cost
    reduction at r=3); a graphify knowledge-graph RAG pipeline across two codebases
    (9.3x vs cache-all on FastAPI, 2.4x on httpx); and the public tau-bench retail
    benchmark (50 tasks), where CAPC is the cheapest of four strategies with reward
    exactly equal to vanilla (both 36/50, p=1.00) while query-aware compression is
    the most expensive at +40.1% over vanilla -- the first production confirmation
    of the crossover model''s negative-ROI prediction on a public benchmark.'
- title: 'FleetSieve: Decision-Critical Profiling for SLO-Aware LLM Fleet Configuration'
  date: 2026-08
  url: https://arxiv.org/abs/2608.19659
  category: method
  subcategory: non-agentic
  authors:
  - Huang Cheng
  - Scott Zhang
  - Aubert Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Choosing tensor-parallel (TP) degrees and replica counts for an LLM serving
    fleet is difficult because performance is not monotonic in TP and the feasible
    choice can change with load. Exhaustive profiling resolves this uncertainty, but
    measures many configurations that do not affect the final resource allocation.
    We present FleetSieve, which selects measurements according to their expected
    effect on a resource-coupled, SLO-aware fleet decision. FleetSieve models capacity
    and tail latency jointly, compares conservative and optimistic allocations, and
    stops when their remaining decision gap is below a specified tolerance. On a fixed
    H100 measurement grid for a 31B-parameter open-weight model, FleetSieve reaches
    the oracle aggregate decision using 22,200 GPU-seconds, 6.9% less than uniform
    random profiling in the fixed comparison. Across 200 random reveal orders, its
    mean saving over random profiling is 5.4% (95% bootstrap CI: 3.5-7.2%). The fixed-comparison
    saving is 21.5% for Chat, while FleetSieve does not use the fewest GPU-seconds
    for Code. Joint capacity and tail modeling also avoids selecting a configuration
    whose 46.4-second completion p99 violates a 30-second SLO. In a 16-GPU allocation,
    an incorrect sparse-profile decision loses up to 1.93 requests/s and 12.4 percentage
    points of max-min fulfillment. Boundary repeats and BurstGPT measurements support
    the observed load-dependent tail-latency mechanism.'
- title: 'Beyond Binary Priorities: Multi-Tier SLA Scheduling for Large Language Model
    Serving'
  date: 2026-08
  url: https://arxiv.org/abs/2608.16336
  category: method
  subcategory: non-agentic
  authors:
  - Anders Vestrum
  - Arya Raeesi
  - Hanna Roed
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Modern LLM serving deployments must simultaneously satisfy heterogeneous
    service-level objectives (SLOs) across a diverse population of user tiers, ranging
    from latency-critical API calls to background batch processing. Llumnix introduced
    a dynamic, migration-capable multi-instance scheduler for LLM inference that achieves
    load balancing, defragmentation, prioritization, and auto-scaling through a unified
    "freeness" metric. However, Llumnix's priority model is restricted to two levels
    (high and normal), an abstraction too coarse to express the richer SLA classes
    common in production deployments. In this work, we extend Llumnix's priority model
    to support an arbitrary number of tiers and evaluate the effects of this extension
    under three realistic priority distributions (uniform, Gaussian, enterprise) using
    Vidur, a high-fidelity LLM inference simulator. We implement per-tier headroom
    with exponential decay, tier-aware dispatch ordering, and the full Llumnix migration
    pipeline inside Vidur's hierarchical scheduling framework. We compare our extended
    scheduler against INFaaS (global routing baseline), vLLM, Orca, and Sarathi-Serve
    (per-replica baselines), sweeping priority levels from 1 to 10. Our experiments
    demonstrate that four priority tiers yields the best cost-effectiveness tradeoff,
    achieving prefill mean speedups of up to 8.3x and end-to-end P99 speedups of up
    to 3.1x over INFaaS with cost-per-latency improvements of 46 to 68%, while preserving
    strong SLO differentiation across tiers. We further show that the system sustains
    these gains at 10 priority levels without tail latency collapse, with overhead
    concentrated in the prefill phase.
- title: 'CrossPool: Efficient Multi-LLM Serving for Cold MoE Models through KV-Cache
    and Weight Disaggregation'
  date: 2026-06
  url: https://arxiv.org/abs/2606.24506
  category: method
  subcategory: non-agentic
  authors:
  - Zhuoren Ye
  - Tianyu Wo
  - Dinghao Xue
  - Mingming Zhang
  - Yuchen Teng
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Emerging LLM services increasingly host many sparse MoE models, yet most
    models receive sparse requests and remain cold. This creates a GPU memory problem:
    model weights are stable and model-determined, while KV-cache is transient and
    demand-determined. Because cold models rarely reach peak KV-cache demand at the
    same time, reserving worst-case KV capacity per model wastes memory; a shared
    KV-cache pool can instead provision aggregate active demand. However, KV-cache
    sharing is not sufficient when weights and KV-cache remain in a monolithic GPU
    memory pool. Static weights compete with dynamic KV-cache, and KV-head-limited
    attention under cold, low-concurrency traffic exposes only a fraction of replicated
    KV capacity, leading to low GPU memory utilization and weak long-context support.
    We present CrossPool, a serving engine for cold MoE models that separates FFN
    weights and KV-cache into two GPU memory pools: a weights pool that consolidates
    FFN weights across cold models, and a KV-cache pool that dynamically serves active
    requests while keeping attention local to KV-cache. CrossPool combines a KV-cache
    planner and virtualizer, a layer-wise pipeline scheduler that hides hidden-state
    transfers, and persistent kernels with control lowering to reduce CPU-GPU control
    overhead. With efficient GPU memory pooling, CrossPool underpins bursty long-context
    requests and outperforms the state-of-the-art kvcached-based multi-LLM serving
    system, reducing P99 TBT by up to 10.4x.'
- title: 'ST2U: Stateful Test-Time Unlearning via Restricted Knowledge Boundary Control'
  date: 2026-08
  url: https://arxiv.org/abs/2608.23034
  category: method
  subcategory: non-agentic
  authors:
  - Xunlei Chen
  - Qinghui Gong
  - Ruini Xue
  - Yaodong Hu
  - Tian Lan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Controlling restricted knowledge in large language models is essential
    for model alignment and safe deployment. Test-time unlearning avoids costly retraining
    and parameter updates by intervening only during inference. However, existing
    activation-editing methods apply isolated pointwise corrections, overlooking how
    autoregressive generation continually reconstructs hidden states from the prompt,
    cache, and generated prefix. Consequently, later states may return to restricted
    knowledge regions after a locally successful correction, causing restricted knowledge
    re-entry. In this work, we propose Stateful Test-Time Unlearning via restricted
    knowledge boundary control (ST2U), which formulates test-time unlearning as trajectory-wide
    boundary control. ST2U first models restricted knowledge boundaries in low-dimensional
    invertible coordinates while leaving orthogonal non-target components unchanged.
    During inference, ST2U monitors risk along the trajectory, applies minimal boundary
    corrections with contextual anchoring, and propagates historical correction states
    across tokens to mitigate knowledge re-entry. This trajectory-wide control enables
    more persistent forgetting while preserving non-target capabilities and limiting
    inference overhead. Across three benchmarks and three model families, ST2U delivers
    the strongest overall balance, combining best or second-best retention with competitive
    forgetting and substantially less restricted-knowledge re-entry than test-time
    baselines (13.76%-19.84% versus 46.50%-59.10%).
- title: Service-Induced Congestion in Memory-Constrained LLM Serving
  date: 2026-06
  url: https://arxiv.org/abs/2606.15555
  category: method
  subcategory: non-agentic
  authors:
  - Ruicheng Ao
  - Jing Dong
  - Gan Luo
  - David Simchi-Levi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'In large language model (LLM) serving, each request accumulates persistent
    graphics processing unit (GPU) memory during service as its key-value cache grows
    with every generated token. Under high concurrency, aggregate memory usage therefore
    increases endogenously over time: the service process itself creates future capacity
    pressure. When memory capacity is exceeded, systems evict active requests, discarding
    cached state and restarting them later, which wastes computation and reduces throughput.
    We develop a discrete-time dynamical model of memory-constrained LLM inference
    that captures admission, memory growth, and eviction under continuous batching.
    In the saturated-input regime, the system admits both eviction-free fixed points
    and limit cycles with evictions. For homogeneous workloads, we show that the eviction-free
    equilibrium is unstable and that, except for a Lebesgue-measure-zero exact-capture
    set, the system converges to a unique worst-case limit cycle that is asymptotically
    stable outside this exceptional set, with throughput losses as large as 50%. For
    heterogeneous workloads, we prove a stability criterion in the two-class common-input
    setting and explain how the survival-polynomial mechanism generalizes to multiple
    classes and heterogeneous-input lengths. Under an input-dominated scaling regime,
    coprime decoding lengths stabilize the eviction-free equilibrium, while non-coprime
    lengths create synchronized modes that drive instability. These results characterize
    when workload heterogeneity desynchronizes completions and helps stabilize memory-constrained
    serving. More broadly, we identify service-induced congestion as a structural
    instability mechanism and derive scheduling design principles for sustaining high
    throughput.'
- title: Global Simulation-Guided Dynamic Operator Scheduling for Efficient Multi-Tenant
    Model Serving
  date: 2026-08
  url: https://arxiv.org/abs/2608.15762
  category: method
  subcategory: non-agentic
  authors:
  - Weinan Liu
  - Zeyuan Ding
  - Dian Ding
  - Chengcheng Wan
  - Lu Tang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Container-granularity scheduling leaves abundant short-lived idle slices
    within containers unexploited. Reallocating containers is too heavyweight to utilize
    such fine-grained opportunities under SLA constraints, and operator-level scheduling
    requires reasoning about dependencies, memory safety, and cluster-wide execution
    dynamics in real time. In this paper, we present SliceScheduler, a dynamic operator-level
    scheduling system for multi-tenant model serving. The key idea is to expose cluster-wide
    operator execution state and enable what-if reasoning over scheduling decisions.
    SliceScheduler consists of four key components. First, we introduce the Global
    Mapping Graph (GMG), a unified abstraction that captures operator dependencies,
    tensor shapes, resource mappings, and execution states, providing a real-time,
    cluster-wide view with explicit resource semantics. Second, we build a global
    simulator on top of GMG to predict operator-level execution and memory evolution
    under candidate placements. Third, we design an incremental, simulation-based
    scheduling module that selects placements to exploit fragmented idle slices while
    avoiding memory violations and preserving SLA. Finally, we develop an operator
    executor that materializes scheduling decisions on GPUs and coordinates computation
    and cross-accelerator transfers. We implement SliceScheduler as a PyTorch backend
    and evaluate it using production trace replay. Experimental results show that
    SliceScheduler improves token throughput by 1.10--2.29× compared to existing approaches,
    while maintaining SLA violations within 9%. SliceScheduler demonstrates that operator-level
    scheduling is a practical and effective approach to improving GPU utilization
    for multi-tenant LLM serving.
- title: 'Lynx: Progressive Speculative Quantization for accelerating KV Transfer
    in Long-Context Inference'
  date: 2026-07
  url: https://arxiv.org/abs/2607.01831
  category: method
  subcategory: non-agentic
  authors:
  - Wenchen Han
  - Gingfung Matthew Yeung
  - Marco Barletta
  - William Toner
  - Amory Hoste
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-context inference is increasingly common in large language model
    (LLM) serving, driven by retrieval-augmented generation and agentic systems. In
    disaggregated inference, these workloads require transferring large Key-Value
    (KV) caches across the network, where decoding cannot begin until the transfer
    completes. Recent KV quantization techniques reduce data volume and alleviate
    this bottleneck, but existing schemes fail to achieve both low network-exposed
    latency and high inference accuracy. We challenge the assumption that the KV cache
    is an indivisible unit that must be fully received before use. We leverage the
    observation that different bits in the KV cache contribute unequally to attention
    computation and inference precision: the most significant bits capture the coarse
    structure of attention and the least significant bits refine precision. This property
    enables partial use of the KV cache during decoding. We present Lynx, a system
    that enables progressive, split-stream KV transfer by partitioning the KV cache
    into a high-priority Anchor stream carrying the most significant bits and a low-priority
    Residual stream carrying remaining precision. Decoding begins upon receipt of
    the Anchor stream and proceeds speculatively while the Residual stream is transferred
    concurrently, followed by verification that ensures equivalence to higher-precision
    decoding. Across multiple models and serving workloads, Lynx achieves Time-to-First-Token
    (TTFT) comparable to aggressive 4-bit KV quantization, while matching the accuracy
    of high-precision (BF16) inference, improving TTFT over standard 8-bit KV quantization
    by up to 1.43× and improving accuracy over state-of-the-art by up to 5.1%.'
- title: 'Tangram: Unlocking Non-Uniform KV Cache Compression for Efficient Multi-turn
    LLM Serving'
  date: 2026-06
  url: https://arxiv.org/abs/2606.06302
  category: method
  subcategory: non-agentic
  authors:
  - Hyungmin Kim
  - Minsoo Kim
  - Hongseok Kim
  - Jungwook Choi
  venue: ''
  code_url: https://github.com/aiha-lab/TANGRAM
  project_url: ''
  abstract: 'Multi-turn LLM serving accumulates dialogue history whose Key-Value (KV)
    cache grows with every turn and every user, quickly exceeding the model weights
    themselves and making memory -- not compute -- the binding constraint on throughput.
    Non-uniform KV compression, which allocates heterogeneous budgets across attention
    heads, preserves accuracy far better than uniform schemes, yet remains impractical:
    modern serving stacks assume identical KV lengths across heads, so heterogeneity
    traps freed memory as page fragmentation, spends up to 25% of prefill time reclaiming
    scattered pages, and skews GPU workloads that inflate decode latency by up to
    1.7× or burn 15--20% of each decode step on re-planning. We observe that this
    heterogeneity need not be discovered at runtime: head-wise retention follows a
    two-level structural regularity -- an input-invariant head ranking with narrowly
    bounded per-head ratios -- that can be calibrated offline from as few as 50 samples.
    Building on this insight, we present Tangram, a serving framework that statically
    resolves what prior systems handle dynamically: Budget Reservation fixes each
    head''s post-compression footprint at scheduling time, eliminating page reclamation;
    Ragged Paging clusters similar-budget heads into independent page tables, turning
    fragmentation into reclaimable memory; and Ahead-of-Time Load Balancing precomputes
    balanced GPU partitions with zero runtime planning. Implemented on vLLM, Tangram
    serves as a drop-in substrate for existing non-uniform compression methods, matching
    their accuracy while improving end-to-end throughput by up to 2.6× over the full-KV
    baseline. Our implementation is publicly available at https://github.com/aiha-lab/TANGRAM.'
- title: 'Pallas: A Proactive KV Cache Migration Framework for LLM Inference in AI-RAN'
  date: 2026-08
  url: https://arxiv.org/abs/2608.16477
  category: method
  subcategory: non-agentic
  authors:
  - Tianhang Ding
  - Jianchun Liu
  - Hongli Xu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'AI-RAN brings large language model (LLM) serving close to mobile users,
    but cellular handover can separate an active request from its inference state:
    the user attaches to a target base station (gNB) while the large and growing key-value
    (KV) cache remains at the source. Retaining inference at the source preserves
    service continuity but persistently increases inter-token latency (ITL), whereas
    recovering the state at the target restores serving locality but requires KV-cache
    transfer, recomputation, or a combination of both only after handover, directly
    prolonging service interruption time (SIT). This work presents Pallas, a textit{proactive
    KV-cache migration framework that prepares the inference state at the predicted
    target before handover, in parallel with ongoing source-side inference and token
    delivery. At the preparation trigger, Pallas partitions the token sequence into
    a stable historical prefix and an evolving suffix. The target reconstructs the
    prefix through local prefill, while the source streams the KV blocks generated
    for the suffix. At handover, the target assembles both portions into an up-to-date
    KV cache and resumes decoding locally, leaving only unfinished preparation to
    contribute to SIT. An online scheduler selects the textit{prefetching window,
    which determines how early preparation begins before handover, based on mobility
    predictions and runtime telemetry. Across three LLMs and 100--500~mathrm{Mbps
    inter-gNB links, our vLLM-based prototype reduces average SIT by factors of 2.28--89.68
    over target-side recovery approaches and lowers average ITL by 16.0%--50.0% compared
    with source-side forwarding.'
- title: 'ViBE: Co-Optimizing Workload Skew and Hardware Variability for MoE Serving'
  date: 2026-05
  url: https://arxiv.org/abs/2606.00735
  category: method
  subcategory: non-agentic
  authors:
  - Seokjin Go
  - Marko Scrbak
  - Ephrem Wu
  - Srilatha Manne
  - Divya Mahajan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'In distributed Mixture-of-Experts (MoE) inference, input-dependent token
    routing interacts with GPU performance variability to create persistent stragglers
    under synchronized execution, where the slowest GPU determines layer latency.
    This performance variability is inherent to modern accelerators: manufacturing
    variation, power limits, and thermal conditions introduce measurable execution-time
    differences across nominally identical GPUs. The core challenge is that MoE execution-time
    imbalance arises from the interaction of workload skew and hardware asymmetry.
    Token routing produces uneven and layer-varying expert loads, while GPU throughput
    depends on device-specific operating characteristics and workload intensity. Prior
    work mitigates routing skew but assumes homogeneous hardware, optimizing token
    balance rather than execution latency. As a result, even balanced token assignments
    can leave hardware-induced stragglers unaddressed. Thus, we propose Variability-Informed
    Binning of Experts (ViBE), a hardware-aware expert placement framework that minimizes
    execution-time imbalance across GPUs. ViBE combines per-GPU performance modeling
    with expert activation profiling to assign high-load experts to faster devices
    and low-load experts to slower ones, reducing layer-level stragglers without modifying
    model semantics or hardware. Because both workload characteristics and effective
    GPU throughput can shift across serving conditions, ViBE supports lightweight
    recalibration under workload/performance drift to refresh its routing and performance
    estimates when needed. Results show that ViBE consistently reduces execution-time
    imbalance and improves SLO attainment by 14%, while lowering P90 TTFT by up to
    45%. We further show that the impact of hardware variability increases at scale,
    making variability-aware placement important for efficient, high-utilization LLM
    serving.'
- title: 'PersistentKV: Page-Aware Decode Scheduling for Long-Context LLM Serving
    on Commodity GPUs'
  date: 2026-06
  url: https://arxiv.org/abs/2606.26666
  category: method
  subcategory: non-agentic
  authors:
  - Muhammad Ahmed
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Autoregressive large language model (LLM) serving is increasingly limited
    by key-value (KV) cache movement rather than dense matrix multiplication. Modern
    paged-attention systems reduce fragmentation, and mature kernels like FlashInfer
    provide highly optimized decode attention. However, the best single-kernel implementation
    is not always the best serving schedule: low-active long-context decode can under-utilize
    GPUs, while mixed sequence lengths introduce tension between many exact-length
    launches and coarse padded batches. We present PersistentKV, a native block-table
    decode attention engine and page-aware scheduling study for grouped-query attention
    (GQA). PersistentKV maps work by KV-head group, executes directly over native
    page tables, and adds a compact workqueue schedule executing only non-empty row-KV-head-sequence-split
    tasks. On an RTX 3060 (FP16, page size 16, Hq=32, Hkv=8, d=128), a calibrated
    roofline-style policy selects FlashInfer for small active batches, PersistentKV
    sequence splitting for batch size 1 (B1) long-context steps, and PersistentKV
    workqueue scheduling for supported B8 long-context GQA steps. With cost-model
    constants fixed on calibration traces, five held-out seeds improve mean wall decode-token
    throughput by 1.04x to 1.08x on B8 bimodal, uniform, and Zipf-like workloads,
    and by 1.40x on a B1 bucketed trace. For the B4 boundary case and uncalibrated
    GQA ratios, the policy avoids regressions by routing to FlashInfer. We also report
    an attention-plus-MLP timing proxy and workload counters showing workqueue scheduling
    reduces launch fan-out from 16.00 to 2.00 launches per step on held-out bimodal
    B8. These results show that work assignment is a decisive serving-system variable.'
- title: 'Execution-State Capsules: Graph-Bound Execution-State Checkpoint and Restore
    for Low-Latency, Small-Batch, On-Device Physical-AI Serving'
  date: 2026-06
  url: https://arxiv.org/abs/2606.20537
  category: method
  subcategory: non-agentic
  authors:
  - Liang Su
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Mainstream LLM serving systems reuse prefix work mainly through paged
    or radix key-value (KV) caches. This is highly effective for high-throughput,
    high-concurrency serving, but it manages only one positional fragment of execution
    state: the KV cache. We study the opposite regime: low-latency, small-batch, on-device
    physical-AI serving, where interactive LLM agents, speech systems, and robot policies
    repeatedly branch, reset, interrupt, and re-enter under tight responsiveness budgets.
    We introduce execution-state capsules, a graph-bound checkpoint and restore mechanism
    for the complete restorable state at a committed boundary. FlashRT is a white-box,
    backend-facing kernel runtime whose evaluated NVIDIA CUDA backend runs captured
    graph plans over contiguous static buffers with no block-table indirection. Because
    the live state is a closed set of named buffers, a capsule can snapshot, restore,
    fork, or roll back the whole execution boundary, including KV, recurrent state,
    convolution state, MTP state, and metadata. This moves reuse from token-addressed
    KV fragments to graph-bound execution-state boundaries. On an RTX 5090, capsule
    restore is byte-exact at the stored-state level and token-identical under greedy
    decode. A KV-only ablation diverges, showing that recurrent state is load-bearing.
    GPU-resident snapshot and restore are sub-millisecond, and TTFT speedup over cold
    prefill grows from 3.9x at 2k tokens to 27x at 16k tokens. On Jetson AGX Thor
    and DGX Spark, the same correctness and structural properties hold. Capsules are
    not a replacement for high-throughput KV-cache serving; they define a complementary
    latency-first serving point for explicit execution-state reuse.'
- title: 'Llama-Mobile: Efficient 2.7-Bit Quantization of VLMs'
  date: 2026-08
  url: https://arxiv.org/abs/2608.21134
  category: method
  subcategory: non-agentic
  authors:
  - Luka Ribar
  - Jeevan Bhoot
  - Douglas Orr
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Deploying vision-language models (VLMs) on mobile devices is challenging
    due to their significant memory and compute requirements. We present a framework
    for quantizing VLMs for efficient inference on resource-constrained hardware.
    Our approach combines a quantization pipeline that uses the model itself to generate
    training data and does not require access to the training setup, with a novel
    2.7-bit-per-parameter format supporting efficient execution on Arm CPUs. We validate
    our approach by compressing the Llama 3.2 11B Vision Instruct model to 3.7 GB
    with 8-bit activations, preserving strong performance on a set of standard visual
    question answering tasks.
- title: 'FedLSG: LLM-Enhanced Semantic Calibration for Federated Graph Backdoor Defense'
  date: 2026-07
  url: https://arxiv.org/abs/2607.19674
  category: method
  subcategory: non-agentic
  authors:
  - Chenyu Zhou
  - Yabin Peng
  - Wei Huang
  - Kunlin Li
  - Shuaishuai Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Federated Graph Neural Networks (FedGNNs) are highly vulnerable to backdoor
    poisoning, yet existing defenses typically rely on rule-based approaches that
    lack semantic understanding, making them vulnerable to stealthy triggers and harmful
    to benign structures. To solve this, we present FedLSG, the first framework that
    integrates large language models (LLMs) into federated graph backdoor defense.
    FedLSG introduces a graph and behavior to text grounding scheme that transforms
    local graph structures and client update behaviors into semantically rich natural
    language representations. The framework further adopts a lightweight student-teacher
    architecture. On the server side, a full scale LLM serves as a teacher, providing
    global contextual guidance and evaluating client updates during aggregation to
    identify potentially malicious participants. On the client side, a LoRA-based
    student is maintained to perform semantic reasoning, to suppress the influence
    of edges associated with backdoor triggers. By enabling semantic interpretation
    of both graph patterns and client behaviors, the framework adaptively incorporates
    rule-based signals into message passing and client aggregation for defense. Experiments
    demonstrate that FedLSG significantly improves resistance to backdoor attacks
    without compromising graph integrity.
- title: 'HERALD: High-Throughput Block Diffusion LLM Serving via CPU-GPU Cooperative
    KV Cache Retrieval'
  date: 2026-06
  url: https://arxiv.org/abs/2606.21633
  category: method
  subcategory: non-agentic
  authors:
  - Omin Kwon
  - Doyeon Kim
  - Jongseok Park
  - Seung Yul Lee
  - Ion Stoica
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The KV cache dominates GPU memory in long-context LLM serving, crowding
    out batch capacity and leaving GPU compute idle. Offloading the cache to CPU DRAM
    restores capacity, but the limited PCIe bandwidth forces state-of-the-art offloading
    systems to pair it with sparse attention, fetching only a small critical subset
    of the cache to the GPU. These systems, however, follow the KV access pattern
    of autoregressive decoding, in which the critical set changes at every token:
    selection and fetching recur at every decoding step, and throughput remains capped
    by PCIe bandwidth rather than by either processor. Block diffusion LLMs(block
    dLLMs), which decode a block of B tokens over T denoising steps, exhibit a different
    KV access pattern that opens a new opportunity for offloading. Recent sparse block
    dLLM methods have shown that sparse inference separates into a selection phase
    that scans the full KV cache once per block and a denoising phase that reuses
    the selected small subset T times. This asymmetry aligns with the compute and
    memory asymmetry of a CPU-GPU system, making it advantageous to run selection
    on the CPU and denoising on the GPU: the critical KV cache then crosses PCIe only
    once per block, removing the interconnect as the bottleneck. We present HERALD,
    to our knowledge the first KV offloading system designed for block dLLMs. HERALD
    resolves the two obstacles of this mapping, the serialized dependency between
    the phases and the compute-bound B-query selection on the CPU, by overlapping
    the phases with a draft block, reducing the selection cost with a single [MASK]
    query, and executing both as a dual-stream pipeline over double-buffered sparse
    KV pools. On two production block dLLMs, HERALD sustains near-lossless accuracy
    at a 5% KV budget and reaches up to 2.28x the decode throughput of GPU-only serving,
    with gains that widen with context length.'
- title: Deformable State Estimation for Autonomous Surgical Tissue Retraction Under
    Partial Observability
  date: 2026-07
  url: https://arxiv.org/abs/2607.13475
  category: method
  subcategory: non-agentic
  authors:
  - Everest Yang
  - Skye Thompson
  - George D. Konidaris
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Surgical tissue retraction requires effective manipulation planning under
    partial and noisy perception. We study state estimation for deformable tissue
    retraction, where only sparse observations of the tissue surface are available
    at decision time. We propose a learned state estimator that reconstructs the full
    deformable mesh state from 40 noisy vertex observations. The estimator combines
    a multilayer perceptron with a low-dimensional PCA latent representation and is
    trained using geometry-aware regularization that encourages smooth and physically
    plausible deformations. We evaluate the approach in a 2D deformable sheet simulation
    using single-step and multi-step retraction planning. Results show that the learned
    estimator achieves 98.1% of oracle performance in multi-step retraction while
    supporting efficient inference. These results demonstrate that learned, geometry-regularized
    state estimation can support effective deformable manipulation under realistic
    perception constraints.
- title: Augmenting Attention with Exponentially Decaying Memory Improves Query-Aware
    KV Sparsity
  date: 2026-05
  url: https://arxiv.org/abs/2605.28640
  category: method
  subcategory: non-agentic
  authors:
  - Xiuying Wei
  - Caglar Gulcehre
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Efficient inference is critical for long-context language models, where
    attention computation and KV-cache access dominate the cost. Recent work RAT+,
    introduces a recurrence-augmented attention backbone that enables flexible dilated
    attention at inference time. In this paper, we investigate whether this exponentially
    decaying memory can also improve existing query-aware sparse inference methods.
    Using representative methods including Quest, MoBA, and SnapKV, we show that RAT+
    consistently improves accuracy over standard attention across sparse budgets on
    eight needle-in-a-haystack tasks. We validate these gains both on the released
    checkpoints from the RAT+ paper and on OLMo2-7B, which we continue pretraining
    with the added memory module for 10B tokens. Finally, we propose two hypotheses
    explaining why this memory module benefits query-aware sparse inference and design
    targeted experiments to support them.
- title: 'FUSE: FK-Steered Multi-Modal Flow Matching for Efficient Simulation-Based
    Posterior Estimation'
  date: 2026-07
  url: https://arxiv.org/abs/2607.05252
  category: method
  subcategory: non-agentic
  authors:
  - Weichen Qin
  - Yufan Xie
  - Peihao Wang
  - Chia-Jui Chou
  - Minghui Du
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Simulation-Based Inference (SBI) is critical for scientific discovery,
    with generative models offering a promising path toward efficient inference. However,
    existing methods struggle with effective multimodal modeling. They often rely
    on brute-force fusion strategies that ignore the structural disparities between
    parameters and observations, thus limiting estimation fidelity. In this work,
    we introduce FUSE (Feynman-Kac steered mUlti-modal flow matching for efficient
    Simulation-based posterior Estimation). Unlike prior work, FUSE employs a dual-track
    architecture that preserves the distinct features of multimodal inputs while facilitating
    dynamic interaction. Additionally, we propose an FK-steered sampling strategy
    that leverages intermediate observation likelihoods to guide the generative trajectories,
    effectively improving the sample quality during inference. Our approach outperforms
    state-of-the-art baselines on standard SBI benchmarks, producing posteriors that
    closely match ground-truth MCMC. Furthermore, in a real-world exoplanet orbital
    estimation task, FUSE successfully resolves complex parameter degeneracies that
    challenge existing methods, highlighting its potential to accelerate complex scientific
    discoveries in astrophysics and beyond.
- title: Transforming LLMs into Efficient Cross-Encoders via Knowledge Distillation
    for RAG Reranking
  date: 2026-07
  url: https://arxiv.org/abs/2607.11933
  category: method
  subcategory: non-agentic
  authors:
  - Shreeya Dasa Lakshminath
  - Shubhan S
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Cross-encoders achieve high reranking accuracy in Retrieval-Augmented
    Generation (RAG) pipelines but impose quadratic inference costs that limit real-time
    deployment. We address this by fine-tuning LLaMA 3 (8B) as a drop-in reranker
    using a two-stage pipeline: supervised fine-tuning on a custom query-document
    relevance dataset via the Unsloth framework with LoRA adapters, followed by 4-bit
    quantization for efficient inference. The resulting model replaces the cross-encoder
    in a dual-retriever RAG pipeline combining BM25 and dense vector search. Evaluated
    on a domain-specific question-answering benchmark using the RAGAS framework, our
    fine-tuned LLaMA 3 reranker achieves gains of 14% in answer relevancy, 16% in
    context precision, 19% in answer similarity, and 21% in answer correctness over
    the cross-encoder baseline, while reducing inference overhead through 4-bit quantization.
    These results demonstrate that instruction-tuned LLMs can be adapted into accurate,
    efficient rerankers without the quadratic complexity of traditional cross-encoders.'
- title: Mitigating the Contractivity Trap in Diffusion ODEs via Stein Stabilization
  date: 2026-06
  url: https://arxiv.org/abs/2606.07835
  category: method
  subcategory: non-agentic
  authors:
  - Shigui Li
  - Delu Zeng
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'A fundamental tension exists in the large-step inference of diffusion
    models via their deterministic probability flow ordinary differential equation
    (PF-ODE) trajectories, which we identify as the contractivity trap: efficient
    inference favors large step sizes, while aggressive steps and highly expressive
    denoisers can undermine contraction-based stability certificates for error suppression.
    To address this, we propose SteinDiff, a step-wise inference-time stabilization
    framework that employs Stein-derived corrections without requiring reference samples.
    Specifically, SteinDiff introduces a geometry-aware residual correction mechanism
    that regularizes large-step solver updates without retraining. To this end, we
    derive a closed-form Stein correction coefficient for step-wise solver adjustment,
    enabling reference-free adaptation to local data geometry. We further establish
    a score-controlled perturbation bound under distributional shifts and provide
    a complementary Stein perspective on EDM-style parameterizations. Extensive experiments
    demonstrate that SteinDiff mitigates severe artifacts and improves generative
    quality across large-step inference settings.'
- title: A Lightweight Foundation Model for Collider Physics with Multi-Domain Adaptation
  date: 2026-07
  url: https://arxiv.org/abs/2607.27501
  category: method
  subcategory: non-agentic
  authors:
  - Liangyu Wu
  - Qibin Liu
  - Alexander Yue
  - Julia Gonski
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present a lightweight approach to foundation modeling (textbf{NEXUS)
    that leverages pre-trained learning from collider physics data towards out-of-domain
    tasks in other scientific datasets, using a fully connected autoencoder model
    with approximately 3 million parameters. The model pre-trains with no supervision
    over a large-scale collision dataset from the Large Hadron Collider modeled by
    charged particle track features. Downstream tasks for collider analyses, such
    as kinematic regression and event classification, are developed on pre-trained
    model weights and achieve improved accuracy with only small labeled datasets when
    compared to equivalent architectures trained from scratch. The benefits of pre-training
    are additionally investigated through latent space interpretation and application
    to other domains, including gravitational waves, flood forecasting, and neural
    activity. Furthermore, the relative computational simplicity of NEXUS is demonstrated
    compared to transformer approaches at comparable scale, opening the door to power-efficient
    inference and real-time or edge applications of foundation models in scientific
    experiments.
- title: Toward Multi-Domain and Long-Tailed Quantization via Feature Alignment and
    Scaling
  date: 2026-06
  url: https://arxiv.org/abs/2606.04920
  category: method
  subcategory: non-agentic
  authors:
  - Ting-An Chen
  - Chin-Yuan Yeh
  - De-Nian Yang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Quantizing deep neural networks is essential for efficient inference on
    resource-constrained devices. However, most existing methods are designed for
    single-domain and class-balanced data, leaving practical settings with domain
    shifts or severe class imbalance underexplored. We address these challenges with
    Efficient Multi-Domain Alignment Quantization (EmaQ), which aligns domain distributions
    through a CDF-based projection and uses sensitivity-aware weight aggregation to
    stabilize multi-domain quantization. We further extend EmaQ to EmaQ-LT for long-tailed
    quantization by introducing class-conditioned variance scaling and confidence-based
    logit adjustment to mitigate majority-class overconfidence. Theoretical analyses
    establish convergence guarantees and motivate the proposed sensitivity and scaling
    mechanisms. Experiments on standard, multi-domain (Office-31, Digits), and long-tailed
    (SynDigits-LT, CIFAR-10-LT, CIFAR-100-LT) benchmarks show that EmaQ and EmaQ-LT
    achieve strong low-bit performance under domain shift and class imbalance.
- title: Efficient Network Inference via Hardware-Aware Architecture Search, Model
    Pruning & Quantization
  date: 2026-06
  url: https://arxiv.org/abs/2606.23210
  category: method
  subcategory: non-agentic
  authors:
  - Lucas Heublein
  - Mark Deutel
  - Axel Plinge
  - Felix Ott
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Embedded global navigation satellite system (GNSS) interference monitoring
    requires fast and memory-efficient inference to process large volumes of raw in-phase
    and quadrature (IQ) samples in real time. At the same time, increasingly expressive
    deep neural networks (DNNs) are needed for robust interference classification
    and characterization across diverse signal conditions. This creates a fundamental
    tension between predictive performance and deployability on resource-constrained
    hardware. In this paper, we investigate efficient network inference for GNSS interference
    characterization using iterative structured pruning, post-training static quantization,
    and hardware-aware zero-shot neural architecture search (NAS). Starting from MCUNet
    as a compact baseline, we analyze how model compression and automated architecture
    optimization affect model size, computational complexity, and memory usage while
    maintaining task performance. Experiments on a GNSS interference dataset, covering
    both classification and generalized characterization, show the benefits of combining
    compression and hardware-aware design for embedded deployment. Our results provide
    practical guidance for developing compact machine learning (ML) models for real-time
    GNSS interference monitoring on embedded platforms (iMXRT1062 MCU, Raspberry Pi
    Zero 2W, and Raspberry Pi 5).
- title: 'DIVE: Dynamic Iterative Visual Evidence Construction for Efficient Vision-Language
    Models'
  date: 2026-08
  url: https://arxiv.org/abs/2608.04496
  category: method
  subcategory: non-agentic
  authors:
  - Chen Zhong
  - Xiao An
  - Zijie Wang
  - Jiepan Li
  - Guangyi Yang
  venue: ''
  code_url: https://github.com/Zhong-Chenchen/DIVE.git
  project_url: ''
  abstract: Visual inputs in vision-language models (VLMs) are often encoded into
    substantially longer token sequences than text, making visual tokens a major bottleneck
    for efficient inference. Abundant recent methods address this bottleneck by scoring
    token importance and pruning low-scoring tokens in a single pass. However, one-shot
    scoring is insufficient because a token's prompt-relevant usefulness depends on
    the evidence already retained. Motivated by this insight, we introduce DIVE (Dynamic
    Iterative Visual Evidence Construction), a training-free framework that recasts
    visual-token pruning as dynamic evidence construction. DIVE repeatedly selects
    the remaining token with the highest residual-conditioned score, updates the visual
    and prompt residuals to discount the evidence already explained, and re-evaluates
    the remaining tokens. This select-update-re-evaluate process builds a retained
    set of complementary, prompt-relevant evidence. Experiments across eight image-understanding
    benchmarks show that DIVE consistently preserves performance across token budgets.
    With an 88.9% reduction in visual tokens, DIVE retains 98.2% of the uncompressed
    model's average performance. Code is available at https://github.com/Zhong-Chenchen/DIVE.git.
- title: Transformers with Physics-Informed Encodings and Simulation-Based Inference
    for Robust Detection of Eccentric Binary Black Holes in Pulsar Timing Array Data
  date: 2026-07
  url: https://arxiv.org/abs/2607.03904
  category: method
  subcategory: non-agentic
  authors:
  - Subhajit Dandapat
  - Alvin J. K. Chua
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Pulsar timing arrays (PTAs) provide a unique window into nanohertz gravitational
    waves (GWs), but extracting astrophysical parameters from noisy, long-baseline
    timing residuals remains computationally challenging with traditional Bayesian
    techniques due to the high dimensionality of the parameter space, complex and
    correlated noise models, and the cost of repeated likelihood evaluations. We introduce
    a Transformer with a physics-informed positional-encoding framework for the efficient
    inference of eccentric binary black holes in relativistic orbits from PTA data.
    Our approach embeds analytical GW phase evolution directly into the model through
    structured positional encodings, enabling the network to learn physically meaningful
    representations from raw PTA timing residuals. We then use generative models,
    including discrete and continuous conditional normalizing flows, to infer posterior
    distributions within a simulation-based inference framework. Across a range of
    signal-to-noise ratios, the proposed method achieves improved accuracy, sharper
    posteriors, and faster inference compared to physics-agnostic baselines. While
    presented for deterministic white-noise signals, the modular framework readily
    generalizes to realistic PTA analyses incorporating red noise and additional components.
    This work highlights the potential of physics-aware deep learning models as scalable
    alternatives to conventional inference pipelines for next-generation PTA datasets.
- title: Sparse Inter-Layer Dependencies of Transformer FFN Neurons
  date: 2026-07
  url: https://arxiv.org/abs/2607.11990
  category: method
  subcategory: non-agentic
  authors:
  - Johannes Knittel
  - Hanspeter Pfister
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Feedforward network (FFN) blocks account for a large fraction of the parameters
    and computation in Transformer architectures, yet their internal structure remains
    difficult to interpret due to the additive superposition induced by the residual
    stream. We examine whether the activation of an FFN neuron can be explained by
    a sparse set of preceding neuron activations and attention outputs. We introduce
    a training-free attribution method that estimates the relative influence of upstream
    neurons and attention outputs on a target neuron's activation. Empirically, across
    models and layers, we find that small subsets of preceding activations and attention
    outputs suffice to preserve neuron activations with high fidelity when all remaining
    inputs are masked with their average values. Effective sparsity is even greater
    when accounting for the inherent activation sparsity of upstream layers. Moreover,
    applying the neuron-specific masks in all layers simultaneously, such that the
    induced deviations propagate through the network, leaves model perplexity largely
    unchanged at moderate sparsity levels. These results demonstrate that, despite
    dense parameterization, FFNs exhibit sparse and structured inter-layer dependencies
    at the neuron level. Our method provides a practical, scalable tool for circuit-level
    interpretability and identifies candidate sparse pathways with potential implications
    for efficient inference.
- title: 'MXAttention: Data-Free Optimal Scaling and Pre-Normalization Quantization
    for MXFP4 Attention'
  date: 2026-07
  url: https://arxiv.org/abs/2607.24377
  category: method
  subcategory: non-agentic
  authors:
  - Jianlin Yu
  - Jing Lin
  - Linghui Kong
  - Aiyue Chen
  - Weiyi Sun
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The quadratic cost of attention is a major bottleneck in diffusion-based
    video generation models. MXFP4 attention provides a promising path toward efficient
    inference, but direct MXFP4 quantization often degrades generation quality due
    to two numerical issues: the clipping-underflow trade-off from power-of-two scaling
    and the row-wise normalization error introduced in the softmax loop. We propose
    MXAttention, a data-free post-training quantization framework for MXFP4 attention.
    MXAttention introduces two components: Universal Optimal Scaling (UOS), which
    exploits the periodic structure of power-of-two microscaling to derive a distribution-independent
    optimal scaling boundary Qmax=7.25 without calibration or search, and Pre-Normalization
    Quantization (PNQ), which quantizes unnormalized softmax exponentials before row-wise
    summation to preserve normalization by construction. Experiments on Wan2.2 and
    HunyuanVideo show that MXAttention closes at least 95% of the VBench Imaging Quality
    gap between OCP MXFP4 and FP16, substantially improves frame-level similarity,
    and preserves FP16-level generation quality with less than 0.01 absolute degradation
    on all reported VBench metrics. MXAttention also achieves performance competitive
    with strong NVFP4-based baselines with negligible overhead when fused into the
    attention pipeline. The implementation is publicly available in MindIE-SD.'
- title: FrugalSOT - Frugal Search Over the Models
  date: 2026-08
  url: https://arxiv.org/abs/2608.21621
  category: method
  subcategory: non-agentic
  authors:
  - Pradheep P
  - Yuvanesh S
  - Harish KB
  - Keerthan Saai Reddy S
  - Joshva Devadas T
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In on-device NLP tasks, limited resources of embedded hardware, such as
    the Raspberry Pi 5, require efficient inference strategies. This paper introduces
    FrugalSOT (Frugal Search Over The Models), a resource-aware model selection architecture
    for on-device NLP inference. FrugalSOT estimates each request's complexity by
    extracting features such as prompt length, named entity density, and syntactic
    complexity. The request is first made to the least complex model that is likely
    to pass a relevance threshold. If the output of that model falls short of the
    threshold, the request is made to a more complex model. It is important to note
    that the relevance threshold undergoes continuous updates in the background. using
    past validation outcomes in an adaptation process using a low-pass filtering mechanism,
    thus imparting adaptation to changing input patterns. Experimental results achieved
    on a Raspberry Pi 5 show that FrugalSOT reduces average inference time and overall
    computational resource use to a significant extent compared to a single-model
    baseline approach, without compromising output relevance to the same extent as
    the most sophisticated model. These results confirm that adaptive model selection
    can enable efficient, high-quality natural language processing inference on limited
    devices.
- title: 'From Digital to Physical Reservoir Computing: Co-Optimizing Soft Robotic
    Reservoirs via Dynamics Matching'
  date: 2026-08
  url: https://arxiv.org/abs/2608.00484
  category: method
  subcategory: non-agentic
  authors:
  - Nicola Visentin
  - Maximilian Stölzle
  - Mariano Ramírez Montero
  - Francesco Braghin
  - Daniela Rus
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Soft robotic substrates are promising for Physical Reservoir Computing
    (PRC) because their compliant nonlinear dynamics can provide temporal memory,
    high-dimensional state transformations, and efficient inference. However, physical
    reservoirs are often adopted as-is rather than pretrained or co-optimized, potentially
    limiting soft robotic PRC performance relative to digital reservoirs. We investigate
    whether a physical reservoir can instead be pretrained against high-performing
    digital reference dynamics. Our formulation jointly optimizes physical parameters,
    a diffeomorphic physical-reference state map, and feedforward-feedback control
    using a differentiable physical model and an acceleration-level equation-error
    objective that avoids temporal integration. As a proof of concept, we instantiate
    the formulation with simulated soft robots, a Random Oscillators Network (RON)
    reference, and parallel multi-start gradient descent. We evaluate the optimized
    reservoirs on classification (sMNIST and ADIAC) and forecasting (Mackey-Glass
    and Lorenz96) tasks across four reservoir dimensions. Compared with unoptimized
    soft robot reservoirs, the optimized reservoirs achieve a mean relative improvement
    of 33.7% across all tasks and datasets, while remaining close to the digital reference.
    These results demonstrate the feasibility of dynamics-level co-optimization for
    the simulated soft robotic reservoirs considered here.
- title: Sensitivity-Aware Thresholding and Token Routing for Activation Sparsification
    in Large Language Models
  date: 2026-07
  url: https://arxiv.org/abs/2607.08991
  category: method
  subcategory: non-agentic
  authors:
  - Bishmoy Paul
  - Youngmin Yi
  - Hoeseok Yang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Efficient inference in Large Language Models (LLMs) requires deciding
    where computation can be reduced while preserving model quality. We study this
    problem through multilayer perceptron (MLP) activation sparsification and token-level
    conditional routing. We first propose Sensitivity-Aware Thresholding for Sparsity
    (SATS), a threshold calibration method to choose layerwise gate thresholds using
    a local MLP output sensitivity proxy rather than calibrating thresholds directly
    from activation percentiles. While SATS retains the existing mechanism of sparsifying
    MLP activations by thresholding gate activations, it replaces percentile-based
    calibration with a sensitivity-aware selection rule. We then introduce a lightweight
    token routing framework that dynamically selects between a base path and a modified
    path on a per-token basis, rather than applying the modified computation uniformly
    to all tokens. We evaluate both methods on multiple recent open-weight LLMs. Our
    results show that SATS improves over the threshold-based sparsification baseline
    at matched actual sparsity and that token routing yields a more favorable quality-throughput
    trade-off than static activation modification baselines. Overall, our results
    suggest that improved threshold calibration and token routing can improve the
    quality-throughput trade-off in LLMs.
- title: 'CascadeLUT: Information-Ordered Streaming Inference for Bandwidth-Constrained
    FPGAs'
  date: 2026-08
  url: https://arxiv.org/abs/2608.00720
  category: method
  subcategory: non-agentic
  authors:
  - Oliver Cassidy
  - Marta Andronic
  - George A. Constantinides
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Mapping neural networks to FPGAs enables low-latency, energy-efficient
    inference, particularly for lookup table (LUT)-based models that eliminate multipliers
    and map directly to reconfigurable fabric. While prior work achieves high compute
    efficiency, it typically assumes full-sample availability, causing pipeline stalls
    in bandwidth-limited streaming scenarios. Here, the bottleneck shifts from computation
    to data movement, as large input transfers limit throughput and energy efficiency.
    We present CascadeLUT, an information-structured inference framework organized
    around bandwidth constraints. Instead of buffering the full input, features are
    partitioned into ordered subsets and predictions are progressively refined as
    subsets arrive. The cascade statically controls which layers consume incoming
    features, enabling deterministic streaming inference without runtime branching.
    By co-designing feature scheduling with hardware dataflow, CascadeLUT reduces
    data movement while maintaining accuracy. Across datasets, it achieves 4.0 to
    12.5 times lower latency, 3.0 to 5.0 times higher throughput and up to 13.8 times
    lower energy/sample than prior LUT baselines, using 1.2 to 4.4 times the LUTs
    of the smallest DWN baseline per task. We also demonstrate on-device input quantization
    integrated with LUT-based inference and present end-to-end FPGA results on real-world
    workloads, with 5 times reductions in quantization overhead.
- title: Flow Matching Meets 3D Curvilinear Structure Segmentation in Medical Imaging
  date: 2026-08
  url: https://arxiv.org/abs/2608.19965
  category: method
  subcategory: non-agentic
  authors:
  - Sidi Mohamed Sid'El Moctar
  - Nicolas Vitry
  - Hélène Bouvrais
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Segmentation of curvilinear anatomical structures in 3D medical images
    remains challenging due to complex topology, severe class imbalance, weak contrast,
    and large variations in structure morphology. While deep learning approaches for
    3D curvilinear segmentation have been proposed, they are often tailored to specific
    anatomies or modalities, limiting generalization across clinical settings and
    leaving room for improvement. Recent generative models have shown the benefits
    of iterative prediction for structured segmentation tasks, yet diffusion-based
    methods suffer from computationally expensive sampling, hindering their use on
    high-resolution 3D volumes. We present 3D-CurvSegFlow, a flow matching-based model
    for 3D curvilinear structure segmentation. The model learns a continuous transformation
    from a simple source distribution to the target vascular representation, enabling
    progressive refinement of complex curvilinear geometries with efficient inference.
    We evaluate our method on Three public challenging datasets covering distinct
    anatomies and modalities: portal vein, cerebral vessel, and coronary arteries.
    Using a common architecture and training strategy across all tasks, our method
    outperforms general-purpose and vessel-specific approaches, with strong preservation
    of thin branches and vascular continuity. This work not only advances the state-of-the-art
    in 3D curvilinear segmentation but also opens new avenues for efficient, generalizable,
    and clinically applicable methods in medical image analysis.'
- title: Efficient Analytic Uncertainty Quantification for Multi-Modal Regression
  date: 2026-06
  url: https://arxiv.org/abs/2606.25188
  category: method
  subcategory: non-agentic
  authors:
  - Kun Jin
  - James Harrison
  - Jiawei Li
  - Sihan Liu
  - Jiayi Liu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Efficient uncertainty quantification (UQ) is essential for trustworthy
    large-scale learning. Existing UQ methods for regression tasks mainly operate
    under the assumption that the conditional label marginal satisfies single-peak
    parametric models, e.g., Gaussians, where the negative log-likelihood function
    simplifies to the mean square error. However, such single-peak assumptions fail
    in regression tasks featuring multi-modal distributions. On the other hand, semi-parametric
    methods which achieve strong regression performance for multi-modal distributions
    often lack efficient quantification on their prediction variances. In this work,
    we extend UQ techniques based on Variational Bayesian Inference (VBI) to two widely
    used semi-parametric regression models that yield histogram-like reconstructions
    of the conditional label densities: Quantile Regression (QR) and Classification
    Restoration (CR). Our approach introduces a unified, distribution-agnostic framework
    that simultaneously achieves accurate estimation of complex conditional distributions
    and highly efficient UQ. Theoretically, our method is grounded in novel formulations
    of QR and CR within the VBI framework, yielding analytic Evidence Lower Bounds
    (ELBO) to streamline training and a closed-form or analytically approximated predictive
    density for efficient inference. Empirically, we evaluate our methods on three
    large-scale regression benchmarks with multi-modal label distributions. Our framework
    outperforms state-of-the-art multi-modal regression baselines, and even matches
    predictive performance of computationally expensive ensemble models. Furthermore,
    by leveraging epistemic uncertainty estimation, our approach enables highly data-efficient
    active learning strategies.'
- title: 'CookVoice: Unified Framework for Style Controllable Multi-Modal Human Voice
    Generation'
  date: 2026-08
  url: https://arxiv.org/abs/2608.11590
  category: method
  subcategory: non-agentic
  authors:
  - Haowei Lou
  - Hye-Young Paik
  - Dai Jia
  - Kai Li
  - Lina Yao
  venue: ''
  code_url: ''
  project_url: https://haoweilou.github.io/CookVoice/
  abstract: 'Human voice generation has made rapid progress in speech generation,
    singing voice generation, voice cloning, and voice editing. However, most existing
    systems are designed for specific tasks and often rely on task-dependent architectures,
    control signals, or autoregressive decoding, limiting fine-grained controllability
    and inference efficiency. In this paper, we propose CookVoice, a unified framework
    for multimodal, multi-style, and multi-task human voice generation. CookVoice
    decomposes the human voice into three key factors: content, prosody, and style,
    enabling both speech and singing voice generation within a unified model. To achieve
    precise and flexible controllability, we design a flexible alignment strategy
    that maps text, style, and prosody control signals onto the frame-level of spectrogram.
    This design allows CookVoice to support a wide range of tasks, including text-to-speech,
    text-to-singing voice, style-controllable generation, voice mimicry, voice conversion,
    and voice editing. Experimental results show that CookVoice achieves generation
    quality comparable to existing Text-to-Speech and text-to-singing voice baselines,
    while providing stronger style and prosody controllability. Moreover, CookVoice
    achieves comparable performance to large-scale baselines with only 43.51 million
    parameters and efficient inference using as few as 4 ODE steps, making it a practical
    solution for real-world human voice generation applications. Demo page is available
    at https://haoweilou.github.io/CookVoice/.'
- title: 'LRMIL: Efficient Low-Resolution Multiple Instance Learning via High-Resolution
    Knowledge Distillation for Whole Slide Image Classification'
  date: 2026-06
  url: https://arxiv.org/abs/2606.06864
  category: method
  subcategory: non-agentic
  authors:
  - Yonghan Shin
  - Won-Ki Jeong
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Multiple instance learning (MIL) has become a standard paradigm for whole
    slide image (WSI) analysis in digital pathology, as it enables slide-level prediction
    without dense annotations. Existing MIL methods typically rely on exhaustive extraction
    and encoding of high-resolution patches. However, this practice suffers from two
    critical limitations in real-world clinical settings: it struggles to capture
    global visual cues at lower magnifications, and incurs substantial computational
    overhead due to the massive number of high-resolution patches per slide. To address
    these limitations, we propose an efficient low-resolution multiple instance learning
    (LRMIL) framework that transfers high-resolution knowledge to low-resolution representations.
    LRMIL adopts a two-stage distillation strategy. First, patch-level cross-resolution
    distillation aligns low-resolution patch embeddings with high-resolution representations.
    Second, slide-level knowledge distillation trains a low-resolution student MIL
    model under both slide-level supervision and teacher guidance. At inference time,
    LRMIL operates exclusively on low-resolution patches, substantially reducing data
    preprocessing and computational cost. Extensive experiments on multiple WSI benchmarks
    demonstrate that LRMIL consistently outperforms state-of-the-art MIL methods while
    achieving more efficient inference. These results highlight LRMIL as a practical
    and scalable solution for WSI analysis in clinical pathology.'
- title: Constrained Decoding for Diffusion Language Models via Efficient Inference
    over Finite Automata
  date: 2026-07
  url: https://arxiv.org/abs/2607.07026
  category: method
  subcategory: non-agentic
  authors:
  - Meihua Dang
  - Stefano Ermon
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Constrained decoding is essential for serving LLMs, ensuring that generated
    outputs follow specific structures such as JSON schema-formatted function calls.
    Existing systems are designed for autoregressive models and assume left-to-right
    generation, masking out invalid next tokens at each step. Diffusion language models,
    however, break this assumption: they sample multiple positions simultaneously
    from a fully-factorized mean-field distribution at each denoising step. In this
    paper, we present an exact and tractable algorithm for sampling from the constrained
    mean-field posterior under any constraint expressible as a finite automaton. Viewing
    finite automata as graphical models, we obtain tractable representations of the
    constrained distribution that enable efficient inference. The approach guarantees
    constraint satisfaction by construction, supports both greedy and sampling-based
    decoding, and is compatible with parallel and block-wise decoding under arbitrary
    remasking schedules. Applying depth-reduction techniques from arithmetic circuit
    theory, we further reduce sampling depth from linear to logarithmic in the sequence
    length. Empirical evaluations on Dream-7B and LLaDA-8B show substantial accuracy
    gains across various tasks including function calling (xLAM, BFCL), planning (Sudoku,
    Countdown), text-to-SQL (Spider), and math reasoning (GSM-Symbolic), with little
    inference overhead relative to unconstrained decoding. For example, on BFCL-Live,
    our approach improves Dream-7B''s greedy decoding accuracy from 63.9% to 71.5%,
    and stochastic sampling accuracy from 22.3% to 69.0%, where the unconstrained
    baseline collapses, with under 5% wall-clock overhead.'
- title: Depth-adaptive Inference of Looped Language Models via Continuous Depth Batching
  date: 2026-08
  url: https://arxiv.org/abs/2608.09444
  category: method
  subcategory: non-agentic
  authors:
  - Kristian Schwethelm
  - Daniel Rueckert
  - Georgios Kaissis
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'A main promise of looped language models (LMs) is depth-adaptive inference.
    By iterating a block of shared layers a variable number of times, the model can
    use less compute for "easy" tokens and more for "hard" ones. However, this adaptivity
    breaks standard batching: tokens in the same batch now require a different number
    of loops, so there is no unified forward pass, making efficient inference difficult.
    Standard inference frameworks like vLLM schedule on the token level and cannot
    handle this because tokens need to be removed from the batch within the forward
    pass. Loop-level scheduling has been proposed as a solution, but never implemented
    end to end. The key challenge is that looped architectures also contain non-looped
    boundary stages (e.g., token embedding and LM head) that must be scheduled at
    different frequencies than the loop. We introduce continuous depth batching (CDB),
    which schedules at the granularity of individual loop iterations. CDB handles
    boundary stages and loop steps in separate priority queues, makes exit decisions
    one step ahead, and overlaps all scheduling work with GPU computation. On Ouro
    1.4B and Huginn 3.5B, CDB can realize up to 99% of the theoretical maximum speed-up
    from adaptive-depth, translating to 1.5-1.9× higher offline throughput and 45-90%
    lower normalized latency under dynamic serving load.'
- title: 'FLARE: Diffusion for Hybrid Language Model'
  date: 2026-06
  url: https://arxiv.org/abs/2606.01774
  category: method
  subcategory: non-agentic
  authors:
  - Yuchen Zhu
  - Jing Shi
  - Chongjian Ge
  - Hao Tan
  - Yiran Xu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Autoregressive (AR) large language models (LLMs) have achieved broad
    practical success, but sequential decoding remains a key bottleneck for low-latency
    deployment. Recent efficient-inference work has progressed along two axes: reducing
    the cost of each model invocation through efficient architectures, and reducing
    serial decoding steps through parallel generation. Hybrid attention backbones
    address the former, while diffusion language models (dLLMs) pursue the latter
    via iterative parallel denoising. Combining these advantages remains challenging:
    AR-to-dLLM conversion often fails to preserve seed-checkpoint capability, and
    hybrid-attention recurrent states and masking constraints make diffusion training
    and serving nontrivial. We present FLARE, a systematic conversion framework for
    hybrid-attention LLMs. Our analysis identifies transfer data quality as the primary
    determinant of capability preservation, outweighing loss formulation and attention-mask
    design. The resulting framework combines a token-equal AR-and-diffusion objective,
    hardware-aware kernels, and unified inference, enabling one checkpoint to support
    both AR-style verified decoding and diffusion-style parallel denoising. Starting
    from strong AR checkpoints with limited post-training data, FLARE is competitive
    with leading open-source dLLMs across model scales and delivers consistent throughput
    gains over open-source dLLM baselines in single-GPU concurrent serving. Our results
    further suggest that practical dLLMs are limited not only by decoding algorithms,
    but also by transfer data quality and the training inefficiency of current block-diffusion
    objectives, motivating joint design of data, objectives, architectures, and inference
    systems.'
- title: 'Efficient Learning of Truncated Boolean Product Distributions: Influence
    to the Rescue'
  date: 2026-07
  url: https://arxiv.org/abs/2607.22889
  category: method
  subcategory: non-agentic
  authors:
  - Rohan Chauhan
  - Ioannis Panageas
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Learning the natural parameters z in mathbb{R^n of discrete distributions
    μz from independent samples constrained to a subset S subseteq {0,1^n is a foundational
    challenge in high-dimensional statistics. Existing methods for efficiently estimating
    truncated Boolean product distributions, notably the work of [Fotakis et al' COLT'20,
    Algorithmica '22], require either strong local connectivity assumptions on S --
    a property denoted fatness -- or stringent anti-concentration assumptions and
    necessitate the total mass of the truncation set to be a constant with respect
    to n. Moreover, the results in [Fotakis et al' COLT'20, Algorithmica '22] suffer
    from sample complexities that scale as Ω(2^n) if the mass of S is exponentially
    small in n. In this work, we circumvent these limitations by analyzing the geometry
    of S under the measure μz. We refine the existing parameter estimation guarantees
    under the fatness assumption, improving the prior sample complexity to O( log
    n / ε2) for ellinfty-recovery, matching the untruncated minimax rate. We further
    generalize fatness using the notion of influence utilized in the analysis of Boolean
    functions and provide sufficient conditions for efficient inference. Notably,
    unlike previous work, our method does not require sampling at arbitrary parameterizations
    of the model. Lastly, we establish a theoretical lower bound demonstrating the
    sample complexity exhibits an intrinsic exponential dependence on the width of
    the model and the minimum distance between elements in the set.
- title: Self-Gating Attention for Efficient Time Series Forecasting
  date: 2026-07
  url: https://arxiv.org/abs/2607.02344
  category: method
  subcategory: non-agentic
  authors:
  - Dezheng Wang
  - Tong Chen
  - Wei Yuan
  - Congyan Chen
  - Shihua Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Transformer architectures have shown strong potential in time series forecasting,
    where multi-head self-attention is widely used to capture temporal dependencies
    across historical timestamps. However, standard self-attention has quadratic time
    and memory complexity with respect to the look-back length. This cost may limit
    its use in resource-constrained or high-throughput forecasting systems, where
    fast and memory-efficient inference is important. Through qualitative and quantitative
    analyses, we observe that self-attention maps in time series forecasting often
    contain redundant patterns across different timestamps. This phenomenon can be
    related to the repeated temporal patterns and relatively stable temporal correlations
    in many real-world time series. Motivated by this observation, we propose Self-Gating
    Attention (SGA), a plug-and-play attention mechanism that represents the attention
    score with a shared learnable matrix and an input-dependent residual component.
    The shared matrix captures common attention patterns, while the residual component
    captures input-dependent variations. In this way, SGA avoids the query and key
    projections used in standard attention score computation, leading to linear time
    and score-matrix memory complexity with respect to the look-back length. We integrate
    SGA into several forecasting backbones and compare it with standard self-attention
    and lightweight attention variants on nine publicly available real-world datasets
    covering electricity, finance, weather, medical monitoring, human activity, and
    climate records. The results show that SGA improves inference efficiency on public
    benchmarks while maintaining competitive forecasting performance against state-of-the-art
    attention mechanisms. These benchmark results provide deployment-oriented evidence.
- title: 'Driving up Inference Energy on SNNs: Per-Sample and Universal Sponge Attacks'
  date: 2026-07
  url: https://arxiv.org/abs/2607.27990
  category: method
  subcategory: non-agentic
  authors:
  - Spyridon Raptis
  - Haralampos-G. Stratigopoulos
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Spiking Neural Networks (SNNs) communicate through sparse binary spike
    events rather than dense activations, enabling energy-efficient inference on neuromorphic
    hardware and motivating their use in always-on, battery-powered edge systems.
    We show that this same efficiency advantage creates a distinct security risk:
    sponge attacks can increase inference-time spike activity and synaptic workload,
    inflating energy consumption while remaining difficult to detect through correctness-based
    monitoring alone. Prior input-space efficiency attacks on SNNs have focused on
    per-sample optimization, primarily in rate-coded settings. We extend this threat
    to native event-based binary inputs and study two attack models. First, we develop
    a per-sample sponge attack that crafts a custom adversarial spike train for each
    input via gradient-based optimization. This attack increases per-inference SynOps
    by 1.5-2.6x on three SNN models for the NMNIST, SHD, and IBM DVS Gesture datasets,
    while preserving the predicted class on at least 98% of evaluated samples. Second,
    to the best of our knowledge, we introduce the first universal sponge attack for
    native event-based SNN inputs: a fixed binary perturbation computed offline and
    applied via XOR to all subsequent inputs. Although weaker, it still inflates SynOps
    by 1.09-1.24x across all three datasets and represents a more realistic deployment
    threat because it requires no per-input optimization. Mapping SynOp inflation
    to estimated Loihi-1 energy yields per-inference overheads from 14 μJ to 13.24
    mJ. These results show that native event-based SNNs are vulnerable to practical
    input-space efficiency attacks, and that reusable universal perturbations can
    accumulate into meaningful battery drain in continuously deployed edge systems.'
- title: 'Streaming Knowledge Compilation: Proactive Materiality-Scored Pinning for
    Time-Evolving LLM Wikis'
  date: 2026-06
  url: https://arxiv.org/abs/2606.09877
  category: method
  subcategory: non-agentic
  authors:
  - Juan M. Huerta
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'LLM wiki systems compile knowledge into pre-filled KV caches for efficient
    inference, but assume a static corpus -- an assumption that fails whenever the
    underlying information landscape evolves. We formalize Streaming Knowledge Compilation:
    given a document stream, a fixed token budget, and future queries unknown at ingestion
    time, maintain a compiled wiki that minimizes cumulative regret against an offline
    oracle with perfect foresight. The enabling insight is a materiality signal φt(k,n)in[0,1]
    that scores document importance for entity k at time t, acting as a query-relevance
    surrogate for proactive pinning before queries arrive; we prove an O(sqrt{Tlog
    K) regret bound where varepsilon=mathbb{E[|φt-hatφt|] is the only domain-specific
    quantity. We instantiate in two domains: finance, where φt is abnormal stock volatility
    predicted by frozen Llama 3.1 8B classification head (AUROC = 0.728 on 76K articles,
    strict temporal split; 1.49× higher realized forward volatility for predicted-material
    articles); and Wikipedia, where φt is the Abnormal Edit Ratio (AER), a cross-sectionally
    normalized edit velocity -- showing the same algorithm generalizes beyond the
    finance domain. End-to-end QA evaluation on 173 matched pairs (finance) and 119
    (Wikipedia) reveals a pervasive LLM-as-judge confound on post-training knowledge,
    establishing that regret analysis -- not absolute QA scores -- is the reliable
    evaluation metric for compiled knowledge systems. Finance cumulative regret converges
    to -20.0 (-0.12/step); Wikipedia to +16.0 (+0.13/step), with the positive sign
    confirming that Wikipedia edit content is genuinely post-training -- richer context
    consistently improves scores (No Wiki 3.80 vs. Oracle 4.74) -- and eliminates
    this confound. The O(sqrt{Tlog K) guarantee applies to any domain where knowledge
    gaps can be predicted from streaming signals.'
- title: 'Distill on a Diet: Efficient Knowledge Distillation via Learnable Data Pruning'
  date: 2026-06
  url: https://arxiv.org/abs/2606.25488
  category: method
  subcategory: non-agentic
  authors:
  - Yifan Wu
  - Yiqi Wang
  - Xichen Ye
  - Wenjing Yan
  - Xiaoqiang Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Knowledge Distillation (KD) is widely used to obtain compact models for
    efficient inference in resource-constrained environments. Yet the computational
    overhead of the distillation process itself is often overlooked, raising the question
    of whether a better student model can be obtained with less data and less compute
    via data pruning. However, existing data pruning methods are not designed for
    KD: some introduce substantial overhead, such as obtaining training dynamics through
    retraining, while others rely on heuristic selection rules that fail to capture
    what KD actually requires, often resulting in suboptimal subsets. To address these
    issues, we propose IF-Beta, an efficient data pruning framework that combines
    influence functions with a learnable sampling policy. Empirically, we first demonstrate
    that influence functions can serve as an effective and efficient estimator of
    sample impact in KD settings, where only a pretrained teacher is available. Building
    on this, our sampling policy is specifically parameterized by a Beta distribution,
    whose highly flexible two-parameter family allows the policy to adapt to diverse
    pruning regimes rather than being tied to fixed heuristic forms. Next, we formulate
    KD pruning as optimizing this policy through a bilevel objective, where the inner
    loop operates in the teacher feature space with a KD-aligned objective, enabling
    fast proxy training, while the outer loop updates the policy parameters to maximize
    distillation performance. This design ensures that IF-Beta is both computationally
    efficient and inherently aligned with the goals of KD. Extensive experiments on
    CIFAR-10/100 and ImageNet show that IF-Beta consistently outperforms other baselines
    across a wide range of pruning ratios. Remarkably, IF-Beta enables students trained
    on less data and less compute to surpass the performance of students distilled
    on the full dataset.'
- title: 'LongNovel: A Multi-Scale Benchmark for Hallucination Detection in Long-Context
    Novel Summarization'
  date: 2026-06
  url: https://arxiv.org/abs/2608.18082
  category: evaluation
  subcategory: non-agentic
  authors:
  - Ruizhi Zhang
  - Jinwei Chen
  - Xiangju Lu
  - He Yan
  - Mo Yu
  venue: ''
  code_url: https://github.com/BDML-lab/LongNovel
  project_url: ''
  abstract: Although context windows have expanded significantly in recent years,
    hallucinations in long-context summarization remain a challenge. Long novels are
    better suited than news or papers for researching these hallucinations, due to
    their intrinsic information and detailed descriptions of events and dialogues.
    However, current research lacks a multi-scale benchmark for hallucination detection
    in long-context novel summarization and does not fully explore how hallucinations
    change as the context grows longer. In this study, we propose LongNovel, a multi-scale
    long-context bilingual (Chinese and English) novel benchmark for hallucination
    detection. This benchmark is constructed from 29 Chinese novels (ranging from
    16k to 100k tokens) and chapter-level data from the BookSum dataset. We design
    8 hallucination types and employ a combination of Multi-Model Arbitration and
    Entity-Referenced Hallucination Generation to ensure both data authenticity and
    a balanced distribution of hallucination categories. Furthermore, we manually
    revise the content in the test set to guarantee data reliability. Extensive experimental
    results demonstrate that LongNovel is a challenging benchmark. We release LongNovel
    for future research. https://github.com/BDML-lab/LongNovel
- title: 'moBERTo: A Modern Encoder for Portuguese via Continued Pretraining of ModernBERT'
  date: 2026-06
  url: https://arxiv.org/abs/2606.22722
  category: evaluation
  subcategory: non-agentic
  authors:
  - Thiago Laitz
  - Thales Sales Almeida
  - João Guilherme Alves Santos
  - Giovana Kerche Bonás
  venue: ''
  code_url: ''
  project_url: https://huggingface.co/Tropic-AI/moBERTo
  abstract: Encoder-only transformer models remain essential for production NLP pipelines.
    We introduce moBERTo, a Portuguese adaptation of ModernBERT obtained through continued
    pretraining of the ModernBERT-base checkpoint on 60 billion tokens (5 epochs over
    a 12-billion-token corpus curated from FineWeb2 and filtered with educational
    and STEM classifiers). We preserve the original architecture, including rotary
    positional embeddings, alternating local-global attention, flash attention, and
    unpadding. We evaluate moBERTo across information retrieval (including long-context
    retrieval at up to 8,192 tokens), document classification, named entity recognition,
    and natural language understanding. Our best variant, which combines a Portuguese
    tokenizer with subword-matching embedding transfer and long-context post-training,
    achieves the highest average reranking nDCG@10 across three Portuguese retrieval
    benchmarks and the best results on PLUE-PT. Through ablation studies, we show
    that (i) continued pretraining is strongly preferable to training from scratch,
    particularly for preserving long-context capabilities; (ii) tokenizer adaptation
    improves token-level tasks but degrades long-context retrieval; (iii) a dedicated
    long-context post-training phase at 8,192 tokens further improves reranking and
    NER; and (iv) encoder-only architectures remain competitive with larger decoder-only
    alternatives for discriminative tasks. We publicly release the model weights at
    https://huggingface.co/Tropic-AI/moBERTo and training data at https://huggingface.co/datasets/Tropic-AI/moberto-pretraining-dataset-c4-compatible
    on Hugging Face.
- title: Self-Guided Test-Time Training for Long-Context LLMs
  date: 2026-07
  url: https://arxiv.org/abs/2607.09415
  category: evaluation
  subcategory: non-agentic
  authors:
  - Xinyu Zhu
  - Zhe Xu
  - Xiaohan Wei
  - Yunchen Pu
  - Fei Tian
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-context processing has become increasingly important for large language
    models (LLMs), but simply extending the context window does not guarantee effective
    utilization of long inputs. As input length grows, accuracy often degrades, indicating
    that models still struggle to identify and use the evidence most relevant to a
    question. A promising way to improve long-context utilization is test-time training
    (TTT), which treats the test context as a training example for instance-specific
    parameter adaptation. However, applying TTT to the entire long context is prohibitively
    expensive, while adapting on randomly sampled spans introduces severe noise. Because
    most spans in a long context are irrelevant to the specific question, training
    on them may even degrade the base model''s performance. Our preliminary study
    shows that TTT is highly sensitive to training-span quality: on LongBench-v2,
    TTT on randomly sampled spans hurts performance, whereas TTT on oracle spans substantially
    improves it. Motivated by this, we propose a simple method, Self-Guided TTT (S-TTT):
    before adaptation, the model identifies the evidence spans it should learn from,
    and the standard language-modeling training objective is applied only to those
    selected spans. On two challenging long-context reasoning benchmarks, LongBench-v2
    and LongBench-Pro, S-TTT improves accuracy for both Qwen3-4B-Thinking-2507 and
    Llama-3.1-8B-Instruct, achieving up to a 15% relative improvement.'
- title: Morphing into Hybrid Attention Models
  date: 2026-06
  url: https://arxiv.org/abs/2606.30562
  category: evaluation
  subcategory: non-agentic
  authors:
  - Disen Lan
  - Jianbin Zheng
  - Yuxi Ren
  - Xin Xia
  - Xuanda Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Hybrid attention models improve long-context efficiency by retaining only
    a subset of full-attention layers and replacing the remaining layers with linear
    attention. However, the effectiveness of Transformer-to-hybrid conversion critically
    depends on which layers preserve full attention. Existing hybrid layer selection
    methods typically rely on heuristic strategies such as fixed placement patterns
    or layerwise scoring, implicitly treating layer importance as isolated and overlooking
    the interdependent layer effect under a global hybrid configuration. In this work,
    we formulate hybrid layer selection as a budget-constrained subset optimization
    problem. We further propose FlashMorph (Fast LAyer Selection for Hybrid MORPHing),
    an effective, efficient and scalable layer selection method for Transformer-to-hybrid
    conversion. FlashMorph first constructs a morphable model by equipping each full-attention
    layer with a converted linear-attention branch. It then freezes all model weights
    and jointly optimizes layerwise gates on synthetic long-context retrieval data,
    with a linearization regularization that encourages the model to rely on linear
    attention for efficiency. The learned gates are discretized under a preset full-attention
    budget to instantiate the hybrid architecture, followed by standard logits distillation
    and long-context finetuning. Extensive experiments show that FlashMorph discovers
    more effective hybrid configurations, preserves strong long-context recall and
    general benchmark performance while substantially reducing layer selection cost
    compared with existing layer selection methods, demonstrating its effectiveness,
    efficiency, and scalability.
- title: 'INS-ActBench: A Comprehensive Benchmark for Assessing Professional Actuarial
    Capability of Large Language Models'
  date: 2026-07
  url: https://arxiv.org/abs/2607.24273
  category: evaluation
  subcategory: non-agentic
  authors:
  - Changyu Chen
  - Chenwei Lin
  - Xian Xu
  venue: ''
  code_url: https://github.com/FDU-INS/INS-ActBench
  project_url: ''
  abstract: 'Large Language Models (LLMs) have shown strong potential in financial
    reasoning, but existing benchmarks often evaluate domain knowledge, numerical
    reasoning, long-context understanding, and tool use in separate settings. This
    limits their ability to assess realistic professional workflows that require auditable,
    context-grounded, and tool-executable decisions. We introduce textbf{INS-ActBench,
    a comprehensive benchmark for evaluating professional actuarial capability in
    LLMs. INS-ActBench contains 12,050 Q&A pairs from public exams and sample questions
    released by 16 actuarial associations. It covers three subsets: textbf{INS-Act-Know
    for standardized actuarial knowledge, textbf{INS-Act-Case for long-context insurance
    case reasoning, and textbf{INS-Act-Practice for spreadsheet and R-code tasks with
    verifiable numerical outputs. Experiments on nine representative LLMs and human
    actuarial experts reveal a clear capability boundary: frontier LLMs perform strongly
    on standardized knowledge, but remain much weaker in case reasoning, tool-based
    workflows, and jurisdiction-sensitive practice. INS-ActBench provides a reproducible
    foundation for developing actuarial LLMs toward reliable professional assistance.
    The code is available at https://github.com/FDU-INS/INS-ActBench.'
- title: 'Beyond Reward Engineering: A Data Recipe for Long-Context Reinforcement
    Learning'
  date: 2026-06
  url: https://arxiv.org/abs/2606.18831
  category: evaluation
  subcategory: non-agentic
  authors:
  - Xiaoyue Xu
  - Sikui Zhang
  - Xiaorong Wang
  - Xu Han
  - Chaojun Xiao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Long-context reasoning is an essential capability for large language models,
    particularly when they are deployed as autonomous agents that must reason over
    lengthy trajectories. Reinforcement learning (RL) has recently emerged as a dominant
    paradigm for improving this ability, yet existing work largely focuses on reward
    engineering while diverse training data remains scarce. We revisit this problem
    from a data-centric perspective and show that a simple yet effective data recipe
    alone, paired with a minimal outcome-based GRPO setup, suffices to substantially
    improve long-context reasoning. Our recipe targets three complementary task families
    -- retrieval, multi-evidence synthesis, and reasoning -- for which we construct
    and curate eight datasets totaling ~14K examples. Experiments on three models
    (Qwen3-4B/8B/30B-A3B) yield average gains of +7.2/+3.2/+6.4 points across seven
    long-context benchmarks, surpassing prior RL training sets. We further demonstrate
    that these gains transfer to agentic tasks, where continuing RL training on an
    agent-tuned model with our data recipe improves GAIA by +4.8 and BrowseComp by
    +7.0 points. We will release our datasets to facilitate future research.
- title: Gemma 4 Technical Report
  date: 2026-07
  url: https://arxiv.org/abs/2607.02770
  category: evaluation
  subcategory: non-agentic
  authors:
  - Gemma Team
  - Sherif El Abd
  - Vaibhav Aggarwal
  - Robin Algayres
  - Alek Andreev
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We introduce Gemma 4, a new generation of open-weight, natively multimodal
    language models in the Gemma model family. Designed to advance compute efficiency
    and reasoning, the Gemma 4 model suite features dense and Mixture-of-Experts architectures,
    ranging from 2.3B to 31B parameters. Alongside improved vision and audio encoders
    for all model sizes, we propose a unified, encoder-free architecture for our 12B
    model, which ingests raw audio and image patches. Furthermore, we integrate a
    thinking mode, enabling Gemma models to generate reasoning traces prior to responding.
    We improve inference speed, memory, and compute efficiency, as well as long-context
    abilities through critical design choices. Gemma 4 establishes a leap in performance
    across STEM, multimodal, and long-context benchmarks, and rivals larger, frontier
    open models in human-rated tasks.
- title: 'The Token Tax of Epistemic Accuracy: Comparing RAG and Long-Context Architectures
    for Document-Grounded Generative AI Applications'
  date: 2026-06
  url: https://arxiv.org/abs/2606.20898
  category: evaluation
  subcategory: non-agentic
  authors:
  - Austin Hamilton
  - Ryan Singh
  - Michael Wise
  - Ibrahim Yousif
  - Arthur Carvalho
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Document-grounded assistants built on large language models are increasingly
    used in high-stakes, knowledge-intensive work. Their usefulness, however, may
    depend on how evidence is allocated before generation. We investigate such a claim
    by comparing two grounding architectures: (a) retrieval-augmented generation (RAG)
    that retrieves a few relevant passages, and (b) long-context prompting, which
    loads the whole document collection in context. We view these as two regimes of
    "epistemic access" on an accuracy--cost frontier. We use "epistemic accuracy"
    to capture model correctness that depends on having the right evidence. We posit
    that broader access (via long context) can increase it, but with a "token tax"
    (i.e., a substantial increase in cost due to larger input token consumption).
    We probe this framing with a case study in manufacturing safety training. Using
    an expert-validated benchmark, we evaluate 972 answers across three machines,
    two small language models, and three retrieval/in-context prompting approaches.
    Long-context prompting achieved the highest correctness (73.1% vs. 65.4% for semantic
    RAG), but at 26 times the per-query token cost. We interpret this gap as the token
    tax of broader evidentiary access. We carefully discuss the implications of our
    findings for resource-constrained organizations.'
- title: 'Storyline Trees: Hierarchical Representations for Long-Form Narratives'
  date: 2026-06
  url: https://arxiv.org/abs/2606.20900
  category: evaluation
  subcategory: non-agentic
  authors:
  - Litu Ou
  - Mirella Lapata
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-form narratives are challenging for long-context models because
    their structure is implicit: events, characters, and plotlines interact across
    hundreds of pages without the explicit cues that guide navigation in structured
    documents. We address this by constructing storyline trees, hierarchical representations
    that organize narratives from global themes and major plotlines to fine-grained
    events. We first segment chapters into contiguous narrative segments, or scenes,
    and use them as the basic units for tree construction. We then infer storyline
    trees through complementary top-down and bottom-up procedures that derive, refine,
    cluster, and summarize storylines at multiple levels of abstraction. We showcase
    the utility of this representation for question answering: storyline trees enable
    adaptive retrieval, allowing models to iteratively inspect high-level narrative
    structure and retrieve scene-level evidence on demand. Experiments on three long-context
    narrative QA benchmarks show that adaptive retrieval outperforms strong baselines,
    including post-trained long-context models and agentic chunk-based methods. Ablations
    confirm that scenes are more effective basic units than chapters or generic segmentation,
    and that gains persist under matched retrieval budgets'
- title: 'Customer-Agent: Overcoming Context Limitations in Ultra-Long Shopping Trajectories
    via Tool-Augmented Agents and RLVR'
  date: 2026-06
  url: https://arxiv.org/abs/2606.07995
  category: evaluation
  subcategory: non-agentic
  authors:
  - Hongye Liu
  - Rongmei Lin
  - Anurag Kashyap
  - Hejie Cui
  - Ricardo Henao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Understanding customer shopping trajectories is essential for enabling
    personalized shopping experiences. However, shopping records (i.e., customer's
    search, clicks, purchases, etc.) often span long time horizons over multiple years,
    resulting in extremely long trajectories that pose significant challenges for
    existing large language models (LLMs). Despite the importance of this problem,
    existing benchmarks are limited to short customer trajectories, while real-world
    trajectories from large e-commerce platforms are rarely accessible due to data
    privacy constraints. To address this gap, we introduce ShopTrajQA, a long-context
    evaluation benchmark constructed from real-world product information and simulated
    shopping trajectories. The dataset includes variants of up to 32k and 64k tokens,
    enabling systematic evaluation of model robustness under varying context lengths.
    Through comprehensive benchmarking of frontier LLMs, we identify critical performance
    gaps in reasoning over long shopping trajectory data. To address these challenges,
    we propose a Customer Agent Framework for ultra-long context management. Leveraging
    a Reinforcement Learning with Verifiable Rewards (RLVR) agentic training paradigm,
    our approach stores trajectories as external local files and trains the agent
    to autonomously retrieve and parse them through code-interpreter interactions
    (e.g., SQL queries), effectively bypassing the fixed in-context window constraints
    of LLMs. Experimental results demonstrate that our framework achieves strong performance
    for ShopTrajQA and shows generalization to other complex reasoning tasks.
- title: 'MemOps: Benchmarking Lifecycle Memory Operations in Long-Horizon Conversations'
  date: 2026-07
  url: https://arxiv.org/abs/2607.12893
  category: evaluation
  subcategory: non-agentic
  authors:
  - Xixuan Hao
  - Zeyu Zhang
  - Zehao Lin
  - Yihang Sun
  - Ziliang Guo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Long-term memory has become a foundational capability for LLM-based agents
    that accompany users across extended, multi-session interactions. Existing benchmarks,
    however, evaluate such memory almost exclusively through downstream question answering,
    scoring only the correctness of a final answer. This black-box formulation conflates
    the heterogeneous causes of memory failure, such as missing the introduction of
    a relevant fact, binding an operation to the wrong target, or relying on stale
    values after a correction. As a result, it can credit correct answers despite
    their reliance on inconsistent or unsafe memory states. In this paper, we argue
    that, in dynamic long-horizon interactions, memory is not a static collection
    of facts but a lifecycle of explicit operations, including remembering, forgetting,
    updating, reflecting, and their compositions. We introduce MemOps, a benchmark
    that reformulates conversational memory as a sequence of lifecycle operations
    and represents each memory event with a structured trace specifying its trigger,
    target, scope, state transition, and supporting evidence. A controllable generation
    pipeline embeds these operations into long, task-oriented conversations and produces
    gold operation traces together with six categories of operation-level probes,
    evaluated under both adjacent-evidence and long-context settings. Across long-context,
    retrieval-based, parametric and managed-memory systems, MemOps disentangles failure
    modes that final-answer accuracy alone conceals, revealing that current systems
    remain far from uniformly reliable. For instance, session-level retrieval outperforms
    turn-level retrieval, and long-context models remain notably weak at reconstructing
    ordered memory-state trajectories. These results move long-term memory evaluation
    from final-answer scoring toward interpretable, operation-level diagnosis.
- title: 'Attention Expansion: Enhancing Keyphrase Extraction from Long Documents
    with Attention-Augmented Contextualized Embeddings'
  date: 2026-06
  url: https://arxiv.org/abs/2606.10716
  category: evaluation
  subcategory: non-agentic
  authors:
  - Roberto Martínez-Cruz
  - Alvaro J. López-López
  - José Portela
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Pre-trained language models (PLMs) have achieved strong performance in
    keyphrase extraction (KPE), largely due to their ability to generate rich contextualized
    representations. However, long-document KPE remains challenging because salient
    keyphrase evidence may be scattered across distant document sections that cannot
    be jointly captured within the limited context window of most PLMs. Although long-context
    large language models (LLMs) can process broader textual contexts, their computational
    cost limits their practicality for efficient and high-throughput KPE. To overcome
    this limitation, we propose an attention expansion mechanism that augments PLM
    token representations with information from surrounding out-of-context chunks
    using pre-trained word embeddings. The proposed mechanism expands the effective
    contextual scope of PLM-based KPE models without requiring full-document attention
    or expensive LLM-based inference. We evaluate our approach across five PLM backbones,
    including general-purpose, scientific, task-specific, and long-context encoders,
    using two training regimes and five benchmark corpora from scientific and news
    domains. Experimental results demonstrate that attention expansion consistently
    enhances KPE performance across all evaluation settings, outperforming state-of-the-art
    models and yielding notable improvements in F1 score. The improvements extend
    to domain-specific, task-specialized, and native long-context models, showing
    that the proposed mechanism provides complementary information rather than merely
    compensating for limited input length. These results establish attention expansion
    as an efficient and effective strategy for long-document KPE.
- title: 'RUMBA: Russian User Memory Benchmark'
  date: 2026-07
  url: https://arxiv.org/abs/2607.21447
  category: evaluation
  subcategory: non-agentic
  authors:
  - Elizaveta Shevtsova
  - Inna Glebkina
  - Mark Baushenko
  - Pavel Gulyaev
  - Alena Fenogenova
  venue: ''
  code_url: ''
  project_url: ''
  abstract: The ability to handle long-term memory in LLMs is becoming increasingly
    critical, yet existing benchmarks remain English-centric and rely on aggregate
    retrieval metrics, failing to capture interactions between long-range context,
    temporal information, and reasoning. To address this, we introduce RUMBA (Russian
    User Memory BenchmArk) - a new benchmark for long-term conversational memory that
    provides a fine-grained taxonomy of memory-centric question types and a unified
    methodology accounting for semantic type, session scope, temporal reasoning, and
    the explicitness of temporal expressions. RUMBA consists of timestamped user-assistant
    dialogues with QA pairs requiring retrieval, combination, and reasoning across
    sessions. While designed for Russian, we also provide an aligned English subset
    under the same methodology. We evaluate contemporary memory systems and long-context
    models, and show how RUMBA serves as a diagnostic tool to analyze model behavior
    across benchmark slices and identify strengths and failure modes of different
    memory mechanisms.
- title: 'QO-Bench: Diagnosing Query-Operator-Preserving Retrieval over Typed Event
    Tuples'
  date: 2026-06
  url: https://arxiv.org/abs/2606.04646
  category: evaluation
  subcategory: non-agentic
  authors:
  - Mengao Zhang
  - Xiang Yang
  - Chang Liu
  - Tianhui Tan
  - Ke-wei Huang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Many real-world questions over business, legal, and scientific corpora
    are natural-language versions of database-style queries over records latent in
    text. Existing retrieval-augmented generation (RAG) systems are optimized primarily
    for semantic relevance, but retrieving plausible passages does not guarantee correct
    query execution. We introduce QO-Bench, a diagnostic benchmark for query-operator
    question answering over typed event tuples. The benchmark covers 22,984 news articles
    and 614 corporate events across 18 query templates, evaluated on 785 questions.
    Each gold answer is deterministically computed from typed event tuples and scored
    by recall, with answers matched to the gold tuples by exact match rather than
    an LLM judge. This design enables operator-level diagnosis such as joins and intersection.
    We evaluate RAG, ReAct RAG, GraphRAG, and information-extraction-to-SQL under
    matched conditions, with a long-context oracle ceiling to isolate retrieval failure.
    A two-axis framework -- index-time preservation versus query-time execution --
    predicts where each paradigm fails, and the results bear it out: systems retrieve
    relevant text but discard the typed values operators need, and the deployable
    paradigm ranking inverts across operators, with similarity retrieval leading on
    filter/project and extraction-to-SQL on intersection and counting. Even given
    the gold evidence, a long-context oracle stays far from saturated, so operator
    execution -- not retrieval alone -- is a core bottleneck that a stronger answer
    model does not remove. QO-Bench reframes the goal from passage relevance to query-operator-preserving
    retrieval.'
- title: 'Beyond Teacher Likelihood: Group-Calibrated On-Policy Distillation for Long-Context
    Reasoning'
  date: 2026-08
  url: https://arxiv.org/abs/2608.19181
  category: evaluation
  subcategory: non-agentic
  authors:
  - Zhu Zhang
  - Jixun Wang
  - Xiaoang Xu
  - Xiaorong Wang
  - Zihan Zhou
  venue: ''
  code_url: https://github.com/SolereZhang/GC-OPD
  project_url: ''
  abstract: On-policy distillation (OPD) trains a student on its own responses using
    dense token-level guidance from a stronger teacher. In long-context tasks, however,
    token-level teacher support can favor locally plausible responses that omit evidence
    distributed across the input or violate global task constraints. Task-specific
    verifiers, in contrast, evaluate task completion at the response level and may
    return graded rewards that reflect partial success. We diagnose this mismatch
    on fixed responses from two representative long-context evidence-aggregation tasks.
    Across longer input ranges, trajectory-level OPD scores become progressively less
    aligned with verifier rewards, indicating teacher-verifier disagreement. Motivated
    by this observation, we introduce Group-Calibrated On-Policy Distillation (GC-OPD).
    GC-OPD separately normalizes verifier rewards and trajectory-level OPD scores
    within each rollout group and uses their difference as a signed teacher-verifier
    disagreement residual. Relative-advantage-based credit assignment (RACA) distributes
    this trajectory-level residual across tokens according to their relative OPD advantages
    while preserving the original OPD signal. Across five long-context benchmarks,
    post-training with GC-OPD raises the five-benchmark averages of the official Qwen3-4B
    and Qwen3-8B checkpoints from 29.08 to 40.47 and from 35.12 to 44.65, respectively.
    Vanilla OPD reaches 39.31 and 43.56 under the same setup. Controlled ablations
    show that the signed residual is more effective than either an additional OPD-derived
    term or direct group-normalized verifier reward addition, while RACA further improves
    over uniform token allocation. Together, these results demonstrate that group-relative
    residual calibration can incorporate verifier outcomes without discarding dense
    token-level guidance. Code is available at https://github.com/SolereZhang/GC-OPD.
- title: 'Beyond Multilingual Averages: MTEB-PT, a Benchmark for Portuguese Sentence
    Encoders'
  date: 2026-07
  url: https://arxiv.org/abs/2607.04071
  category: evaluation
  subcategory: non-agentic
  authors:
  - Lucas Hideki Takeuchi Okamura
  - Alexandre Alcoforado
  - Anna Helena Reali Costa
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Portuguese remains underrepresented in text embedding evaluation, despite
    being one of the most widely spoken languages in the world. As a result, embedding
    models are often selected based on English or multilingual metrics, while their
    effectiveness in Portuguese remains unclear. We present MTEB-PT, a Portuguese
    benchmark constructed from a subset of MMTEB, comprising 14 existing datasets
    across Semantic Textual Similarity (STS), classification, retrieval, and reranking.
    We use this benchmark to evaluate 17 open- and closed-source embedding models
    under a unified protocol. Our results show that Portuguese performance is strongly
    task-dependent: multilingual rankings do not reliably predict Portuguese-specific
    performance across task families, no single model dominates all settings, and
    models with stronger long-context capacity are particularly advantageous on longer-input
    tasks such as retrieval and reranking. The benchmark also shows that language-specific
    fine-tuning still improves model performance in Portuguese, especially on task
    types that match the adaptation data most closely. To examine this effect, we
    fine-tune three representative backbone models with Portuguese contrastive supervision
    and Matryoshka Representation Learning (MRL). These benchmark-informed baselines
    yield their strongest gains on STS, consistent with the predominantly symmetric
    supervision used during training, while also improving retrieval and remaining
    competitive under dimensional truncation. We release the MTEB-PT benchmark, the
    fine-tuned models, and the training and evaluation code.'
- title: Randomized YaRN Improves Length Generalization for Long-Context Reasoning
  date: 2026-06
  url: https://arxiv.org/abs/2606.23687
  category: evaluation
  subcategory: non-agentic
  authors:
  - Manas Mehta
  - Fangcong Yin
  - Greg Durrett
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large language models (LLMs) are typically pretrained on short sequences
    and then extended to work on longer sequences with additional training. However,
    such LLMs still struggle to further generalize to very long sequences. We propose
    Randomized YaRN, a training method that improves length generalization by combining
    YaRN-based positional extrapolation with randomized positional encoding and a
    length curriculum. During training on short context data, tokens are assigned
    YaRN positional encodings sampled from a larger position range, exposing the model
    to out-of-distribution positional representations even on short-context inputs.
    We evaluate Randomized YaRN on two challenging long-context reasoning benchmarks,
    BABILong and Multi-Round Coreference Resolution (MRCR). When training on data
    with <8K context, Randomized YaRN consistently improves reasoning performance
    on context lengths from 16K to 128K and outperforms standard fine-tuning, with
    the largest gains appearing at far out-of-distribution lengths. Our results suggest
    that progressively exposing models to OOD positional distributions provides an
    effective recipe for generalizable long-context reasoning.
- title: Mitigating Position Bias in Transformers via Layer-Specific Positional Embedding
    Scaling
  date: 2026-06
  url: https://arxiv.org/abs/2606.27705
  category: evaluation
  subcategory: non-agentic
  authors:
  - Changze Lv
  - Zhenghua Wang
  - Yiran Ding
  - Yixin Wu
  - Tianlong Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large Language Models (LLMs) still struggle with the ``lost-in-the-middle''
    problem, where critical information located in the middle of long-context inputs
    is often underrepresented or lost. While existing methods attempt to address this
    by combining multi-scale rotary position embeddings (RoPE), they typically suffer
    from high latency or rely on suboptimal hand-crafted scaling strategies. To overcome
    these limitations, we introduce a layer-specific positional embedding scaling~(LPES)
    method that assigns distinct scaling factors to each layer. LPES achieves a more
    balanced attention distribution without fine-tuning model parameters or increasing
    inference delay. A specially designed genetic algorithm is employed to efficiently
    select the optimal scaling factors for each layer by incorporating Bézier curves
    to significantly reduce the search space. Extensive experiments demonstrate that
    LPES effectively mitigates positional attention bias and delivers consistent improvements
    across multiple long-context benchmarks, yielding up to an 11.2% accuracy gain
    on the key-value retrieval dataset.
- title: 'ATLAS: All-round Testing of Long-context Abilities across Scales'
  date: 2026-05
  url: https://arxiv.org/abs/2605.28079
  category: evaluation
  subcategory: non-agentic
  authors:
  - Deli Huang
  - Cunguang Wang
  - Hongyin Tang
  - Zhe Tang
  - Linsen Guo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-context language models now advertise context windows up to millions
    of tokens, yet evaluations typically report a single length or a narrow task family,
    masking two failure modes: performance can collapse as length grows, and strong
    retrieval need not transfer to downstream use. We present ATLAS, a benchmarking
    framework that redefines long-context evaluation as length-dependent capability
    profiling. ATLAS contributes three methodological principles:(i) a layered taxonomy
    separating foundational operations from application workloads so failures can
    be attributed, (ii) length-aware AUC scoring that integrates score-length curves
    over a fixed 8K-1M grid, replacing single-point metrics with full degradation
    profiles, and (iii) ATLAScore, a harmonic-mean aggregate over taxonomy categories
    that penalizes imbalanced profiles, with end-to-end uncertainty propagation from
    subset scores through the nonlinear final aggregate. We instantiate the framework
    across eight capability dimensions with nine auditable components and 6,438 instances,
    and evaluate 26 models. Gemini-3.1-Pro-Preview leads at 128K, Claude-Opus-4.6
    leads at 1M. Rankings reshuffle substantially between ATLASscore@8K-128K and ATLASscore@8K-1M:
    7 models move by at least two ranks, and the two taxonomy layers share only 61%
    of cross-model variance, with individual rank gaps up to 12 positions. These results
    support reporting long-context quality by capability and length, not by a single
    headline score.'
- title: 'SWE-Pruner Pro: The Coder LLM Already Knows What to Prune'
  date: 2026-07
  url: https://arxiv.org/abs/2607.18213
  category: evaluation
  subcategory: non-agentic
  authors:
  - Yuhang Wang
  - Yuling Shi
  - Shaoqiu Zhang
  - Jialiang Liang
  - Shilin He
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Pruning long context for coding agents has been a vital technology for
    efficient context management. While existing context pruning methods such as SWE-Pruner
    realize this by attaching a separate code classifier, we find the agent itself
    encodes internal representations indicating the relevance of code context when
    reading tool output. Based on this finding, we propose SWE-Pruner Pro, which prunes
    tool outputs directly inside the agent. Concretely, a small head turns the agent's
    own internal representations into a keep-or-prune label for each line, with a
    length-aware embedding keyed to each tool output's line count. Across two open-weight
    backbones and four multi-turn benchmarks, SWE-Pruner Pro saves up to 39% of prompt
    and completion tokens while preserving task quality, with bounded inference overhead.
    Notably, on MiMo-V2-Flash SWE-Pruner Pro additionally raises the SWE-Bench Verified
    resolve rate by +3.8% and the long-context Oolong accuracy by +2.2 points.
- title: 'LongCat Sparse Attention: Taming the Lightning via Streaming-aware Hierarchical
    Cross-Layer Indexing'
  date: 2026-08
  url: https://arxiv.org/abs/2608.01662
  category: evaluation
  subcategory: non-agentic
  authors:
  - Wen Zan
  - Jiaqi Zhang
  - Jianchao Tan
  - Hong Liu
  - Cunguang Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'DeepSeek Sparse Attention (DSA) enables efficient long-context modeling
    through its Lightning Indexer. However, practical deployment remains constrained
    by the indexer''s expensive O(L2) scoring overhead and the hardware-inefficient,
    discontinuous memory-access patterns induced by its outputs. To address these
    system-level bottlenecks, we introduce LongCat Sparse Attention (LSA), a hardware-algorithm
    co-designed framework comprising three complementary and orthogonal strategies:
    (1) Streaming-Aware Indexing, which selectively converts scattered KV entries
    into hardware-aligned contiguous layouts to enable coalesced HBM access; (2) Cross-Layer
    Indexing, which amortizes indexing overhead by reusing the results produced by
    a single layer across consecutive layers, supported by cross-layer distillation;
    and (3) Hierarchical Indexing, which adopts a coarse-to-fine scoring scheme to
    progressively narrow the candidate set for each query, thereby substantially reducing
    indexing computation. Extensive scaling experiments, ranging from 69B-A3B to 560B-A27B
    models, demonstrate that LSA consistently achieves performance on par with full
    attention across both general-purpose and long-context benchmarks. Moreover, LSA
    supports native training with context lengths of up to one million tokens and
    underpins the development of LongCat-2.0 (1.6T-A48B). To facilitate further research,
    we also introduce and open-source LongCat-Flash-Lite-Sparse (69B-A3B), which integrates
    LSA into LongCat-Flash-Lite and incorporates an updated long-context training
    corpus.'
- title: 'VibeSearchBench: Benchmarking Long-horizon Proactive Search in the Wild'
  date: 2026-05
  url: https://arxiv.org/abs/2605.27882
  category: evaluation
  subcategory: non-agentic
  authors:
  - Xiaohongshu Inc
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'LLM-based agents score well on search benchmarks, yet real users consistently
    find results unsatisfying, revealing a persistent evaluation-experience gap. We
    attribute this gap to existing benchmarks'' reliance on over-specified queries,
    single-turn interactions, and fixed-schema evaluation, none of which reflect real
    search behavior where users and agents collaboratively refine vague intent through
    multi-turn dialogue. We term this paradigm VibeSearch and introduce VibeSearchBench,
    a benchmark comprising 200 manually curated bilingual (Chinese and English) tasks
    across 20 domains, split into VibeSearch-Pro (professional) and VibeSearch-Daily
    (daily-life) subsets. Each task pairs a user persona with a schema-free ground-truth
    knowledge graph, and is evaluated through a progressive-disclosure user simulator
    and a graph-matching evaluation framework. We benchmark seven frontier models
    under both the ReAct framework and the OpenClaw agent harness. Results show that
    all models remain substantially inadequate for VibeSearch (best F1: 30.30), highlighting
    the need for fundamental advances in long-context reasoning, proactive intent
    elicitation, and structured knowledge construction.'
- title: 'XL-DocBench: Benchmarking Evidence-Grounded Extra-Long Document Understanding'
  date: 2026-07
  url: https://arxiv.org/abs/2608.00036
  category: evaluation
  subcategory: non-agentic
  authors:
  - Hongchen Wei
  - Yuanzhe Wang
  - Bei Liu
  - Yifan Yang
  - Qi Dai
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Real-world document tasks often ask professionals to answer questions
    from annual reports, regulations, clinical guidelines, and technical manuals that
    span hundreds or thousands of pages. Some questions also require comparing related
    reports. Reliable long-document understanding is therefore a prerequisite for
    using LLMs in compliance, clinical, financial, and engineering workflows, where
    decisions must be traceable to specific evidence pages and the cost of an unsupported
    answer is high -- yet most existing benchmarks still measure short-context or
    single-page QA. We introduce XL-DocBench, a fully human-verified benchmark for
    extra-long document understanding, with 1,519 retained questions from six professional
    domains and contexts up to 2,303 pages. XL-DocBench goes beyond page-level lookup.
    1,103 examples (72.6%) use multiple evidence pages. The final set also includes
    556 questions (36.6%) that use tables, charts, or figures, and 165 questions (10.9%)
    that require evidence from multiple documents. Each question has one of twelve
    reasoning labels, expert-annotated evidence pages, a typed verification rule,
    and an answer format, including 218 None-answer cases. We build the benchmark
    with a tree-guided synthesis pipeline followed by artifact filters and full verification
    by 194 human experts. By coupling extra-long professional contexts with page-level
    evidence and typed rules, XL-DocBench fills a gap left by prior single-page, short
    multi-page, or text-only long-context benchmarks, and lets future work attribute
    system failures to retrieval, evidence use, or rule following rather than to a
    single leaderboard score. The results show that current systems still struggle
    with long contexts, multi-page evidence, and structured reasoning over professional
    documents.
- title: 'SEER: Long-Context Reasoning via Selective Visual-Text Compression'
  date: 2026-08
  url: https://arxiv.org/abs/2608.15962
  category: evaluation
  subcategory: non-agentic
  authors:
  - Jiawei Xu
  - Zhilin Zhai
  - Jinrui Fang
  - Ruohan Xu
  - Mingfei Lu
  venue: ''
  code_url: https://github.com/jiaweixu98/SEER
  project_url: ''
  abstract: Long-context reasoning remains computationally expensive for large language
    models due to the quadratic complexity of attention over text tokens. Visual-text
    compression offers a promising alternative by rendering text into images and processing
    them with vision-language models, often reducing token usage. However, existing
    approaches apply uniform compression regardless of query relevance, potentially
    sacrificing precision where detailed extraction is required. We present SEER,
    a framework that learns to select query-relevant images through visual scanning
    and retrieve textual content only where needed, combining the efficiency of visual
    compression with the precision of text-based reasoning. Through supervised fine-tuning
    on tool-interaction trajectories, SEER learns adaptive tool invocation for selection
    and retrieval. Experiments on long-context benchmarks show that SEER improves
    extraction precision through selective text retrieval while retaining average
    prompt-token savings relative to full-text baselines. On LongBench, SEER achieves
    51.11% average accuracy, outperforming the visual-text baseline Glyph-9B by 2.33
    points and Qwen3-8B by 3.49 points. Code can be accessed at https://github.com/jiaweixu98/SEER
- title: 'Copy Less, Ground More: Overcoming Repetitive Copying in Long-Context Reasoning
    via Evidence-Aware Reinforcement Learning'
  date: 2026-07
  url: https://arxiv.org/abs/2607.19345
  category: evaluation
  subcategory: non-agentic
  authors:
  - Lizhe Fang
  - Weizhou Shen
  - Tianyi Tang
  - Yisen Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language models that generate step-by-step reasoning traces have
    achieved strong performance on complex tasks, and extending them to long-context
    settings has emerged as an important frontier. However, we identify a critical
    failure mode in this regime: emph{repetitive copying, where models extensively
    copy text from the input into their reasoning traces rather than productively
    solving the problem. We show that this behavior is pervasive across frontier long-context
    LLMs and intensifies with context length. By separating each prompt into task-relevant
    key evidence and irrelevant distractor context, we further show that the root
    cause is insufficient grounding: models copy from the prompt indiscriminately,
    and those that fail to focus on key evidence are far more likely to answer incorrectly.
    Motivated by this diagnosis, we propose GEAR (Grounding Evidence-Aware Reward),
    a reward shaping method that augments the accuracy signal with a grounding reward
    for overlap with key evidence and a distractor penalty for overlap with irrelevant
    context. To enable GEAR on natural-language data, we develop an automated pipeline
    that constructs evidence-annotated training data from arbitrary documents. We
    validate GEAR across multiple model scales and benchmarks, showing consistent
    improvements of up to +4.6 average points over standard RL with accuracy-based
    rewards, with larger gains at longer contexts, while also reducing repetitive
    copying and thinking length. Our findings suggest that, even as long-context evaluation
    shifts from simple retrieval toward complex reasoning, accurate grounding in relevant
    evidence remains an indispensable capability with substantial room for improvement.'
- title: Can Agent Memory Systems Track Evolving State?
  date: 2026-08
  url: https://arxiv.org/abs/2608.19652
  category: evaluation
  subcategory: non-agentic
  authors:
  - Xinyi Fan
  - Miri Liu
  - Ruozhen Yang
  - Siru Ouyang
  - Jiawei Han
  venue: ''
  code_url: ''
  project_url: ''
  abstract: As LLM-based agents are deployed for longer and higher-stakes tasks, their
    memory systems continue to have crucial gaps. While existing memory benchmarks
    focus largely on recall-shaped tasks, we argue an effective memory system must
    track the evolving state of the world; as facts, constraints, and decisions are
    revised over a long interaction, answers must reflect the current state and not
    a superseded one. We define this capability as state tracking and instantiate
    it in StateMemBench, a benchmark of 234 multi-session scenarios spanning two conversation-length
    regimes. Its closed-pool grading scores whether an answer reflects the current
    state, the superseded state, or fails otherwise, separating state-tracking failures
    from other errors by construction. Our analysis shows that this task is challenging
    for existing memory systems, retrieval-augmented baselines, and long-context baselines.
    We then present StateMem, a state-first memory method that explicitly tracks supersession
    and relational dependencies, and show it improves current-state accuracy over
    the strongest same-backbone baseline by 1.8x (0.205 -> 0.363) on DeepSeek-V4-Flash
    and over the strongest memory system by 1.6x (0.149 -> 0.233) on Qwen-3.5-9B,
    while remaining competitive with the long-context baselines. Finally, we show
    the same state approach can be applied as a lightweight single-call wrapper over
    existing memory systems, lifting current-state accuracy by +32 to +67 points on
    StateMemBench across six memory and retrieval backends. A length- and cost-matched
    control attributes +15 to +32 of those points to state structure rather than added
    context.
- title: 'Dense Contexts Are Hard Contexts: Lexical Density Limits Effective Context
    in LLMs'
  date: 2026-06
  url: https://arxiv.org/abs/2606.06203
  category: evaluation
  subcategory: non-agentic
  authors:
  - Giovanni Dettori
  - Matteo Boffa
  - Danilo Giordano
  - Idilio Drago
  - Marco Mellia
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Input length and the position of relevant information are widely cited
    as the primary causes of degraded LLM long-context performance. Here, we study
    lexical density -- the rate at which a context introduces distinct information
    -- as a third, largely overlooked factor that systematically reduces the effective
    context window of LLMs. We quantify the impact of lexical density on open-weight
    LLMs (9B-685B) using three "find-the-needle" style benchmarks with identical length
    (~12k tokens) and controlled needle position, but increasing density of information.
    We observe a sharp performance collapse in higher-density benchmarks: models that
    are near-perfect in sparse contexts drop below 60% retrieval score on denser ones.
    To rule out task-type confounds, we vary and control the density within each benchmark
    while keeping all other properties unchanged. Reducing density generally restores
    performance, especially in the high-density regimes where degradation appears.
    These results show that effective context capacity is a function of lexical density,
    with direct implications for real-world LLM systems operating on compact, information-rich
    inputs.'
- title: 'EntSQL: A Benchmark for Grounding Text-to-SQL in Long-Context Enterprise
    Knowledge'
  date: 2026-06
  url: https://arxiv.org/abs/2606.03363
  category: evaluation
  subcategory: non-agentic
  authors:
  - Chengxi Liao
  - Tao Xu
  - Zulong Chen
  - Chuanfei Xu
  - Yiyan Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Text-to-SQL enables natural language access to databases, and recent LLMs
    have substantially advanced its capabilities. Existing benchmarks such as Spider,
    BIRD, and Spider~2.0 evaluate schema generalization, large-scale databases, and
    realistic workflows, but largely overlook enterprise scenarios where SQL generation
    depends on private business knowledge, such as internal metrics, reporting conventions,
    and organizational rules. We introduce EntSQL, an enterprise-oriented Text-to-SQL
    benchmark for evaluating long-context grounding over proprietary business documents.
    EntSQL contains 1,066 aligned Chinese-English semantic examples across five business
    domains, with most examples requiring domain knowledge beyond the question and
    schema and involving complex SQL structures. On English inputs, the best evaluated
    system reaches only 15.9% when long-form documents are provided, highlighting
    the difficulty of grounding SQL generation in enterprise knowledge.
- title: 'ContractScrub: A benchmark for final review of legal contracts'
  date: 2026-08
  url: https://arxiv.org/abs/2608.20204
  category: evaluation
  subcategory: non-agentic
  authors:
  - Yejin Bang
  - Kirsty Fielding
  - Brandan Oliver
  - Brian Birke
  - Nabeel Seedat
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Legal work, with its heavy reliance on processing large amounts of text,
    is often considered one of the domains most exposed to the use of LLMs. Contract
    ``scrubbing,'' the final review of transactional agreements for errors and inconsistencies,
    is a particularly suitable task for automation, because it is routine, painstaking
    work requiring detailed attention to long documents. Scrubbing also seems to align
    naturally with the general capabilities expected of frontier LLMs around long-context
    reasoning, consistency checking, and named entity recognition (NER). Despite the
    economic value and potential for automation, no formal evaluations of LLMs performing
    contract scrubbing have been conducted. We introduce ContractScrub, the first
    benchmark designed to evaluate contract scrubbing capabilities, comprising contracts
    hand-crafted by experienced lawyers over diverse error categories such as misuse
    of defined terms, incorrect references, and inconsistent language. Frontier models
    perform surprisingly poorly with only one model reaching 0.75 macro average recall
    despite strong performance on seemingly related general benchmarks, demonstrating
    the practical limits of current models and the importance of narrowly targeted,
    domain-specific benchmarks for measuring real-world impact.
- title: Multi-Head Recurrent Memory Agents
  date: 2026-07
  url: https://arxiv.org/abs/2607.01523
  category: evaluation
  subcategory: non-agentic
  authors:
  - Jiatong Li
  - Samuel Yeh
  - Sharon Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Recurrent memory agents extend LLMs to arbitrarily long contexts by iteratively
    consolidating input into a fixed-size memory window. Despite their scalability,
    these agents exhibit a well-documented reliability problem: end-to-end performance
    degrades systematically as context length grows. We diagnose this failure by decomposing
    performance into two factors--memory capture and memory retention--and quantitatively
    confirm that retention is the dominant bottleneck. Retention collapses because
    existing designs maintain memory as a monolithic text block, forcing every update
    to risk overwriting previously retained content. Motivated by this diagnosis,
    we propose Multi-Head Recurrent Memory (MHM), a general, training-free framework
    that partitions memory into independent heads governed by a stage-wise select-then-update
    strategy. At each step, exactly one head is selected for update while the remaining
    heads are structurally shielded from overwriting, shifting the burden of retention
    from model behavior to architectural design. As a lightweight instantiation, we
    introduce Least-Recently-Updated MHM (MHM-LRU), which guarantees uniform head
    utilization with zero additional token overhead. Extensive experiments on long-context
    benchmarks show that MHM-LRU substantially improves both retention and end-to-end
    accuracy across the 100K--1M token range, where baselines degrade sharply. On
    RULER-HQA at 896K tokens, MHM-LRU improves the memory retention rate from less
    than 30% to 73.96%. These gains generalize across model families, scales, and
    task types, positioning architectural optimization as a practical and cost-efficient
    path toward reliable long-context recurrent memory.'
- title: 'DeLS-Spec: Decoupled Long-Short Contexts for Parallel Speculative Drafting'
  date: 2026-07
  url: https://arxiv.org/abs/2607.07409
  category: evaluation
  subcategory: non-agentic
  authors:
  - Hong-Kai Zheng
  - Piji Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Speculative decoding accelerates LLM inference by drafting multiple tokens
    and verifying them in parallel. Block-parallel drafters such as DFlash further
    improve drafting efficiency by predicting an entire block in one pass, but their
    position-wise predictions lack explicit intra-block causal conditioning. Recent
    methods such as Domino and DSpark attempt to introduce such causality into block-parallel
    drafting, but they require training the draft model from scratch, which limits
    their flexibility and increases training cost. We propose DeLS-Spec, a decoupled
    long-short context speculative decoding method. DeLS-Spec treats the fixed DFlash
    model as a long-context expert and introduces a lightweight local head as a short-context
    expert. The local head can be trained independently with a standard next-token
    prediction objective, without joint training with the target model or the DFlash
    backbone, leading to extremely low training cost. At inference time, DeLS-Spec
    combines long-context and short-context logits, and the local head is not tied
    to a specific DFlash checkpoint, making the method more modular and flexible.
    Experiments on Qwen3 models show that DeLS-Spec consistently improves speedup
    and average acceptance length over DFlash across math, code, and dialogue benchmarks.
- title: 'Enjoy Your Talk: A Human-Centered Benchmark for Multi-Turn Dialogue with
    Decoupled User Simulation, Target Modeling, and Judging'
  date: 2026-07
  url: https://arxiv.org/abs/2607.10428
  category: evaluation
  subcategory: non-agentic
  authors:
  - Jinglan Gong
  - Jiefan Lu
  - Hewei Guo
  - Kehan Li
  - Zhiyuan Han
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Evaluating large language models (LLMs) as multi-turn conversational
    partners requires probing capabilities that single-turn benchmarks miss: persona
    consistency, evolving intent tracking, emotional dynamics, and goal completion
    across many turns. We introduce EYT-Bench, a human-centered benchmark whose evaluation
    protocol is built around a decoupled three-party design: a persona-grounded user
    simulator, a target model evaluated on both intent perception and response generation,
    and an independent, configurable ensemble of LLM judges. Across 3,400 dialogues
    with 17 target models, EYT-Bench reveals four findings that previous benchmarks
    miss: (i) state-of-the-art closed and open-source models are statistically indistinguishable
    on subjective dimensions, but separate by up to 9x on objective intent-tracking;
    (ii) reasoning is a phase transition for objective tracking on long-context personas
    but is essentially flat on subjective scores; (iii) persona format strongly affects
    trajectory spread, FICR (final-intent completion rate) saturates above 0.95 on
    Nemotron-USA but ranges from 0.53 to 0.88 on PersonaMem-v2; and (iv) the warm-up
    effect is observed in 16 of 17 models.'
- title: Global Merger-Arbitrage Forecasting with Language Models
  date: 2026-07
  url: https://arxiv.org/abs/2607.09921
  category: evaluation
  subcategory: non-agentic
  authors:
  - Hinal Jajal
  - Michal Mucha
  - Charles Sweat
  - Chris Pulman
  - Charlie Flanagan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We present a language-model forecasting system for merger arbitrage,
    a specialized high-stakes financial setting in which the task is to predict the
    outcome of announced M&A deals. Unlike prior work on judgmental forecasting with
    LLMs, which has focused on broad mixed-topic benchmarks and short context such
    as news snippets, we study a setting that requires long-context reasoning over
    hundreds of pages of technical documents. Our system combines expert-guided context
    engineering with finetuning on hindsight-guided reasoning traces derived from
    historical deals. Given an announced deal, it outputs a probability distribution
    over three mutually exclusive outcomes: closing at announced terms, a higher bid,
    or deal termination. On an out-of-sample set of more than 400 large deals spanning
    42 countries, our finetuned system achieves the best performance of any method
    we evaluate, reducing class-balanced Brier score to 0.151. This is 24% below calibrated
    market-implied probabilities, 19% below XGBoost, and 25-42% below frontier language
    models. These results, together with ablation studies, show that LLM-based forecasting
    can succeed in specialized, long-context financial workflows, with hindsight-based
    supervision and expert-designed context playing a critical role.'
- title: 'ChildEval: When large language models meet children''s personalities'
  date: 2026-05
  url: https://arxiv.org/abs/2605.27805
  category: evaluation
  subcategory: non-agentic
  authors:
  - Yanyan Luo
  - Xue Han
  - Chunxu Zhao
  - Ruiqiao Bai
  - Yaxing Zhang
  venue: ''
  code_url: https://github.com/ziyanluo/ChildEval
  project_url: ''
  abstract: While LLMs enable personalized chatbots, their effectiveness in child-centered
    personalization remains unclear, as systematic evaluation of child-specific preferences
    is still lacking. To address this gap, we introduce ChildEval, a benchmark for
    evaluating LLMs' ability to infer and follow child-centered preferences in long-context
    conversations. ChildEval contains 29K synthesized persona profiles of children
    aged 3-6, providing relatively static background information. Each persona is
    associated with a child preference-which may align with, conflict with, or be
    independent of the persona-expressed either explicitly in a single sentence or
    implicitly through 6-10 turn dialogues. Explicit and implicit preferences are
    designed to reflect the same underlying preference but differ in expression, capturing
    dynamic aspects of preference expression rather than changes in the static persona.
    The benchmark spans five top-level and fourteen sub-level categories covering
    children's daily lives and development. We further propose fine-grained, child-centric
    evaluation protocols to systematically assess open-source LLMs. Experimental results
    demonstrate how different personalized representations affect LLM responses and
    suggest that finetuning on ChildEval can enhance child-centered performance. Our
    code and dataset are available at https://github.com/ziyanluo/ChildEval.
- title: Logit-Contribution Scoring Identifies Non-Literal Retrieval Heads
  date: 2026-07
  url: https://arxiv.org/abs/2607.01002
  category: evaluation
  subcategory: non-agentic
  authors:
  - Aryo Pradipta Gema
  - Beatrice Alex
  - Pasquale Minervini
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'In long-context use, large language models frequently synthesize answers
    from the meaning of a relevant context span rather than literally copy-pasting
    them. Identifying which attention heads perform this synthesis matters for interpreting
    long-context model behavior. Yet existing detectors miss these heads by construction:
    they reward heads whose attended token matches the generated token, a literal-copy
    criterion that captures where a head reads but not what it writes through its
    output-value (OV) circuit, the very mechanism that carries non-literal retrieval.
    We introduce Logit-Contribution Scoring (LOCOS), a write-aware detector that scores
    each head by the projection of its OV-circuit output onto the answer-token unembedding
    direction, contrasting needle and off-needle source positions in a single forward
    pass. Across three model families (Qwen3, Gemma-3, OLMo-3.1), mean-ablating the
    top LOCOS heads on the NoLiMa non-literal retrieval benchmark collapses ROUGE-L
    at lower head counts than prior attention-based detections; on Qwen3-8B, ablating
    50 heads drives ROUGE-L from 0.401 to 0.000 while the strongest baseline still
    retains 0.292. The selected heads are retrieval-specific: parametric recall and
    arithmetic reasoning stay at baseline under the same ablation. On Qwen3-8B, the
    same ablation also drops MuSiQue from 0.55 to 0.08 and BABI-Long from 0.62 to
    0.20, while a random-heads control stays within 0.05 of baseline.'
- title: 'PI-Mem: Pushing Long-Context Reasoning to 3.6M Tokens with Parallel-Iterative
    Memory'
  date: 2026-08
  url: https://arxiv.org/abs/2608.03048
  category: evaluation
  subcategory: non-agentic
  authors:
  - Dawei Liu
  - Haixu Song
  - Shuang Cheng
  - Shijie Wang
  - Haozheng Hou
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Long-context reasoning remains a critical bottleneck for large language
    models, as recent recurrent-memory approaches face two inherent challenges: sequential
    chunk-wise updates can overwrite early critical evidence with later irrelevant
    content, and serial inter-chunk dependencies limit parallelism and cause latency
    to increase with context length. To address these issues, we propose PI-Mem (Parallel-Iterative
    Memory), a mechanism that processes all chunks in parallel and iteratively refines
    a shared memory over a bounded number of turns. In each turn, PI-Mem reads all
    chunks in parallel conditioned on the current memory, selects new or complementary
    evidence from each chunk, and merges the selected evidence into a compact shared
    memory for the next turn. To discourage redundant turns, we optimize the workflow
    through reinforcement learning with an auxiliary turn-efficiency reward, enabling
    the model to adaptively exit once sufficient evidence has been accumulated. We
    evaluate PI-Mem with Qwen3.5-35B-A3B and Qwen2.5-7B on the HotpotQA benchmark
    across context lengths up to 3.6 million tokens and find that it outperforms the
    recurrent-memory baseline by +6.25 and +7.81 absolute points while achieving 6.1×
    and 2.1× inference speedups, respectively. These results demonstrate that PI-Mem
    breaks the accuracy--efficiency trade-off in long-context reasoning and provides
    a scalable approach to complex multi-hop question answering over extremely long
    documents.'
- title: 'LEDGER: A Long-Context Benchmark of Corporate Annual Reports for Grounded
    Financial Retrieval and Extraction'
  date: 2026-06
  url: https://arxiv.org/abs/2606.13100
  category: evaluation
  subcategory: non-agentic
  authors:
  - Charles Moslonka
  - Amaury de Vitry
  - Arthur Garnier
  - Hicham Randrianarivo
  - Emmanuel Malherbe
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Finance reporting is a natural proving ground for large language models,
    and the very-long-context capabilities of recent models across all sizes make
    rigorous evaluation in this domain an increasingly pressing need. Yet most public
    financial resources reduce the task to plain-text SEC 10-K filings paired with
    a handful of question-answer items. We release LEDGER (Long-context Evaluation
    of Documents for Grounded Extraction and Retrieval), a corpus of 4,999 digitized
    corporate annual reports - full documents with figures, tables, and narrative,
    not just regulatory filings. Each report is labeled with 31 consolidated financial
    KPIs to be extracted and linked to the market''s reaction at the earnings date.
    From this data we derive three evaluation benchmarks spanning the difficulty spectrum:
    a pure page-level KPI retrieval task with TREC-style relevance judgments over
    118,048 questions in natural language, a conversational "needle-in-a-haystack"
    single-value lookup, and a full KPI extraction task, both from long, numerically
    dense reports. We additionally provide human OCR-quality annotations with inter-annotator
    agreement and the complete extraction, validation, and scoring toolchain. We further
    demonstrate the dataset''s research utility with a case study linking CEO-letter
    rhetoric to post-publication market impact.'
- title: Memory Retrieval for Changing Preferences
  date: 2026-06
  url: https://arxiv.org/abs/2606.02976
  category: evaluation
  subcategory: non-agentic
  authors:
  - Yuehan Qin
  - Li Li
  - Linxin Song
  - Wei Yang
  - Jiate Li
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Long-context dialogue systems must decide both when to access memory and
    which parts of the interaction history are relevant. Existing approaches typically
    rely on heuristic retrieval signals or always-on memory usage, failing to account
    for the changing and potentially inconsistent nature of user preferences. In this
    work, we propose a unified framework for memory access and selection based on
    changing preferences. We formulate personalized memory retrieval as identifying
    which historical turns provide evidence about a user's latent preference state,
    rather than relying on surface-level semantic similarity. To this end, we quantify
    the utility of each memory turn using a Bayes factor, defined as the improvement
    in the model's likelihood of the reference response when the turn is included
    in context. This provides a principled measure of evidence strength and a unified
    signal for both memory access and selection. By framing memory retrieval as utility
    estimation, the model learns to identify salient turns and regulate memory usage
    based on expected utility. Experiments on four heterogeneous memory benchmarks
    show that our approach outperforms existing embedding-based retrieval on long-context,
    preference-intensive tasks where modeling changing preferences is essential, while
    remaining competitive in low-density regimes where semantic similarity suffices.
- title: 'CoSA: Accelerating Long-Context Inference via Proxy-Kernel Co-Designed Sparse
    Attention'
  date: 2026-07
  url: https://arxiv.org/abs/2607.25291
  category: evaluation
  subcategory: non-agentic
  authors:
  - Yufei Xue
  - Lin Niu
  - Hong Liu
  - Siran Liu
  - Hanyong Shao
  venue: ''
  code_url: https://github.com/Tencent/AngelSlim
  project_url: ''
  abstract: The quadratic cost of self-attention makes long-context inference prohibitively
    expensive, and proxy-based block-sparse attention has become a practical remedy.
    Existing methods typically rely on a proxy to predict a binary sparse mask and
    a kernel to consume this mask and perform sparse attention computation. Such an
    approach is effective under moderate budgets. However, as the budget tightens,
    the estimated proxy inevitably drops some salient blocks, while the kernel can
    only apply the sparse mask mechanically, leading to an evident drop in model accuracy.
    We propose CoSA, a two-stage training-free Sparse Attention under proxy-kernel
    CO-design, which couples a Kernel-Aware Proxy (KAP) with an Ordered-Skipping Kernel
    (OSK). In the first stage, the KAP selects blocks under a moderate budget and
    produces an ordered mask that prescribes the order in which KV pages are visited
    in the kernel inner loop. In the second stage, the OSK applies this mask and skips
    more blocks under a tightened budget given online-softmax statistics. Across mainstream
    LLM backbones and long-context benchmarks, CoSA attains higher accuracy at lower
    budgets. Impressively, CoSA achieves a 4.93× attention speedup and reduces end-to-end
    Time-to-First-Token by 2.53× under a context length of 128K with negligible performance
    degradation. Code is available at https://github.com/Tencent/AngelSlim.
- title: 'OmniAlign: A Unified Multilingual Aligner for Word and Sentence Alignment'
  date: 2026-08
  url: https://arxiv.org/abs/2608.18474
  category: evaluation
  subcategory: non-agentic
  authors:
  - Mengpeng Yang
  - Jingxu Yang
  - Chao Chen
  - Tian Xia
  - Yabo Sun
  venue: ''
  code_url: https://github.com/MilkDargon/OmniAlign
  project_url: https://huggingface.co/WPS-Qingqiu/OmniAlign}
  abstract: 'Cross-lingual sequence alignment is fundamental for building and exploiting
    parallel corpora, spanning mappings from documents and sentences down to words
    and subwords. Existing tools, however, typically specialize in a single granularity,
    so practitioners often need separate systems for word- and sentence-level alignment---especially
    in multilingual and long-text settings. We present OmniAlign, a unified multilingual
    aligner that supports both word-level and sentence-level alignment with a single
    lightweight model. Built on an encoder-only backbone with strong long-context
    modeling, OmniAlign induces word alignments from contextualized token similarity
    matrices, and obtains document-level m--n sentence alignments via sentence embeddings
    combined with dynamic programming. To balance fine-grained alignment accuracy
    and sentence-representation quality, we use a four-stage training pipeline: alignment-oriented
    continued pre-training, self-supervised learning, supervised fine-tuning on human
    annotations, and sentence-embedding distillation from a strong multilingual teacher.
    Experiments show that OmniAlign achieves highly competitive performance on both
    word- and sentence-alignment benchmarks and generalizes well to unseen language
    pairs. Surprisingly, later-stage supervised fine-tuning on short texts further
    improves alignment quality while retaining the long-context understanding acquired
    in earlier training, keeping the model robust on long-text word alignment. normalsize
    {color{bluetextbf{Code: https://github.com/MilkDargon/OmniAlignpar {color{bluetextbf{Model:
    https://huggingface.co/WPS-Qingqiu/OmniAlign'
- title: 'LongTraceRL: Learning Long-Context Reasoning from Search Agent Trajectories
    with Rubric Rewards'
  date: 2026-05
  url: https://arxiv.org/abs/2605.31584
  category: evaluation
  subcategory: non-agentic
  authors:
  - Nianyi Lin
  - Jiajie Zhang
  - Lei Hou
  - Juanzi Li
  venue: ''
  code_url: https://github.com/THU-KEG/LongTraceRL
  project_url: ''
  abstract: 'Long-context reasoning remains a central challenge for large language
    models, which often fail to locate and integrate key information in extensive
    distracting content. Reinforcement learning with verifiable rewards (RLVR) has
    shown promise for this task, yet existing methods are limited by low-confusability
    distractors and sparse, outcome-only reward signals that cannot supervise intermediate
    reasoning steps. To address these issues, we introduce textsc{LongTraceRL. For
    data construction, we generate multi-hop questions via knowledge graph random
    walks and leverage search agent trajectories to build emph{tiered distractors:
    documents the agent read but did not cite (high confusability) and documents that
    appeared in search results but were never opened (low confusability), producing
    training contexts that are far more challenging than those built by random sampling
    or one-shot search. For reward design, we propose a emph{rubric reward that uses
    the gold entities along each reasoning chain as fine-grained, entity-level process
    supervision. This rubric reward is applied only to responses with correct final
    answers (positive-only strategy), distinguishing the reasoning quality among correct
    responses and preventing reward hacking. Experiments on three reasoning LLMs (4B--30B)
    across five long-context benchmarks demonstrate that textsc{LongTraceRL consistently
    outperforms strong baselines and encourages comprehensive, evidence-grounded reasoning.
    Codes, datasets and models are available at href{https://github.com/THU-KEG/LongTraceRL{https://github.com/THU-KEG/LongTraceRL.'
- title: 'Connecting the Dots: Benchmarking Reflective Memory in Long-Horizon Dialogue'
  date: 2026-05
  url: https://arxiv.org/abs/2606.01223
  category: evaluation
  subcategory: non-agentic
  authors:
  - Jingjie Lin
  - Bingbing Wang
  - Zihan Wang
  - Zhengda Jin
  - Weiming Qiao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Despite substantial progress in long-context modeling, existing benchmarks
    remain confined to factual memory for explicit recall, failing to measure the
    reflective memory required to synthesize fragmented, multimodal cues into high-level
    interpretations. To address this gap, we introduce RefMem-Bench, a benchmark for
    reflective memory in long-horizon dialogue. RefMem-Bench contains 26K annotated
    QA instances with eight reflective-memory dimensions and three task formats, requiring
    models to move beyond surface-level retrieval and infer latent meanings from evidence
    distributed across interaction histories. To enhance reflective memory capability,
    we propose REflective Memory INDuction (REMIND), a hierarchical framework that
    treats reflective memory as progressive meaning construction. REMIND couples question-conditioned
    evidence retrieval, salience-aware grounding, and abstraction-level supervision,
    and uses Progressive Reflective Alignment to distill high-level reflective reasoning
    into the factual inference pathway. Experiments show RefMem-Bench poses a substantial
    challenge to current models, while REMIND consistently improves both answer accuracy
    and memory recall through progressive evidence perception, grounding, and abstraction.
- title: Scalable Hierarchical Attention Transformers for Multi-Turn Jailbreak Detection
    in Long Conversations
  date: 2026-06
  url: https://arxiv.org/abs/2606.21082
  category: evaluation
  subcategory: non-agentic
  authors:
  - Chenhui Hu
  - Muhammed Salih
  - Sudipto Guha
  - Subramanian Srinivasan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Multi-turn jailbreaks can evade turn-level moderation by spreading unsafe
    intent across a dialogue through gradual escalation, reframing, and role manipulation.
    We address multi-turn jailbreak detection as a conversation-level classification
    problem and introduce an efficient hierarchical detector that avoids expensive
    long-context concatenation while retaining cross-turn reasoning. The model encodes
    individual turns to form compact turn representations and applies a lightweight
    conversation module that captures dialogue dynamics and selectively attends to
    fine-grained evidence when needed. On a challenging evaluation benchmark of 14,038
    conversations, our approach achieves an F1 of 0.9394, outperforming Claude Opus
    4.7, the strongest competing baseline, by 0.07 while halving its false-positive
    rate. Ablation studies confirm that each architectural component contributes meaningfully,
    with combining cross-attention and self-attention in the conversation module yielding
    a 2.26 percentage point reduction in false-positive rate over the self-attention-only
    variant.
- title: Studying quantization trade-offs for efficient inference deployment in machine
    translation
  date: 2026-07
  url: https://arxiv.org/abs/2607.29397
  category: evaluation
  subcategory: non-agentic
  authors:
  - Jim Zhao
  - Sohir Maskey
  - Koen Oostermeijer
  - Douglas Orr
  - Teryn Jones
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Deploying large language models in realistic server environments poses
    challenges, as the system needs to provide high-quality responses with low latency.
    Quantization is a common approach to reduce the memory footprint and improve inference
    efficiency, yet its impact on latency and throughput is rarely evaluated under
    controlled, orchestration-level workloads. In this work we study the quantization
    trade-offs of two translation model families, EuroLLM citep{martins2025eurollm
    and Hy-MT2 citep{zheng2026hy across five models ranging from 1.7B to 22B for efficient
    deployment on a single A100 or H100 GPU. We demonstrate that combining a document-chunking
    strategy with W4A8 or W8A8 quantization improves the latency-throughput Pareto-curve
    under a wide range of workloads. Furthermore, since standard machine translation
    (MT) benchmarks rely on isolated sentences and fail to capture long-context dynamics,
    we introduce a document-level evaluation from WMT24++ to assess how text chunking
    strategies affect translation quality under quantization. Our results reveal that
    standard segment-level evaluation can fail to predict the interaction between
    quantization and long-context document translation. While Hy-MT2 remains robust
    under quantization, EuroLLM shows strong sensitivity and translation quality collapses
    rapidly for all considered quantization formats. Overall, our experiments show
    that the trade-off between inference efficiency and translation quality depends
    not only on the quantization format, but also on the choice of text chunking strategy.
- title: 'UniClawBench: A Universal Benchmark for Proactive Agents on Real-World Tasks'
  date: 2026-07
  url: https://arxiv.org/abs/2607.08768
  category: evaluation
  subcategory: non-agentic
  authors:
  - Zhekai Chen
  - Chengqi Duan
  - Kaiyue Sun
  - Bohao Li
  - Yuqing Wang
  venue: ''
  code_url: https://github.com/HKU-MMLab/UniClawBench
  project_url: ''
  abstract: 'The rapid development of large language models and multimodal large language
    models has accelerated the emergence of proactive agents capable of operating
    everyday tools and assisting users in real-world environments. However, existing
    benchmarks struggle to evaluate such agents effectively, as they often rely on
    sandboxed environments and single-turn evaluation paradigms. Moreover, their scenario-based
    task taxonomies mix multiple model capabilities within the same task category,
    making it difficult to identify the root causes of agent failures. To address
    these limitations, we introduce UniClawBench, the first capability-driven benchmark
    designed to evaluate proactive agents in dynamic, real-world settings. UniClawBench
    is built around five foundational model capabilities: Skill Usage, Exploration,
    Long-Context Reasoning, Multimodal Understanding, and Cross-Platform Coordination.
    Based on these capabilities, we design 400 bilingual real-world tasks. Unlike
    previous benchmarks that rely on static, pre-recorded answers, our benchmark evaluates
    agents in live Docker containers using fine-grained, step-by-step completion checkpoints.
    Furthermore, we design a closed-loop evaluation strategy comprising an executor
    agent, a hidden supervisor agent, and a user agent to simulate realistic multi-turn
    human feedback without leaking grading criteria. To disentangle base model capabilities
    from framework-level design choices, we evaluate state-of-the-art models under
    multiple agent frameworks. Through comprehensive comparisons across both models
    and frameworks, we show how base model capabilities and agent framework designs
    jointly shape performance in real-world environments. To facilitate future research,
    we make our benchmark and code publicly available at https://github.com/HKU-MMLab/UniClawBench.'
- title: 'EvoEmbedding: Evolvable Representations for Long-Context Retrieval and Agentic
    Memory'
  date: 2026-06
  url: https://arxiv.org/abs/2606.21649
  category: evaluation
  subcategory: non-agentic
  authors:
  - Chang Nie
  - Chaoyou Fu
  - Junlan Feng
  - Caifeng Shan
  venue: ''
  code_url: ''
  project_url: https://clare-nie.github.io/EvoEmbedding/
  abstract: 'Existing embedding models are inherently static: they encode text segments
    in isolation, ignoring their surrounding context and temporal order. This paper
    introduces EvoEmbedding, a novel embedding model that generates evolvable representations
    for retrieval. It is tailored for long-context scenarios, where information is
    dynamic, sequential, and requires continuous state tracking. Our design is simple:
    EvoEmbedding maintains a continuously updated latent memory as it sequentially
    processes inputs, and uses it alongside the raw content to jointly generate evolvable
    embeddings. Consequently, for the same query, our model adapts its representation
    to retrieve distinct targets based on the evolving context, going beyond static
    semantic search. To equip the model with this capability, we construct EvoTrain-180K,
    a diverse dataset for the joint optimization of latent memory and retrieval. Furthermore,
    we introduce a memory queue to prevent representation collapse during recurrent
    encoding, alongside segment-batching techniques that tackle significant length
    variance and accelerate training by 3.8×. Extensive experiments show that our
    model not only outperforms larger-scale specialists (e.g., Qwen3-Embedding-8B
    and KaLM-Embedding-Gemma3-12B) across a range of long-context retrieval benchmarks,
    but also generalizes well to downstream tasks (e.g., personalization) with contexts
    10× longer than its training window. Notably, EvoEmbedding seamlessly integrates
    into agentic workflows to boost performance. For instance, a naive RAG pipeline
    equipped with our model surpasses dedicated agentic memory systems. Project Page:
    https://clare-nie.github.io/EvoEmbedding/.'
- title: 'SimpleOPD: Simple Tokenizer-Agnostic On-Policy Distillation for Long-Context
    Reasoning'
  date: 2026-08
  url: https://arxiv.org/abs/2608.14277
  category: evaluation
  subcategory: non-agentic
  authors:
  - Haonan He
  - Haodi Lei
  - Yun Luo
  - Haoran Zhang
  - Shunkai Zhang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: On-policy distillation (OPD) offers a promising way to transfer reasoning
    capabilities from stronger teacher models, but applying it to long-context reasoning
    teachers and short-context students introduces practical challenges, including
    tokenizer mismatch, teacher-student distribution mismatch, response length explosion,
    and training instability. In this work, we study this setting by transferring
    proof-reasoning capabilities from the long-context reasoning model SU-01 to short-context
    student models. To handle tokenizer differences, we perform OPD in a shared text
    space and align only tokens that occupy identical text spans under the student
    and teacher tokenizers. To mitigate the problem of excessive generation length
    and frequent truncation, we introduce a student reference KL loss and mask the
    advantages of special termination tokens such as </think> and <|imend|>. This
    strategy constrains the student from drifting excessively from its initial policy,
    thereby mitigating the teacher-student distribution mismatch problem and fostering
    steady length growth. Experiments on both same-family and different-family student
    models, including Qwen3, Qwen3.5, Intern-S2, GLM-4.7, Gemma-4, show consistent
    gains in mathematical reasoning, especially natural-language math proving. Notably,
    Intern-S2-Preview improves by 21.2 points on ProofBench, reaching 55.2 and surpassing
    Gemini-2.5-Pro. It also improves on science benchmarks such as HLE and HiPhO,
    suggesting that OPD transfers reasoning capabilities that generalize beyond the
    mathematical training domain.
- title: 'MemoryDocDataSet: A Benchmark for Joint Conversational Memory and Long Document
    Reasoning'
  date: 2026-06
  url: https://arxiv.org/abs/2606.04442
  category: evaluation
  subcategory: non-agentic
  authors:
  - Qiyang Xie
  - Jialun Wu
  - Xinjie He
  - Su Liu
  - Shuai Xiao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'AI systems increasingly need to combine two demanding capabilities: navigating
    multi-session conversation history and performing deep reading comprehension within
    long documents. Yet no existing benchmark evaluates both simultaneously. We introduce
    MemoryDocDataSet, a synthetic benchmark of 50 micro-worlds and 1,000 QA pairs
    in which each instance comprises 3-5 personas, a temporal event graph spanning
    months of activity, 3-5 real long documents (20,000-50,000 tokens each sourced
    from the Caselaw Access Project), multi-session conversations grounded on those
    documents, and 20 question-answer pairs across five reasoning categories. The
    defining feature is the Hybrid source tag: questions requiring a system to first
    navigate conversation history to identify which document is relevant, then extract
    the answer from within that document. Hybrid questions account for 75.1% of the
    dataset. Dataset quality is characterised through a prompt-sensitivity self-consistency
    analysis using LLM-as-judge, yielding a median Cohen''s κ= 0.634 across all 50
    micro-worlds. We evaluate six baseline configurations spanning truncated context,
    long-context LLMs, retrieval-augmented generation (RAG), and memory systems. The
    best baseline (RAG-Both) achieves 0.358 overall F1 and 0.342 on Hybrid. Document-only
    retrieval (RAG-Doc) collapses to 0.267 on Hybrid despite achieving 0.453 on Doc-only
    questions, demonstrating a clear joint-retrieval gap that motivates architectures
    unifying conversational memory with long-document navigation. We release the dataset,
    generation pipeline, and all baseline implementations.'
- title: 'GateMem: Benchmarking Memory Governance in Multi-Principal Shared-Memory
    Agents'
  date: 2026-06
  url: https://arxiv.org/abs/2606.18829
  category: evaluation
  subcategory: non-agentic
  authors:
  - Zhe Ren
  - Yibo Yang
  - Yimeng Chen
  - Zijun Zhao
  - Benshuo Fu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Memory benchmarks for LLM agents largely assume single-user settings,
    leaving shared assistants for hospitals, workplaces, campuses, and households
    understudied. In these deployments, multiple principals write to a common memory
    pool and query it under different roles, scopes, and relationships, so memory
    quality requires governance as well as recall. We introduce GateMem, a benchmark
    for multi-principal shared-memory agents. GateMem jointly evaluates utility for
    legitimate long-horizon requests with state updates, access control across contextual
    authorization boundaries, and agent-facing active forgetting after explicit deletion
    requests. It spans medical, office, education, and household domains, with long-form
    multi-party episodes, incremental memory injection, hidden checkpoints, structured
    judging, and leak-target annotations. Across diverse baselines and backbone models,
    no method simultaneously achieves strong utility, robust access control, and reliable
    forgetting. Long-context prompting often yields the best governance score at high
    token cost, while retrieval-based and external-memory methods reduce cost yet
    still leak unauthorized or deleted information. These results show current memory
    agents remain far from reliable shared institutional deployment.
- title: 'Continual LLM Upcycling: A Predictor-Gated Bank-Wise Sparsity Training Recipe
    for Dense-to-Sparse LLMs'
  date: 2026-06
  url: https://arxiv.org/abs/2606.10722
  category: evaluation
  subcategory: non-agentic
  authors:
  - Ruixuan Huang
  - Jinyuan Shi
  - Hantao Huang
  - Yifan Huang
  - Ziyi Guan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We study dense-to-sparse continual training as a way to construct channel-sparse
    large language models from dense checkpoints. Starting from a Qwen2.5-8B dense
    backbone, we continue training at 32K context and introduce a predictor-gated
    sparse SwiGLU FFN in the 32K stage. For each token and layer, we use a low-rank
    predictor to produce FFN-channel routing logits. We then apply a bank-wise top-k
    rule to retain 16 channels in every 64-channel bank, yielding 4x sparsity in the
    FFN intermediate activation. Unlike post-hoc sparse inference methods, the routing
    module is placed on the main language modeling path and optimized during continual
    training, enabling the dense model to be upcycled into a hardware-oriented sparse
    model. We report the architecture, training recipe, benchmark performance, and
    training lessons. We also identify a layer-local long-context failure mode on
    RULER-CWE and propose a single-layer repair algorithm that substantially improves
    the affected length range.
- title: Does AI Reviewer See the Full Picture? Attacking and Defending Multimodal
    Peer Review
  date: 2026-06
  url: https://arxiv.org/abs/2606.12716
  category: evaluation
  subcategory: non-agentic
  authors:
  - Xinyu Zhao
  - Rana Muhammad Shahroz Khan
  - Zhen Xu
  - Zhen Tan
  - Tianlong Chen
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The integration of Large Language Models (LLMs) and Multimodal LLMs (MLLMs)
    into scientific peer-review workflows introduces novel and significant risks for
    adversarial manipulation, especially given the multimodal nature of scientific
    papers where figures, not just text, convey core evidence. This creates a significant
    gap: current robustness studies on AI peer-review are overwhelmingly text-only.
    Moreover, the problem is distinct from standard jailbreaking, as a peer-review
    attack seeks to induce a domain-specific, targeted failure (e.g., "inflate this
    score") rather than a general safety policy violation, for which no practical
    defenses exist. To address this, we introduce PaperGuard, the first comprehensive
    benchmark designed to systematically evaluate and defend AI-generated peer-review
    against these domain-specific, cross-modal attacks. Our framework is built on
    three pillars: (1) a new multimodal peer-review dataset spanning multiple scientific
    domains; (2) a unified suite of attacks, including black-box prompt injections
    and white-box perturbations, specifically designed to target both text (GCG) and
    figures (PGD); and (3) a practical defense, motivated by the long-context challenge
    of academic papers, that uses chunk-based embedding search to efficiently localize
    and mitigate harmful instructions. Our extensive experiments, conducted across
    state-of-the-art models, confirm that AI reviewers are pervasively vulnerable.
    PaperGuard establishes the foundational benchmark, protocols, and actionable defense
    necessary to pioneer trustworthy, attack-resilient AI-assisted scholarly reviewing.'
- title: 'Beyond LLM-Based Reasoning: Lightweight GNNs for Agent Failure Attribution'
  date: 2026-08
  url: https://arxiv.org/abs/2608.18575
  category: evaluation
  subcategory: non-agentic
  authors:
  - Ting-Wei Li
  - Yuanchen Bei
  - Xiao Lin
  - Hanghang Tong
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language model (LLM)-based multi-agent systems (MAS) often exhibit
    complex failure modes, which frequently cause agents to produce incorrect outcomes.
    This motivates the task of Agent Failure Attribution: given a failed multi-agent
    trajectory, identify the faulty agents and their corresponding error types. Existing
    approaches predominantly rely on LLMs to perform failure attribution, either through
    direct prompting, fine-tuning on synthetic data or complex agentic pipelines.
    While effective, these methods incur substantial computational overhead due to
    long-context processing, expensive post-training and handcrafted workflows. Moreover,
    empirical evidence shows that even state-of-the-art models achieve limited accuracy
    on existing benchmarks, suggesting that scaling model size alone is insufficient.
    In this work, we revisit this task and question the necessity of such expensive
    generative solutions. We introduce AFANet, a lightweight graph-based framework
    that models interaction trajectories through step-level semantic signals and agent-level
    relationships. We show that with significantly fewer parameters and near-zero
    inference cost, AFANet (i) matches or outperforms LLM-based baselines, including
    fine-tuned models on in-domain benchmarks, (ii) maintains robust performance across
    different GNN architectures and (iii) can be further improved with inexpensive
    test-time adaptation on the OOD benchmark. Our results suggest that effective
    agent failure attribution does not require heavy LLM reasoning and a lightweight,
    structured approach can achieve strong performance.'
- title: 'ArborMem: Navigating Interaction States with Memory Forests'
  date: 2026-08
  url: https://arxiv.org/abs/2608.17534
  category: evaluation
  subcategory: non-agentic
  authors:
  - Zongwei Lv
  - Yuemeng Xu
  - Yilun Yao
  - Siyi Ding
  - Xinyu Tan
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Large language models increasingly serve as persistent conversational
    assistants, requiring memory that preserves relevant experience and maintains
    continuity across interactions. Existing methods improve access to conversational
    history through long-context processing, selective retrieval, and structured memory
    organization. However, most systems treat memory access as retrieving relevant
    past information without first determining which prior interaction state the current
    turn resumes. This limitation becomes particularly important when conversations
    interleave multiple tasks, people, and plans that may be interrupted and later
    revisited. We introduce ArborMem, an online memory framework that represents a
    long-running conversation as a navigable forest of interaction states. Each branch
    preserves a locally coherent trajectory, while the forest maintains multiple trajectories
    that may later be resumed. For each new input, ArborMem localizes the relevant
    state, restores its branch-local context, and augments it with reusable evidence
    retrieved across branches, preserving interaction continuity without conflating
    semantically related but structurally distinct trajectories. Existing long-term
    memory benchmarks cover diverse memory and reasoning capabilities but do not explicitly
    isolate branch-structured challenges. We therefore introduce BranchMemEval, a
    controlled diagnostic benchmark for interleaved and resumable interaction trajectories.
    Experiments on LongMemEval, LoCoMo, BEAM 100K, and BranchMemEval show that ArborMem
    outperforms the strongest baselines by 3.36 to 10.31 percentage points on the
    three established benchmarks and by 5.0 points on BranchMemEval. Its advantage
    grows under constrained read budgets, while complete memory queries remain below
    half a second.
- title: 'MoNe: Modular Neural Memory for Efficient Long Context Inference'
  date: 2026-08
  url: https://arxiv.org/abs/2608.17616
  category: evaluation
  subcategory: non-agentic
  authors:
  - Wonguk Cho
  - Kyubyung Chae
  - Tribhuvanesh Orekondy
  - Sunghyun Park
  - Hyoungwoo Park
  venue: ''
  code_url: ''
  project_url: ''
  abstract: We present MoNe, a lightweight modular neural memory that attaches to
    any frozen pretrained Transformer to enable long-context inference without retraining.
    MoNe reads context in fixed-size segments via test-time learning of fast-weight
    neural memory networks with layer-localized gradient updates; at inference, the
    memory generates keys and values from the query tokens alone, with no context
    tokens re-read. This two-phase design decouples inference cost from context length,
    achieving O(N) preprocessing and O(1) query cost with peak GPU memory that does
    not grow with N. At 128K tokens, MoNe reduces both compute and peak GPU memory
    by approximately 80% compared to ICL with only 6.4% parameter overhead. MoNe generalizes
    to context lengths far beyond the backbone's native window, achieving strong performance
    on needle-in-a-haystack and word extraction benchmarks from RULER, where ICL degrades
    sharply.
- title: 'G-Long: Graph-Enhanced Memory Management for Efficient Long-Term Dialogue
    Agents'
  date: 2026-06
  url: https://arxiv.org/abs/2606.13115
  category: evaluation
  subcategory: non-agentic
  authors:
  - Minjun Choi
  - Yoonjin Jang
  - Sangwon Youn
  - Youngjoong Ko
  venue: ''
  code_url: ''
  project_url: ''
  abstract: While Large Language Models (LLMs) have advanced open-domain dialogue
    systems, maintaining long-term consistency remains a challenge due to inherent
    limitations in long-context reasoning and the inefficiency of processing extensive
    raw text. Existing approaches typically rely on either unstructured memory storage,
    which is prone to information loss, or computationally expensive LLMs that incur
    high latency. To address these limitations, we propose G-Long, a graph-enhanced
    framework that utilizes a fine-tuned small Language Model (sLM) for structured
    triplet extraction and associative retrieval, significantly reducing operational
    costs. Furthermore, we introduce the novel attention-aware importance scoring
    mechanism that leverages the intrinsic cross-attention signals of a T5 summarizer
    to identify salient memories. Extensive experiments across diverse benchmarks
    demonstrate that G-Long achieves state-of-the-art performance in both response
    generation and memory retrieval, yielding performance gains of up to 9.8% in response
    quality on MSC and 40.8% in retrieval recall on LME, while significantly minimizing
    computational overhead.
- title: 'MemTrace: Tracing and Attributing Errors in Large Language Model Memory
    Systems'
  date: 2026-05
  url: https://arxiv.org/abs/2605.28732
  category: evaluation
  subcategory: non-agentic
  authors:
  - Xinle Deng
  - Ruobin Zhong
  - Hujin Peng
  - Xiaoben Lu
  - Yanzhe Wu
  venue: ''
  code_url: https://github.com/zjunlp/MemTrace
  project_url: ''
  abstract: Memory is essential for enabling large language models to support long-horizon
    reasoning, yet existing memory systems remain unreliable and difficult to debug.
    Tracing memory's dynamic evolution is crucial to understand how information is
    synthesized, propagated, or corrupted over time. In this work, we study the new
    problem of error tracing and attribution in LLM memory systems. We propose a novel
    framework that transforms memory pipelines into executable memory evolution graphs,
    enabling fine-grained tracing of operational information flow. We then construct
    MemTraceBench, a benchmark collected from representative memory systems such as
    Long-Context, RAG, Mem0, and EverMemOS, to systematically study memory failure
    modes. We further introduce an automatic attribution method that iteratively traces
    operation subgraphs to pinpoint the root cause of any failed case. Our analysis
    reveals that memory failures are systematic, stemming from operation-level issues
    like information loss and retrieval misalignment. Crucially, we leverage these
    fine-grained attribution signals to guide downstream prompt optimization, establishing
    a closed-loop system that automatically corrects faults and boosts end-task performance
    by up to 7.62%. Code will be released at https://github.com/zjunlp/MemTrace.
- title: 'AgentCL: Toward Rigorous Evaluation of Continual Learning in Language Agents'
  date: 2026-06
  url: https://arxiv.org/abs/2606.02461
  category: evaluation
  subcategory: non-agentic
  authors:
  - Yiheng Shu
  - Bernal Jiménez Gutiérrez
  - Saisri Padmaja Jonnalagedda
  - Yuguang Yao
  - Huan Sun
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Language agents spend substantial inference time solving individual tasks,
    yet the experience acquired in one episode is often underutilized in future episodes.
    Continual learning expects an agent to accumulate reusable experience across a
    stream of tasks, improve over time, and avoid interference from irrelevant experiences.
    Unfortunately, existing benchmarks struggle to evaluate continual learning in
    language agents rigorously. Most efforts focus on retrieval and reasoning over
    long-context conversations or documents, while recent lifelong-adaptation benchmarks
    often rely on naive task streams with limited analysis of cross-task relationships,
    making it difficult to understand what an agent learns and reuses over time. This
    paper presents an evaluation framework AgentCL for continual learning in agents,
    centered on controlled task streams and metrics for transfer gains. AgentCL constructs
    compositional streams where earlier sub-solutions, evidence, or workflows are
    intentionally reusable in later tasks, and contrasts them with naive streams where
    such reusability is not guaranteed. We use the benchmark to evaluate non-parametric
    memory designs for continual learning. To diagnose how memory design choices affect
    continual learning, we develop MemProbe, a probing method that stores interactions,
    insights, and skills, while filtering unreliable experiences during consolidation.
    Empirical analysis across coding, deep research, and language understanding/reasoning
    tasks shows that naive streams offer limited ability to distinguish memory designs,
    whereas controlled streams more clearly distinguish their plasticity. Meanwhile,
    naive and held-out settings often yield limited gains and can expose memory-induced
    degradation. These results highlight the need for stronger memory designs that
    balance plasticity and stable reuse.
- title: 'EpiBench: Can LLMs Understand Epitopes for Antibody Drug Discovery?'
  date: 2026-08
  url: https://arxiv.org/abs/2608.06022
  category: evaluation
  subcategory: non-agentic
  authors:
  - Zirui Wang
  - Jiaqi Wang
  - Qinghan Wang
  - Yuzhi Xu
  - Gang Du
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Epitopes determine where antibodies bind antigens and shape downstream
    therapeutic properties such as functional blockade and escape resistance, making
    epitope understanding central to antibody drug discovery. Although large language
    models (LLMs) have shown strong biomedical reasoning ability, it remains unclear
    whether they can infer epitope information directly from antigen and antibody
    sequences. Existing epitope resources typically focus on isolated prediction tasks
    or rely on specialized structural settings, while general protein benchmarks do
    not evaluate epitope-centered decisions across the antibody development workflow.
    To address this gap, we introduce EpiBench, a closed-book, sequence-based, and
    automatically scorable benchmark for evaluating epitope reasoning in LLMs. EpiBench
    contains 1,609 curated samples grounded in structural antibody--antigen contacts,
    curated functional B-cell assays, and deep mutational scanning escape measurements.
    It covers five connected tasks: targetable region discovery, antibody-conditioned
    epitope identification, epitope binning, functional epitope assessment, and antibody
    escape assessment, with controlled sampling to reduce shortcut-based evaluation
    artifacts. We evaluate nine general-purpose LLMs and analyze their behavior through
    task-specific baselines, antigen length stratification, explicit-reasoning comparison,
    and failure-mode inspection. The results show that current LLMs capture partial
    epitope-related signals but remain limited in antibody-specific sequence grounding,
    long-context residue localization, and biologically grounded reasoning. Therefore,
    EpiBench provides a diagnostic testbed for measuring and improving sequence-aware
    biomedical LLMs toward reliable LLM-assisted antibody discovery.'
- title: 'Harness the Memory: A Holistic Evaluation of Memory Substrates in Memory
    Agents'
  date: 2026-08
  url: https://arxiv.org/abs/2608.15008
  category: evaluation
  subcategory: non-agentic
  authors:
  - Wei-Chieh Huang
  - Weizhi Zhang
  - Yuchen Wu
  - Yankai Chen
  - Eric Hanchen Jiang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Memory is becoming core infrastructure for long-horizon LLM agents, yet
    existing evaluations offer limited guidance on which memory substrate, namely
    the underlying medium in which memory is represented and stored, should be used
    under different operating regimes. We present a controlled harness evaluation
    of memory substrates for memory-augmented agents, covering dense and sparse indices,
    text records, structural stores, hierarchical stores, refinement-based memories,
    parametric updates, and activation-compatible context mechanisms. Across three
    backbone models and four benchmark suites spanning user-centric question answering
    and agent-centric decision-making, we instrument 26 performance and efficiency
    metrics under a unified harness. Our results show that no single substrate consistently
    dominates: broad retrieval benefits long-context factual QA, while excessive retrieval
    can harm sequential decision-making by shifting attention away from action-critical
    context. Scalability introduces a further routing axis, as substrates that perform
    well at moderate history lengths can become costly or brittle at longer horizons.
    These findings motivate substrate routing as a necessary component of adaptive
    agent memory systems and provide empirical guidance for designing efficient, reliable,
    and regime-aware long-term memory for LLM agents. Code will be made available
    upon acceptance.'
- title: Modality-Driven Search with Holistic Trace Judging for ARC-AGI-2
  date: 2026-06
  url: https://arxiv.org/abs/2606.31543
  category: evaluation
  subcategory: non-agentic
  authors:
  - Johan Land
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language models can produce fluent, internally coherent reasoning
    traces for abstract reasoning tasks while still being confidently wrong - making
    selection among candidates, not just generation, the central challenge. I present
    a solver for ARC-AGI-2, a few-shot visual reasoning benchmark, built around two
    principles: (i) treating reasoning modalities as search operators, generating
    diverse candidates independently across text, image, and code channels, and (ii)
    context-preserving holistic judging, in which a judge model jointly compares all
    candidate reasoning traces within a single long-context prompt. Unlike self-consistency
    or majority voting, this approach reliably recovers correct minority hypotheses
    on tasks where the modal answer is wrong. On the ARC Prize semi-private evaluation
    set, the solver achieves 72.9 percent at USD 38.99 per task - the highest score
    on the verified leaderboard at the time of writing, exceeding the best standalone
    frontier models, GPT-5.2 Pro at 54.2 percent and Gemini 3 Pro at 54.0 percent,
    by +18.7 percentage points. On the public evaluation set, it achieves 76.1 percent
    at USD 19.69 per task. I release the full source code and document extensive negative
    results, including the finding that prescriptive prompting templates and iterative
    refinement systematically reduce hypothesis diversity and degrade performance.'
- title: Give it Space! Explicit Disentangling of Positional and Semantic Representations
    in Encoders
  date: 2026-05
  url: https://arxiv.org/abs/2605.30022
  category: evaluation
  subcategory: non-agentic
  authors:
  - Pierre-Antoine Lequeu
  - Camille Barboule
  - Benjamin Piwowarski
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Positional encoding (PE) underpins how permutation-invariant Transformers
    represent sequence order, yet how positional information is processed and stored
    remains poorly understood. Modern PE methods such as RoPE still struggle on tasks
    such as long-context understanding or retrieval cite{chen-etal-2025-hope. Hence,
    a better understanding of the internal positional mechanism could help design
    better PE. Building on evidence that positional and semantic signals occupy nearly
    orthogonal subspaces in trained Transformers, we modify an encoder Transformer
    to process three explicitly disentangled streams: semantic, absolute positional
    (AP) and relative positional (RP), and confine the masked-language-modeling (MLM)
    objective to the semantic stream. This decoupling enables a clean mechanistic
    study and yields three take-aways. (1) The isolated AP subspace spontaneously
    collapses into a low-frequency two-dimensional manifold that captures the structure
    of the document; (2) Attention heads specialize into structure and semantic-oriented
    groups, with RP exclusively supporting the latter; (3) Standard positional encodings
    do not robustly retain macroscopic structure: RoPE and RP only weakly encode it,
    and entangled AP loses it in the final layers under MLM pressure. The disentangled
    approach preserves positional encoding, which improves linguistic representation
    on 49 of the 65 linguistic phenomena of the Flash-Holmes probing benchmark.'
- title: Uncertainty-Aware Hybrid Retrieval for Long-Document RAG
  date: 2026-06
  url: https://arxiv.org/abs/2606.13550
  category: evaluation
  subcategory: non-agentic
  authors:
  - Hoin Jung
  - Xiaoqian Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Retrieval augmented generation (RAG) depends critically on the quality
    and granularity of retrieved evidence. Large retrieval units preserve context
    but often introduce irrelevant content, which can dilute answer bearing evidence
    and worsen long context utilization. Fine-grained units are more compact, but
    they may be difficult to retrieve reliably because short chunks can lack semantic,
    lexical, or bridging cues needed to match the query. We propose Uncertainty-aware
    Multi-Granularity RAG (UMG-RAG), a training-free hybrid retrieval framework that
    treats chunk granularity as query-specific reliability estimation. Instead of
    training a new retriever or modifying the generator, UMG-RAG uses existing dense
    and sparse retrievers as complementary experts across multiple chunk granularities.
    For each query, it converts each expert-granularity score list into an evidence
    distribution, estimates reliability from distribution entropy, and fuses candidates
    according to query-specific semantic, lexical, and granularity confidence. We
    further introduce UMGP-RAG, a parent promotion variant that uses fine-grained
    hits to locate relevant evidence while returning broader non-redundant parent
    chunks for local coherence. Experiments on question answering benchmarks show
    that uncertainty-aware fusion and parent promotion improve generation quality
    while maintaining a lightweight, plug-and-play retrieval pipeline.
- title: 'Transformer-Based Language Models Across Domain Verticals: Architectures,
    Applications and Critical Assessment'
  date: 2026-06
  url: https://arxiv.org/abs/2606.24331
  category: evaluation
  subcategory: non-agentic
  authors:
  - Guruprakash J
  - Krithika L. B
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Transformer-based language models have become the default substrate for
    natural language processing and the pace of new releases has made it hard for
    practitioners to separate durable ideas from the noise of incremental announcements.
    This review works at two levels. At the level of mechanism, we organise the main
    transformer families into a working taxonomy, covering encoder-only, decoder-only,
    encoder-decoder, long-context, permutation-based, and generator-discriminator
    variants. We then extend the discussion to post-2023 developments that changed
    the picture in practice: instruction tuning, reinforcement learning from human
    feedback, direct preference optimisation, mixture-of-experts scaling, retrieval
    augmentation and the current flagship model families from OpenAI, Anthropic, Google,
    Meta, Mistral and DeepSeek. At the level of use, we survey deployments across
    healthcare, finance, legal, education, customer service, creative writing and
    scientific work. Based on this we link each to the specific capabilities that
    make a transformer the appropriate tool. The contribution of this paper is a critical
    assessment that is based on the survey. We compare architectures on four axes
    that matter to deployment decisions, we quantify the trade-off between parameter
    count and energy cost. We also discuss how alignment methods, data provenance
    and benchmark saturation change what it means to call a model "state of the art".
    The final section lists the research questions that we think deserve more attention.'
- title: 'MemDefrag: Latent Memory Defragmentation for Large Language Models'
  date: 2026-07
  url: https://arxiv.org/abs/2607.05969
  category: evaluation
  subcategory: non-agentic
  authors:
  - Ruiyi Yan
  - Zhuoyuan Mao
  - Yiwen Guo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Latent memory, which stores past knowledge fragments as per-layer hidden
    states, has emerged as a promising paradigm (e.g., MemoryLLM and M+) for long-term
    memory in large language models (LLMs). However, the paradigm suffers from significant
    performance degradation during memory updates, due to positional encoding misalignment
    and the absence of any tracing mechanism to distinguish target memory fragments
    from irrelevant ones. To discover such a tracing mechanism, we probe the layer-wise
    attention density over stored memory fragments, and find that a small set of middle
    transformer layers consistently concentrates the highest density on the target
    fragment - exposing an inherent tracing signal. In light of this, we propose MemDefrag,
    a training-free and model-agnostic framework that (1) uses a middle-layer tracing
    signal to conduct memory defragmentation (rank, reorder, and filter memories),
    and (2) applies an informativeness-guided proportional forgetting mechanism once
    capacity is exceeded. Experiments show that MemDefrag substantially outperforms
    MemoryLLM and M+ on knowledge retention (e.g., 43.0% vs. 17.4%/17.6% after 50
    memory updates) and long-context benchmarks, and generalizes well across various
    LLMs and latent-memory variants. The code is available at github.com/ryehr/MemDefrag.
- title: 'Reduced Matrix Multiplication: Input-Adaptive Matrix-Product Reduction for
    LLM Inference'
  date: 2026-08
  url: https://arxiv.org/abs/2608.13426
  category: evaluation
  subcategory: non-agentic
  authors:
  - Zixuan Lan
  - Yanhong Li
  - Jiawei Zhou
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Transformer-based language models achieve strong performance but incur
    substantial inference cost due to repeated high-dimensional matrix multiplications.
    We propose Reduced Matrix Multiplication (RMM), a training-free, input-adaptive
    inference method that reduces Transformer matrix products by selecting informative
    slices along their contraction dimensions, without modifying model weights. Under
    a simple retention-ratio control, RMM provides a smooth and predictable accuracy-efficiency
    trade-off. Across language models ranging from 1B to 70B parameters, we find that
    reduction tolerance depends on the model family, task, component, and retention
    ratio, although it often improves with model scale. Under moderate reduction,
    RMM remains robust across the evaluated discriminative, autoregressive generation,
    and long-context settings. We further show that the same principle extends to
    multimodal vision-language inference. Mechanistic ablations reveal a structural
    asymmetry within Transformers: attention-side computations are substantially more
    reducible than MLP components. Finally, wall-clock benchmarks with custom kernels
    on an NVIDIA A100 show that these computational savings can translate into practical
    runtime gains, especially at longer sequence lengths. Together, these results
    position RMM as a scalable direction for input-adaptive inference-time optimization.'
- title: Inject or Navigate? Token-Efficient Retrieval for LLM Analysis of Transactional
    Legal Documents
  date: 2026-07
  url: https://arxiv.org/abs/2607.05764
  category: evaluation
  subcategory: non-agentic
  authors:
  - Mahmoud Hany
  - Mourad ElSheraey
  - Mahmoud Said
  - Peter Naoum
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Answering questions over a set of transactional legal documents is most
    simply done by injecting the whole corpus into the LLM''s context window on every
    query. That baseline maximises retrieval recall, but its token footprint scales
    with the corpus rather than the question, and long-context degradation scales
    with it. We report what it took to replace full-corpus injection in a legal-document
    analysis system, comparing it against two structured retrieval modes over our
    proprietary structure-aware chunking: embedding retrieval (NAVEMBED) and LLM navigation
    over a compact structured index (NAVINDEX). On a 20-question benchmark with verified
    ground-truth answers, a position-bias-controlled, reference-anchored pairwise
    judge scored semantic retrieval with reranking tied with injection on 16 of 18
    document-bound questions (injection preferred on 2) while attending to 17.3x fewer
    input tokens (a general-text-embedding (GTE) configuration reaches 29.9x at a
    lower tie rate); both modes were judged tied on the 2 out-of-scope controls. NAVINDEX
    was judged tied on all 18 at a 1.61x smaller total token footprint, a ~56x smaller
    answering context, and 25% lower dollar cost. We derive a closed-form caching-crossover
    rule: cached injection is cheaper in dollars only while the corpus stays below
    roughly ten times the retrieval payload. Scope and uncertainty are quantified
    in Section 8.'
- title: 'Lost at the End: Primacy Bias in Multimodal Retrieval-Augmented Question
    Answering'
  date: 2026-06
  url: https://arxiv.org/abs/2606.16494
  category: evaluation
  subcategory: non-agentic
  authors:
  - Jieyuan Liu
  - Jianyang Gu
  - Shijie Chen
  - Jefferson Chen
  - Zhen Wang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Knowledge-based visual question answering (KB-VQA) lets vision-language
    systems answer questions that exceed their parametric knowledge by conditioning
    a reader on passages retrieved from a Wikipedia-scale knowledge base. In pure-text
    long-context LLMs, retrieved-context use follows the U-shaped "lost-in-the-middle"
    effect of Liu et al. (2024): information at the start and end of context is used,
    the middle is lost. Whether this transfers to deployed multimodal KB-VQA is open.
    To close this gap, we design the first controlled probe of reader-side position
    dependence in multimodal KB-VQA: a gold-position protocol in which only the gold
    passage''s prompt slot varies within question. We run it on three open-source
    7B/8B VLM readers and two KB-VQA benchmarks at k up to 20. The shape flips from
    U to primacy: gold-at-first beats gold-at-last by 16 to 26 points on every reader-by-benchmark
    cell, an effect we call "Lost at the End". Three targeted ablations narrow the
    cause: a text-only control shows the multimodal setting amplifies an already-present
    text-mode primacy 2.2 to 4.5 times, and image-position and distractor-shuffle
    ablations together pin the locus to prompt slot 0 of the instruction-tuned reader.
    On a frozen reader, three retrieval-side fixes (MMR, oracle reranking, rank-based
    reordering) all leave the gap intact (no separable improvement). Our findings
    indicate that recall@k is the wrong metric for deployed KB-VQA and that closing
    the gap requires reader-side intervention; we release our protocol as a controlled
    instrument for evaluating such interventions.'
- title: 'WildTrace: Benchmarking Natural Evidence Trails in Long-Context Reasoning'
  date: 2026-07
  url: https://arxiv.org/abs/2607.09328
  category: evaluation
  subcategory: non-agentic
  authors:
  - Zixin Chen
  - Peng Liu
  - Haobo Li
  - Rui Sheng
  - Jianhong Tu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Answering complex questions over long documents frequently requires integrating
    evidence that the source itself disperses naturally across distant passages. In
    an incident report, the operating condition, design flaw, and missed safety check
    that jointly explain a disaster may appear dozens of sections apart; in a novel,
    a character's true motive may surface only through scenes far removed from the
    moment it becomes relevant. This source-internal evidence integration is central
    to real-world long-document analysis, yet existing benchmarks largely sidestep
    it. Needle probes, planted facts, and reverse-engineered multi-hop chains embed
    evidence that may differ from the host text in distribution, placement, or register,
    making it unclear whether strong performance reflects genuine source reasoning
    or distributional artifacts. We introduce WILDTRACE, a benchmark of 481 tasks
    over 214 naturally occurring long-form sources such as technical incident reports
    and lesser-known literary narratives, where all evidence trails arise from the
    document's own causal, temporal, and narrative logic. Drawing on Pearl's causal
    hierarchy and prior multi-hop reasoning typologies, we define seven source-internal
    evidence geometries that characterize the distinct relational demands of analytical
    reading in long documents. A source-first construction pipeline mines candidate
    trails from document structure before writing questions; each item then undergoes
    multi-stage validation covering clue necessity, answer groundedness, rubric fidelity,
    contamination resistance and answerability. As models are increasingly entrusted
    with real-world high-stakes analytical tasks, this gap between accessing information
    and reasoning over naturally dispersed evidence emerges as a defining challenge
    for the next stage of long-context research.
- title: 'Distractor-Aware Truncation: Disentangling Context-Length Effects from Signal
    Loss in Long-Context LLM Benchmarks'
  date: 2026-08
  url: https://arxiv.org/abs/2608.03297
  category: evaluation
  subcategory: non-agentic
  authors:
  - Mohsen Arjmandi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'A standard claim in the literature on retrieval-augmented and memory-augmented
    language models is that shorter context is better when the relevant information
    is preserved. We test this claim by running every sample of two long-context benchmarks
    -- BABILong and GraphWalks (BFS) -- at four context-retention fractions (100%,
    75%, 50%, 25%) under two truncation protocols. The first is the naive protocol
    implicitly used in much prior work: drop content from the middle of the prompt.
    The second is distractor-aware: identify the task-relevant content for each sample
    and drop only the rest. We evaluate three sizes of the Claude family (Haiku 4.5,
    Sonnet 4.6, Opus 4.7) and, to test cross-provider generality, GPT-5.5 from a different
    provider; we apply the same protocol to two further benchmarks (MRCR v2, Oolong).
    Under naive truncation, score collapses monotonically (paired Wilcoxon, Holm-corrected
    padj < 0.05 in all eight BABILong and GraphWalks cells). Under the distractor-aware
    protocol -- which preserves the signal by construction -- performance is preserved
    or improves: the two smaller Claude models show statistically significant gains
    on BABILong, while the larger models (Opus 4.7 and GPT-5.5) sit at their full-context
    ceiling. The naive collapse and its distractor-aware recovery replicate on GPT-5.5,
    ruling out a single-provider artifact. The mechanism is direct: under the naive
    protocol the answer-bearing content survives in fewer than 1% of samples at 25%
    retention; under the distractor-aware protocol it is preserved by construction.
    The naive protocol is therefore not a measurement of context-window effects; it
    is a measurement of how often middle-removal happens to spare the answer. We conclude
    that future studies of context-length effects must specify how they distinguish
    signal from distractor, or they are at best ambiguous between two opposite hypotheses.'
- title: 'Quantization-Aware Healing: A Practical Recipe for Recovering Compressed,
    4-Bit LLMs'
  date: 2026-08
  url: https://arxiv.org/abs/2608.20953
  category: evaluation
  subcategory: non-agentic
  authors:
  - Bakbergen Ryskulov
  - Iker García-Ferrero
  - David Montero
  - David Jansen
  - Ali Hashemi
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Serving large language models cheaply increasingly means shipping models
    that are both structurally compressed to a fraction of their parameters and quantized
    to 4 bits. Together these steps degrade reasoning, mathematics, coding, and long-context
    behavior enough to require a recovery, or healing, stage before deployment. The
    default recipe, quantization-aware training (QAT), re-fits the compressed, quantized
    model to hard labels; in our pipeline it converged slowly and collapsed past its
    peak. We adopted Quantization-Aware Healing (QAH) instead. Because a structurally
    compressed model is never independently trained at full precision, its bfloat16
    checkpoint is a distillation-recovered approximation of the original; QAH distills
    the 4-bit student directly from the original, uncompressed model. On a GPT-OSS
    120B to 60B to MXFP4 pipeline, the QAH student matches or beats its bfloat16 source
    on 7 of 9 benchmarks at roughly 4 times less weight memory and half the teacher's
    parameter count, and is released open-weight as Hypernova-60B. Against a matched
    QAT baseline it reaches a comparable peak about 7 times faster and stays stable
    under continued training, without hand-tuned early stopping. We also report deployment
    lessons, including a large, reproducible quality gap between distributed-training
    backends. Our aim is a recipe deployable without a multi-week hyper-parameter
    search.
- title: A Sovereign, Open-Source Foundation Model for German and English
  date: 2026-07
  url: https://arxiv.org/abs/2607.09424
  category: evaluation
  subcategory: non-agentic
  authors:
  - Soofi-Team
  - ':'
  - Benedikt Droste
  - David Fitzek
  - Ruben Härle
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We present Soofi S 30B-A3B, a sovereign, open-source Mixture-of-Experts
    (MoE) hybrid Mamba Transformer foundation model for German and English. Its hybrid
    design activates only 3B of 30B parameters per token and keeps the inference cache
    near-constant as context grows, giving it a decisive throughput advantage over
    dense models for long-context, high-concurrency deployment. Pretrained on roughly
    27 trillion tokens with deliberately up-weighted German, Soofi S matches dense
    14 to 27B models on aggregate English and German benchmarks while achieving the
    best code aggregates in both languages among 17 open base models, and outperforms
    every European sovereign baseline in our comparison, including ones far larger
    in active parameters. Among fully open models, Soofi S obtains the highest English
    and German evaluation scores, ahead of Olmo 3 32B and Apertus 70B. Soofi S was
    built end-to-end on the German Industrial AI Cloud, a sovereign HPC scale AI infrastructure
    operated by Deutsche Telekom in Munich. Soofi S will be released under highly
    permissive, open-access terms: weights, selected intermediate checkpoints, full
    per-source data accounting, hyperparameters, and training and evaluation code.
    Where source licenses permit, data-construction artifacts are released under permissive
    licenses; commercially licensed sources are documented with aggregate statistics
    and exact mixture accounting.'
- title: 'Magnifying What Matters: Attention-Guided Adaptive Rendering for Visual
    Text Comprehension'
  date: 2026-06
  url: https://arxiv.org/abs/2606.12898
  category: evaluation
  subcategory: non-agentic
  authors:
  - Shenglai Zeng
  - Qirui Wang
  - Kai Guo
  - Xinnan Dai
  - Xianxuan Long
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Visual Text Comprehension (VTC) renders text into images for a vision-language
    model (VLM) to read, sidestepping LLM context-window limits and powering applications
    from long-page OCR to multi-page memory QA. Yet existing VTC pipelines treat rendering
    and layout as a fixed, content-agnostic preprocessing step and offer little mechanistic
    understanding of how VLMs internally process visualized text. Through a focused
    empirical study on VTC QA tasks, we reveal that VLMs exhibit a localization-without-utilization
    regime: evidence-localizing attention emerges sharply in the middle-to-late layers
    and is largely decoupled from answer correctness, yet simply enlarging the localized
    spans on the rendered page recovers a large fraction of the failures. Building
    on these observations, we propose AGAR (Attention-Guided Adaptive Rendering),
    a training-free, model-agnostic method that leverages a VLM''s own middle-to-late
    layer attention to identify the top-K important visual patches, maps them back
    to word spans, and re-renders the page with those spans enlarged before re-inferring
    the answer. Extensive experiments across nine VTC benchmarks (short-form, long-context,
    and multi-page memory QA) and four VLM backbones show that AGAR (i)consistently
    improves off-the-shelf VLMs as a plug-and-play enhancement, (ii)composes with
    VLM post-training to yield further gains, and (iii)remains robust under both visual-
    and text-side input degradation.'
- title: Are the Financial Reasoning from LLMs Credible? A Real World Test over Long-Horizon
    Statements
  date: 2026-07
  url: https://arxiv.org/abs/2607.28661
  category: evaluation
  subcategory: non-agentic
  authors:
  - Xinke Tong
  - Xuanming Zhang
  - Tianyi Tang
  - An Yang
  - Jiatu Hu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Do Large Language Models (LLMs) possess genuine structural reasoning,
    or merely rely on surface-level pattern matching? The financial domain, demanding
    numerical precision and multi-step logic over long contexts, is an ideal testbed.
    Existing benchmarks fail to capture real-world industrial complexity, predominantly
    relying on multiple-choice questions or single-hop QA over cropped tables while
    ignoring intricate cross-statement dynamics and temporal de-cumulation. To bridge
    this gap, we introduce FinIndices, a large-scale benchmark evaluating data-processing
    fidelity over uncropped financial statements (up to 32K tokens). Utilizing an
    automated synthesis pipeline with adversarial traps, FinIndices encompasses Single-Index
    computation and Table-Index tabulation to test complex domain, temporal, and caliber
    reasoning. Our evaluation reveals two severe LLM vulnerabilities. First, a "Knowledge
    Bottleneck": despite memorizing formulas during pre-training, models demonstrate
    fragile pattern matching. Removing explicit formula hints causes performance to
    collapse (e.g., Gemini-3.1-Pro drops from 70.70% to 38.22% on table tasks), exposing
    fatal flaws in temporal de-cumulation and stock-flow caliber mismatch. Second,
    a "Structural Bottleneck": the intense cognitive load of generating multi-metric,
    multi-period tables actively drains reasoning capacity. Under structural pressure,
    LLMs that flawlessly execute isolated derivations regress to shallow heuristics,
    such as fetching incorrect adjacent columns or substituting deep accounting adjustments
    with lazy literal arithmetic. Finally, Supervised Fine-Tuning (SFT) yields substantial
    zero-hint gains (+8.54% Single, +3.82% Table), validating that structured logic
    can be partially restored via data-centric alignment.'
- title: 'EvoWiki: Incremental State Overwriting and Traceable Question Answering
    for Cross-Meeting Knowledge Evolution'
  date: 2026-08
  url: https://arxiv.org/abs/2608.23265
  category: evaluation
  subcategory: non-agentic
  authors:
  - Dongsheng Chen
  - Tianyu Wang
  - Wenhui Que
  venue: ''
  code_url: ''
  project_url: ''
  abstract: In long-term collaboration spanning multiple meetings, factual states
    such as decisions and risks are continually revised, overturned, and replaced.
    Existing long-context methods typically stack the entire history, while many RAG
    and structured-memory methods organize knowledge as static or append-only facts
    and rely on semantic relevance at read time. Without explicit modeling of knowledge
    lifecycles, these approaches may retain conflicting old and new states simultaneously
    or discard history, leading to stale retrieval and answers that are difficult
    to verify. We present EvoWiki, an incremental question-answering architecture
    for dynamic long-form text. EvoWiki decouples offline incremental construction
    (BUILD) from online structured reading (READ). BUILD captures the intra-meeting
    micro-evolution from proposal to decision and uses entity version chains and a
    fine-grained State-Overwrite Protocol to explicitly distinguish current valid
    states from superseded history while preserving meeting-level provenance anchors.
    READ bypasses relevance-based Top-k retrieval and performs deterministic entity
    addressing, temporal resolution, and cross-entity multi-hop aggregation over the
    complete Wiki to produce grounded and traceable answers. We further introduce
    CrossMeet, a high-fidelity bilingual benchmark designed to simulate long-term
    state evolution, covering factual consistency, temporal reasoning, and cross-meeting
    multi-hop reasoning. Across six datasets and two reader models, EvoWiki improves
    macro-average Judge Accuracy over the strongest baselines by 9.72 and 10.00 percentage
    points, respectively. Human evaluation shows that EvoWiki is more robust and factually
    faithful under frequent state flips, validating valid-state-oriented reading as
    a reliable approach to cross-meeting knowledge evolution.
- title: 'WorldMemArena: Evaluating Multimodal Agent Memory Through Action-World Interaction'
  date: 2026-05
  url: https://arxiv.org/abs/2605.29341
  category: evaluation
  subcategory: non-agentic
  authors:
  - Chengzhi Liu
  - Yuzhe Yang
  - Sophia Xiao Pu
  - Yepeng Liu
  - Lin Long
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Multimodal large language models are increasingly deployed as long-horizon
    agents, where memory must do more than recall: it must track an evolving world,
    revise what has gone stale, and surface the right evidence at decision time. Existing
    benchmarks measure recall over static dialogue, collapse memory into a single
    end-of-task accuracy, and reduce visual observations to captions, leaving us unable
    to localize failures to writing, maintenance, retrieval, or use. The rise of agent
    harnesses that author their own memory sharpens this gap, since we have no principled
    way to compare hand-designed pipelines with self-managing alternatives. To close
    these gaps, we formulate multimodal agent memory as an Action-World Interaction
    Loop with an observable four-stage lifecycle, and instantiate it in WorldMemArena:
    400 multi-session multimodal tasks spanning Lifelong Evolution (evolving personal
    and task states) and Agentic Execution (memory from real observations, actions,
    and feedback), annotated with gold memory points, updates, distractors, and evidence
    chains for stage-level diagnosis. This enables the first head-to-head comparison
    of long-context, manually designed (RAG and external memory systems), and harness-based
    memory agents. Results show that: (1) better memory writing and storage do not
    guarantee better performance; (2) multimodal memory still struggles to fully use
    visual evidence; (3) systems are unstable across domains and degrade on realistic
    agentic trajectories; and (4) harness memory is more flexible but remains costly
    and less reliable.'
- title: Test-Time Training with Next-Token Prediction
  date: 2026-06
  url: https://arxiv.org/abs/2606.21803
  category: evaluation
  subcategory: non-agentic
  authors:
  - Xuan Ouyang
  - Zefan Cai
  - Junjie Hu
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Next-token prediction is the self-supervised signal that trains language
    models, and every observed prompt token provides the same signal at test time.
    We study whether this signal can define the inner-loop objective for test-time
    training (TTT) in pretrained long-context language models. Many TTT architectures
    require models to be trained with test-time adaptation in mind, limiting their
    direct applicability to released LLM checkpoints. While recent in-place TTT methods
    make fast-weight adaptation possible for pretrained LLMs without redesigning the
    backbone, they leave a central question unresolved: what should each test-time
    write store? Existing recipes train the fast weight to match a learned local value
    proxy but they are not directly tied to the self-supervised next-token prediction
    signal. We introduce Test-Time Training with Next-Token Prediction (TTT-NTP),
    a drop-in fast-weight adaptation method for pretrained LLMs that instead supervises
    updates using the model''s own next contextual hidden state. This makes each local
    write follow the same causal computation that supports next-token prediction:
    the value target is a pointwise linear projection of a single next-position contextual
    state. On RULER Full-13 (averaged over 4k, 8k, 16k, and 32k context lengths),
    TTT-NTP is the only method that consistently improves the released backbone across
    four models spanning three families and a 0.6--8B size range: Llama-3.1-8B (+3.9),
    Mistral-7B-v0.3 (+3.0), and the Qwen3 series (Qwen3-4B +4.1, Qwen3-0.6B +2.9).
    On the real-world LongBench-v2 long-document QA benchmark, TTT-NTP improves over
    the base model on both Llama-3.1-8B (+5.6) and Mistral-7B-v0.3 (+3.7), while preserving
    commonsense and knowledge performance.'
- title: 'Macaron-V1: Towards Open Continual Learning with Self-Improvement and Mixture-of-LoRA'
  date: 2026-08
  url: https://arxiv.org/abs/2608.09819
  category: evaluation
  subcategory: non-agentic
  authors:
  - Mind Lab
  - ':'
  - Vin Bo
  - Asher Cai
  - Jingwei Cao
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Macaron-V1 is an open agent-model family for experiential intelligence:
    learning from experience in real environments and continuing to learn after deployment.
    It is organized around two system goals. Adaptation is pursued through recursive
    improvement of versioned model-harness pairs, where experience from one configuration
    is evaluated under an external contract and used to construct its successor. Collaboration
    is pursued via the Mixture-of-LoRA (MoL) architecture that freezes a base model,
    composes specialist LoRA adapters, and selects one LoRA per user turn. The flagship
    Macaron-V1-Venti (748B) combines a 744B GLM-5.2 base with four LoRAs for chat,
    agent, coding, and GenUI; the Qwen3.6-35B-based Macaron-V1-Tall (50B) uses the
    same design for local deployment. This report presents Macaron-V1 as a co-designed
    system spanning architecture, algorithms, and infrastructure. The MoL architecture
    supports continual learning through extensible LoRA specialists. The algorithm
    combines Model-Harness Co-design and recursive self-improvement loop, including
    the UI4A component-native GenUI harness, a stateful action substrate, versioned
    Harness Context Protocol contract, and the agentic RL framework MindForge. The
    supporting infrastructure includes the post-training platform MinT, the long-context
    RL method LongStraw, and stability techniques for sparse MoE and DSA base models.
    We evaluate Macaron-V1 on Personal Intelligence, GenUI, and general capability
    benchmarks against frontier baselines. Our results validate the current system,
    while compounding gains from continual learning and collective intelligence remain
    open questions.'
- title: 'VISTA Architect: A graph database-oriented health AI system demonstrated
    in multidisciplinary tumor boards'
  date: 2026-06
  url: https://arxiv.org/abs/2606.22692
  category: evaluation
  subcategory: non-agentic
  authors:
  - Tuomo Kiiskinen
  - Jason Fries
  - Philip Adamson
  - David Wu
  - Timothy John Ellis-Caleo
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'We introduce VISTA Architect, a database-oriented AI architecture for
    integrating large language models (LLMs) with longitudinal electronic health records
    (EHRs). At ingestion, it transforms complex clinical documentation into a persistent,
    provenance-linked knowledge graph, eliminating repeated reprocessing of raw records
    at query time. The architecture has two layers: a source-faithful MEDS Graph preserving
    granular EHR structure with full provenance, and a clinically abstracted Timeline
    Object Architecture (TOA) that uses graph-guided LLM extraction to synthesize
    a concise timeline of deduplicated, temporally coherent clinical events. This
    addresses key limitations of direct long-context prompting and retrieval-augmented
    generation (RAG), which often miss temporal relationships and incur high cost
    and latency from repeated raw-text processing. By precomputing clinical synthesis
    once, downstream queries access an organized patient state and traverse to source
    documentation only when detailed verification is needed. We demonstrate the system
    in multidisciplinary thoracic oncology tumor boards at Stanford Medicine, where
    precise reconstruction of patient histories is critical. Across 1,180 patients,
    VISTA Architect achieved 96.4% accuracy (mean 9.75/10) on 15 tumor board-salient
    variables (17,700 evaluations; 95% CI 96.1-96.7%), surpassing a matched BM25 RAG
    baseline and recent benchmarks for LLM-based clinical extraction. An agentic interface
    reduced preparation for a 30-patient held-out cohort to about 2.2 minutes without
    sacrificing accuracy. While configured here for thoracic oncology, the modular
    design adapts to other specialties through customizable event definitions, episode
    structures, and agentic tools; validation beyond thoracic oncology remains future
    work.'
- title: 'ATFlash: Per-RoPE-Wavelength Attention Windows for Compute/Memory-Efficient
    LLM Inference'
  date: 2026-08
  url: https://arxiv.org/abs/2608.02947
  category: evaluation
  subcategory: non-agentic
  authors:
  - Shun-ichiro Hayashi
  - Daichi Mukunoki
  - Tetsuya Hoshino
  - Takahiro Katagiri
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The attention score with rotary position embeddings (RoPE) decomposes
    exactly into a sum over its 2D-rotation frequency pairs, and each pair''s wavelength
    limits how far it can discriminate position. Aligned with this structure, we propose
    the per-RoPE-wavelength distance window: it prunes the query--key inner-product
    terms beyond a wavelength-proportional distance. Unlike a sliding window, every
    key remains reachable, at least through the low-frequency pairs. The reduction
    rate is input-independent, with a closed form logarithmic in the sequence length
    N, in contrast to dynamic-sparse methods like MInference. Such token-level selection
    is orthogonal to our frequency-level pruning. The window can therefore be applied
    on top of those methods. On Qwen2.5-0.5B and Llama-3.2-3B, the window prunes 37--48%
    of the query--key inner-product terms within each model''s native context length.
    Relative to full attention, the top-1 match rate stays at 96--98% and the mean
    output-distribution KL at the 10^{-3-nat level on LongBench-v2 contexts. We examine
    absolute scores on long-context benchmarks such as RULER, OpenAI-MRCR, LongCodeQA,
    and inftyBench: they are broadly preserved. We implement the window as a slice
    of the query--key contraction axis, leaving the online-softmax recurrences untouched,
    and port it with minimal diffs into the released FlashAttention-4 prefill and
    FlashInfer decode. On RTX PRO 6000 with Llama, both ports outpace stock with gains
    growing with context length, up to 1.29× at 128K. End to end on Qwen2.5-7B-1M,
    with 57% of the inner-product terms pruned, the speedup reaches 1.31× at a 1M-token
    context.'
- title: 'Zero-Mem: Zero-Token Memory Operations for LLM Agents'
  date: 2026-07
  url: https://arxiv.org/abs/2607.29377
  category: evaluation
  subcategory: non-agentic
  authors:
  - Yilin Xiao
  - Zhehan Zhu
  - Yujing Zhang
  - Jin Chen
  - Zijin Hong
  venue: ''
  code_url: https://github.com/TheMoon0815/Zero-mem
  project_url: ''
  abstract: 'LLM agents need memory to act consistently over long interactions, yet
    many systems use additional LLM calls to operate that memory. Generating intermediate
    records and mediating their retrieval adds recurring token and time costs, while
    omitted or merged details can obscure the original evidence. We ask whether structured
    memory access requires generation at all. Zero-Mem introduces emph{zero-token
    memory operations: no step outside final question answering invokes an LLM or
    consumes LLM input or output tokens; encoder computation is accounted for separately.
    Zero-Mem preserves original interaction traces as its source of record. It organizes
    the traces in two complementary ways. An entity--context graph exposes connections
    across interactions, while a temporal hierarchy preserves conversational locality
    and session state. For each query, Zero-Mem weighs the two views, retrieves from
    both, and follows their structure to recover supporting relations or surrounding
    context. Deterministic calibration first discards conflicting evidence and then
    keeps the reader''s answer grounded in the retrieved traces. Only the final-QA
    reader invokes an LLM. Across long-memory and long-context question-answering
    benchmarks, Zero-Mem achieves competitive performance while eliminating LLM calls
    and LLM-token consumption from memory operations. With the same final-QA reader
    and context budget, it reduces memory-operation time cost by 57.6% relative to
    the fastest compared baseline. Ablations support the contribution of the two views
    and their query-dependent coordination. Overall, the results show that structured
    agent memory need not generate an intermediate representation of the past. After
    peer review, the code and implementation details will be available at textcolor{blue{https://github.com/TheMoon0815/Zero-mem.'
- title: 'Agentic Routing: The Harness-Native Data Flywheel'
  date: 2026-07
  url: https://arxiv.org/abs/2607.11399
  category: evaluation
  subcategory: non-agentic
  authors:
  - Xinchen Liu
  - Hang Zhou
  - Yingjie Zong
  - Yuchuan Tian
  - Liuyang Song
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Large language model agents are increasingly executed not by a single
    model call, but by an execution harness that manages observation, context, control,
    action, state, and verification. At the same time, frontier and open models are
    becoming structurally specialized: a model that is strong at code editing, long-context
    recovery, tool use, mathematical reasoning, or low-latency response may not dominate
    on the other axes. This makes model selection inside an agent a core systems problem
    rather than a per-query serving trick. Existing routing methods mostly optimize
    single-turn cost-quality trade-offs and therefore miss the execution state, intermediate
    failures, and feedback loops that make agents different from chat completion.
    We propose Harness-Native agentic routing, a step-level routing paradigm that
    selects either a single best-fit model for cost-effective execution or multiple
    complementary models for ensemble-style accuracy improvement, conditioned on the
    full harness state. The key insight is that every routing decision naturally produces
    a structured data record -- consisting of the query, harness state, model choice
    or model set, execution trace, outcome, and cost -- whose labels are supplied
    by the environment rather than by the router itself. These records form a harness-native
    data flywheel: execution traces train better routers and harness-native models,
    which improve cost-quality trade-offs and generate more traces under the same
    budget. We instantiate this idea in OpenSquilla with a four-layer routing stack,
    an open LightGBM cold-start ranker, and a staged router-model path that turns
    logged arena records into progressively stronger routing policies. The report
    studies singleton and multi-model routing on agentic benchmarks including DRACO
    and PinchBench, and argues that agentic routing is not merely cost control, but
    a data engine for agent-native training.'
- title: 'DominoTree: Conditional Tree-Structured Drafting with Domino for Speculative
    Decoding'
  date: 2026-07
  url: https://arxiv.org/abs/2607.08642
  category: evaluation
  subcategory: non-agentic
  authors:
  - "Saw S. Lin</name>\n      <arxiv:affiliation>Zhiqi Zhang</arxiv:affiliation>\n\
    \    </author>\n    <author>\n      <name>Jyh-Shing Roger Jang"
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Speculative decoding accelerates LLM inference by drafting tokens and
    verifying them in parallel. Block-diffusion drafters such as DFlash model only
    per-position marginals, and tree methods such as DDTree expand candidate trees
    from those marginals. The released Domino drafter adds a GRU-based causal correction
    making each draft token''s distribution path-dependent, a structure DDTree''s
    factorized formulation cannot represent. We introduce DominoTree, a training-free
    best-first draft tree scored by Domino''s conditional (non-factorized) correction
    along each root-to-node path, made practical by restricting the per-node correction
    to a candidate top-M. We evaluate it on eight benchmarks in a single-stream harness,
    and in SGLang, where it runs as an out-of-tree plugin against AR, DFlash, EAGLE-3
    and Domino under identical flags. DominoTree attains the highest mean accepted
    length in every serving cell - two model sizes, single-request and concurrent
    load, context to 32K - and the highest Overall accepted length at every temperature
    in the research harness (21 of 24 per-dataset cells). A three-arm decomposition
    holding drafter, budget and verifier fixed separates the gain from applying the
    correction at all (+10.1% accepted length) from that of recomputing it along each
    candidate''s realized path (+4.7% more), the part this paper adds. Where the round
    is verify-dominated, throughput follows: up to 7.3x over AR on Qwen3-8B, beating
    the released Domino decoder at its CUDA-graph best at every temperature, and inside
    SGLang winning single-request throughput by +12% over Domino on Qwen3-8B. On HELMET
    long context it beats Domino by +29-36% accepted length and +10-34% throughput
    at every length and both model sizes. Past a memory-constrained card''s admission
    cap the chain wins goodput, and at our longest context, where prefill dominates,
    our lead over EAGLE-3 narrows to a tie.'
- title: Memory for Large Language Models
  date: 2026-07
  url: https://arxiv.org/abs/2607.25380
  category: survey
  subcategory: non-agentic
  authors:
  - Sining Zhoubian
  - Dan Zhang
  - Evgeny Kharlamov
  - Jie Tang
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'Memory has evolved into a foundational architectural dimension in large
    language models (LLMs), shifting from an implicit byproduct of computation to
    a spectrum of explicit, controllable mechanisms. While recent advances introduce
    diverse strategies---spanning transient attention, recurrent state dynamics, parameter-efficient
    adaptations, and scalable lookup storage---this rapid evolution has led to a highly
    fragmented research landscape. In this survey, we present a systematic, architecture-centric
    taxonomy of memory in LLMs. Our framework characterizes memory along three orthogonal
    axes: representation (implicit versus explicit), update dynamics (offline versus
    online), and persistence (short-term versus long-term). We further formalize the
    granular mechanisms dictating memory writing, routing, state transitions, and
    consolidation. This unified perspective elucidates the conceptual boundaries between
    computation-coupled and independently addressable memory, effectively bridging
    disparate architectural paradigms. Additionally, we critically analyze hybrid
    memory architectures, system-level efficiency trade-offs, and multi-dimensional
    evaluation methodologies. By consolidating these scattered advancements into a
    cohesive framework, this survey charts the trajectory of memory-centric LLM design
    and provides a principled foundation for future innovations in scalable and adaptive
    language modeling.'
- title: 'From Question Answering to Task Completion: A Survey on Agent System and
    Harness Design'
  date: 2026-06
  url: https://arxiv.org/abs/2606.20683
  category: survey
  subcategory: non-agentic
  authors:
  - Jianyuan Guo
  - Zhiwei Hao
  - Chengcheng Wang
  - Cheng Fan
  - Tingzhang Luo
  venue: ''
  code_url: https://github.com/ggjy/Awesome-Agent-Engineering
  project_url: ''
  abstract: 'LLM-based agents mark a shift from passive question answering to active
    task completion: they perceive environments, invoke tools, maintain state, and
    act over extended horizons. As agent systems have evolved from prompt engineering
    to workflows and context engineering, harness engineering, and agent-native training
    with co-evolution, a central question has become increasingly important: where
    does the bottleneck in agent performance reside, in the foundation model, in the
    execution harness, or in the coupling between them? This survey examines LLM-based
    agents through a model-harness lens. We first clarify the functional definition
    of agents and the implementation view of an LLM-based agent as a foundation model
    coupled with an execution harness. We then analyze the limits of model-centric
    scaling, trace four paradigms of agent engineering, and decompose the execution
    harness into six coupled runtime responsibilities: observation, context, control,
    action, state, and verification. Using this decomposition, we map task properties
    and domain pressures to harness configurations, review benchmark and evaluation
    practices, and synthesize model-harness evidence on how runtime design affects
    long-horizon task completion, efficiency, and reliability. Finally, we identify
    open challenges in value-aware evaluation, safety, harness generalization, and
    model-harness co-evolution. Rather than treating agents as models with auxiliary
    tools, this survey argues that agent quality -- including success, efficiency,
    safety, and generalization -- emerges from the interaction between model capability,
    runtime infrastructure, task structure, and evaluation design. A collection of
    papers discussed in this survey is provided in https://github.com/ggjy/Awesome-Agent-Engineering.'
- title: 'Multimodal Unlearning Across Vision, Language, Video, and Audio: Survey
    of Methods, Datasets, and Benchmarks'
  date: 2026-07
  url: https://arxiv.org/abs/2607.07907
  category: survey
  subcategory: non-agentic
  authors:
  - Nobin Sarwar
  - Shubhashis Roy Dipta
  - Zheyuan Liu
  - Vaidehi Patil
  venue: ''
  code_url: ''
  project_url: https://smsnobin77.github.io/Awesome-Multimodal-Unlearning/
  abstract: 'With the growing adoption of VLMs, DMs, LLMs, and AFMs, these multimodal
    foundation models can inadvertently encode sensitive, copyrighted, biased, or
    unsafe cross-modal associations that originate from their training data. Retraining
    after deletion requests or policy updates is often impractical, and targeted forgetting
    remains difficult because knowledge is distributed across shared representations.
    Multimodal unlearning addresses this challenge by enabling selective removal across
    modalities while retaining overall utility. This survey offers a unified, system-oriented
    view of multimodal unlearning across vision, language, audio, and video, grounded
    in recent advances, emerging applications, and open problems. Our taxonomy enables
    systematic comparison across model architectures and modalities, clarifying trade-offs
    among deletion strength, retention, efficiency, reversibility, and robustness.
    This survey highlights open problems and practical considerations to support future
    research and deployment of multimodal unlearning. We release a curated repository:
    https://smsnobin77.github.io/Awesome-Multimodal-Unlearning/'
- title: 'Autonomous Information Seeking: A Roadmap for Agentic Recommender Systems'
  date: 2026-07
  url: https://arxiv.org/abs/2607.04433
  category: survey
  subcategory: non-agentic
  authors:
  - Xinyu Lin
  - Yashar Deldjoo
  - Sunhao Dai
  - Honghui Bao
  - Xiaopeng Ye
  venue: ''
  code_url: ''
  project_url: ''
  abstract: 'The rapid integration of large language model-based agents into recommender
    systems has driven a shift from static, ranking-based pipelines toward autonomous
    and interactive systems that can reason, plan, and act. This survey provides a
    comprehensive overview of this emerging landscape by introducing a unified taxonomy
    grounded in the level of autonomy and three core paradigms of agentic recommender
    systems: agent-assisted recommendation, agent-as-recommender, and agent-as-user-simulator.
    The autonomy framework organizes existing methods along increasing capabilities
    in proactivity, context awareness, interaction flexibility, and adaptivity. Building
    on this framework, the survey analyzes how each paradigm adopts different agentic
    architectures and how agents enhance key components such as profiles, memory,
    tool use, workflows, and optimization mechanisms. We further examine evaluation
    methodologies for agentic recommendation, covering automated metrics, LLM-based
    judging, and simulation-based assessment, and discuss their limitations in capturing
    reasoning quality, user experience, and system behavior. Beyond existing evaluation
    protocols, we further discuss unresolved issues in evaluating agentic recommender
    systems, including trajectory-level assessment, agent contribution analysis, and
    calibration of user simulation. Lastly, the survey outlines open challenges in
    lifelong user modeling, contextual abstraction, multimodal alignment, controllability,
    trustworthiness, privacy, scalability, and efficiency. Together, these analyses
    establish a unified foundation for understanding the current progress of agentic
    recommender systems and highlight promising opportunities for developing more
    autonomous, reliable, and human-aligned recommendation agents.'
- title: 'Beyond Tokens: A Survey on Decoding Methods for Large Language and Vision-Language
    Models'
  date: 2026-08
  url: https://arxiv.org/abs/2608.14797
  category: survey
  subcategory: non-agentic
  authors:
  - Haoran Wang
  - Xiongxiao Xu
  - Philip S. Yu
  - Kai Shu
  venue: ''
  code_url: https://github.com/wang2226/Awesome-LLM-Decoding
  project_url: ''
  abstract: Large language models (LLMs) and large vision-language models (LVLMs)
    have demonstrated impressive generative capabilities, yet ensuring their outputs
    align with user intent is still challenging. While most existing approaches address
    this issue at the training stage, inference-time approaches like decoding methods
    offer a more efficient and scalable solution. Decoding methods control model generation
    by guiding token-level selection, performing sequence-level generation, or generating
    tokens in parallel to accelerate the process. In this survey, we identify three
    emerging paradigms from recent works on decoding methods for LLMs and LVLMs, provide
    a systematic review of these methods, highlight ongoing challenges, and discuss
    potential future research directions. Our goal is to underscore the efficiency
    and effectiveness of decoding methods and offer a practical view of their applications.
    Paper lists and more resources on decoding methods for LLMs and LVLMs can be found
    at https://github.com/wang2226/Awesome-LLM-Decoding.
- title: 'Accelerating Masked Diffusion Large Language Models: A Survey of Efficient
    Inference Techniques'
  date: 2026-07
  url: https://arxiv.org/abs/2607.12829
  category: survey
  subcategory: non-agentic
  authors:
  - Daehoon Gwak
  - Minhyung Lee
  - Junwoo Park
  - Jaegul Choo
  venue: IJCAI-ECAI 2026
  code_url: ''
  project_url: ''
  abstract: Diffusion large language models (dLLMs) offer a theoretical advantage
    in parallel generation over standard autoregressive models. However, parallel
    generation alone does not guarantee practical speedups. Realizing this efficiency
    requires specialized inference mechanisms, such as diffusion-aware caching and
    reuse. Consequently, as inference efficiency becomes a prerequisite for practical
    deployment, recent research has actively explored acceleration techniques across
    algorithms, architectures, and systems. However, rigorous comparisons remain difficult,
    as end-to-end latency stems from intricate trade-offs between algorithmic, architectural,
    and system-level factors that are often conflated in existing benchmarks. In this
    survey, we introduce a unified latency decomposition framework for dLLMs to disentangle
    these factors and analyze their impact on inference speed in real deployments.
    Guided by this framework, we categorize acceleration techniques along three axes
    covering algorithmic innovations, architectural and system optimizations, and
    inference-time scaling. Finally, we provide guidelines for reproducible benchmarking
    and highlight open challenges for realizing the full potential of parallel generation.
- title: 'Agent Skill Evaluation and Evolution: Frameworks and Benchmarks'
  date: 2026-06
  url: https://arxiv.org/abs/2606.11435
  category: survey
  subcategory: non-agentic
  authors:
  - Kexin Ding
  - Yang Zhou
  - Can Jin
  - Feng Tong
  - Mu Zhou
  venue: ''
  code_url: https://github.com/Cassie07/AgentSkill_Survey
  project_url: ''
  abstract: The growth of agent skills has transformed how agentic systems are built,
    evaluated, and deployed. As skill libraries continue to scale, rigorous evaluation
    becomes critical to ensuring their utility, quality, and safety in real-world
    applications. Consequently, the field is undergoing an emerging paradigm shift
    from isolated skill creation to automated, evaluation-driven skill evolution.
    In this survey, we systematically examine the landscape of skill evolution and
    evaluation beyond foundational skill creation. We categorize evolution into four
    distinct paradigms, spanning execution feedback, trajectory distillation, compression,
    and reinforcement learning, showing how each element contributes to improving
    skill utility and reliability. We also provide an analysis of six skill-centric
    benchmark categories, identifying structural gaps in benchmark coverage, trade-offs,
    and metric richness to advance skill research. Finally, we identify open directions
    for building skill ecosystems that are generalizable, efficient, and verifiably
    safe. The project URL is https://github.com/Cassie07/AgentSkillSurvey
- title: The conditional superiority of fast silicon sampling
  date: 2026-08
  url: https://arxiv.org/abs/2608.14079
  category: survey
  subcategory: non-agentic
  authors:
  - Nickolas Hock Yuen Lam
  - Ji Xuan Voo
  - Xiangyu Ma
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Silicon sampling can produce surprisingly good population estimates at
    times. Does doing it fast attenuate such fidelity? In this study, we extend and
    assess ongoing work in silicon sampling by comparing the algorithmic fidelity
    of "fast" and "slow" modes of silicon sampling among a nationally representative
    sample of Singaporean survey respondents. We find that silicon sampling with contemporary
    frontier models remains a method in early development to be used only with great
    caution. While silicon samples are able to produce moderately faithful estimates
    of population means, they continue to understate opinion variance and distort
    the latent contextual space behind human opinions. Conditional on such limitations,
    we find "fast" modes of silicon sampling to be relatively superior to traditional
    "slow" modes of silicon sampling. Fast silicon sampling is significantly more
    efficient in compute resources and run-time while being monotonically superior
    to slower modes of sampling in algorithmic fidelity.
- title: 'Large Language Models for Low-Resource Languages: A Conceptual Framework
    for an Electronic Explanatory Dictionary of the Tajik Language'
  date: 2026-08
  url: https://arxiv.org/abs/2608.04186
  category: survey
  subcategory: non-agentic
  authors:
  - Mullosharaf K. Arabov
  - S. S. Pirov
  - B. Sultonov
  venue: ''
  code_url: ''
  project_url: ''
  abstract: This paper presents a conceptual framework for developing an electronic
    explanatory dictionary of the Tajik language using large language models (LLMs).
    The relevance of the work stems from the absence of a comprehensive digital lexicographic
    resource for Tajik that is comparable in functionality to dictionaries for high-resource
    languages, and from the limited adaptation of modern natural language processing
    technologies to low-resource language systems. Based on a systematic survey of
    existing linguistic, statistical, and corpus resources, we propose a dictionary
    architecture that integrates modules for morphological analysis, lemmatization,
    semantic clustering, and dictionary entry generation using LLMs. The choice of
    subword tokenization is justified by the agglutinative nature of Tajik morphology
    and its high morphological variability, along with a parameter-efficient fine-tuning
    (PEFT) strategy suitable for limited annotated data. The novelty of the work lies
    in proposing the first holistic conceptual architecture of an explanatory dictionary
    for Tajik that unifies classical lexicographic methods, language statistics, and
    generative capabilities of LLMs into a single system. The practical significance
    of the study is the formation of a methodological foundation for developing a
    full-featured electronic dictionary that can serve both as a lexicographic tool
    and as a core resource for machine translation, automatic summarization, sentiment
    analysis, and other applied NLP tasks. The paper is intended for specialists in
    computational linguistics, lexicography, and developers of natural language processing
    systems working with low-resource languages.
- title: Evaluating LLM Usage for Efficient and Explainable Numerical and Classified
    Implicit Sentiment Analysis of Product Desirability
  date: 2026-06
  url: https://arxiv.org/abs/2606.23701
  category: survey
  subcategory: non-agentic
  authors:
  - Sherri Weitl-Harms
  - John Hastings
  venue: ''
  code_url: ''
  project_url: ''
  abstract: Qualitative product feedback can reveal nuanced user experiences, but
    its implicit sentiment is difficult to measure. This paper presents a scalable
    and interpretable framework that uses large language models (LLMs) to quantify
    product desirability from such data. Using two Product Desirability Toolkit (PDT)
    datasets from ZORQ and CARMA comprising 106 respondent term groupings with gold-standard
    human annotation, zero-shot continuous numerical sentiment scoring and categorical
    sentiment classification are evaluated without relying on explicit review scores.
    Across the datasets, LLMs generated numerical sentiment scores directly from qualitative
    responses and closely matched expert labels, achieving Pearson correlations up
    to 0.97 and classification accuracy up to 94%. LLMs maintained robustness even
    when handling data presented in multiple forms and consistently expressed high
    confidence. In contrast, lexicon-based and transformer baselines did not produce
    statistically significant results. Among the models tested, GPT-4o-mini achieved
    performance comparable to larger models at 94% lower cost, supporting scalable
    deployment. The framework also incorporates model confidence ratings and human-readable
    rationale explanations (xAI), improving interpretability, transparency, and trust
    while supporting practical use in product satisfaction assessment. In general,
    using the PDT tool as a survey method along with a cost efficient LLM for sentiment
    analysis has the potential to provide for product evaluation with results that
    are rich in terms of sentiment scores (both numerical and classified sentiment)
    and in terms of the high-level user impressions of the product that can be used
    to identify ideas for product development and improvement, as well as marketing
    ideas for target audiences.
- title: 'Artificial Intelligence for Mathematical Reasoning: An Integrated Survey
    of Language Models, Neuro-symbolic Systems, and Verified Discovery'
  date: 2026-06
  url: https://arxiv.org/abs/2606.08728
  category: survey
  subcategory: non-agentic
  authors:
  - Syed Rifat Raiyan
  - Mohsinul Kabir
  - Hasan Mahmud
  - Md Kamrul Hasan
  - Sophia Ananiadou
  venue: ''
  code_url: https://github.com/Starscream-11813/awesome-AI4Math
  project_url: ''
  abstract: 'Mathematical reasoning has long served as a stringent test of machine
    intelligence; over the past decade, it has moved from a niche problem within NLP
    to one of the most consequential AI frontiers. This survey provides a unified
    account of the field''s evolution, from early rule-based math word problem (MWP)
    solvers and template-driven geometry systems, through neural expression generation
    and LLM prompting, to contemporary reasoning models, multi-agent systems, neuro-symbolic
    theorem provers, and verified discovery workflows. We organize the landscape along
    four axes: (i) informal reasoning over text and diagrams, spanning MWP solving,
    multimodal geometry, and VLMs; (ii) formal reasoning in proof assistants, including
    autoformalization, tactic prediction, compiler-guided repair, and proof search;
    (iii) mathematical discovery, where systems propose constructions, improve bounds,
    or assist attacks on open problems; and (iv) the inference and training-time techniques,
    including CoT prompting, tool use, process reward models, and RLVR, that increasingly
    connect generation with verification. We catalog major benchmarks across grade-school
    arithmetic, competition mathematics, geometry, formal proving, multimodal and
    multilingual reasoning, and expert evaluation, and we examine benchmark saturation,
    contamination, reporting mismatches, and the distinction between pass@1, majority
    voting, and verifier-assisted pass@k. We critically assess failure modes: brittleness
    under perturbation, reward hacking, multimodal grounding failures, fragile formalization,
    and the energy cost of reasoning-scale inference. Drawing on recent perspectives
    from working mathematicians, we identify future directions centered on verified-discovery
    workflows, reasoning efficiency, and infrastructure to make AI-assisted formalization
    broadly usable. Companion materials: https://github.com/Starscream-11813/awesome-AI4Math.'
